name: KOSIS
website: https://kosis.kr
description: KOSIS (KOrean Statistical Information Service) is Statistics Korea’s
  statistical table platform. Public catalogs are the table tree on kosis.kr
  (including /bukhan/), agency and local portals that expose /statHtml/statHtml.do
  (ITSTAT, Gyeonggi, Jeonbuk, Jeju, GSIS, KESIS, MOF, MOEL), and ODA clones
  such as MMSIS, LAOSIS, and ASIS. OpenAPI is documented at /openapi/ and
  requires a service key. Distinct from local-government /stat/index.do CMS
  skins that only link out to KOSIS, and from 지표누리 (index.go.kr) and SGIS.
