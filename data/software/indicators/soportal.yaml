id: soportal
name: SOPORTAL
website: https://www.wise.co.kr/
description: SOPORTAL is Wiseitech's agency statistical-table portal for South
  Korean public authorities. Tenants share indexPage.do, a /css/{skin}/soportal/
  stylesheet tree, /js/portal/lib/, and /portal/stat/ table browsers
  (easyStatPage.do, orgStatPage.do, nameStatPage.do), mounted under a context
  path such as /portal/, /research/portal/, or /r-one/portal/. OpenAPI pages
  live under /portal/openapi/ and require a service key. commonness.js carries
  COPYRIGHT (C) 2013 WISEITECH CO., LTD., but that file also ships on unrelated
  Wiseitech sites (Gyeonggi Data Dream, Open National Assembly) that use
  mainPage.do. Distinct from KOSIS /statHtml/statHtml.do, from MOLIT 통계누리,
  and from IBSheet used as a grid on other statistical sites.
