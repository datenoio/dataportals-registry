description: The Global Cancer Observatory (GCO) is the IARC/WHO cancer indicators
  platform, hosting the Cancer Today (GLOBOCAN incidence, mortality, and prevalence
  estimates), Cancer Tomorrow, and Cancer Over Time tools. It is served on the
  mirrored hosts gco.iarc.fr and gco.iarc.who.int, with country, cancer type, age,
  and sex breakdowns, charts, maps, and downloadable tables.
