name: DesInventar
website: https://www.desinventar.net
description: DesInventar is the disaster loss and damage database methodology and
  software coordinated by UNDRR. National institutions build country inventories
  of disaster events with homogeneous event, cause, damage, and loss
  classification; the DesInventar Sendai web system at desinventar.net hosts
  national datasets used for Sendai Framework and SDG target monitoring.
  Installations include national systems such as Cambodia's CamDi.
