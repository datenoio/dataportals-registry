description: MATS (Modernes Analyse Tool Statistik) is the shared statistical
  data-warehouse and dashboard product co-developed by Statistikamt Nord,
  Statistisches Landesamt Rheinland-Pfalz, and Amt für Statistik
  Berlin-Brandenburg. Public catalogs are the Land MATS-Datenportal pages of
  filterable tables and dashboards (Oracle Analytics underneath). Distinct from
  GENESIS-Online, from SIS-Dashboards, and from generic Oracle APEX sites.
