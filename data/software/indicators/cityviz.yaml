name: CityViz
description: CityViz is a Canadian community economic-development data platform
  (CityViz Data Solutions, Calgary/Kelowna). Municipalities and regional economic
  development organizations publish economic indicators, community profiles,
  business counts, location analytics, and Report Studio exports. Tenants are
  hosted on vendor subdomains like laclabichecounty.cityviz.ca or on custom
  domains (for example data.choosecranbrook.ca, insights.medicinehat.ca,
  data.langleycity.ca). Pages are R Shiny apps titled
  "Economic Development Data Platform" with "powered by Cityviz" chrome. Do not
  label the vendor marketing site cityviz.ca itself or the fictional Bellaville
  showcase as catalogs.
