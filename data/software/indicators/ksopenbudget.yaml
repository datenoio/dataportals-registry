description: KS Open Budget («КС Открытый бюджет. Бюджет для граждан») is
  Keysystems’ public-finance portal. Regional skins share /Scripts/Site.js
  (namespaces EB and GZW), /Menu/Page/, /Show/Category/, /Content/Skin*/,
  /Content/BudgetCalculator/, and jquery.ks.multichoicer.js. The same
  installation can publish an open-data register. Distinct from NPO Krista
  iMonitoring (ifinmon.ru) and from other open-budget sites such as
  budget.lenobl.ru and budget.mos.ru.
