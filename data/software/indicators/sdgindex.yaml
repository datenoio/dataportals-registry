name: SDG Index
description: SDG Index dashboards are the Sustainable Development Solutions Network
  (SDSN) indicator sites for the Sustainable Development Report and regional or
  subnational editions. Current hosts are Next.js apps, usually on *.sdgindex.org,
  with rankings, maps, profiles, and a downloadable indicator database. The 2019
  European Cities edition is an earlier static build on euro-cities.sdgindex.org.
  Country profile pages on the same host are not separate catalogs. Do not label
  OpenSDG sites or the SDSN library at sdgtransformationcenter.org.
