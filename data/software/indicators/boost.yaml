id: boost
name: BOOST
website: https://www.worldbank.org/en/programs/boost-portal
description: BOOST is the World Bank open-budget program and fiscal transparency
  portal platform, launched in 2010 with active engagements in over 90 developing
  countries. Country ministries of finance publish line-item expenditure and revenue
  data extracted from government financial management information systems through
  country-owned BOOST web portals with interactive pivot tables and CSV/Excel
  downloads. Registry installations include Paraguay (boostvep.mef.gov.py),
  Cameroon (boostcameroon.cm), Mauritania (boost.budget.mr), and Tunisia
  (Mizaniatouna).
