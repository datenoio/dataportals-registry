description: e-Stat is Japan’s portal site for official statistics (政府統計の総合窓口).
  Public catalogs include the table portal (www.e-stat.go.jp), Statistical LOD
  (data.e-stat.go.jp), and the Statistics Dashboard (dashboard.e-stat.go.jp).
  The machine API is api.e-stat.go.jp and requires an application ID. Distinct
  from RESAS and from ministry CMS pages that only link to e-Stat.
