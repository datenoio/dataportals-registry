name: FPMA Tool
website: https://fpma.fao.org/giews/fpmat4/global/
description: The Food Price Monitoring and Analysis (FPMA) Tool is FAO GIEWS' indicator
  dashboard for domestic and international food prices. Version 4 (fpmat4) runs a
  global instance at fpma.fao.org and country instances hosted by FAO or national
  statistical offices and ministries of agriculture (for example Kyrgyzstan,
  Tajikistan, Uzbekistan, El Salvador, Guatemala, Yemen, Costa Rica, Zimbabwe).
  Each instance publishes monthly price series by country, market, and commodity
  with charts, maps, and CSV/Excel downloads.
