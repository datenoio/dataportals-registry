id: gecoopendata
name: GeCO-sys OpenData
website: https://gecoopendata.registrotumoriveneto.it/
description: GeCO-sys OpenData is a web application used by Italian cancer
  registries to publish epidemiological indicators computed from AIRTUM record-layout
  archives. Public tenants live on gecoopendata.{registry-host} with /incidenza.php,
  /sopravvivenza.php, and related statistic pages on an AdminBSB-based UI with GeCOsys
  branding, covering incidence, mortality, survival, prevalence, and data-quality
  indicators by tumour site, age, sex, and territory. Documented as a reusable
  application by the Registro Tumori Veneto; tenants include the Veneto, Umbria, and
  ASL Napoli 3 Sud registries. Distinct from GeCo, the Lombardy regional-council
  management application.
