name: IDDS
website: https://idds.censtatd.gov.hk/
description: IDDS (Interactive Data Dissemination Service) is the Hong Kong Census
  and Statistics Department custom statistical table platform. Each installation is
  a themed tenant on its own host — Common-IDDS (idds.censtatd.gov.hk) for social
  and economic statistics, Trade IDDS (tradeidds.censtatd.gov.hk) for merchandise
  trade with a documented JSON GET API, and census-round tenants such as the 2021
  Population Census IDDS (idds.census2021.gov.hk). Users build custom tables and
  charts and download the outputs.
