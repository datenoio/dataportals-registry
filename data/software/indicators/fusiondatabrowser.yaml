id: fusiondatabrowser
name: Fusion Data Browser
website: https://wiki.sdmxcloud.org/Fusion_Data_Browser
description: Fusion Data Browser is Metadata Technology's SDMX dissemination UI.
  It browses dataflows, builds tables and charts, and exports CSV, Excel, and SDMX.
  Public installs are usually mounted at /FusionDataBrowser and read a Fusion Edge
  Server or Fusion Registry data API (/FusionEdgeServer/ws/public/sdmxapi/rest or
  /FusionEdgeServer/sdmx/v2/). One record per public browser. Structural registries
  without this UI stay fusionregistry.
