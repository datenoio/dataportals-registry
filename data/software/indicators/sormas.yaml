name: SORMAS
description: SORMAS (Surveillance, Outbreak Response Management and Analysis System)
  is an open-source digital health platform for disease surveillance and outbreak
  response, maintained by the SORMAS Foundation. National deployments (Nepal, Ghana,
  Nigeria, Fiji, and others) are operated by ministries of health; some publish an
  anonymous public dashboard or bulletin with weekly counts of outbreak-prone diseases
  by province, district, and municipality.
