description: Cascade CMS is Hannon Hill's web content management system used by
  US state agencies and universities to publish data and indicator portals.
  Published pages carry Cascade template-region comments such as
  `<system-region name="CAROUSEL"/>`. State labor market information sites on
  Cascade (for example milmi.org, lmi.mt.gov, discover.arkansas.gov) share a
  common `_files/css` + `_files/js` asset layout with news-gallery.js and
  random-background.js. Data applications inside the CMS (data searches,
  dashboards) are site-custom.
