id: liveshop
name: LiveShop
description: LiveShop is an ASP.NET statistics database platform used by central
  banks and regional monetary bodies to publish macroeconomic time series. Tenants
  run on their own domains with a /shop landing page (site title "Home Page - LiveShop"),
  /shop/meta-data and /shop/data-calendar pages, and a /data-browser chart and table
  view. Known tenants include the Central Bank of Nigeria (statistics.cbn.gov.ng)
  and the West African Monetary Institute (wami-data.org). Distinct from DataWarehousePro
  (datawarehousepro), whose tenants live on the vendor's app.datawarehousepro.com
  host with /go/{tenant} paths.
