description: IHK-Fachkräftemonitor is a multi-Land labour-market dashboard
  used by German Chambers of Industry and Commerce. Public tenants share
  ihk-fachkraeftemonitor.de/{land}/ (for example /bw/, /nrw/, /sh/) with
  occupation, industry, and regional skills-shortage projections. The
  underlying model is from GWS Osnabrück. Distinct from IHK Arbeitsmarktradar
  Bayern and IHK-Konjunkturboard.
