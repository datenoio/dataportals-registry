description: Shared reporting dashboards of the Secretariat of the Basel, Rotterdam
  and Stockholm Conventions, built on the BRS Electronic Reporting System (eRS).
  Each convention runs the same eRSodataReports dashboard application
  (/eRSodataReports2/...DashBoard.html) over its national-report submissions, with
  filters by year, region, and country and Excel downloads. Live instances cover the
  Basel Convention (ers.basel.int) and the Stockholm Convention (ers.pops.int).
