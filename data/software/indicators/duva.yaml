name: DUVA
website: https://duva.de/
description: DUVA is a metadata-based municipal statistics information system
  from the German KOSIS-Gemeinschaft DUVA. The public catalog surface is the
  Informationsportal (tables, charts, and maps generated from DUVA metadata),
  typically under /Informationsportal/ or a branded FR.ITZ-style host. About
  60 German cities and counties use the community software. Distinct from
  Korean KOSIS (kosis.kr) and from Urban Audit atlas hosts that do not expose
  a public Informationsportal.
