description: The IMF National Summary Data Page (NSDP) is the standardized e-GDDS,
  SDDS, and SDDS Plus dissemination template that national statistical offices and
  central banks host. Pages list macroeconomic categories with SDMX 2.0 XML downloads
  and a link to the IMF Dissemination Standards Bulletin Board. Distinct from Knoema
  or WordPress sites that only wrap an NSDP.
