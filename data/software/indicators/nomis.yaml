description: Nomis is the official UK labour market and census statistics
  service, provided by the Office for National Statistics and run under
  contract by Durham University. The catalog UI and the REST/SDMX API live on
  www.nomisweb.co.uk (dataset list at /api/v01/dataset/def.sdmx.json). One
  national hub — do not add a catalog per dataset or per geography. Distinct
  from the ONS website (ons.gov.uk), NISRA and StatsWales products, and from
  Power BI or InstantAtlas labour-market dashboards.
