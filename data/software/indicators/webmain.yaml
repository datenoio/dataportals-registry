id: webmain
name: WebMain
website: https://nstatdb.dgbas.gov.tw/dgbasall/webMain.aspx?k=dgmain
description: WebMain is Taiwan’s DGBAS-family statistical dynamic-query UI
  (統計資料動態查詢 / 共通性查詢). Public catalogs share webMain.aspx with sys=
  and funid= parameters, often under /dgbasall/, /micst/, /statiscla/,
  /njswww/, /exam/, /statis/, or /edust/. Distinct from local-government
  DGBAS Web (/DgbasWeb/), from PxWeb on statdb.dgbas.gov.tw, and from
  ministry portals that only link to a WebMain tree (MOTC Portal, MOENV
  epanet).
