description: StatsWales is the Welsh Government's official statistics
  dissemination service. The bilingual catalog UI lives on
  statswales.gov.wales and the public API (OAS 3.1) on api.stats.gov.wales
  (/v1 lists all published datasets). One national hub — do not add a catalog
  per topic or per dataset. Distinct from the retired OData service
  (open.statswales.gov.wales, shut down August 2024) and from InfoBaseCymru
  local authority profiles.
