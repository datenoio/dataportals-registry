description: iMonitoring is NPO Krista’s public-finance and socio-economic
  indicator platform (KristaBI underneath). Regional Open Budget portals share
  ifinmon.ru tenants or branded hosts with a data constructor
  (/servisy/konstruktor-dannyx/ or /konstruktor-dannykh), open-data registers,
  and fm@krista.ru / fmsupport@krista.ru support. The comparative hub is
  iminfin.ru. Distinct from other Russian open-budget CMS sites that are not
  Krista (Leningrad Oblast, Zabaykalsky Krai, Moscow city).
