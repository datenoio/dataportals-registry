description: OpenScience.si repository software is the shared institutional-repository
  stack developed at the University of Maribor Faculty of Electrical Engineering and
  Computer Science for the Slovenian open-access infrastructure. University and research-organisation
  tenants (DKUM, RUL, RUP, RUNG, ReVIS, DiRROS) share one PHP application with OAI-PMH
  at /oai/oai2.php. It is not DSpace, EPrints, or Fedora. The national openscience.si
  portal is an aggregator over those tenants, not a third-party product.
