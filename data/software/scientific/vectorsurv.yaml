id: vectorsurv
name: VectorSurv
website: https://vectorsurv.org
description: VectorSurv is a hosted vector-borne disease surveillance and data
  management platform operated by the University of California, Davis for US
  state and local public-health and mosquito/vector control agencies. The
  central system publishes open data visualizations and exports; participating
  agencies can also publish state-branded views that embed VectorSurv (for
  example California's westnile.ca.gov, which carries VectorSurv branding and a
  vectorsurvEmbedded frame). Records cover the central portal and state-branded
  deployments that visibly embed the VectorSurv service.
