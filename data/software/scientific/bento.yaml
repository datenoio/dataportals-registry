id: bento
name: Bento Framework
website: https://github.com/CBIIT/bento-frontend
description: Bento is the reusable data-commons framework developed at the NCI
  Center for Biomedical Informatics and Information Technology (CBIIT). The
  frontend is a React single-page application scaffolded with
  @bento-core/create-bento-app; deployments share a runtime configuration file
  (injectEnv.js serving window.injectedEnv), session chrome (/js/session.js) and
  a GraphQL backend. Independent NCI deployments include the Integrated Canine
  Data Commons (ICDC), the Childhood Cancer Clinical Data Commons (C3DC) and the
  CCDI Molecular Targets Platform (MTP).
