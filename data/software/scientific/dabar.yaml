description: DABAR (Digital Academic Archives and Repositories) is Croatia’s national
  multi-tenant institutional repository platform, operated by the University of Zagreb
  University Computing Centre (SRCE). Public tenants expose a shared Laravel UI and
  OAI-PMH, with Fedora as the storage layer after the 2025 reimplementation (previously
  Drupal and Islandora). Register one catalog per public institutional hostname, not
  each namespace facet on the national hub.
