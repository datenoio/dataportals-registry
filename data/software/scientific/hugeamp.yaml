id: hugeamp
name: HuGE AMP Knowledge Portal
website: https://hugeamp.org
description: The HuGE AMP Knowledge Portal is an open-source platform for
  aggregating and analyzing human genetic association results, epigenomic
  annotations, and computational predictions. Deployments include the Common
  Metabolic Diseases Knowledge Portal (hugeamp.org) and the Type 2 Diabetes
  Knowledge Portal (t2d.hugeamp.org), each presenting gene, variant, and phenotype
  pages with downloadable summary statistics.
