name: Crystallography Open Database
website: https://www.crystallography.net/
description: The Crystallography Open Database (COD) platform is an open-source repository
  stack for crystal structures in CIF format, maintained by the COD advisory board at
  Vilnius University. The same codebase powers the experimental COD, the predicted
  structures database (PCOD), and the theoretical structures database (TCOD) on
  crystallography.net, with seven-digit persistent entry identifiers, subversion-based
  file versioning, a Perl/CGI search interface with REST-style result endpoints, full
  database dumps, and cod-tools CIF processing utilities.
