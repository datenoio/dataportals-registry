name: ReDBox
website: https://www.redboxresearchdata.com.au
description: ReDBox (Research Data Box) is an open-source research data management
  platform led by QCIF. Australian and New Zealand universities use it to capture
  metadata for research collections, run research data management plans (RDMP), and
  publish to Research Data Australia via OAI-PMH. Public portals commonly expose
  paths under /default/rdmp/.
