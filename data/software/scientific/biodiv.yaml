description: Biodiv is Strand Life Sciences' open-source Biodiversity Informatics
  Platform for species pages, citizen-science observations, datasets, datatables,
  documents, and maps. Public portals show the footer "Biodiversity Informatics
  Platform". Independent installations include the India Biodiversity Portal,
  the Bhutan Biodiversity Portal, WIKTROP, and related regional portals. Distinct
  from Symbiota, Specify, and a GeoServer that only serves a Biodiv map workspace.
