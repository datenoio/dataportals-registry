description: SeaDataNet is the pan-European infrastructure for marine and ocean data
  management, operated by a consortium of National Oceanographic Data Centres with
  portal software developed by MARIS. The same stack powers the Common Data Index
  (CDI) data discovery and access service, the Cruise Summary Reports (CSR)
  directory, and the EDMED, EDMERP, and EDMO directories of datasets, research
  projects, and marine organisations, as well as the SeaDataNet data products
  catalogue. Metadata records follow SeaDataNet ISO 19115 profiles and are exposed
  through a public SRU/OAI-style search API and OGC services.
