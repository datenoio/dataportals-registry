id: nbia
name: National Biomedical Imaging Archive
website: https://wiki.nci.nih.gov/display/NBIA
description: The National Biomedical Imaging Archive (NBIA) is open-source
  software (BSD 3-Clause) for storing, searching and downloading de-identified
  DICOM images with clinical annotations, exposing a versioned REST API
  (collections, patients, studies, series) and supporting federation between
  independent NBIA instances. The Cancer Imaging Archive (TCIA) runs on NBIA;
  the former NCI-hosted NCIA instance (retired March 2022, data moved to TCIA)
  served the same software at imaging.nci.nih.gov/ncia. The NBIA Data Retriever
  desktop/CLI client handles bulk downloads from any NBIA server.
