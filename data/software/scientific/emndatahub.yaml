id: emndatahub
name: EMN Data Hub
website: https://www.energy.gov/eere/amo/energy-materials-network
description: EMN Data Hub is the shared Energy Materials Network repository UI
  hosted by the National Renewable Energy Laboratory / National Laboratory of the
  Rockies for DOE consortium data hubs. Public tenants at datahub-*.nlr.gov
  (DuraMAT, ElectroCat, HydroGEN / H2AWSM, ChemCatBio) serve the same SPA shell
  with js/remote-app-entry.js module federation (for example DuramatdhApp,
  ElectrocatdhApp). The platform was originally built on CKAN for the Energy
  Materials Network; the current public hosts do not expose a live CKAN
  /api/3/action/status_show endpoint, so do not label them ckan. Distinct from
  Wind Data Hub, Livewire, and HyMARC CKAN.
