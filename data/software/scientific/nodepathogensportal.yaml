description: Pathogens Portal Node is SciLifeLab Data Centre's Hugo toolbox for
  national pathogen-data portals. The Swedish site is the original pathogens-portal
  codebase. Later nodes deploy node-pathogens-portal or a fork of it, with a public
  dataset listing at /datasets/. Distinct from the EMBL-EBI central Pathogens Portal,
  the Swiss SIB theme, and national sites that only share the network name.
