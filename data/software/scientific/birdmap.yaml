description: BirdMap Africa is the shared citizen-science atlas platform of the African
  Bird Atlas Project (FitzPatrick Institute of African Ornithology). Country projects
  (SABAP2, Nigeria, Kenya, Senegal, and others) publish pentad-based bird distribution
  catalogs on {project}.birdmap.africa with a public REST API at api.birdmap.africa.
  Distinct from the BirdLasser mobile app used to submit cards.
