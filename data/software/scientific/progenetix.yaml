description: Progenetix is an open-source cancer genomics data platform for genome-wide
  copy number profiling data in cancer, served through the bycon Beacon+ API stack.
  Public instances publish curated CNV profile collections (progenetix, arrayMap,
  TCGA cohorts) with per-diagnosis filters; arrayMap is published from the same
  installation.
