name: Aphia
website: https://www.marinespecies.org/about.php
description: Aphia is the Flanders Marine Institute taxonomic data platform behind
  the World Register of Marine Species and its related global, regional, and
  thematic species registers. Public registers serve /aphia/js/aphia.js and a
  REST API under /rest. One catalog per host that runs the application. Thematic
  registers that are paths on marinespecies.org stay on the WoRMS record. Pages
  that only link to marinespecies.org/aphia.php are not Aphia installations.
