id: wfcatalog
name: EIDA WFCatalog
website: https://orfeus-eu.org/data/eida/webservices/wfcatalog/
description: EIDA WFCatalog is the ORFEUS/EIDA waveform-metadata web service
  deployed at every European Integrated Data Archive node. It exposes daily-granularity
  waveform quality and availability metrics as JSON through a versioned REST API at
  /eidaws/wfcatalog/1/ (query, version, application.wadl methods), specified by the
  EIDA WFCatalog specification with source in the EIDA GitHub organization. Node
  records typically also serve the companion FDSN web services
  (/fdsnws/station/1/, /fdsnws/dataselect/1/, /fdsnws/availability/1/); FDSN is a
  protocol family with multiple implementations, so the catalog-specific shared
  product is WFCatalog. One record per EIDA node.
