description: 52°North SOS is 52°North's open-source implementation of the OGC Sensor
  Observation Service (SOS 1.0/2.0). Public instances expose sensor observations via
  GetCapabilities / DescribeSensor / GetObservation, typically deployed as a Java
  webapp under /52n-sos-webapp/ with a default HTML page titled "52°North Sensor
  Observation Service". Used by geomonitoring, oceanography, and environmental
  observation networks.
