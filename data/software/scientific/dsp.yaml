description: The DaSCH Service Platform (DSP, formerly Knora) is an open-source
  repository for humanities research data. DSP-API stores RDF and media, exposes
  a JSON-LD HTTP API, and serves the public virtual research environment at
  app.dasch.swiss. Projects are tenants of that installation. The organization
  site dasch.swiss is not the repository.
