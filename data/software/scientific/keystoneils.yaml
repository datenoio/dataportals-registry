description: Index Data Keystone is the Keystone Digital Library Suite, a PHP and
  Zebra catalog whose public UI is Toolkit Lite (TKL). Installations show a
  “Powered by the Index Data Keystone ILS” footer, `.tkl` templates, and CCL
  search parameters (`cclterm`, `wf_step`). It is not Keystone Systems KLAS
  and not Trimble Locus. The last published TKL release is 1.5.9.
