description: Genesys PGR is the global online platform for plant genetic resources
  for food and agriculture, operated by the Global Crop Diversity Trust with CGIAR.
  It aggregates genebank accession passport and characterization data and lets
  genebanks publish and manage their collections; partner genebanks (for example
  the World Vegetable Center) embed Genesys interfaces in their own catalogs.
  Public APIs expose accession, institute, and subset data.
