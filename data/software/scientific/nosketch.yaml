id: nosketch
name: NoSketch Engine
description: NoSketch Engine is the open-source (GPL-2.0) corpus query suite of the
  NLP Centre at Masaryk University and Lexical Computing, consisting of the Manatee
  index backend and the Bonito web interface (the simplified sibling of the commercial
  Sketch Engine). Independent national language-bank and CLARIN installations share
  the Bonito UI and Manatee backend with CQL search. Register each public NoSketch
  UI, not every corpus inside one instance.
