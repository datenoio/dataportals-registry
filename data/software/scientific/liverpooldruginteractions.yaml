id: liverpooldruginteractions
name: Liverpool Drug Interactions
website: https://www.hiv-druginteractions.org/
description: Liverpool Drug Interactions is the University of Liverpool checker
  for evidence-based drug-drug interactions. The same application is deployed
  for HIV, hepatitis, COVID-19, and PrEP, and jointly with Radboud UMC for
  cancer. HIV, hepatitis, and COVID-19 publish a public interaction list at
  /view_all_interactions. Cancer uses /view_all_interactions/new. PrEP is in
  beta and currently exposes the checker and prescribing-resource lists.
