description: Archipelago Commons is an open-source digital objects repository and
  DAM architecture built on Drupal. Metadata lives as JSON in Strawberryfield; public
  catalogs expose Archipelago Digital Objects (ADOs) via Solr search, IIIF, optional
  OAI-PMH, and Drupal JSON:API. Installations range from GLAM collections to germplasm
  and research-data catalogs.
