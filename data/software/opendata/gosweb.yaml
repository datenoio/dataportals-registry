description: Gosweb is the Gosuslugi website constructor for Russian state and
  municipal bodies. Public pages load assets from
  static.gosweb.gosuslugi.ru/omsu/ and the NetCat template gw_omsu
  (/netcat_template/template/gw_omsu/). Open data is published at
  /ofitsialno/statistika/otkrytye-dannye/ with list.csv and meta.csv
  passports. A NetCat site that does not use the gw_omsu template is not
  Gosweb. esnsi.gosuslugi.ru is a separate reference-data system.
