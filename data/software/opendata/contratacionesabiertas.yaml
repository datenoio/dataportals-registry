name: Contrataciones Abiertas
website: https://github.com/datosabiertosmx/contrataciones-abiertas-infraestructura
description: Contrataciones Abiertas is INAI's EDCA-MX capture and public
  dashboard for open contracting. Installs serve
  /contratacionesabiertas/datosabiertos on Express, with
  /contratacionesabiertas/static/javascripts/common.js pointing at the
  capture API ({url}:{port}/edca/recordPackages/{year}). Distinct from
  other OCDS portals, including Peru's OECE site, and from pages that
  only mention the contracting standard.
