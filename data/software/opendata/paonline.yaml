description: PA-Online Open Data is the hosted DCAT catalog Technical Design
  publishes for Italian municipalities on pa-online.it. Each comune is a
  directory under /OpenData/{ISTAT code}/ with an RDF catalog (METADATO.rdf
  or a comune-named .rdf) that dati.gov.it harvests. The same host serves
  GisMasterWebS sportello and payment pages; those are not this catalog, and
  the map viewer remains gismaster.
