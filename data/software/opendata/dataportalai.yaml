name: DataPortal.AI
description: DataPortal.AI is the Sister (Almawave) open-data portal, the current
  generation of StatPortal Open Data and SPOD. Italian administrations publish a
  dataset catalog on their own host. SPOD portals are Drupal 7 with
  /sites/all/modules/spodata/, a statportal or spod_bootstrap theme, a catalog
  at /catalogo-opendata or /catalog, and datasets under /opendata/{slug}. The
  DataPortal.AI shell has title DataPortal.AI and /lmap/lmap-core/. Distinct
  from the Istat browser at statportal.it, from Sister Data Browser, from
  StatKit, from CKAN (including a former SPOD host that now returns
  ckan_version), and from a generic Drupal theme.
