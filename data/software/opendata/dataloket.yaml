id: dataloket
name: Het Dataloket
website: https://kbenp.nl/expertise/datatoepassingen
description: Het Dataloket is Analyze's hosted catalog of data assets for Dutch
  governments (datasets, maps, dashboards, and reports). Public tenants are a
  Vue SPA titled "Dataportaal", with /assets/img/search-blue.svg and
  /assets/img/logo_analyze.svg, configuration at /api/configuration, and catalog
  search at /api/search. Known hosts include data.venlo.nl,
  dataportaal.tilburg.nl, and dataportaal.prvlimburg.nl. One record per tenant.
  Distinct from Civity CKAN at ckan.dataplatform.nl, Swing incijfers sites, and
  the separate Limburg viewer at dataportaal-viewer.prvlimburg.nl.
