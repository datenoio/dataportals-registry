description: Budeshi is an open contracting data platform by the Public and
  Private Development Centre (PPDC, Nigeria). It hosts government procurement
  portals that publish projects, tenders, and awards as Open Contracting Data
  Standard (OCDS) releases, with documented HTTP APIs (e.g. /api and /ocds-api
  on the Kaduna State deployment). Installations carry a "Powered By Budeshi"
  credit. Use this id for Budeshi-hosted portals; unrelated one-off OCDS portals
  without the credit stay custom.
