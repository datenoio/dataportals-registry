name: BODIK ODCS
description: Hosted open-data catalog for Japanese local governments, run by
  the Big Data and Open Data Initiative Kyushu (ISIT). Each municipality is a
  tenant at odcs.bodik.jp/{lgcode}. The shared catalog API is CKAN at
  data.bodik.jp. A 2020 Docker package (odpkg-docker) bundles CKAN, WordPress,
  and a map dashboard; live tenants are the hosted service, not that package.
