description: >-
  Craft CMS is Pixel & Tonic's content management system. Some US
  research-data sites (CUAHSI, Chesapeake Bay Program data hub, Neotoma) publish
  their data catalog pages through Craft. Signals are the X-Powered-By Craft
  CMS response header and /cpresources/ asset paths. Data applications inside
  the CMS (search, download services) are site-custom.
