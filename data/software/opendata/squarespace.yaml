description: >-
  Squarespace is a hosted website builder. Small US research groups
  and foundations publish data and indicator pages as Squarespace sites (for
  example Kentucky Health Facts, Freedom on the Move, SAIS CARI Data). Signals
  are the Server Squarespace response header, static1.squarespace.com
  assets, and end-of-squarespace-headers HTML comments. Dataset tables and
  downloads are ordinary Squarespace pages.
