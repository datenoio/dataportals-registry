description: Municipium Portale Opendata is the open-data module of the Municipium
  municipal platform by Maggioli. Italian comuni publish a "Portale Opendata" catalog
  on their own host (opendata.comune.*.it) backed by the shared
  opendata-api.cloud.municipiumapp.it service, with a Bootstrap Italia theme,
  /js/agid-home.js, and the apis.maggioli.cloud captcha widget. Distinct from ATM
  Maggioli (atmmaggioli), the Spanish sede electrónica product.
