description: openportal is a Chinese government open-data portal product that serves
  the catalog under /extranet/openportal/pages/... . Observed on independent
  municipal hosts in two provinces — Yichun, Jiangxi (data.yichun.gov.cn) and
  Zhangjiakou, Hebei (kf.zjkzwfw.gov.cn). Distinct from Inspur oPortal (`oportal`),
  Zhejiang JDOP (`jdop`), and ODWeb (`odweb`).
