description: WSO2 API Manager developer portal (/devportal). Each installation
  lists REST and SOAP APIs with documentation, OpenAPI definitions, and
  subscription signup; governments use it as a national API catalog (e.g.
  api.viss.gov.lv in Latvia). Catalog records use catalog_type API Catalog.
  The software category is Open data portal because the software schema has
  no API Catalog category. Register each public developer portal, not each
  API operation.
