description: MapaInversiones is the Inter-American Development Bank (IDB) regional
  platform for public investment transparency, deployed in 14+ Latin American and
  Caribbean countries (Colombia, Paraguay, Costa Rica, Peru, Dominican Republic,
  Argentina, Jamaica, Honduras, Panama, and others). A .NET web application that
  georeferences public investment projects, budgets, and procurement data (using
  the OCDS standard), with a national open-data download section on each
  deployment. Since 2025 it is an open-source digital public good distributed
  through the IDB Code for Development (Code4Dev) catalog. Deployments are often
  branded "MapaInversiones" nationally, for example Costa Rica's Rendir Cuentas /
  MapaInversiones at rendircuentas.mideplan.go.cr.
