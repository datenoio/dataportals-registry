id: orasdigital
name: Oraș Digital
website: https://oras.digital
description: Oraș Digital is a Romanian municipal open-data portal product (oras.digital,
  "Connecting the City through technology") deployed per city as {city}.oras.digital
  with the sister city-app {city}.digital. The Iași deployment (iasi.oras.digital,
  alias opendata.oras.digital) is a Cloudflare-hosted shell (assets/js/app.min.js,
  assets/css/app.css) whose dataset pages group records into real-time, statistical,
  and map categories with institution and format filters (HTML, CSV, XLS, XLSX, API).
  A REST JSON API is documented per deployment at /api-docs/ with a downloadable Postman
  collection (assets/api/api-postman-collection.json).
