description: Gobierto Datos is the open-data catalog module of Gobierto, the
  municipal open-government platform from Populate Tools. Each administration
  gets a hosted site with a dataset hub at /datos/, DCAT metadata, CSV/JSON/XML
  downloads, and a SQL API over HTTP. The same suite also ships budget,
  contracts, and transparency modules; those pages are not this catalog.
  Source is at github.com/PopulateTools/gobierto. Populate also offers it as SaaS.
