description: Jekyll is a static site generator, often hosted on GitHub Pages.
  Research projects publish dataset catalogs as Jekyll sites (for example Open
  Graph Benchmark, Therapeutics Data Commons, Gene Ontology, BridgeDb). Signals
  are the `jekyll-seo-tag` HTML comments and a `Jekyll vX.Y.Z` generator meta.
  Use `jekyll` only when the data catalog itself is the Jekyll site; do not tag
  custom repository applications that merely keep a Jekyll docs frame.
