name: Centurion
description: Centurion is the government data-portal platform from PT eBdesk
  Teknologi. Public shells set theme-fontsize and data-maps on the html element
  and theme-shape="rounded" on the body. Installations load the Charts module
  from https://fem.centurion.id/remoteEntry.js or from a same-host
  /femc/remoteEntry.js that begins with "var Charts". Some tenants also expose
  a PostGraphile API at POST /api/v1/graphql (metadata_datasets). A satudata
  hostname alone is not this product. The centurion.id login and
  fem.centurion.id module host are not catalogs.
