name: CreatorCMS
website: http://www.yiyang.gov.cn/webapp/yiyang2019/dataPublic/index.jsp
description: CreatorCMS is a Chinese government website CMS whose data-open module
  serves municipal data catalogs under /webapp/{city}/... (dataPublic/index.jsp,
  dataDetail.jsp?id=), with KCUI front-end assets and /creatorCMS/ backend routes.
  Observed on Hunan municipal portals (Yiyang, Chenzhou, Yueyang). Vendor attribution
  is inferred from the KCUI/creatorCMS fingerprints.
