name: Andino
description: Andino is a Docker-packaged CKAN distribution developed by the Argentine
  Republic for the national open data policy. It bundles CKAN with the gobar theme,
  a time-series explorer (series_explorer), extra harvesters (gobar_ckan_harvester,
  xlsx_harvester), and the national metadata profile. It powers datos.gob.ar and
  provincial, municipal, and agency portals across Argentina. Detect via the
  gobar_theme extension in /api/3/action/status_show.
