id: islandis
name: Ísland.is
website: https://island.is
description: Ísland.is is the open-source digital-services platform of the Icelandic
  government (Stafrænt Ísland / Digital Iceland), developed as a public MIT-licensed
  TypeScript monorepo. Government content catalogs such as the Stjórnartíðindi official
  gazette and the Opin gögn open-data page are published as Ísland.is applications.
  A GraphQL gateway at api.island.is fronts the underlying REST microservices, and
  machine-to-machine services are registered in the X-Road Straumurinn API catalogue.
  Distinct from the national CKAN catalog on ckan.island.is (ckan).
