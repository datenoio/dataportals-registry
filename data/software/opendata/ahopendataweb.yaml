description: Anhui open-data-web is a Chinese public-data open platform product
  deployed in Anhui province. Deployments serve the catalog under /open-data-web/
  with Struts-style .do actions (Bozhou, Hefei) or /dataopen-web/ (provincial host
  data.ahzwfw.gov.cn). Distinct from Inspur oPortal (`oportal`), Zhejiang JDOP
  (`jdop`), ODWeb (`odweb`), and Guangxi gxopendata.
