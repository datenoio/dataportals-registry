description: Viavansi Open Government is a Spanish municipal open-data front end
  built as a WordPress theme (viavansi-open-government or viavansi-ogov-current)
  over a dataset catalog. Public installs include Diputación de Cádiz and
  Santander. The public page generator is WordPress. Use this id when that
  theme is the catalog. A bare WordPress open-data page without the Viavansi
  theme stays wordpress. Do not set ckan unless the public catalog UI is CKAN.
