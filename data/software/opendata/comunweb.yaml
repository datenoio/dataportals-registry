description: ComunWeb is the Consorzio dei Comuni Trentini website platform used
  by Trentino municipalities and communities. Each site publishes a dataset
  list as the content class opendata_dataset
  (/api/opendata/v1/content/class/opendata_dataset) and a CSV at
  /exportas/csv/opendata_dataset. The classList endpoint also exposes the rest
  of the CMS. Register one record per ente site that has that dataset class,
  not the vendor site comunweb.it. A ckan_ prefix on objectRemoteId is a remote
  id, not a CKAN portal.
