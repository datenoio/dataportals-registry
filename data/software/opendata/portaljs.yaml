name: PortalJS
description: PortalJS is Datopian's open-data catalog frontend. Governments and
  other organizations publish a dataset catalog on their own host, often with
  the footer "PortalJS on CKAN Backend". Dataset pages use /@{org}/{slug}.
  Hosted portals also run on {slug}.portaljs.com and {slug}.arc.portaljs.com.
  A CKAN Action API on the same host or a linked API host does not make the
  public catalog plain CKAN.
