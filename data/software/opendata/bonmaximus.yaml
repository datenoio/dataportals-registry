name: Bon Maximus e-Procurement
website: https://bonmaximus.com
description: Bon Maximus e-Procurement is a vendor-built electronic government
  procurement and open contracting portal by Bon Maximus Companies Ltd (Abuja,
  Nigeria). Deployments power Nigerian state Bureau of Public Procurement portals
  (e.g. Kogi, Osun, Abia, Ebonyi, Anambra) that publish tender and award records
  and OCDS-oriented pages. Installations are IIS-hosted ASP.NET sites with a
  "Powered by Bon Maximus Companies" footer credit. Use this id for the vendor
  product; one-off e-procurement sites without the Bon Maximus credit stay custom.
