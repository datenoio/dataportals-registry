id: imaptoo
name: iMap (imapTOO)
website: https://www.comoxvalleyrd.ca/about/about-cvrd/imap
description: imapTOO is the hosted iMap municipal web-GIS platform operated by
  the Comox Valley Regional District (British Columbia, Canada) for itself and
  neighbouring local governments. Tenants are ArcGIS Web AppBuilder viewers
  (jimu.js, title "ArcGIS Web Application") on *.imaptoo.ca hosts at /imap/,
  /imapviewer/, or /secure/, backed by a shared ArcGIS Server at
  mapviewer.imaptoo.ca/imap87320977492837458/rest/services (alias
  imap2.comoxvalleyrd.ca). Known tenants are Comox Valley RD (mapviewer.imaptoo.ca/secure/),
  Alberni-Clayoquot RD (acrdimap.imaptoo.ca/imap/), Village of Cumberland
  (imapcumberland.imaptoo.ca/imapviewer/), and Regional District of Mount
  Waddington (imaprdmw.imaptoo.ca/secure/). Distinct from generic "iMap"-named
  viewers on other platforms (Maryland iMap, King County iMap) and from 1Map
  (1Doc, Brazil).
