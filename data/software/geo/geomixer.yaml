description: GeoMixer (Kosmosnimki) is a web GIS platform developed by ScanEx. It
  powers map-centric geoportals with a layer tree, vector and raster data publishing,
  satellite imagery catalogs, and a JavaScript/REST API (geomixer.js) used both for
  ScanEx-operated services (kosmosnimki.ru, fires.ru, search.kosmosnimki.ru) and for
  third-party thematic maps that embed the Kosmosnimki maps API.
