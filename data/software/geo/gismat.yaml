description: GISMAT is PH Informática's municipal geoportal (WEBEPL, WEBPDM,
  WEBCAP, WEBMIC, WEBCAT). Public viewers are a React, Cesium, and OpenLayers
  shell with geoportal.svg, window.CESIUM_BASE_URL, and a footer credit
  "Powered by Ph Informática SA". Tenants run on municipal hosts or
  *.phinformatica.pt. Distinct from older PH Informática MapGuide shells
  (mapguide) that credit "desenvolvido por Ph informática SA" and load
  /mapguide/mapviewerajax/, and from GeoServer (geoserver) on the same host.
