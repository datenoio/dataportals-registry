id: kommunekart
name: Norkart Kommunekart
website: https://www.kommunekart.com/
description: Norkart Kommunekart is a Norwegian municipal web map platform from
  Norkart AS. The national viewer at kommunekart.com loads a Norkart JS app
  (new Norkart with appId Kommunekart) with free detailed maps and aerial
  imagery for all of Norway, and municipalities run branded viewers on their own
  hosts (for example kart.harstad.kommune.no). Kommunekart 3D
  (3dx.kommunekart.com) is a Cesium-based variant. Successor to the legacy
  Norkart WebAtlas (webatlas.no). Distinct from Avinet Adaptive (avinet) and
  ISY Map (isymap).
