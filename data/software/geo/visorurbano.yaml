description: Visor Urbano is Guadalajara's municipal urban-management GIS,
  replicated across Mexican cities with Bloomberg Philanthropies support.
  Public tenants use visorurbano.{city}.gob.mx or {city}.visorurbano.com for
  cadastral lookup, land-use consultation, and business or construction
  licences. Distinct from unrelated Leaflet city visors that reuse the
  "Visor Urbano" label (for example visorguadalupe.com).
