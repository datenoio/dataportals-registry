description: TerraVisu is the open-source territorial data visualization platform
  from Makina Corpus and Autonomens (Terralego). Public catalogs are interactive
  map observatories that list thematic scenes and layer trees from a Django API
  (`/api/geolayer/scene/`, `/api/geolayer/view/{slug}/`). Distinct from older
  Terralego Angular apps on terralego.com that lack those endpoints.
