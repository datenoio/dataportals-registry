description: G3W-SUITE is an open-source QGIS WebGIS platform (Django G3W-ADMIN plus
  Vue/OpenLayers G3W-CLIENT) for publishing QGIS projects as public map catalogs and
  OGC services. Italian regions, metropolitan cities, parks, and municipalities use
  it as the public geoportal. Distinct from Lizmap (lizmap) and QWC2 (qwc2).
