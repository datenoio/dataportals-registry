description: istSOS is an OGC Sensor Observation Service (SOS) server for managing
  and publishing sensor and observation data (hydrology, meteorology, environmental
  monitoring). It implements SOS 1.0.0/2.0, offers a REST administration and data
  API, a web admin interface and viewer, and supports procedures, offerings,
  observed properties and time-series observations as interoperable sensor web
  services.
