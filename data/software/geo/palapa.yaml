description: Palapa (Geoportal Palapa / GSPalapa) is Badan Informasi Geospasial's
  open-source simpul jaringan geoportal for Indonesian ministries, provinces,
  and kabupaten/kota. Public nodes use title Geoportal Palapa, path /main/,
  login /gspalapa/, and a bundled GeoServer plus pycsw CSW at /csw. Distinct
  from GeoNode, standalone GeoServer catalogs, Ina-Geoportal, provincial
  /WebPortal/ shells, and CKAN hosts branded Satu Data Palapa.
