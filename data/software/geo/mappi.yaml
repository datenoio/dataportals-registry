description: Mappi is Swis's hosted map platform for Dutch municipalities and
  organizations ("het kaartenplatform voor organisaties"). Public tenants run on
  city hostnames (kaart.leiden.nl, kaart.kampen.nl, kaart.amsterdam.nl,
  kaart.katwijk.nl, kaart.westerkwartier.nl, kaartlaag.rotterdam.nl,
  kaart.halle.be) as a Laravel/Vue SPA carrying
  <meta name="tenant-id"> and a shared <meta name="app-version"> build hash, with
  map GeoJSON served from /api/maps/{id}.json. One record per public tenant;
  event maps (kaart.marathon.nl) are out of scope.
