name: uMap
website: https://umap-project.org
description: uMap is an open-source collaborative map creator built on OpenStreetMap
  (Django + Leaflet). Each public instance acts as a map catalog where users publish
  maps with their own datalayers (GeoJSON); public maps are browsable and searchable
  on the instance home page and via /{lang}/search/. Widely self-hosted by OSM
  chapters, French public bodies, and civil-society groups.
