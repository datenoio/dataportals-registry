name: Maplat
description: Maplat is a Japanese open-source (FOSS4G) viewer for historical
  maps and picture maps (絵地図) with rubber-sheeting between old and current
  maps (MaplatTin / MaplatEditor). Maintained by Code for History; used by
  libraries, museums and municipalities. Hosted tenants run under
  s.maplat.jp/r/{tenant}/ (ぷらっと series) or on custom domains such as
  onkochishinmap.com.
