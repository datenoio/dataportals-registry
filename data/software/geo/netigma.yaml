name: Netigma
website: https://www.netcad.com/tr/urunler/netigma
description: Netigma is a low-code web application platform from Netcad Yazılım
  A.Ş. used by Turkish municipalities to publish spatial and non-spatial data
  as map-based forms, reports, and dashboards. The common public deployment is
  the BELNET municipal portal at /BELNET/LoginFW/Login.aspx (login page shows
  netigma-logo.png and "Netcad Hesabınızla Giriş Yapabilirsiniz"), often on a
  keos.* or webgis.* host next to a NetGIS Server KEOS city guide, which is a
  separate catalog. Guest (misafir) access and e-Devlet login are common.
