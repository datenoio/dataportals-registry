name: GeoMoose
website: https://www.geomoose.org
description: GeoMoose is an open-source WebGIS JavaScript framework, an OSGeo
  community project originally created for Minnesota state and county governments.
  Version 2 pairs a PHP/MapScript frontend with MapServer mapfiles; version 3 is a
  React/Redux client with small Node or PHP services (identify, search, select,
  geocode). Widely deployed by US counties and by agencies in Mongolia, Latin
  America, and Europe as public parcel and thematic map viewers.
