id: geoview
name: GeoView
website: https://canadian-geospatial-platform.github.io/geoview/
description: GeoView (CGPV) is the Canadian Geospatial Platform's open-source
  embeddable map viewer for geoCore content. Built with React, TypeScript, and
  OpenLayers as a Rush monorepo, it is embedded with a single cgpv-main.js script
  tag and div.geoview-map containers configured through data-config JSON or a
  programmatic JavaScript/TypeScript API (cgpv.init, createMapFromConfig). It
  renders WMS, WFS, ESRI REST, GeoJSON, and tile layers, is bilingual (EN/FR) and
  WCAG 2.1 compliant, and supports external plugins such as Clip-Zip-Ship.
  Distinct from Nobel Systems GeoViewer Online (geoviewer) hosted on geoviewer.io.
