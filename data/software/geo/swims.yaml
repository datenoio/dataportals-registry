name: SWIMS
website: https://swims.faoswalim.org/
description: SWIMS (Water Sources Information Management System) is FAO SWALIM's
  web application for inventorying and monitoring Somali water sources. Public
  tenants pair an operational dashboard and LiveMap with a tabular inventory of
  boreholes, dug wells, dams, berkads, and springs, including functioning status,
  quality analytics, and survey metadata. Deployed for FAO SWALIM
  (swims.faoswalim.org) and replicated to the Puntland Information Management Center
  (pwsims.imcpuntland.so, branded PWIMS); both serve the same AdminBSB/calcite-maps
  application with /dashboard/view and water-source WFS/WMS layers. Related
  SWALIM-family applications (ClimSeries, FRRIMS) are separate products. One record
  per public tenant.
