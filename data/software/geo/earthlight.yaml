description: StatMap Earthlight is a UK local-government browser GIS (Earthlight
  Portal / Earthlight Public, with Aurora public map embeds). Public SaaS tenants
  live at {authority}.statmap.co.uk/map/map.html with HTML title StatMap Earthlight
  and login=ExternalELP; some councils host the same /map/map.html app on maps.{council}.gov.uk.
  Distinct from Astun iShare (ishare) and Cadcorp SIS WebMap (cadcorp). Skip intranet-only
  Earthlight Enterprise and HorizoNext planning case portals.
