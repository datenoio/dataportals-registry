id: miramon
name: MiraMon
website: https://www.miramon.cat
description: MiraMon is a GIS and remote sensing software suite developed by CREAF
  and the Universitat Autònoma de Barcelona (GRUMETS research group). The MiraMon
  Map Server (CGI) publishes OGC WMS/WMTS/SOS collections, and the MiraMon Map
  Browser is an HTML5/JavaScript client configured by a declarative config.json
  that can combine layers, binary arrays, and data cubes from several servers.
  Deployed mainly by Catalan and Andorran research and government bodies as
  thematic geoportals, climatic atlases, and Earth observation data cubes.
