description: GAUSS WebGIS is a Brazilian municipal cadastral viewer from GAUSS
  Geotecnologia e Engenharia (Porto Alegre, RS). Public tenants live at
  {city}.webgis.geo.br/{city} with the title "{City} WebGIS - GAUSS", an
  OpenLayers map, and layers from geoserver2.webgis.geo.br/geoserver/{city}/wms.
  Some cities also publish a public map at /mapa-publico. Distinct from GAUSS
  WebCity (gausswebcity), the MapStore product of Gauss d.o.o. Tuzla on
  *.gis.ba, and from DRZ WebGIS (drzwebgis), CTMGEO SigWEB (ctmgeo), Geodados
  SaaS (geodados), and Geopixel Cidades (geopixel). Nonexistent city hosts
  fail DNS. Do not guess city slugs; confirm a live "{City} WebGIS - GAUSS"
  title.
