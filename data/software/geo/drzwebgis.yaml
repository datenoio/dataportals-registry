id: drzwebgis
name: DRZ WebGIS
website: https://www.drz.com.br/
description: DRZ WebGIS (Plataforma SIG Web) is a Brazilian municipal cadastral
  WebGIS from DRZ Territórios Inteligentes. Public tenants live at
  webgis.drz.com.br/{city}/ with OpenLayers, meta Rodolfo/DRZ Geotecnologia,
  and lot/zoning search. Nonexistent city paths return nginx 404 (not a
  wildcard). Distinct from CTMGEO SigWEB (ctmgeo), Geodados SaaS (geodados),
  and Geopixel Cidades (geopixel). Skip the nginx default root, /drz/ clients
  map, Tomcat manager, and demo/docs/examples paths.
