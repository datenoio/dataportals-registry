description: North Australian Fire Information (NAFI) is a hosted fire-mapping
  service for northern Australia operated by Charles Darwin University with
  land-manager partners. The OpenLayers web viewer at firenorth.org.au/nafi3/
  publishes current fire locations, fire scars, and fire-history layers backed
  by GeoServer with public WMS feeds. Single hosted instance; do not confuse
  with generic fire-map pages.
