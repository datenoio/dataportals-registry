description: CatasIA is Gentemóvil's multipurpose-cadastre product for Colombian
  cadastral managers. It runs on ArcGIS and the LADM-COL model and is licensed
  as software as a service. The public dissemination portal is an Angular
  application whose client bundle contains the string logCatasia.
  Villavicencio publishes that portal at catasia.villavicencio.gov.co. Do not
  infer CatasIA from a generic cadastral geoportal, or from a back-office
  license that has no public dissemination site.
