description: Tailormap is an open-source Angular and OpenLayers GIS viewer from
  B3Partners. Public municipal and agency maps use title Tailormap, path
  /nl/app/{app} or /nl/page/, JSON GET /api/app/{app}, or the older
  /portal/page/extern gallery. Hosts are typically {org}.tailormap.nl,
  {org}.tailormap.com, or a city GIS host. Distinct from GeoServer backends
  on the same estate and from vendor demo/snapshot tenants.
