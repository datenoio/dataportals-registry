description: Sentinel Hub (Sinergise / Planet) is a commercial Earth-observation
  platform with a STAC Catalog API, OGC WMS/WMTS/WCS, Process API, and EO Browser /
  Copernicus Browser clients. Official catalog hosts include services.sentinel-hub.com
  and collections.sentinel-hub.com. Prefer sentinelhub over stacserver for Sentinel
  Hub Catalog. Distinct from openEO backends (openeo), including the Sentinel Hub
  openEO API on Copernicus Data Space.
