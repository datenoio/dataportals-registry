id: ldpgis
name: LDP SIT
website: https://www.ldpgis.it/
description: LDP SIT is LDP Progetti GIS's hosted municipal territorial information
  system used by Italian comuni and unions. Public tenants live at
  cloud.ldpgis.it/{comune}/ (and sct-*.ldpgis.it / maps1.ldpgis.it slugs) and on
  city-owned hosts such as maps.comune.arezzo.it. Interactive maps use LdP Viewer
  (OpenLayers). Distinct from Drupal as the public catalog (Drupal is only the
  CMS shell), from GeneGIS PAGIS (genegis), and from Maggioli GFMaplet
  (gfmaplet). Skip the vendor marketing hub cloud.ldpgis.it/ with no comune slug
  and empty placeholder tenants that only repeat the LDP product homepage.
