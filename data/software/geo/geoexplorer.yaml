id: geoexplorer
name: GeoExplorer
website: null
description: GeoExplorer (branded "GEOhub") is a shared Saudi municipal web-GIS viewer
  deployed per municipality (amanat). Installations are hosted on municipal
  mapservice.* / webgis.* subdomains with a per-city path such as /HailGeoExplorer/
  or /Asir_GeoExplorer, and serve a shared static asset root /MapControl_GeoExplorer/.
  The front end is a Blazor application built on the ArcGIS Maps SDK for JavaScript
  that consumes the municipality's map services, offering layer browsing, search and
  identify, and shapefile import/export.
