description: GC2 (GeoCloud 2) is an open-source spatial-data platform from MapCentia,
  often paired with the Vidi browser GIS client. It deploys PostGIS, MapServer or
  QGIS Server, MapCache, and Elasticsearch, and exposes layers through a SQL API,
  WMS, WFS, and WMTS. Danish municipalities commonly host tenants on mapcentia.com
  or gc2.io.
