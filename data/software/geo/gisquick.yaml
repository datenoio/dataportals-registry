description: GISQuick is an open-source platform for publishing QGIS projects as
  responsive web map applications. The stack combines a QGIS plugin, a Go/Django
  server application, QGIS Server, and Vue.js web/mobile clients, communicating over
  OGC WMS, WMTS, and WFS services. Each published project exposes a public JSON
  project description and OGC web services.
