description: dpWebmap is Digpro's browser-based client for dpSpatial and
  related network and municipal GIS products. Deployments commonly use a
  /bios/dpwebmap/ application root, the dpWebmap title, and a compiled
  app.htmlclient.gwt.DPWebApp.nocache.js client. The viewer can publish layers
  from WMS, WFS, and other configured geodata services.
