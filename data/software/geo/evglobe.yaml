id: evglobe
name: EV-Globe
website: https://www.ev-image.com/
description: EV-Globe is Beijing Guotu Xintiandi's (国遥新天地) proprietary 3D GIS
  / spatial-information platform family (EarthView brand). EV-Globe Desktop and WebGL
  viewers plus the EV-Server cloud GIS server (currently EV-Server 7) that hosts,
  processes, and publishes imagery, DEM, vector, tile, and 3D-model services with
  OGC WMS/WFS support. Public instances splash with title EV-Server and redirect to
  the login-gated manager SPA at /earthview/server/manager/index.html (v7) or
  /ev-server/manager/index.html (older). Most deployments are Chinese government,
  energy, or intranet systems. Register only tenants with a public unauthenticated
  service or catalog view. Do not register the vendor homepage ev-image.com, the
  forum bbs.ev-image.com, bare-IP manager consoles, or the manager login itself.
