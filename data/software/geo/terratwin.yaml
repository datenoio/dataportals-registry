id: terratwin
name: Terratwin
website: https://terratwin.de/
description: Terratwin is an ArcGIS-based digital-twin and geoportal platform for
  German municipalities and districts, developed with cities and Landkreise for
  urban planning and citizen participation. Public clients share an identical
  hashed Vite bundle set with ALKIS cadastral modules (alkis-*.js), run on a
  /terratwin/ or /m/hokis/ route of a county GDI subdomain, or appear as
  vendor-hosted tenants under *.terratwin.net (for example Landkreis Calw on
  lracw.terratwin.net). Do not confuse with the unrelated EU research project
  terratwin.eu.
