id: vertigisstudioweb
name: VertiGIS Studio Web
website: https://www.vertigis.com/studio/web/
description: >
  VertiGIS Studio Web (formerly Geocortex Web / GXW) is a commercial web GIS
  viewer on Esri ArcGIS. Public apps launch from /vertigisstudio/web/?app={guid},
  /gcx/WebViewer/?app={guid}, or /Geocortex/WebViewer/?app={guid}, with HTML
  #gcx-app and a page title VertiGIS Studio Web. SaaS tenants appear under
  apps.vertigisstudio.com and apps.vertigisstudio.eu. Distinct from Geocortex
  Essentials (geocortex) Html5Viewer / REST Sites Directory and from VertiGIS
  WebOffice (weboffice). One catalog per public tenant, not per app GUID.
