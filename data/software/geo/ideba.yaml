name: IDEBA Visualizador
website: https://visualizador.ideba.gba.gob.ar/
description: IDEBA Visualizador is the hosted municipal map-viewer platform of the
  Buenos Aires Province spatial data infrastructure (IDEBA, Infraestructura de Datos
  Espaciales de la Provincia de Buenos Aires). Municipal tenants live at
  visualizador.ideba.gba.gob.ar/{municipio} as a Leaflet application
  (src/leaflet/plugins/*, map-toolbar.css) backed by per-tenant GeoServer workspaces
  at geoserver-nodo2.ideba.gba.gob.ar/geoserver/{municipio}/wfs|wms. One record per
  public municipal tenant; the province-level GeoNetwork catalog and GeoServer nodes
  are separate records.
