description: Avinet Adaptive (Webatlas) is a Norwegian thematic map platform
  from Avinet AS / Asplan Viak Digitale tjenester. Public atlases load ExtJS
  4.2 and OpenLayers 2.13, often from a3.avinet.no, and expose WMS/WFS via
  wms.ashx / wfs.ashx. Distinct from ISY Map (isymap) and from ArcGIS Hub.
