description: Xiltrion is Dataxil's hosted multipurpose-cadastre platform. Its
  public municipal map clients use customer subdomains of
  xiltriongeoservicio.com, the /map route, an identical hashed Vite bundle, and
  Xiltrion-branded Mapbox styles. The shared client calls a first-party /api and
  supports public parcel mapping, municipal boundaries, thematic layers, and
  WMS sources; the wider authenticated application supports cadastral workflows.
