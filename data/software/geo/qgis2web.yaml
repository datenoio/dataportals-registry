description: qgis2web is an open-source QGIS plugin that exports the current map
  to a self-contained static web viewer (OpenLayers or Leaflet). Exports are
  typically uploaded as-is under a public path and carry recognizable assets
  (resources/qgis2web.js, resources/qgis2web.css, qgis2web_expressions.js) plus
  a layers/layers.js data file. Popular with municipal and cadastral GIS
  viewers, for example in Costa Rica and Lebanon.
