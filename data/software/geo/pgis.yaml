description: pGIS is TOPODATI's hosted geographic-information browsing platform
  for Latvian municipalities. Deployments use customer subdomains of pgis.lv,
  title the Angular client pGIS, load the same hashed main and styles bundles,
  and expose a JSON layer-classifier API under /api/v1/classifiers/layers. The
  vendor service includes WMS and WFS services, initial data import, and one
  municipal tenant per subscription.
