name: GoMap
website: https://indixio.com/gomap/
description: Indixio GoMap (formerly Geomap GIS Amérique, hosting brand
  iGeoMapGuide / geomapguide.ca) is a proprietary web GIS platform built on
  MapGuide Open Source and FDO for publishing, viewing, querying, and editing
  geospatial data. SaaS tenants live on {client}.geomapguide.ca; on-premise
  tenants use paths such as /gomap/ or /map/ on the owner domain. Viewer title
  pattern "GoMap - {tenant}", scripts under /gomap_web/, MapGuide mapagent
  backend. Distinct from SIGimWeb (sigimweb), the Indixio Quebec municipal
  assessment viewer on the same engine, and from generic MapGuide (mapguide)
  sites. One record per public tenant.
