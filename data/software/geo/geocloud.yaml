id: geocloud
name: Platforma GeoCloud
website: https://geocloud.gov.sk/
description: Platforma GeoCloud is the Slovak national GeoICT platform run by the
  Ministry of Environment (MZP SR) under the ESPUS project. It hosts the national
  INSPIRE applications on shared FastAPI + PostgreSQL/PostGIS backends with
  GeoServer and MapProxy at gis.geocloud.gov.sk and a Strapi CMS at
  cms.geocloud.gov.sk. Tenants include Narodny geoportal (geoportal.gov.sk,
  Vue.js/Vuetify, /settings.js exposes VUE_APP_API_ENDPOINT_GP
  api.geocloud.gov.sk/geoportal), Register of Spatial Information RPI (rpi.gov.sk,
  Angular + FastAPI), and the NIPI website (inspire.gov.sk). Distinct from Cegal
  GeoCloud, US GeoCloud Inc (gpt.geocloud.com, esrigeo), and the Chinese 地质云.
