description: GajaMatrix GeoPortal / GDI-Knoten is the public web portal and GDI node
  module of the GajaMatrix municipal GIS by Gingko.Systeme, aimed at small and
  medium-sized German municipalities. Public GeoPortal frontends show a
  "GajaMatrix GeoPortal" page title or send an x-powered-by "GajaMatrix GIS" header
  (WildFly backend); documented tenants include Merseburg, Gera, Wasser Nord,
  Rudolstadt, Altenburg, and Elsterwerda. The vendor-hosted backends on
  {tenant}.gajamatrix.de/geoserver and gdi.gajamatrix.de/geonetwork are tagged with
  those software ids, not this one. Distinct from disy Cadenza (cadenza).
