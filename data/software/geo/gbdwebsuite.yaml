id: gbdwebsuite
name: GBD WebSuite
website: https://gbd-websuite.de/
description: GBD WebSuite is an open-source WebGIS platform from gbd-consult combining
  a WebGIS server, a responsive web client, OGC services (WMS, WMTS, WFS), and 1:1
  QGIS Server project rendering, deployed as Docker containers. Public clients load
  /_/webSystemAsset/path/{app,vendor,util}.js, expose a gc/main React module and
  gwsLogin/gwsOptions globals, and are used by German municipalities and water boards
  (Schmallenberg, Hase-Wasseracht). Source and docs are public.
