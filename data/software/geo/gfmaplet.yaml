name: GFMaplet
website: https://www.sportellotelematicopolifunzionale.it/cartografia-online
description: GFMaplet is GLOBO S.r.l. (Gruppo Maggioli) Web GIS for Italian
  municipal and provincial geoportals, often embedded in Sportello Telematico
  Unificato (STU) Drupal pages. Public catalogs use /page:s_italia:geoportale or
  a comune-specific geoportale page, with cartography at
  /stu-geoportale-cartography or /gfmaplet/. Hosted tenants include
  {comune}.prod.globogis.com. Distinct from GisMaster (gismaster) on
  sportellounicodigitale.it, from ATM Maggioli (atmmaggioli) Spanish open data,
  and from ArcGIS Server as the public catalog. One record per geoportale
  tenant, not the sportello form home and not cartografia*.maggioli.cloud REST
  as a second copy of the same STU geoportale.
