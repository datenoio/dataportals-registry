description: OVIE (Oficina Virtual de Información Económica) is INEGI's municipal
  economic GIS template for IMPLAN and state sites. Public viewers share
  OpenLayers OL.js, Materialize, html2canvas, canvg, and jsPdf under /js/libs/.
  Distinct from Mapa Digital de México / MxSIG (mxsig) and
  from generic OpenLayers copies. Do not set ovie from Mission Viejo
  geoviewer.io or other hosts that merely contain ovie in the hostname.
