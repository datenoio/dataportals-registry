description: Berry GIS is the hosted municipal GIS of Berry ICT (BerryBath
  Solutions & Cutting Edge Technologies), an Accra-based ICT firm. Public
  property-identification viewers run on the vendor domain under
  gis.berryict.com/gis/gis/{assembly}/propertyidentification.php with a shared
  Leaflet client and per-assembly layers for streets, buildings, parcels,
  blocks, communities, and sub-metros. The vendor also supplies street
  addressing (Geo-Spatial Address Systems) and property-rate mapping for Ghanaian
  assemblies.
