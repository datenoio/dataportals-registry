description: NetGIS Runtime is WSP Danmark's municipal WebGIS viewer. Public
  maps live at municipal hosts under /NetGISRuntime/basis/index.jsp (often with
  custid or alias query params) and title NetGIS - © WSP Danmark. Distinct from
  Turkish Netcad NetGIS Server (netgisserver) and from German netgis.de MapServer
  clients. One record per municipal viewer, not the ArcGIS REST directory on the
  same commune.
