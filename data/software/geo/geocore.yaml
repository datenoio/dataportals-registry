name: geoCore
website: https://canadian-geospatial-platform.github.io/geocore/
description: geoCore is the Canadian Geospatial Platform's open-source, cloud-native
  (AWS) geospatial catalog. It stores HNAP / ISO 19115 and provincial metadata in a
  flexible extended-GeoJSON "metadata lake" and exposes a REST API (bbox search
  GET /geo, record lookup GET /id, /featured, /foundational, plus API-key
  contribution endpoints). It harvests GeoNetwork over CSW and STAC catalogs, and
  powers the app.geo.ca discovery app together with the GeoView map viewer. The
  app.geo.ca frontend (Canadian-Geospatial-Platform/app.geo.ca-v2, SvelteKit + SST)
  can be white-labeled so contributors can run their own portal on the shared
  catalog; as of September 2026 the only production deployment is GEO.ca itself.
