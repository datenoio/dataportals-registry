id: gogis
name: Go GIS
website: https://www.sungis.lv/our-products/go-gis/
description: Go GIS is SunGIS's (SIA SunGIS, Latvia) browser and QGIS geospatial
  data-management product for municipalities and municipal utilities. Public
  tenants are hosted on {org}.gis.sungis.lv and title the Angular SPA Gogis V2
  or GogisFrontendV3, loading OpenLayers plus /assets/images/gogis_logo_white-min.png.
  Self-hosted municipal deployments serve the "gopub" public portal variant
  (HTML title `gopub`, `data-theme="gogis"` on the root element, bundle
  references to sungis.lv), e.g. geodati.jelgava.lv.
  Distinct from Indixio GoMap (gomap) on geomapguide.ca, from Latvian terGIS
  (tergis) and pGIS (pgis), and from Stellenbosch University's sungis08 GeoServer.
