description: MxSIG is INEGI's open-source web GIS (Mapa Digital de México V6).
  Public viewers load /mdm6/ or /mxsig2/ with jquery 1.9, amplify.js,
  lz-string, and title Mapa Digital de México. Distinct from OVIE
  (ovie), which is a separate OpenLayers/Materialize economic template.
  Do not set mxsig from a generic OpenLayers copy or from Gaia DENUE
  wrapper pages that are not the MDM6 viewer.
