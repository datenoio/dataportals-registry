description: VLAB is the online planning-map product of VLAB Co., Ltd (footer
  credit "Phát triển bởi VLAB" / VLAB J.S.C). Vietnamese cities publish approved
  zoning maps and parcel lookup on their own hosts or on vlab.tech. Confirmed
  installations include Ho Chi Minh City
  (thongtinquyhoach.hochiminhcity.gov.vn, Leaflet and Tangram, guest.map CSS)
  and Thu Duc City (ttqh-thuduc.tphcm.gov.vn, guest.index CSS), plus vendor-hosted
  maps such as htkt-thuduc.vlab.tech. Require the VLAB credit, a vlab.tech host,
  or a /img/vlab.png (or vlab-logo.png) asset. Do not set vlab from the words
  "quy hoạch" alone, from eKMap (ekmapboxgl), from Hanoi quyhoach.hanoi.gov.vn
  (Next.js), or from Vinh Phuc OpenLayers planning.
