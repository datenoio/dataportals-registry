id: inventwebgis
name: INVENT WebGIS
website: https://invent.al/en/index.html
description: INVENT WebGIS is the browser-based WebGIS product line of INVENT ltd
  (Tirana, Albania), built for Albanian public authorities with editing, SDI, and
  INSPIRE/ASIG interoperability support. Public viewers load invent.css and an
  OpenLayers/dojo client under /aps/?name={tenant} or /apps/?name={tenant}; known
  deployments are the ARRSH road-authority WebGIS, the ATP property-agency WebGIS,
  and tenant viewers on INVENT's own hosting (maps.gc-al.com, apps.invent.al —
  vendor gallery at apps.invent.al). Distinct from the OpenLayers/GeoExt heritage
  viewers run by IKTK
  (arkeologjia/monumente.iktk.gov.al), which are a different build.
