description: Geopixel Cidades is a Brazilian municipal geointelligence SaaS
  (cadastre, IPTU, and public map catalog). Public geoportals use
  {city}.geoportal.geopixel.com.br, a shared Next.js shell that loads city
  config from /api/pages. Older tenants also appear at
  {city}.geopixel.com.br/geopixelcidades-{city}/. The geoportal hostname is a
  DNS wildcard — do not register a city from HTTP 200 alone.
