description: IGVT (internal "IGeo Viewer Template", npm gis-viewer-template) is the
  in-house GIS viewer framework of the State Geodetic Administration of Croatia (DGU,
  Državna geodetska uprava). DGU operates branded deployments for other Croatian state
  bodies; installations share igvt_* internals (igvt_local_features, __igvt_group_,
  IGVT.ENV) and an igeo-loading bootstrap element. Live deployments include GeoHrvatska
  (geohrvatska.hr), the HAC Geoportal (geoportal.hac.hr), Bioportal GIS (bioportal.hr/gis)
  and the NIPP geoportal viewer (geoportal.nipp.hr). Distinct from DGU's newer EnGeon
  viewer (geoportal.dgu.hr, 2025 relaunch, engeon-app element).
