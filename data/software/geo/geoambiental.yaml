description: Geoambiental is SIGMA Ingenieria's proprietary geographic and
  management platform for Colombian environmental authorities. Its public
  cartographic viewers use organization-specific geoambiental.co subdomains,
  the /content-layout route, a Geoambiental page title, and matching Angular
  vendor and stylesheet bundles. The wider platform manages environmental
  permits, monitoring, indicators, reports, and structured cartography and is
  offered as software as a service.
