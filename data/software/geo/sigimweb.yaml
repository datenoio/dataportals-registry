description: Indixio SIGim Web (SIGimWeb) is a Quebec municipal GIS viewer for
  assessment rolls, graphic matrices, cadastre, and zoning. Public tenants use
  title SIGimWeb, path /sigimweb/ or /sigim/, ExtJS, and /gomap_web/. Distinct
  from generic MapGuide (mapguide), GOnet, and JP Cadrin CIF. One record per
  public MRC or city tenant, not per municipality in the picker.
