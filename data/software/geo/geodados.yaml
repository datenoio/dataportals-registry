description: Geodados SaaS (Sistema Geodados) is a Brazilian municipal GIS from
  Geodados Geoprocessamento in São José do Rio Preto, SP. Public tenants live
  at {city}.geodados.com.br/Publico with OpenLayers, anonymous access
  (acessoAnonimo = true), thematic maps, and viability queries. Staff login at
  the tenant root is not a catalog. Distinct from ArcGIS Hub sites named
  Geodados and from GeoNode geodados.daee.sp.gov.br. Nonexistent city hosts
  fail DNS. Skip oracle.geodados.com.br (internal) and www.geodados.com.br
  (marketing).
