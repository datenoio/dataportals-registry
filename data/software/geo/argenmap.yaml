id: argenmap
name: Argenmap
website: https://ign-argentina.github.io/argenmap/
description: Argenmap is the Argentine National Geographic Institute's open-source
  Leaflet map viewer. Self-hosted deployments use the Argenmap src/js application
  tree and a JSON configuration to publish grouped layers, including WMS and WMTS
  sources. Distinct from generic Leaflet applications that do not carry the
  Argenmap source layout or IGN template identifiers.
