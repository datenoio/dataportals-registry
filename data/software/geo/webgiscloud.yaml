description: WebGIS Cloud is the map portal and JavaScript API from Energie
  Steiermark. Public geoportals are self-hosted or served from webgiscloud.com
  and load webgis-portal-cloud.js, api.min.js (id webgis-api-script), and
  webgis-map.min.js. Portal homes use /{instance}/portal/{name}/ or
  /{instance}/{portal}/. Distinct from GAUSS WebGIS (gausswebgis), DRZ WebGIS
  (drzwebgis), WebGIS Publisher (webgispublisher), KC WebGIS (kcwebgis), and
  VertiGIS WebOffice (weboffice).
