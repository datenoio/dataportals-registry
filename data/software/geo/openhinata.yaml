description: open-hinata is the open-source edition (OpenLayers 5 + Vue) of
  ひなたGIS, the free public WebGIS originally built for Miyazaki Prefecture.
  Layers are added via js/layers.js. The open-hinata3 / OH3 fork
  (oh3lab.jp/oh3/) targets land surveyors with 登記所地図 (地図XML), 地番図 and
  SIMA exchange.
