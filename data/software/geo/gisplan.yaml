id: gisplan
name: GISPLAN
website: https://www.tmapy.sk/verejna-sprava/mesta
description: GISPLAN is T-MAPY's municipal web GIS (Spinbox / T-WIST gallery).
  Slovak tenants usually live at {city}.gisplan.sk or a city host that still
  loads tmapy.svg / Spinbox and public /mapa/ apps. Czech GIS4U tenants live at
  {muni}.gis4u.cz; T-WIST galleries also live at {city}.tmapserver.cz and on
  city hosts that load ost/filebox/ug_hm.php with t-wist_ren / tmapy.svg icons.
  Distinct from T-MAPY mOBEC (mobec) on mobec.sk tenants, Romanian GISApp
  (gisapp), Kaliopa iObčina (iobcina), Geoportál GEPRO (gepro), TopGis
  GisOnline (gisonline), Mapotip (mapotip), and CORA GEO CG WebGIS (cgwebgis).
  Login-only tenants without a public app gallery are not catalogs.
