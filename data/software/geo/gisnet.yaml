description: GISNET V5 is Complot's hosted municipal GIS platform for Israeli
  municipalities, local and regional councils. Public tenants live at
  v5.gis-net.co.il/v5/{authority}/ and on the older mg{1,2}.gis-net.co.il/{Authority}Gis
  generation, with page titles "GISNET V5 By Complot - {city}" and a Hebrew interface
  for planning, parcels, land-use, and engineering layers. Dozens of authorities run
  public tenants; some cities use dedicated hosts (gisn.tel-aviv.gov.il). One record
  per public tenant.
