name: Intertown UP
website: https://up.intertown.co.il/
description: Intertown UP is Intertown's hosted GIS platform for Israeli regional
  councils, local councils, and planning committees. Public tenants live at
  up.intertown.co.il/{code}/public/ with the title "GIS Intertown" and per-tenant
  "UP by Intertown" branding; /org/ paths are the login-only internal systems.
  A React SPA on Intertown's open-source OpenGIS stack, with hybrid ArcGIS
  data-source support. Tenants include Nahal Sorek, Hevel Yavne, Hevel Modi'in,
  Merom HaGalil, Megiddo, and the Shur kot planning committee. One record per
  public tenant. The ags20.intertown.co.il ArcGIS Server endpoints are a separate
  arcgisserver stack.
