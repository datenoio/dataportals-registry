description: GisMaster is Technical Design S.r.l. municipal Web GIS used by
  Italian comuni. Public GeoPortale tenants live on
  geoportale.sportellounicodigitale.it/GisMaster with an IdCliente (ISTAT
  comune code or TD* client id). VisualDesc.aspx / VisualDescNR.aspx is the
  catalog landing; Default.aspx is the same tenant map, not a second catalog.
  Distinct from GISApp (gisapp), Masterportal (masterportal), and MapGIS
  IGServer (mapgisigserver). Skip cemetery VisualCim-only totems and empty
  boilerplate tenants with no cadastre/PRGC layers.
