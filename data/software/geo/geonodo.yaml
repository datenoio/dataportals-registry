description: Geonodo is the open geospatial platform of Chile's Secretaría Ejecutiva
  SNIT - IDE Chile. Public institutions run it as an IDE node with an ISO 19115
  metadata catalog, map viewers, and a page builder. The public catalog is a
  Laravel Livewire app ("Descubre N datos territoriales", assets under
  /images/metadatagis/) with pycsw CSW at /csw. Distinct from GeoNode, including
  GeoNode hosts whose names contain geonodo.
