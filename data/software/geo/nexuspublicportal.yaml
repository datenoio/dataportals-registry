description: Nexus Public Portal is the public web GIS viewer of INS Nexus GIS
  (Skopje). Municipal tenants publish cadastral parcels, GUP/DUP urban plans, and
  related layers at {city}.ins.com.mk/NexusPublicPortal/PublicPortal/Map and on
  city hosts such as gis.{city}.gov.mk. HTML title is Map - Public GIS Portal or
  Мапа - Јавен ГИС портал. Distinct from Spanish enMapa (Nexus Geographics) and
  from Nexus Twin digital-twin portals. Skip vendor marketing (nexus.ins.com.mk),
  the nexusgis.ins.com.mk demo, Field GIS, and login-only AppCreator workflows.
