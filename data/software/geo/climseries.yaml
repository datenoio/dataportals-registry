id: climseries
name: ClimSeries
website: https://climseries.faoswalim.org/
description: ClimSeries (Somalia Climate TimeSeries Data) is FAO SWALIM's web
  application for managing, visualizing, and exporting hydrometeorological station
  time series. Public tenants pair a dashboard and station maps with per-station
  tables and CSV downloads for automatic weather, manual rainfall, synoptic, and
  groundwater stations, using an AdminBSB-based UI with /station/map/{aws,mrs,ss,gws}/
  routes. Deployed for FAO SWALIM (climseries.faoswalim.org) and replicated to the
  Puntland and Somaliland Information Management Centers. Related SWALIM-family
  applications (SWIMS, FRRIMS) are separate products. One record per public tenant.
