description: ArcGIS Experience Builder is Esri's configurable web app for maps and
  data-driven pages. Public catalogs are hosted at experience.arcgis.com/experience/{id},
  on Portal for ArcGIS at /portal/apps/experiencebuilder/experience/?id=, or on a
  custom domain that loads jimu-core/init.js (title Experience, favicon exb.ico).
  Swedish Länsstyrelsen WebbGIS tenants on ext-webbgis.lansstyrelsen.se are this
  product. Distinct from ArcGIS Hub (arcgishub), ArcGIS Server REST (arcgisserver),
  ArcGIS Web AppBuilder (webappbuilder), ArcGIS Instant Apps (instantapps), and
  Esri Finland dmCity (dmcity).
