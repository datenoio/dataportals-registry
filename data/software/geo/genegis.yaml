description: PAGIS is GeneGIS GI's hosted municipal SIT / WebGIS used by Italian
  comuni. Tenants live at {comune}.servizigis.it (Index.aspx) and on city-owned
  hosts such as sit.comune.benevento.it. Distinct from Pulaski Area GIS
  (www.pagis.org, arcgisserver) and from Emilia-Romagna ArcGIS hosts named
  servizigis.*. Skip the vendor marketing hubs services.servizigis.it and
  pagis.it. One record per municipality, not IndexPC.aspx as a second copy of
  the same SIT when Index.aspx is the public catalog.
