id: septimasearch
name: Septima Search
website: https://septima.dk/
description: Septima Search is a hosted geodata search component from the Danish
  company Septima, embedded in public map applications such as the Danmarks
  Miljøportal clients (septima-search-dmp/v1.js) and served from
  search.cdn.septima.dk. The companion Septima Widget
  (widget.cdn.septima.dk/latest/widgetapi.js) is a simple embeddable map, not a
  catalog. Septima Search apps search across Danish geodata sources (addresses,
  places, cadastre, WFS/GeoJSON layers) and are typically bespoke per customer.
