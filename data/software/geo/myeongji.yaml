name: Myeongji WebGIS
website: https://www.mjinfo.co.kr/
description: Myeongji WebGIS is the municipal living-information map platform of
  Myeongji Information Technology (명지정보기술), a Korean GIS company in
  Jeonju. Deployments share one OpenLayers 2 client codebase identified by
  /js/base/MapSave.js, /js/base/BaseMap.js, /js/base/SeeMap.js, and
  /js/base/mapsave/MapSaveTool.js, and carry titles like 생활지리정보시스템 or
  생활공간정보안내시스템. The Iksan deployment credits 명지정보기술 in its
  footer. Do not infer the platform from a Korean "Life Map" title or the
  Korean public-sector /common/ web template alone; the shared base JS assets
  are required.
