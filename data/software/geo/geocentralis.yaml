description: GeoCentralis is a Quebec municipal GIS SaaS (Évimbec) for graphic
  matrices, assessment rolls, cadastre, and zoning. Public tenants live at
  portail.geocentralis.com/public/sig-web/{mrc}/{code}/ with a municipality
  picker. Distinct from Geocentriq (app.geocentriq.com), SIGimWeb (sigimweb),
  GOnet (goazimut.com), and SIGALE. One record per public MRC or city slug,
  not per geo-code path. Do not register the marketing homepage, staff
  /core/login/, or a second zonage URL for the same tenant.
