id: nazca4u
name: Nazca4U Rapportagemodule
website: https://nazca4u.nl/
description: Nazca4U Rapportagemodule is Dutch company Nazca's hosted
  soil-information reporting application for provinces, omgevingsdiensten, and
  municipalities. Public tenants live at {tenant}.nazca4u.nl/rapportage/ and
  serve the same ASP.NET application with /Rapportage/Geolocator/{Map,Toolbar,Legend}/
  assets and App_Themes/RapportageModule/*.css. Users look up bodeminformatie by
  address, parcel, or map selection and receive a PDF report by e-mail; underlying
  bodemonderzoek reports are linked where available. Distinct from NAZCA, Soltesoft's
  Colombian cadastral viewer (nazca). One record per public tenant.
