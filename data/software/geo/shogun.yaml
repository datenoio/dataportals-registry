name: SHOGun
website: https://terrestris.de/en/software/shogun/
description: SHOGun is an open-source Spring Boot WebGIS framework by terrestris
  for configurable geoportals. Public clients load application configurations from
  REST /applications (optionally GraphQL) and render OpenLayers maps via shogun-gis-client.
  The stack typically includes GeoServer, PostgreSQL/PostGIS, and Keycloak. Distinct
  from GeoServer (geoserver), GeoNetwork (geonetwork), and Masterportal (masterportal)
  on the same estate.
