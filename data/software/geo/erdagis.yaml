description: ErdaGIS web is Erda Kft.'s municipal web GIS, built on MapServer
  with an OpenLayers client. Public tenants use {settlement}.erda.hu
  (Aszód, Debrecen, Balatongyörök) or
  gis.erda.hu/erda/html/projects/{id}/main.php (Jászfényszaru,
  Alsómocsolád). Distinct from EnviMAP (envimap), Autodesk MapGuide
  (mapguide), and a bare MapServer (mapserver).
