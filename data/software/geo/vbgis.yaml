description: VB GIS is a Vietnamese municipal and provincial WebGIS platform
  hosted on tenant subdomains of the vendor domain vbgis.vn, such as
  gismytho.vbgis.vn (My Tho urban management GIS) and
  tiengianglis.vbgis.vn (Tien Giang land information system). Public clients
  provide construction-planning lookup, land-record search, and thematic
  infrastructure map layers. The operating company's full legal name is not
  published on the unreachable vendor site; the platform is identified by the
  tenant-hosting pattern, so confirm the subdomain belongs to vbgis.vn before
  assigning.
