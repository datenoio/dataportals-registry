name: GIS4U
website: https://www.tmapy.cz/gis4u
description: GIS4U is the municipal web map portal platform of T-MAPY spol. s r.o.
  (Hradec Kralove, Czechia). Tenants run on municipal domains with Czech
  application routes under /mapa/ (for example /mapa/zakladni-aplikace/,
  /mapa/technicka-mapa/), a shared /theme/square/ asset theme, and a tmapy.cz
  credit; the vendor's own example portals live on cr.gis4u.cz. Do not identify
  GIS4U from a tmapy.cz link alone; the /mapa/ application routes plus the
  square theme are required because T-MAPY sells several distinct products.
