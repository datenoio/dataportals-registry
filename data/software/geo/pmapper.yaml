description: p.mapper is an open-source PHP/MapScript web GIS frontend for
  MapServer. Public catalogs use a /pmapper/ or /pmapper-4.2.0/ path (Calabria
  SETIN tenants on {city}.geo-portale.it) or title p.mapper. Distinct from
  UMN MapServer as the public catalog (mapserver), Lizmap (lizmap), and
  Mapbender (mapbender). Do not add a second mapserver record on the same
  p.mapper UI.
