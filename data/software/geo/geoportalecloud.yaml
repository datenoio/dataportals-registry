description: GeoPortale.cloud is Andreani Tributi (Gruppo Andreani) hosted municipal
  Web GIS for Italian comuni. Public tenants live at {comune}.geoportale.cloud
  (sometimes {comune}.andreanitributi.geoportale.cloud) with an Accesso libero /
  Urbanistica card that loads map.php after a guest login_start.php POST.
  Distinct from GisMaster (gismaster) on sportellounicodigitale.it, GeneGIS PAGIS
  (genegis), LDP SIT (ldpgis), and p.mapper (pmapper) on geo-portale.it. Skip the
  vendor marketing hub www.geoportale.cloud, login-only branded landings with no
  public map card, test hosts, and Andreani aliases of an already registered
  tenant.
