description: eKMap Cloud is eKGIS's Vietnamese provincial planning GIS. Public
  viewers share Mapbox GL JS 1.13, `assets/ekmapboxgl/ekmap-mapboxgl.js`,
  `assets/ekmapboxgl/common.js`, and mapbox-gl-compare, often with title
  `eKMap Cloud`. Distinct from Hanoi `quyhoach.hanoi.gov.vn` (Next.js, not
  eKMap), Vinh Phuc OpenLayers 6 planning maps, and HCMC VLAB Leaflet
  planning. Do not set ekmap from a site that only loads Mapbox GL without
  the ekmapboxgl assets.
