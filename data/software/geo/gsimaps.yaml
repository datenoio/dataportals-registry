name: GSI Maps (地理院地図)
description: GSI Maps (地理院地図) is the open-source Leaflet-based WebGIS behind
  Japan's national geoportal run by the Geospatial Information Authority of Japan
  (GSI). Source is published as gsi-cyberjapan/gsimaps (BSD-2-Clause) with
  layers.txt layer definitions, vector-tile and 3D support; third-party sites
  redeploy the same source with their own layers (e.g. 全国Q地図).
