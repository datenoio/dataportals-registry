name: HSLayers NG
website: https://ng.hslayers.org
description: HSLayers NG is an open-source web mapping framework (Angular +
  OpenLayers + CesiumJS) used to build map composition catalogs and geoportals.
  Deployments typically pair the HSLayers NG client with a Layman backend
  (maps/layers REST API) and Micka metadata catalogue; public map compositions
  are browsable in the built-in composition catalogue.
