id: mobec
name: mOBEC
website: https://www.tmapy.sk/mobec
description: >
  mOBEC is T-MAPY's municipal map portal for smaller Slovak towns and
  villages. Public tenants live at mobec.sk/{slug} (optional hash-base path),
  load /img/tmapyn.svg, set a numeric tenant ido, and title the public map
  Všeobecná mapa. Distinct from GISPLAN Spinbox galleries (gisplan) on
  {city}.gisplan.sk. Staff login chrome on the same SPA does not make the
  public map a non-catalog.

