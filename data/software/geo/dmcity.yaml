description: dmCity is Esri Finland's municipal digital-city SaaS. Public map
  tenants live at web.dmcity.fi/{city}/public/ with title dmCity Web App and
  jimu-core/init.js (Experience Builder shell). Distinct from generic ArcGIS
  Experience Builder (experiencebuilder) on other hosts and from ArcGIS Server
  REST on {city}.dmcity.fi/server (arcgisserver). One record per public city
  tenant, not the marketing site.
