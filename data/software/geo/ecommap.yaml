name: eコミマップ (e-Community Platform)
description: eコミマップ (eコミュニティ・プラットフォーム) is an open-source
  participatory WebGIS developed by NIED (National Research Institute for Earth
  Science and Disaster Resilience). Users overlay external layers (WMS, XYZ,
  TMS, KML) on GSI tiles, build disaster-prevention maps and publish them as
  open data. It also forms the basis of the 官民協働危機管理クラウド crisis
  management cloud for municipalities.
