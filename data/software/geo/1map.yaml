name: 1Map
website: https://go.1doc.com.br/1map/
description: 1Map is the municipal geoportal module of the 1Doc public
  administration suite (1Doc Tecnologia S.A., Florianopolis, SC, Brazil). It
  shows real-time municipal service requests and thematic territorial layers.
  Tenants are municipality subdomains of 1map.com.br (for example
  americana.1map.com.br, taubate.1map.com.br) running a Next.js viewer titled
  "1Map" that requires sign-in (/auth/unauthenticated callback). Not to be
  confused with the South African 1map platform (1map.co.za), a separate
  product.
