description: >
  HyG Mapgis (Suite MapGIS) is an on-premises municipal and regional GIS viewer
  from H&G Consultores S.A.S (Medellín). Installs use /mapgis/mapa.jsp?aplicacion=
  or /mapgis9/mapa.jsp?aplicacion= over ArcGIS Server/Java, with footer text
  Desarrollado por HyG Consultores S.A.S. Distinct from Zondy Cyber MapGIS
  IGServer (mapgisigserver, /igs/rest/). Do not register a second ArcGIS Server
  catalog on the same Mapgis host, and do not add Mapgis as a second product on a
  host that already has GeoNetwork as the public catalog.
