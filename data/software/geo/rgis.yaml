description: KAZGISA RGIS is the Regional Geographic Information System used by
  Kazakhstani akimats for land, urban-planning, and public-service maps. Public
  open-contour viewers share an Angular SPA at `{host}/map/` with Leaflet 1.7.1
  (`runtime.js`, `polyfills.js`, `vendor.js`, `main.js`). Distinct from Geonomics
  (geonomics) Vue/Mapbox portals, SmartMap (smartmap) `{district}.smartmap.kz`
  tenants, and VKOMAP (vkomap) `/vkomap/` Leaflet+Esri viewers. Do not set rgis
  from the older KAZGISA OpenLayers stack (eatyrau.kz).
