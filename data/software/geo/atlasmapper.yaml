description: AtlasMapper is an open-source atlas mapping framework developed by
  the Australian Institute of Marine Science (AIMS), originally published on
  Google Code and now exported to GitHub. It powers the eAtlas family of
  Australian research atlases (eAtlas at maps.eatlas.org.au, North West Atlas,
  Ningaloo Atlas) with an Ext JS/GeoExt map client whose static assets carry an
  atlasmapperVer version parameter. Deployments are typically paired with a
  GeoNetwork catalogue and GeoServer/THREDDS backends.
