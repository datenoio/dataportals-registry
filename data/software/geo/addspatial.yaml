  LoginService/Brands, and images/addspatial.svg, often wrapped from a karta.*
  host that iframes atlas.{kommun}.se/smart/. Distinct from Hajk (hajk), Origo
  (origo), myCarta (mycarta), and Digpro dpWebmap (dpwebmap). Skip the vendor
  cloud login at addspatial.icebound.com/SMART and Icebound marketing pages.
