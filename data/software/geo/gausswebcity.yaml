id: gausswebcity
name: GAUSS WebCity
website: https://gauss.ba/en/solutions/gauss-webcity/
description: GAUSS WebCity is Gauss d.o.o. Tuzla's MapStore-based municipal and
  cantonal geoportal product (also marketed as GAUSS WebPresenter). Public
  tenants often live at {org}.gis.ba or a city host with /webcity/ loading
  dist/mapstore2.js, plus a GAUSS landing that links /public/ for unregistered
  users. Distinct from GeoSolutions MapStore (mapstore) on other hosts, from
  VertiGIS WebOffice tenants branded WebCity (weboffice), and from Brazilian
  GAUSS WebGIS (gausswebgis) on {city}.webgis.geo.br. One record per public
  tenant, not the gauss.ba marketing site.
