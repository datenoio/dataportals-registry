description: enMapa is a municipal web GIS by Nexus Geographics (Catalonia, Spain)
  used by Spanish town councils. Public tenants live at {city}.enmapa.com behind
  Cloudflare and on city hosts such as geoportal.{city}.cat/visor/guia or
  mapes.{city}.cat/geoportal/ (Geoportal Urbanístic) with HTML title Enmapa /
  EnMapa v4.x or '{city}. Geoportal Urbanístic', OpenLayers, and nexus Matomo.
  Distinct from
  the CKAN open-data tenants some councils run on the same host family
  ({city}-opendata.enmapa.com). Do not register dev/admin/demo subdomains.
