description: IndorRoad Geoportal (IndorGeo) is ИндорСофт's browser geoportal for
  GIS IndorRoad road-asset databases. Public tenants expose a PHP landing page
  titled IndorGeo and a React map/table app at /geo3/ (older installs use
  /dashboard/ with /assets/indorgeo/ig1.js), covering road passports, diagnostics,
  accidents, and related objects without installing the desktop GIS.
