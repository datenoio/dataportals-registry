description: UrbisMap is UrbisMap S.r.l.s. hosted national Web GIS for Italian
  urban-planning, cadastre, constraint, and regulatory layers. The public
  geoportal is a single hub at www.urbismap.com (Vue app, /v2, and
  /territorio/{slug} city pages). Affiliated comuni publish on that hub rather
  than separate tenant hosts. Distinct from GeoPortale.cloud (geoportalecloud),
  GisMaster (gismaster), GeneGIS PAGIS (genegis), LDP SIT (ldpgis), and
  p.mapper (pmapper). Skip the marketing site urbismap.it, CRM, tiles/tiler,
  status, analytics, 401 beta hosts, dead archivio.* / catasto subdomains, and
  FOIA Accesso agli Atti.
