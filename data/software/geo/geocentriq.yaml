description: Geocentriq is a Quebec municipal GIS SaaS for graphic matrices,
  assessment rolls, cadastre, and orthophotos. Public tenants live at
  app.geocentriq.com/mrc/{mrc} with geocentriq.min.js assets and a
  municipality picker. Distinct from GeoCentralis (geocentralis), SIGimWeb
  (sigimweb), GOnet (goazimut.com), and SIGALE. One record per public MRC
  tenant, not per municipality in the picker. Do not register the marketing
  homepage or /login.
