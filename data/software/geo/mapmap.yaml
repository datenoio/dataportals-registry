  {city}.mapmap.com.br with a Laravel citizen hub and /geo-portal. Distinct
  from mapmap.ai routing APIs and from MapMap Cidadão PWAs at
  {city}.cidadao.mapmap.com.br. Skip www/app/tributario marketing and staff
  apps, teste/demonstracao/staging, geoserver backends, and tenants that
  return HTTP 403 Licença Suspensa. The *.mapmap.com.br certificate is a
  wildcard — do not guess cities; use cidadao.mapmap.com.br/api/organizacoes-ativas.
