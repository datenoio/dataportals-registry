description: MAP+ is TYDAC AG's modular WebGIS. Public city maps load
  /mapplus-lib/ and OpenLayers, often with tydac branding. Used by Swiss
  municipalities (Chur, St. Gallen, Biel, geoJura bernois) and sold in
  Germany as GeoAS Web. Distinct from GeoMapFish (geomapfish) and from
  mf-geoadmin3 (mfgeoadmin3).
