description: SmartGIS is GEO's hosted and on-premises municipal Web GIS
  (2D/3D viewer and editor). Public tenants use HTML title SmartGIS, Angular
  app-root, and a point_cloud/viewer bootstrap on city hosts or {tenant}.geo.rs.
  Distinct from Kazakhstan SmartMap (smartmap), Greek GIS4Smart (gis4smart),
  Indonesian GeoNode hosts named smartgis, Malaysian ArcGIS smartGIS portals,
  and unrelated SmartGIS brands in Czechia, Indonesia, and Croatia.
