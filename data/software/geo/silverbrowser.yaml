id: silverbrowser
name: SilverBrowser
website: http://www.geoservice.com/silverbrowser.htm
description: SilverBrowser is Geoservice S.r.l. municipal Web GIS for Italian
  local governments. Public tenants expose an open-data module at
  /opendata/ui/www/ or a planning viewer such as SilverPrg at /prg/ui/www/,
  often on {tenant}.cloud.silverbrowser.it. Distinct from GisMaster
  (gismaster), GFMaplet (gfmaplet), LDP SIT (ldpgis), PAGIS (genegis), and
  GeoPortale.cloud (geoportalecloud). One record per public comune viewer,
  not the staff login.
