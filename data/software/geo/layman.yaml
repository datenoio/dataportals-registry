id: layman
name: Layman
website: https://github.com/LayerManager/layman
description: Layman is an open-source geodata publication server (Layer Manager).
  It publishes vector and raster layers and map compositions through a REST API
  (/rest/workspaces/...) backed by GeoServer, PostGIS, QGIS Server, and Micka
  metadata, and is typically paired with an HSLayers NG web client or QGIS
  plugin. Public workspaces are readable by EVERYONE without authentication.
