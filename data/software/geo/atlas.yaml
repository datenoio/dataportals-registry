id: atlas
name: Atlas
website: https://gitlab.com/purmerend/atlas
description: Atlas is the open-source (EUPL 1.2) Common Ground municipal geoportal
  started by Gemeente Purmerend and developed with Delta10 and the Atlas community.
  Public tenants run at municipal hosts (atlas.apeldoorn.nl, geodata.zutphen.nl,
  datalab.purmerend.nl/atlas, viewer.zaanstad.nl/atlas) as a Vue.js SPA served from
  /atlas/static/assets/
  with the title "Atlas · Gemeente {name}", backed by Django and OpenLayers with
  WMS, WFS, WMTS, and vector-tile (MVT) layers. Documented users include Purmerend,
  Utrecht, Zutphen, Apeldoorn, Zaanstad, Dijk en Waard, Voorst, and the SED
  collaboration (Stede Broec, Enkhuizen, Drechterland). One record per public
  tenant. Distinct from InstantAtlas (instantatlas) and unrelated "Atlas" products.
