id: cmv
name: Configurable Map Viewer (CMV)
website: https://cmv.io/
description: CMV (The Configurable Map Viewer) is a community-supported
  open-source mapping framework built with the Esri JavaScript API (3.x) and
  the Dojo Toolkit. Deployments load cmv/cmv-app viewer assets (for example
  viewer/css/main.css), configure the viewer through js/config/viewer.js with
  a dojoConfig block, and commonly reference cmv.io. It works with ArcGIS
  Server and ArcGIS Online services and is popular with US local-government
  GIS sites and national SDI portals.
