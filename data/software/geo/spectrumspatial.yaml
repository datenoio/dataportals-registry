description: Spectrum Spatial Analyst is Precisely's (formerly Pitney Bowes / MapInfo)
  browser GIS used by councils and regional bodies as a public map catalog. It
  supersedes Exponare. Public sites use path /connect/analyst/ or
  /connect/analyst/mobile/, HTML title Spectrum Spatial (sometimes a local brand),
  Precisely favicon assets, and mapcfg= project parameters. Distinct from Exponare
  (/exponare/), IntraMaps, ArcGIS Hub/REST, and Experience Builder on the same owner.
