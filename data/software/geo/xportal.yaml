name: XPortal
website: https://www.ingeea.ro
description: XPortal is the municipal public GIS portal engine by Intergraph Computer
  Services (Romania), sold inside the Ingeea suite (product page "Pachetul Hartă de
  Public"; Sibiu deployment brands itself IngeeaCity Public). Modern deployments are
  ASP.NET apps (IIS/Kestrel) loading Kendo UI for jQuery webpack bundles (vendors.bundle.js,
  ClientEventManager.js, kendo.aspnetmvc.min.js) under xportal*-prefixed paths such
  as /xportalurb or /xportalBacau_public; the login screen reads XPortal with footer
  "powered by Intergraph Computer Services". The legacy generation (ExtJS 4.2 + OpenLayers
  2.14, _xportalTemplate scripts, title Harta public) also runs on the vendor SaaS
  saas.ingeea.ro. Known installations include Bucharest PMB (urbanism.pmb.ro UrbOnline plus
  hip.pmb.ro), Bacău County Council (gis.csjbacau.ro), Sibiu County Council (egis.cjsibiu.ro),
  and Brașov (serviciiharta.brasovcity.ro). The footer string alone also appears on
  other Intergraph Computer Services products (ORDA portals) and is not sufficient
  without the portal fingerprints.
