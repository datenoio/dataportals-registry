description: DMAPS (Digital Metric Addressing System / Digital Map-Based Addressing
  and Planning System) is NAXA's municipal house-numbering GIS for Nepal palikas.
  Public tenants use HTML title Digital Metric Addressing System (or an older
  Metric System title) with a shared Vite SPA at /assets/index-*.js, commonly on
  {palika}.dmaps.org or a municipal dmaps./metric./imas./gis. host. Distinct from
  Kathmandu's custom house-numbering GIS and from GeoNep p.mapper. Do not register
  the marketing homepage or app.dmaps.org.
