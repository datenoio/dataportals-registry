description: SHK Kent Bilgi Sistemi is SHK Bilişim Teknolojileri's municipal
  geographic-information product for publishing city guides, parcel and zoning
  searches, plan notes, and thematic points of interest. Confirmed deployments
  include Gölbaşı, Pursaklar, and Üsküdar; clients use ArcGIS JavaScript and
  municipality-hosted ArcGIS REST services, with older installations displaying
  the SHK logo directly.
