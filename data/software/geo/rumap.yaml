description: Геопортал RuMap is Geocenter-Consulting's (Digimap) public web GIS
  on the RUMAP-GIS platform. The hosted open-access portal lives at rumap.ru
  (React + OpenLayers, layer catalog tab) with a legacy Angular SPA at
  rumap.ru/v2 (ng-app="digimap"). Distinct from the licensed RuMap transport
  analysis app on transport.digimap.ru, from RoadNetworkBuilder, and from the
  vendor marketing site digimap.ru. Wildcard aliases (www/maps/api/tiles/pro/beta)
  are the same catalog, not extra tenants. Customer-side RUMAP-GIS deployments
  are in-scope only when they expose a public geoportal UI with the same
  fingerprints.
