description: vMap2 is an open-source web GIS from Veremes (successor to Veremap
  and vMap) for publishing, consulting, and editing geospatial maps in the
  browser. It is built on PostgreSQL/PostGIS and MapServer, exposes WMS/WFS,
  and is widely used by French collectivités with optional public map widgets.
