description: Zeljko GIS is Zeljko d.o.o.'s Croatian and Bosnian municipal and
  county Web GIS. Public tenants live on zeljko-gis.com MapGuide Fusion
  templates (mapguide25/mapguide252/mapguide26) or as cadastral search UIs on
  zopcina.zeljko-gis.com/{tenant}/, plus county hosts that still load the same
  Fusion ApplicationDefinition. Distinct from generic MapGuide (mapguide). One
  record per public tenant, not a second cadastral UI of the same county map.
