description: SIT WebGis is SIT Servizi di Informazione Territoriale's
  municipal GIS. Public tenants live at webgis.sit-puglia.it/{comune}/
  with title WebGis {Town} (AngularJS ng-app WebApp plus OpenLayers 3
  core/lib/openlayers/js/ol.js) or SIT-{TOWN} (Angular CLI plus
  ol-attribution-hotfix.js). Distinct from Regione Puglia GeoNetwork on
  repertorio.sit.puglia.it, Lizmap, Spectrum Spatial Analyst, and GeneGIS
  PAGIS. Do not register the marketing homepage. Skip stale homepage
  slugs such as /mola and /potenza that 404.
