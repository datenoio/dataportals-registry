description: CubeWerx CubeSERV (Stratos Geospatial Platform) is a commercial OGC
  server for WMS, WMTS, WFS, WCS, CSW, and OGC API. National and provincial SDIs
  expose it as /cubewerx/cubeserv or a CubeWerx catalogue. Register it when CubeSERV
  is the public catalog, not merely a backend behind another portal. Distinct from
  GeoServer (geoserver) and MapServer (mapserver).
