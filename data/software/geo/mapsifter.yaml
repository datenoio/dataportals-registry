description: MapSifter is TerraScan's hosted county parcel-map viewer, paired
  with the TaxSifter assessment search. Public tenants historically lived at
  {county}.mapsifter.com and now run as county-branded ASP.NET applications at
  {county}-mapsifter.publicaccessnow.com behind a Disclaimer.aspx gateway, with
  parcel, owner, and address search plus assessment and zoning layers. Documented
  deployments include Pacific, Okanogan, Skamania, Klickitat, and Adams counties
  in Washington. One record per public tenant.
