name: ArcGIS Web AppBuilder
website: https://www.esri.com/en-us/arcgis/products/arcgis-web-appbuilder/overview
description: ArcGIS Web AppBuilder (Web AppViewer) is Esri's earlier configurable
  map app, typically at /apps/webappviewer/index.html?id= on ArcGIS Online
  (*.maps.arcgis.com) or Portal for ArcGIS (/portal/apps/webappviewer/). Distinct
  from ArcGIS Experience Builder (experiencebuilder), ArcGIS Instant Apps
  (instantapps), ArcGIS Hub (arcgishub), and ArcGIS Server REST directories
  (arcgisserver). Esri is retiring Web AppBuilder
  in favor of Experience Builder.
