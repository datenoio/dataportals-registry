description: GT Map is V&G's municipal spatial-information platform for South
  Korean public authorities. Public LifeMap deployments load the V&G SODA
  OpenLayers client from /resources/common/thirdparty/soda/soda.js, whose header
  identifies V&G and a SODA version. Tenant applications commonly expose a
  municipal layer catalog and WMS gateway under /gs-gate/.
