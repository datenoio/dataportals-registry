name: iSTAR
website: https://www.istar.igg.unam.mx/lab/geoportal-tecnologia
description: iSTAR is the UNAM GITS web GIS viewer (version 3.1). Public
  installs answer with Server iStar-Platform and X-Powered-By iStar-UNAM,
  and load /static/js/main.bundle.js with Turf and D3 under /static/js/lib/.
  The HTML root is id="istar" or id="gits" with data-puma_role. Distinct
  from INEGI MxSIG (mxsig) and OVIE (ovie), and from a generic OpenLayers
  copy. The IDEA download catalog is the dataset collection behind the
  GITS viewer, not a second product.
