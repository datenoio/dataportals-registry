description: MapFusion is GeoPlan's (Ourém, Portugal) Yii2 and OpenLayers municipal
  WebSIG. Public IDE hubs title Infraestrutura de Dados Espaciais, credit GeoPlan,
  and open thematic viewers at /page/viewer?id= with QGIS Server maps under
  /var/www/MapFusion/Projetos/Visualizadores/. Distinct from MapGuide Fusion
  (mapguide), from QGIS Server (qgisserver) backends on the same estate, and from
  older GeoPlan PHP landings that use index.php?page= without Yii2.
