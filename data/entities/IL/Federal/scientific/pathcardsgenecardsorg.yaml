description: PathCards is an integrated database of human biological pathways and
  their annotations. Human pathways were clustered into SuperPaths based on gene content
  similarity. Each PathCard provides information on one SuperPath which represents
  one or more human pathways. It includes 1,658 SuperPath entries, consolidated from
  11 selected web sources and is modeled on the architecture and richness of the popular
  GeneCards database of human genes.
