description: BitterDB is a free and searchable database of bitter compounds. Compounds
  can be searched by name, chemical structure, similarity to other bitter compounds,
  association with a particular human bitter taste receptor, and so on. The database
  also contains information on mutations in bitter taste re- ceptors that were shown
  to influence receptor activation by bitter compounds. The aim of BitterDB is to
  facilitate studying the chemical features associated with bitterness.
