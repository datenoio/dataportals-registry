description: Knowledge of the molecular interactions of human proteins within tissues
  is important for identifying their tissue-specific roles and for shedding light
  on tissue phenotypes. However, many protein-protein interactions (PPIs) have no
  tissue-contexts. The TissueNet database bridges this gap by associating experimentally-identified
  PPIs with human tissues that were shown to express both pair-mates. Users can select
  a protein and a tissue, and obtain a network view of the query protein and its tissue-associated
  PPIs. TissueNet v.2 is an updated version of the TissueNet database previously featured
  in NAR. It includes over 40 human tissues profiled via RNA-sequencing or protein-based
  assays. Users can select their preferred expression data source and interactively
  set the expression threshold for determining tissue-association. The output of TissueNet
  v.2 underlines qualitative and quantitative features of query proteins and their
  PPIs. The tissue-specificity view highlights tissue-specific and globally-expressed
  proteins, and the quantitative view highlights proteins that were differentially
  expressed in the selected tissue relative to all other tissues. Together, these
  views allow users to quickly assess the unique versus global functionality of query
  proteins. Thus, TissueNet v.2 offers an extensive, quantitative and user-friendly
  interface to study the roles of human proteins across tissues.
