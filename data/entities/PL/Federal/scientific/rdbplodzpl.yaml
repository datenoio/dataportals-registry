description: TUL Open Research Data Repository (RDB.open) is a service addressed to the scientific
  and research community of the Lodz University of Technology. The main purpose of RDB.open
  is to collect, share and store the open research data, both during the research and after
  its completion, at least for the minimum period indicated by the funder or the scientists.
  The RDB.open is a place where research data can be openly shared, accessed and then reused
  by others.
