description: MX-RDR (Macromolecular Crystallography Raw Data Repository) is an open-access
  scientific database designed to archive and share raw diffraction data from macromolecular
  crystallography experiments. It stores datasets related to crystal structure studies
  along with rich metadata extracted from images, user input, and Protein Data Bank
  deposits. The platform allows users to search, access, and download data freely
  to support reuse and reproducibility in structural biology research.
