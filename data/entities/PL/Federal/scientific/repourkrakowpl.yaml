description: 'Scientific Output Database of the University of Agriculture in Krakow
  (URK)


  The Scientific Output Database of the University of Agriculture in Krakow is an
  institutional repository that collects, manages, and disseminates information about
  the research achievements of the university''s academic staff and PhD students.


  The database includes:


  scientific publications (articles, books, book chapters, monographs),


  patents and patent applications,


  research projects,


  conference papers and presentations,


  other scientific and scholarly outputs.


  Its main objectives are to:


  document and promote the research activity at URK,


  support internal and national research assessment processes,


  enhance the visibility and accessibility of research results through integration
  with national and international systems (e.g., ORCID, POL-on, OpenAIRE).


  The repository contributes to the open science movement by enabling open access
  to scientific knowledge and fostering transparency in research.'
