description: LinkProt collects information about protein chains and complexes that
  form links. LinkProt detects deterministic links (with loops closed by cysteine),
  and determines likelihood of formation of links in networks of protein chains called
  MacroLinks. Links are presented graphically in an intuitive way, using tools that
  involves surfaces of minimal area spanned on closed loops. The database presents
  extensive information about biological functions of proteins with links and enables
  users to analyze new structures.
