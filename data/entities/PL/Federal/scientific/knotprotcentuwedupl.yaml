description: KnotProt collects information about proteins with knots or slipknots.
  The knotting complexity of proteins is presented in the form of a matrix diagram
  that shows users the knot type of the entire polypeptide chain and of each of its
  subchains. The database presents extensive information about the biological function
  of proteins with non-trivial knotting and enables users to analyze new structures.
