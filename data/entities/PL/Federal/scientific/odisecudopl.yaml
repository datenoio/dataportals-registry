description: 'The eCUDO.pl project is created by a consortium of Project partners.
  These are research units, scientific institutes and universities whose scientific
  activity focuses on the area of knowledge related to the seas and oceans. The genesis
  of the project was the desire to make these resources available to a wide range
  of interested parties, not only those from the scientific and industrial sectors,
  but also ordinary citizens interested in oceanographic issues.

  Partner institutions have collected a huge amount of data as part of their research
  activities. The result of this idea is a database prepared by us and a dedicated
  application. The data covers the broadest possible spectrum of information on the
  environment of the Baltic Sea and other maritime areas. The application allows you
  to search for information about data based on many criteria. The retrieved data
  can be easily downloaded or used directly via web services in other map portals
  or projects.The eCUDO.pl portal is practically the only place on the web where information
  from the Baltic area and beyond has been collected from various scientific disciplines,
  such as: physics, chemistry, biology, meteorology, climatology, geology. The huge
  amount of data already collected will be updated and successively supplemented with
  the acquired new data sets.'
