description: The Polish Polar Data Base is an open data repository of Polish Polar
  Consortium (PKPol) basing on CENAGIS Platform. The portal is used to collect and
  share research data and metadata from external repositories and centers in a standardised
  way with geoportal functionality. The Repository POLAR-PL is one of the results
  of The HarSval Norwegian-Polish Project (2025) harmonised with SIOS Data Access
  Portal. The repository serves datasets with reach metadata according with FAIR principles.
  Catalog provides tools for integration basic geomorfological, glaciological, oceanographic,
  meteorogical data with other thematic data services (as international GNSS services,
  EUPOS etc.) and for data geovisualisation and basic tools and applications for data
  analysis, including the use of big data. The Polish Polar DataBase is a hub of information
  on datasets collected by Polish polar researchers. The purpose of creating the database
  was to facilitate access to data collected by Polish polar researchers by creating
  a single integrated access point. The database records both datasets and links to
  other databases.The database makes resources available in accordance with the requirements
  of open science and FAIR principles. Data that are not made available to the public
  (available only to specific individuals or research teams) can also be collected.
  The Polish Polar DataBase is linked to the Central Server of Geospatial Services
  - a tool that allows location and cartographic visualisation of 3D data. Services
  in the full version also include automated retrieval of satellite imagery, data
  analysis in the Jupyter Lab environment using AI methods (data science computing
  center) and use of Virtual Computers.
