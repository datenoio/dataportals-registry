description: SalmoBase is an integrated molecular resource for Salmonid species which
  includes visualizations and analytic tools. The genome of the Atlantic salmon (Salmo
  salar) has undergone extensive restructuring since a whole genome duplication event
  ~80 million years ago, which creates opportunities to explore the evolutionary process
  of rediploidization. A public genome assembly is available and ordered into 29 chromosome
  files. SalmoBase includes a GBrowse interface for exploring the chromosome sequence
  as well as BLAST functionality and links to expression levels, gene and SNP information.
  Using public RNAseq data 37,000 high confidence protein coding genes have been identified,
  wherein almost half show splice variants.
