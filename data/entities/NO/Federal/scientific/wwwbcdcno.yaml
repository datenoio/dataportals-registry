description: The Bjerknes Climate Data Centre (BCDC) serves the data and syntheses
  obtained and assembled by researchers within the Bjerknes Centre for Climate Research
  (BCCR). All data from the different disciplines at BCCR (e.g. geology, oceanography,
  biology, model community) will be archived, interconnected and made publicly available
  in this long-term repository, by the BCDC. BCDC will become an Associated Data Unit
  (ADU) under IODE, International Oceanographic Data and Information Exchange, a worldwide
  network that operates under the auspices of the Intergovernmental Oceanographic
  Commission of UNESCO and aims to become a part of ICSU World Data System.
