description: The MAR databases is a collection of manually curated marine microbial
  contextual and sequence databases, based at the Marine Metagenomics Portal. This
  was developed as a part of the ELIXIR EXCELERATE project in 2017 and is maintained
  by The Center for Bioinformatics (SfB) at the UiT The Arctic University of Norway.
  SfB is hosting the UiT node of ELIXIR Norway. The MarRef, MarDb, MarFun and MarCat
  contextual databases are built by compiling data from a number of public available
  sequence, taxonomy and literature databases in a semi-automatic fashion.
