description: "Sikt Research Data Archive is a national research data infrastructure\
  \ dedicated to the digital curation of high-quality research data, focusing on social\
  \ science, humanities, and select areas of medical, health, and environmental research.\
  \  The Archive's mission is to archive, facilitate, and disseminate rich data resources\
  \ and support services to students, researchers, and organisations in higher education\
  \ and research. The Archive offers data curation services that include carefully\
  \ reviewing incoming data and documentation, enhancing documentation, adding detailed\
  \ metadata, creating new sustainable formats, and reviewing deposited data for accuracy\
  \ and legitimacy. The Archive is the Norwegian Service Provider for the Consortium\
  \ of European Social Science Data Archives (CESSDA). \n\nThe Archive has a long\
  \ history of promoting and supporting open access to research data and data sharing\
  \ within the social sciences, both as a national infrastructure and as part of the\
  \ European and worldwide network of social science data archives. Before its merger\
  \ into Sikt in 2022, the Archive was part of NSD – Norwegian Centre for Research\
  \ Data. NSD was established in 1971 as part of the Research Council of Norway and\
  \ became an independent limited company fully owned by the Ministry of Education\
  \ and Research in 2003. The Archive is now a service under Sikt – Norwegian Agency\
  \ for Shared Services in Education and Research, a public administrative body under\
  \ the Ministry of Education and Research."
