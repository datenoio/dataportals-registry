description: 'The MHAS study is a series of questionnaires distributed in waves, the fourth of which was
  fielded in the Fall of 2015. Research goals include, but are not limited to the following: examination
  of the aging processes and its disease and disability burden in a large representative panel of older
  Mexicans; evaluation of the effects of individual behaviors, early life circumstances, migration and
  economic history, community characteristics, and family transfer systems on multiple health outcomes;
  and comparison of the health dynamics of older Mexicans with comparably aged Mexican-born migrants in
  the U.S. and second generation Mexican-American using similar data from the U.S. population (for example
  the biennial Health and Retirement Study HRS) to assess the durability of the migrant health advantage.'
