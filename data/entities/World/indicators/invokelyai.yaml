description: >-
  Public catalog of official-statistics indicators with definitions, units and rankings.
  Values are available through a hosted REST API for US states and counties, EU regions,
  Spanish municipalities, and country and world indicators from the World Bank. Each value
  includes its publisher and a citation. The catalog is browsable without an account.
  The free plan includes 500 MCP calls per month; REST data queries require Builder, Pro
  or prepaid credits. Full history and CSV export are included on every plan, with up to
  5,000 series points per call. Original publishers' licenses govern reuse.
