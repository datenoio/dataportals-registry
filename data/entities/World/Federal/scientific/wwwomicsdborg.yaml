description: OmicsDB offers an integrated platform for studying biological networks
  in multiple organisms, as well as accessing gene expression data. By expanding the
  classic single species databases across species, it is possible to leverage the
  amount of information to an even higher level. Its main goal is to enable researchers
  to find omics data as well as biological networks (Coexpression, PPI etc). One of
  the main ideas has been to cover non-model species (Fungal plant pathogens, Sorghum,
  Cassava etc), to allow researchers in these fields similar oppertunities as researchers
  in more developed fields (Like Arabidopsis or Yeast).
