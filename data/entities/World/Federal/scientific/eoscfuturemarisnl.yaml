description: "The Marine Data Viewer uses information from in-situ and satellite observations\
  \ as well as model products to provide the user with the possibility to observe\
  \ the marine environment. The user interface of the map viewer is designed for (citizen)\
  \ scientists and allows for interaction with large data collections by geographical\
  \ area and using sliders for date, time and depth. \n\nThe in-situ values are provided\
  \ by SeaDataNet and Euro-Argo and are co-located with product layers from Copernicus\
  \ Marine, based upon modelling and satellite data."
