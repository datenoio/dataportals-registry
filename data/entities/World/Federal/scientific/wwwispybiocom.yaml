description: iSpyBio is an intelligent and unbiased search engine for Life scientists.
  It ranks reagents by the number of data such as publications, reviews, characterization
  images and tested applications. It displays over 500,000 reagents such as antibodies,
  proteins, ELISA kits and biomolecules. iSpyBio’s proprietary search algorithm is
  unique and rapidly analyzes the end-users search query against its large database.
  Powerful filters allow the user to enhance the search results, for example if they
  want a protein expressed in yeast or an antibody that only works in mouse. As iSpyBio
  syncs with supplier and other public databases, it is always up-to-date. This allows
  iSpyBio to exclude out of stock items but show the most recent testing results and
  peer-reviewed publications.
