description: The International Committee on Taxonomy of Viruses (ICTV) taxonomic database
  is a maintained resource comprised of a universal taxonomic scheme for all the viruses
  infecting animals (vertebrates, invertebrates and protozoa), plants (higher plants
  and algae), fungi, bacteria and archaea. The ICTV Executive Committee (EC) has established
  over 100 international Study Groups (SGs) covering all virus taxa with subcommittees
  encompassing curation of Archaeal Viruses, Animal DNA Viruses and Retroviruses,
  Animal dsRNA and ssRNA- Viruses, Animal ssRNA+ Viruses, Bacterial Viruses, Fungal
  and Protist Viruses, and Plant Viruses.
