description: The Virtual Metabolic Human (VMH) database captures information on human
  and gut microbial metabolism, linking to information from hundreds of diseases and
  nutritional data-related resources (5,607 unique metabolites, 19,313 unique reactions,
  3,695 human genes, 255 Mendelian diseases, 818 microbe reconstructions, 632, 685
  microbial genes, and 8,790 food items as of 2022-09-19). VMH also contains manually
  curated genome-scale metabolic reconstructions, which have been assembled based
  on genomic, biochemical, and physiological data. The VMH helps to facilitate rapid
  analyses and interpretations of complex biological data arising from large-scaled
  biomedical studies for enabling complex queries and detailed graphical representations
  of human metabolism (distributing computational models for simulating human and
  microbial metabolism).
