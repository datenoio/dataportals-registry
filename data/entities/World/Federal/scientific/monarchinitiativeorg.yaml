description: The Monarch Initiative is an integrative data and analytic platform connecting
  phenotypes to genotypes across species, bridging basic and applied research with
  semantics-based analysis. The correlation of phenotypic outcomes and disease with
  genetic variation and environmental factors is a core pursuit in biology and biomedicine.
  We have created or currently contribute to many essential bio-ontologies that together
  enable sophisticated and semantically integrated computational analysis across gene,
  genotype, variant, disease, and phenotype data. We have developed algorithms and
  tools that are in use by multiple communities for tasks including the identification
  of animal models of human disease through phenotypic similarity, phenotype-driven
  computational support for differential diagnostics, and translational research.
