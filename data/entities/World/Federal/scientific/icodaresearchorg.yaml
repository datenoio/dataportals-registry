description: Convened by Health Data Research UK, the national institute for health
  data in the UK, ICODA was an open and inclusive global collaboration of leading
  life science, philanthropic and research organisations that came together to harness
  the power of health data to respond to the COVID-19 pandemic. Building on the ICODA
  programme, HDR UK has now convened the HDR Global programme which seeks to assist
  with data science skills and enable trustworthy data access, re-use and analysis
  in regions, communities and disease areas, where evidence to tackle threats to public
  health is lacking
