description: FORRT’s Replication Database (FReD) is a community-augmented, quantitative,
  meta-analytical interface of one of the most comprehensive collections of original
  and replication findings, including Replications and Reversals and large scale projects
  such as Many Labs or Registered Replication Reports. Via ReD, students, researchers,
  and applicants can create summaries of replication findings, search replications,
  investigate correlates of replicability, and automatically check for replications
  in reference lists.
