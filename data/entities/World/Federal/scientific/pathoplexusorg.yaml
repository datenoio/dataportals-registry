description: 'Pathoplexus is an open-source database designed to enhance the sharing
  and analysis of human viral pathogen genomic data. Developed in response to the
  growing need for specialized viral databases, Pathoplexus aims to offer the features
  needed for the research community to share and explore datasets for viruses of public
  health importance. By leveraging new open-source software, Pathoplexus provides
  a robust and user-friendly platform for scientists and public health professionals.


  One of the key features of Pathoplexus is its flexible data sharing options. Users
  can choose to share their data openly or with time-limited protections to ensure
  proper attribution and safeguard their contributions. After a specified period,
  all data becomes openly accessible through INSDC-member databases. Data on Pathoplexus
  consists of both data directly submitted to Pathoplexus (which users can choose
  to keep protected for a period of time, or make open straight away) and data from
  INSDC-member databases.'
