description: The Comparative Agendas Project (CAP) is an open research database that
  compiles and codes government policy activity data from countries around the world
  using one consistent classification system. Researchers, students, and policymakers
  can use it to analyze trends in policy-making over time and compare how different
  governments respond to issues. It covers a wide range of topics across decades and
  lets users download datasets for deeper analysis.
