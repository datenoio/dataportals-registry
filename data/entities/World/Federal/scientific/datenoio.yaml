description: "Dateno is a next-generation dataset search engine that provides fast,\
  \ comprehensive access to open datasets worldwide. Our mission is to make data discovery\
  \ and integration as seamless as possible for researchers, analysts, developers,\
  \ journalists, and anyone else working with data.\n\nOur Vision\n\nWe believe that\
  \ access to data should be easy and efficient. By creating a powerful search engine\
  \ specifically for datasets, we aim to accelerate research, innovation, and data-driven\
  \ decision-making across various fields.\nWhat Sets Us Apart\n\n    Speed: We've\
  \ optimized our search functionality to deliver results as quickly as possible using\
  \ Meilisearch.\n    Comprehensive Filtering: Our advanced filtering system allows\
  \ users to narrow down results by various parameters, making it easier to find exactly\
  \ what you need.\n    API-First Architecture: We're building Dateno with API access\
  \ in mind, allowing for seamless integration into your workflows and applications.\n\
  \    Extensive Index: Our constantly growing index includes millions of records\
  \ from thousands of data catalogs worldwide.\n    Data Preservation: We're committed\
  \ to archiving datasets that are at risk of disappearing, ensuring valuable data\
  \ remains accessible.\n\nHow It Works\nDateno is built on the Dateno registry of\
  \ data catalogs. We crawl various types of data sources, including:\n\n- Open data\
  \ portals\n- Geoservers/geoportals\n- Scientific data repositories\n- Microdata\
  \ catalogs\n- Databases of indicators\n\nWe use common APIs and export formats like\
  \ DCAT, CKAN API, CSW, WFS, WMS, and ArcGIS Rest API to gather data. After crawling,\
  \ we enrich the data and convert it to a unified structure similar to DCAT, creating\
  \ a single search index."
