description: The Common Metabolic Diseases Knowledge Portal (CMDKP) aggregates and
  analyzes genetic association results, epigenomic annotations, and results of computational
  prediction methods to provide data, visualizations, and tools in an open-access
  portal. The aim of the CMDKP is to facilitate research on the molecular basis of
  complex diseases, including type 1 and type 2 diabetes, cardiovascular and cerebrovascular
  disease, and sleep disorders.
