description: The Proteoform Atlas is a community-driven database that gathers experimentally
  observed proteoforms, which are distinct molecular forms of proteins created by
  genetic variation, splicing, or chemical modifications. It allows researchers to
  explore proteoform diversity across organisms and upload their own validated datasets.
  The project aims to standardize identifiers, encourage data sharing, and advance
  understanding of protein complexity in biology and disease.
