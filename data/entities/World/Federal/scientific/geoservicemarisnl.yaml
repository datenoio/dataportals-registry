description: "The **SeaDataNet CDI OGC WFS service** provides a metadata endpoint\
  \ in OGC Feature format. It provides a WFS endpoint to the metadata overview of\
  \ the CDI service, e.g. for integration in (web)GIS applications.\n\nThe SeaDataNet\
  \ infrastructure links more than 100 national oceanographic data centres and marine\
  \ data centres from 35 countries bordering all European seas. The data centres manage\
  \ large sets of marine and ocean data (such as samples, timeseries, profiles, trajectories,\
  \ etc), originating from their own institutes and from other parties in their country,\
  \ in a variety of data management systems and configurations. \n\nThe CDI service\
  \ itself provides access to the data resources from more than 800 data originators.\
  \ The Common Data Index service (CDI) gives users, via an ISO19115 - ISO19139 based\
  \ index (metadatabase), a highly detailed insight in the availability and geographical\
  \ spreading of marine data from the different data centres across Europe.  Data\
  \ sets are available in ODV (Ocean Data View) and NetCDF (CF) SeaDataNet formats\
  \ that can be imported to ODV software, which includes the Data Interpolating Variational\
  \ Analysis software tool (DIVA)."
