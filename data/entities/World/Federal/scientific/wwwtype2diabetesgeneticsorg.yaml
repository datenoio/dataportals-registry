description: The Type 2 Diabetes Knowledge Portal is an open-access resource for human
  genetic information on type 2 diabetes (T2D). It is a central repository for data
  from large genomic studies that identify DNA variants whose presence is linked to
  altered risk of having T2D or related traits such as high body mass index. Pinpointing
  these DNA variants, and the genes they affect, will spur novel insights about how
  T2D develops and suggest new potential targets for drugs or other therapies to treat
  T2D.
