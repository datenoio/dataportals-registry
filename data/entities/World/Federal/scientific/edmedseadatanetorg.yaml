description: SeaDataNet is a pan-European distributed marine data infrastructure for
  the management, exchange and re-use of marine and oceanographic data sets. A major
  objective and challenge in SeaDataNet is to promote discoverability of these data
  resources in a consistent and comprehensive manner. This is achieved through the
  SeaDataNet metadata services a set of directories, with associated user interfaces
  and web services, each governed by a SeaDataNet partner and content provided through
  national SeaDataNet collating nodes. The European Directory of Marine Environmental
  Data (EDMED) is the SeaDataNet catalogue promoting discoverability of, and access
  to, marine and oceanographic data sets and collections held within European research
  organisations. EDMED covers a wide range of disciplines including marine meteorology;
  physical, chemical and biological oceanography; and marine geology and geophysics.
  Data sets are described in EDMED irrespective of their format. EDMED utilises a
  metadata format based upon the ISO 19115 content model. The EDMED Schema and XML
  coding are supported by URLs and URNs to the SeaDataNet Common Vocabularies.For
  communities who need to search and access standardised marine data sets and collectionsMore
  than 110 data providers (linked to more than 600 data originators) and several thousands
  of data users.
