description: "SeaDataNet provides different types of data products from its database:\
  \ \n•\tharmonised and quality controlled aggregated datasets (ODV collections of\
  \ all SeaDataNet measurements of temperature and salinity by sea basins) \n•\tderived\
  \ climatologies (regional gridded field products based on the aggregated datasets)\
  \ \nBoth types of data products are created for all the European sea basins, namely:\
  \ Arctic Ocean, Baltic Sea, Black Sea, Mediterranean Sea, North Atlantic, and North\
  \ Sea.\n\nThe aggregated datasets are provided as ODV (https://www.seadatanet.org/Software/ODV)\
  \  data collections, while the climatology gridded fields are provided in NetCDF\
  \ files.\n\nEach SeaDataCloud product is described in a Product Information Document\
  \ (PIDoc) that can be accessed from the product’s landing page. Product PIDoc contains\
  \ detailed information about the product: the data source, statistics on spatial\
  \ and temporal data coverage, information about quality procedures, applied methods\
  \ and tools used, comparison with previous versions, information about validation\
  \ procedures and so on.\n\nExample of DOI (landing page) : https://doi.org/10.12770/2a2aa0c5-4054-4a62-a18b-3835b304fe64\n\
  Example of PIDoc : https://archimer.ifremer.fr/doc/00658/77059/"
