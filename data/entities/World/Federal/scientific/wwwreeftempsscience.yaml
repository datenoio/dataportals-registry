description: 'ReefTEMPS is a sensors network initiated in 1958 to monitor the coastal
  area of the South, West and South-West Pacific. This long-term observatory allows
  the acquisition of several parameters: sea temperature, electrical conductivity
  / practical salinity, sea pressure / waves height & period / sea level, fluorescence,
  turbidity, with high or medium frequency (from 1 second to 30 minutes). The main
  objective is to study the climatic parameters of the tropical ocean with a focus
  on the coastal sea waters to monitor the long-term effects of global climate change
  and its impact on coral reefs.'
