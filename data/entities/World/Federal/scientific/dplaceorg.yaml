description: 'The Database of Places, Language, Culture, and Environment (D-PLACE)
  is an expandable, open-access databases that aims to describe the dispersed corpus
  of information describing human cultural diversity. Its goal is to make it easy
  for individuals to contrast their own cultural practices with those of other societies,
  and to consider the factors that may underlie cultural similarities and differences.
  D-PLACE contains cultural, linguistic, environmental and geographic information
  ''societies'', which are groups of people in a particular locality who often share
  a language and cultural identity. All cultural descriptions are tagged with the
  date to which they refer and with the ethnographic sources that provided the descriptions.
  The majority of the cultural descriptions in D-PLACE are based on ethnographic work
  carried out in the 19th and early-20th centuries (pre-1950). D-PLACE lets you visualize
  cross-cultural data in three ways: as a list in a table, on a global map, or on
  a linguistic tree (i.e., phylogeny or classification). Data points (i.e., rows in
  the table, points on the map, points on the tree) represent the expression of a
  particular cultural feature by a particular society at a given time and place, as
  recorded by the Source. Data points are colour-coded to allow you to quickly assess
  the diversity of a cultural feature across societies in the table, map, or linguistic
  tree.'
