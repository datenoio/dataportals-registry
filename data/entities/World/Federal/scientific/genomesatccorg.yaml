description: Database and knowledgebase of authenticated microbial genomics data with
  full data provenance to physical materials held within American Type Culture Collection's
  (ATCC) biorepository and culture collections. Data includes whole genome sequencing
  data for bacterial, viral and fungal strains at ATCC, their genome assemblies, metadata,
  drug susceptibility data, and more. All data is freely available for non-commercial
  research use only (RUO) applications via the web portal interface or via a REST-API.
  The goal is to provide the research community with provenance information and authentication
  between the biological source materials and reference genome assemblies derived
  from them.
