description: The WHO International Clinical Trials Registry Platform (ICTRP) registry
  platform and clinical trial Search Portal aims to provide a single point of access
  to information about ongoing and completed clinical trials to ensure that a complete
  view of research is accessible to all those involved in health care decision making.
  Global health and scientific community access is provided through a centralized
  database system containing primary clinical trial registrations from primary data
  providers in the WHO Registry Network in facilitating unambiguous identification
  of clinical trials and links to full original study records. In May 2022, the Seventy-fifth
  World Health Assembly adopted a resolution (WHA75.8) on “Strengthening clinical
  trials to provide high-quality evidence on health interventions and to improve research
  quality and coordination”. The WHO secretariat has developed this webpage in order
  to provide a single point of access for information and resources of relevance to
  resolution WHA 75.8. This includes initiatives and guidances highlighted to WHO
  as part of the public consultation held related to WHA 75.8 in October and November
  2022. This webpage will be updated as activities related to the resolution progress.
