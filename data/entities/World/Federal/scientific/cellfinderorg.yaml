description: CellFinder maps validated gene and protein expression, phenotype and
  images related to cell types.The data allow characterization and comparison of cell
  types and can be browsed by using the body browser and by searching for cells or
  genes. All cells are related to more complex systems such as tissues, organs and
  organisms and arranged according to their position in development. CellFinder provides
  long-term data storage for validated and curated primary research data and provides
  additional expert-validation through relevant information extracted from text.
