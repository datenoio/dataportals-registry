description: The Database of Zeolite Structures hosts detailed, publicly accessible
  information on all zeolite framework types approved by the International Zeolite
  Association. It stores crystallographic data, framework chemical compositions, NMR
  spectra, powder diffraction patterns, and animated structural illustrations. The
  database also includes models, synthesis-verified data, and a specialized module
  for disordered zeolite structures.
