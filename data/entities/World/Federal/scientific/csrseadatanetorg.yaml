description: SeaDataNet is a pan-European distributed marine data infrastructure for
  the management, exchange and re-use of marine and oceanographic data sets and collections.
  A major objective and challenge in SeaDataNet is to promote discoverability of these
  data resources in a consistent and comprehensive manner. This is achieved through
  the SeaDataNet metadata services a set of directories, with associated user interfaces
  and web services, each governed by a SeaDataNet partner and content provided through
  national SeaDataNet collating nodes. The European Directory of Cruise Summary Reports
  (CSR) is the SeaDataNet catalogue promoting discoverability of, and access to, reports
  of the research oceanographic cruises operated by European countries. CSR utilises
  a metadata format based upon the ISO 19119 content model. The CSR Schema and XML
  coding are supported by URLs and URNs to the SeaDataNet Common Vocabularies.Find
  an existing cruise, see if cruises exist in your area of interestChief scientists
  of Research cruises, Oceanographers, researchers, ship owners, public authorities.
