description: 'The Global Carbon Atlas is an online platform to explore, visualize
  and interpret global and regional carbon data arising from both human activities
  and natural processes. The Atlas has three components with objectives and information
  relevant to different users: OUTREACH providing educational material, EMISSIONS
  providing browsing, visualization and download of carbon dioxide emissions data,
  and RESEARCH providing filtering and map visualisation for carbon fluxes from research
  models and datasets.'
