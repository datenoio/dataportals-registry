description: The Joint Evaluated Fission and Fusion File (JEFF) project is a collaboration
  between NEA Data Bank member countries. The JEFF library combines the efforts of the JEFF
  and EFF/EAF Working Groups to produce a common sets of evaluated nuclear data, mainly for
  fission and fusion applications. It contains a number of different data types, including
  neutron and proton interaction data, radioactive decay data, fission yields, and thermal
  scattering law data.
