description: The UNESCO Digital Library provides access to publications, documents
  and other materials either produced by UNESCO or pertaining to UNESCO’s fields of
  competence. It is constantly enriched with new publications and documents produced
  by UNESCO, as well as with acquisitions, resources shared by other institutions
  and donations. The UNESCO Digital Library is the repository of UNESCO’s institutional
  memory and a source of information on UNESCO activities (in education, natural sciences,
  social and human sciences, culture, and communication and information), with more
  than 350,000 documents dating back to 1945.
