description: The World Values Survey (WVS) is a worldwide network of social scientists studying
  changing values and their impact on social and political life. The WVS in collaboration
  with EVS (European Values Study) carried out representative national surveys in more than
  100 countries containing almost 90 percent of the world's population. These surveys show
  pervasive changes in what people want out of life and what they believe.
