description: The MIBiG (Minimum Information about a Biosynthetic Gene Cluster) Repository
  stores Biosynthetic Gene Clusters (BGC) that are manually curated through community efforts.
  It is a central reference database for BGCs of known function, and provides the basis for
  comparative analyses for a number of tools. It has enabled many computational analyses of
  BGC function and novelty central to both small and large-scale studies of microbes and microbial
  communities.
