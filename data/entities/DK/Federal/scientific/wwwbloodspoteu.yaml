description: BloodSpot is a database of mRNA expression in healthy and malignant haematopoiesis
  and includes data from both humans and mice. The core function of BloodSpot is to provide
  an expression plot of genes in healthy and cancerous haematopoietic cells at specific differentiation
  stages. In addition to the default plot, that displays an integrated expression plot, two
  additional levels of visualization are available; an interactive tree showing the hierarchical
  relationship between the samples, and a Kaplan-Meier survival plot. Prior to BloodSpot,
  this service was provided by an earlier project, HemaExplorer, also by the same research
  group. HemaExplorer was updated to the BloodSpot platform, which all users are encouraged
  to use instead.
