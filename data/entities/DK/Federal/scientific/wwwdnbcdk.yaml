description: The Danish National Birth Cohort is a large, longitudinal research database that
  follows about 100,000 Danish pregnancies from early gestation through childhood and beyond
  to study how early-life exposures affect later health outcomes. It combines prospectively
  collected interviews, questionnaires, biological samples, and links to national health registries
  to enable life-course epidemiological research.
