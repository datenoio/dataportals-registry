description: SilkDB is a database of the integrated genome resource for the silkworm, Bombyx
  mori. This database provides access to not only genomic data including functional annotation
  of genes, gene products and chromosomal mapping, but also extensive biological information
  such as microarray expression data, ESTs and corresponding references. SilkDB will be useful
  for the silkworm research community as well as comparative genomics.
