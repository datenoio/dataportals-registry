description: The Metalloenzyme Data Bank and Analysis (MeDBA) is a metalloenzyme-focused
  data bank and analysis tools relevant to research areas such as biochemistry, structural
  biology, synthetic biology, computational chemistry and drug discovery. MeDBA integrates
  comprehensive information of metalloenzymes (e.g., related diseases, structures,
  metal sites), ligands (e.g., bioactive molecules, substrates/products, drugs and
  drug candidates) and metalloenzyme-ligand associations (e.g., MBP, metalloenzyme-ligand
  complexes), which are provided for users to freely search, browse, download and
  analyze. Metalloenzyme-specific analysis servers are also provided, including 3D
  visualization of metalloenzyme structures, structure/metal active site comparison,
  substructure search for ligands and MBPs, and metalloenzyme profiling.
