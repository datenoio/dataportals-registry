description: PGG.Population is a database to aid research on genomic diversity and
  genetic ancestry of human populations, containing over 7000 genomes, covering more
  than 350 non-overlapping worldwide populations/groups. It stores information on
  the genomic diversity of each population, including their genetic affinity, population
  structure, genetic admixture, ancestral architecture, and evidence of natural selection
  in their genomes.
