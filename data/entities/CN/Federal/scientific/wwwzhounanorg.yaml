description: FerrDb V2 contains 1001 ferroptosis regulators and 143 ferroptosis-disease
  associations manually curated from 3288 articles. Specifically, there are 621 gene
  regulators, of which 264 are drivers, 238 are suppressors, 9 are markers, and 110
  are unclassified genes; and there are 380 substance regulators, with 201 inducers
  and 179 inhibitors. Compared to FerrDb V1, curated articles increase by > 300%,
  ferroptosis regulators increase by 175%, and ferroptosis-disease associations increase
  by 50.5%. Circular RNA and pseudogene are novel regulators in FerrDb V2, and the
  percentage of non-coding RNA increases from 7.3% to 13.6%. External gene-related
  data were integrated, enabling thought-provoking and gene-oriented analysis in FerrDb
  V2.
