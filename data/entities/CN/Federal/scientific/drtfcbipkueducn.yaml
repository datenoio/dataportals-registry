description: DRTF contains 2025 putative transcription factors (TFs) in Oryza sativa
  L. ssp. indica and 2384 in ssp. japonica, distributed in 63 families, identified
  by computational prediction and manual curation. It includes detailed annotations
  of each TF including sequence features, functional domains, Gene Ontology assignment,
  chromosomal localization, EST and microarray expression information, as well as
  multiple sequence alignment of the DNA-binding domains for each TF family.
