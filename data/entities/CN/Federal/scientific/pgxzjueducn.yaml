description: scMOVIR is a multi-omics database for human viral infections and immune
  responses, which integrates transcriptomic, proteomic, and immune receptor repertoire
  data at single-cell resolution. scMOVIR incorporates 8,532 samples covering 114
  viral species, subtypes, and strains, 59 disease states, and over 30 tissue types,
  spanning acute and chronic infection contexts, virus-associated cancers, vaccination
  cohorts, and therapeutic intervention studies. All datasets are subjected to standardized
  processing, quality control, and unified annotation to ensure consistency and interoperability.
  We performed multi-layered analyses, including differential gene and protein expression
  profiling, functional enrichment, cell–cell communication inference, and clonality
  characterization.
