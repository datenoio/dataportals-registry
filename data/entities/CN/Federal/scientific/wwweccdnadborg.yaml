description: eccDNAdb currently includes 1270 eccDNAs, which were identified in 480
  samples (of 42 cancers) after analyzing a total number of 3395 tumor samples (of
  57 cancers) including patient tissues, patient-derived xenografts, and cancer cell
  lines. A total number of 54,901 eccDNA genes were annotated and included in the
  database as well. With the integration of gene expression, clinical information
  and chromatin accessibility data, eccDNAdb enables users to easily determine the
  biological function and clinical relevance of eccDNAs in human cancers.
