description: Silkworm Pathogen Database (SilkPathDB) is a comprehensive resource for
  studying on pathogens of silkworm, including microsporidia, fungi, bacteria and
  virus. SilkPathDB provides access to not only genomic data including functional
  annotation of genes and gene products, but also extensive biological information
  for gene expression data and corresponding researches. SilkPathDB will be help with
  researches on pathogens of silkworm as well as other Lepidoptera insects.
