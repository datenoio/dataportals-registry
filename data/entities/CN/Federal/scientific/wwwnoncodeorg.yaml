description: NONCODE is a database of noncoding RNAs (except tRNAs and rRNAs), including
  long noncoding (lnc) RNAs. Information contained within the database includes human
  lncRNA–disease relationships and single nucleotide polymorphism-lncRNA–disease relationships;
  human exosome lncRNA expression profiles; and predicted RNA secondary structures
  of human transcripts. This resource has not been updated since 2017, and therefore
  its status has been marked as Uncertain. Please get in touch if you have any information
  about the current status of this resource.
