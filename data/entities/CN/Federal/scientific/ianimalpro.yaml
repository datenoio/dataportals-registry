description: IAnimal is a cross-species, multi-omics knowledgebase. It provides comprehensive
  structured multi-omics data for a wide range of animal species, abundant omics data
  mining and visualization tools, and intelligent integration analysis algorithms
  for multi-omics data. In the present version, IAnimal provides 61,191 WGS, RNA-Seq,
  ChIP-Seq, and ATAC-Seq individual information and genome annotation information
  for 21 species, such as mouse, pig, cow, chicken, and which the scale of clean data
  reaches about 846.46 TB. In order to better understand the biological significance
  of omics information, IAnimal built a deep learning model based on BioBERT and AutoNER
  to mine 'gene' and 'trait entity from the abstracts of 2,794,237 research papers,
  and this is helpful for users to understand how each different omics layer regulates
  genes to affect the traits.
