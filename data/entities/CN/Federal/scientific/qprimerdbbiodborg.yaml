description: The qPrimerDB database stores information on qPCR primers and is accessible
  through a web front-end providing gene-specific and pre-computed primer pairs across
  147 different organisms, including human, mouse, zebrafish, yeast, thale cress,
  rice, and maize. The qPrimerDB provides an interactive and information-rich web
  graphical interface to display search and BLAST results as table-based descriptions
  and associated links. The database provides 3,331,426 of the best primer pairs for
  each gene based on primer pair coverage (PPC), as well as 47,726,569 alternative
  gene-specific primer pairs, which can be conveniently batch downloaded.
