description: MGTbind database contains 3,093 manually curated MGs with their chemical
  structures and physicochemical properties, along with 3,924 ternary interactions
  with bioactivity measurements (e.g. degradation capacities for MG degraders, in
  vitro biochemical activities and cellular activities). Hierarchical binding affinity
  is also collected to enable exploring of cooperative binding mechanisms. Ternary
  complex structural data are systematically integrated, either from the Protein Data
  Bank or generated by AlphaFold 3. All of them can be intuitively analyzed and visualized
  along with various predicted metrics. A fully functional and user-friendly web interface
  that allows global search and smooth browsing is provided and is freely accessible
  at https://mgtbind.pkumdl.cn.
