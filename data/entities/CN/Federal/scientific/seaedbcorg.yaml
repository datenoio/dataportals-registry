description: SEA (Super-Enhancer Archive) is a web-based comprehensive resource focusing
  on the collection, storage and online analysis of super-enhancers. It focuses on
  integrating super-enhancers in multiple species and annotating their potential roles
  in the regulation of cell identity gene expression. To facilitate data extraction,
  SEA supports multiple search options, including species, genome location, gene name,
  cell type/tissue, and super-enhancer name.
