description: 'The Gene Therapy Omnibus (GTO) is a free, specialized resource in the
  field of gene therapy. It compiles data from global clinical trial registration
  platforms and the literature, along with pre- and post-therapy transcriptomic data
  from the GEO and ArrayExpress. This information is meticulously organized, stored,
  and analyzed to provide valuable insights into gene therapy research.


  The database contains a total of 6,333 clinical trial records and 3,466 transcriptome
  profiles. These include 614 altered genes (e.g., p53, VEGFA, NY-ESO-1) and 22 types
  of gene therapy (e.g. CAR-T, TCR-T, gene transfer, ASO, mRNA vaccine). For each
  gene therapy product, detailed information is provided, including the altered gene
  name, structural components, indication, vector, clinical trial phase, and, where
  available, clinical outcomes and adverse effects.'
