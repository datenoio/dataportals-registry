description: MethMarkerDB is a comprehensive cancer DNA methylation biomarker database
  based on WGBS data, providing precise genomic location information for biomarkers,
  including genes and DMRs. It offers various functions such as literature-based marker
  gene search, pan-cancer biomarker search, and diagnostic/prognostic tools, supporting
  the discovery and clinical application of novel DNA methylation biomarkers in cancer.
