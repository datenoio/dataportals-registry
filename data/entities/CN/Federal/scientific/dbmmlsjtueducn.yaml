description: A web-based resource for integrative and conjugative elements (ICEs)
  found in bacteria. It collates available data from experimental and bioinformatics
  analyses, and literature, about known and putative ICEs in bacteria as a PostgreSQL-based
  database called ICEberg. This database contains detailed information on all archived
  ICEs and the genes carried by each entity, including unique identifiers, species
  details and hyperlink-paths to other public databases, like NCBI, UniprotKB and
  KEGG.
