description: 'The Global Communication Repository (GCR) aims to collect, store, cumulate
  and circulate academic case study research and industry practice cases and welcomes
  submissions from scholars, students, practitioners and media organizations and other
  institutions from across the world, especially from the Global South countries.
  GCR is to be launched in cooperation with the Ubiquity platform owned by De Gruyter
  Grille and hopes to generate more research opportunities by leveraging on case study
  as a new form of academic and professional format for knowledge building between
  an academic paper and a professional report. A case study is expected to address
  a specific issue of concern or question that should be solved but still remain unsolved
  in most societies, especially Global South countries.


  By so doing, GCR encourages comparative approaches for case studies submitted around
  the world, in an effort to better enhance its goal to serve as an academic bridge
  between the Global North and the Global South countries. Note that only some records
  have DOIs minted by GCR.'
