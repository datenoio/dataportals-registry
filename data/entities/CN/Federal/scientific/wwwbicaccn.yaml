description: Medicinal plants have garnered significant attention in ethnomedicine
  and traditional medicine due to their potential antitumor, anti-inflammatory and
  antioxidant properties. Recent advancements in genome sequencing and synthetic biology
  have revitalized interest in natural products. Despite the availability of sequenced
  genomes and transcriptomes of these plants, the absence of publicly accessible gene
  annotations and tabular formatted gene expression data has hindered their effective
  utilization. IMP (Integrated Medicinal Plantomics) is a freely accessible platform
  storing genetic, genome assembly, and transcriptome sequencing data encompassing
  various organs, tissues, developmental stages and stimulations.
