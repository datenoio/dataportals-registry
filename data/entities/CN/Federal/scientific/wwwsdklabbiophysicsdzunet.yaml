description: 'Long noncoding RNAs (lncRNAs) have emerged as crucial regulators across
  diverse biological processes and diseases. While high-throughput sequencing has
  enabled lncRNA discovery, functional characterization remains limited. The EVLncRNAs
  database is the first and exclusive repository for all experimentally validated
  functional lncRNAs from various species. After previous releases in 2018 and 2021,
  this update marks a major expansion through exhaustive manual curation of nearly
  25,000 publications from May 15, 2020, to May 15, 2023. It incorporates substantial
  growth across all categories: a 154% increase in functional lncRNAs, 160% in associated
  diseases, 186% in lncRNA-disease associations, 235% in interactions, 138% in structures,
  234% in circular RNAs, 235% in resistant lncRNAs, and 4724% in exosomal lncRNAs.
  More importantly, it incorporated additional information include functional classifications,
  detailed interaction pathways, homologous lncRNAs, lncRNA locations, COVID-19, and
  phase-separation and organoid-related lncRNAs. The web interface was substantially
  improved for browsing, visualization, and searching. ChatGPT was tested for information
  extraction and functional overview with its limitation noted. EVLncRNAs 3.0 represents
  the most extensive curated resource of experimentally validated functional lncRNAs
  and will serve as an indispensable platform for unravelling emerging lncRNA functions.
  The updated database is freely available at https://www.sdklab-biophysics-dzu.net/EVLncRNAs3/.'
