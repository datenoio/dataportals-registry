description: RASP (RNA Atlas of Structure Probing) is build from 161 deduplicated
  transcriptome-wide RNA secondary structures from datasets culled from 38 papers.
  RASP covers 18 species across animals, plants, bacteria, fungi, and also viruses,
  and categorizes 18 experimental methods including DMS-seq, SHAPE-Seq, SHAPE-MaP,
  and icSHAPE, etc. Specially, RASP curates the up-to-date datasets of several RNA
  secondary structure probing studies for the RNA genome of SARS-CoV-2. RASP also
  provides a user-friendly interface to query, browse, and visualize RNA structure
  profiles, offering a shortcut to accessing RNA secondary structures grounded in
  experimental data.
