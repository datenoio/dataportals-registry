description: CryoSeek represents a structure first paradigm for the discovery of biological
  entities. The CryoSeek strategy employs cryo electron microscopy (cryo EM) as a discovery
  tool to identify previously unknown biological entities directly isolated from natural environments
  or native resources. This approach is further integrated with AI facilitated computational
  tools and bioinformatic analyses to assess their potential origins and biological functions.
