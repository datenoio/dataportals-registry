description: 'The National High Energy Physics Science Data Center (NHEPSDC) is a
  repository for high-energy physics. In 2019, it was designated as a scientific data
  center at the national level by the Ministry of Science and Technology of China
  (MOST). NHEPSDC is constructed and operated by the Institute of High Energy Physics
  (IHEP) of the Chinese Academy of Sciences (CAS). NHEPSDC consists of a main data
  center in Beijing, a branch center in Guangdong-Hong Kong-Macao Greater Bay Area,
  and a branch center in Huairou District of Beijing. The mission of NHEPSDC is to
  provide the services of data collection, archiving, long-term preservation, access
  and sharing, software tools, and data analysis. The services of NHEPSDC are mainly
  for high-energy physics and related scientific research activities. The data collected
  can be roughly divided into the following two categories: one is the raw data from
  large scientific facilities, and the other is data generated from general scientific
  and technological projects (usually supported by government funding), hereafter
  referred to as generic data.  In the past three years, the average data increment
  is about 10 PB per year. By integrating data resources with the IT environment,
  a state-of-art data process platform is provided to users for scientific research,
  the volume of data accessed every year is more than 400 PB with more than 10 million
  visits.'
