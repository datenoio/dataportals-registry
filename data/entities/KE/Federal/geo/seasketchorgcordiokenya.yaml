description: Community MSP is an innovative digital platform designed to facilitate
  discussions and engagements related to national Marine Spatial Planning (MSP). Spearheaded
  by the Coastal Oceans Research and Development - Indian Ocean (CORDIO), this tool
  is specifically crafted to involve local communities and stakeholders in the stewardship
  and sustainable management of marine resources. It serves as a collaborative space
  where users can map out fishing grounds, access points, and other crucial marine
  locales, contributing significantly to the discourse surrounding the blue economy
  and marine spatial planning.  Community MSP enables stakeholders to visualize and
  interact with spatial data, helping them to understand and plan the distribution
  of activities in marine areas. By providing a platform for transparent communication,
  Community MSP, under the guidance of CORDIO, helps ensure that the interests and
  rights of local communities are considered in the development of MSP strategies.
  This engagement is vital for promoting sustainable marine development and achieving
  ecological and economic objectives. Community MSP aims to empower communities through
  data-driven insights, fostering a more sustainable and equitable use of marine resources.
  Public SeaSketch project exposing 5 published overlay layers without sign-in; sketch
  editing may require an account.
