description: 'The Library HELLANICUS Institutional Repository of the University of
  the Aegean is a service for depositing digital documents which are produced by the
  Institution’s academic community as a result of its scientific and research activities
  and which, to a great extent, are not commercially available.


  The main aim of the Hellanicus Institutional Repository is to collect, organize,
  publicize and maintain the scientific work of the members of the academic community
  in a way that ensures an easy and seamless access to it. Examples of this work include
  scientific articles - published or not - seminar lectures, textbooks, teaching material,
  dissertations and PhD theses, multimedia material and videotaped lectures.'
