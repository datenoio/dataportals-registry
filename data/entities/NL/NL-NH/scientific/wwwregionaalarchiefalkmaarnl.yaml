description: Regionaal Archief Alkmaar (RAA) is a joint arrangement that operates within a
  large region in the province of Noord-Holland. The first purpose of this arrangement is
  to fulfill the function of a regional knowledge and information center through the acquisition
  and preservation of a broad collection of historical sources. The second purpose is to make
  these sources actively available. It does so according to the Dutch Public Records Act (Archiefwet
  1995).
