description: Erfgoedcentrum Zutphen is a digital heritage portal that provides unified access to the historical
  collections of the municipality of Zutphen in the Netherlands. It brings together archives, archaeological
  records, museum collections, monument documentation, photographs, maps, and other cultural heritage
  resources from several partner institutions. The portal supports research, education, and public engagement
  by preserving and making local historical and cultural heritage accessible.
