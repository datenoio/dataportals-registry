description: The National Archives of the Netherlands (Nationaal Archief), which is situated
  in The Hague, holds over 3.5 million records that have been created by the central government,
  organisations and individuals and are of national significance. Many records relate to the
  colonial and trading history of the Netherlands in the period from 1600 to 1975. The Dutch
  presence in countries in North and South America, Africa and Asia is reflected within these
  collections.
