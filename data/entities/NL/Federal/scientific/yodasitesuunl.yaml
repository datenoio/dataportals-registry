description: Yoda is a research data management service that enables researchers to deposit,
  share, publish and preserve large amounts of research data during all stages of a research
  project. This service is managed and supported by an interdisciplinary team of university
  employees. The software has been developed at Utrecht University and is used by multiple
  organisations, both in the Netherlands and abroad. Yoda publishes data packages via Datacite.
