description: Zorggegevens is a metadata base with an overview of metadata from datasources about public
  health and care in the Netherlands. In this overview Zorggegevens shows who collects what data, for
  what purpose, who finances this datasource, what the data is used for and where the data is available
  for secondary data usage. This overview concerns sources such as healthcare records, patient records,
  surveys, monitors and other sources that are available for secondary data usage.
