description: 'In February 2022, C-support, together with Erasmus MC, started a large-scale multi-year
  study into Long COVID. People who had been registered with C-support up to January 2022 with long-term
  symptoms after a COVID-19 infection and who completed the 1th questionnaire are invited annually for
  an extensive questionnaire. So far there have been three rounds of questionnaires: more than 11.000
  people have completed the 1th questionnaire and approximately 8.000 people completed the 2nd and/or
  3rd questionnaire.


  An overview of the topics per questionnaire and more information is available on our website: https://en.c-support.nu/data-aanvraag-meerjarig-long-covid-onderzoek/


  You can request a portion of this data to use for your own research or analyses. We can also perform
  analyses for you, such as creating customized summary tables and/or graphs.


  About C-support: C-support supports people with long-term symptoms after COVID-19 or a COVID-19 vaccination.
  In addition, C-support shares knowledge with (healthcare) professionals and promotes research, for example
  by making data available.'
