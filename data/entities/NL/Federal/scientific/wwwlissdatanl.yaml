description: Established in 2007, the LISS panel is managed by Centerdata, an independent
  non-profit institute based on the campus of Tilburg University. As an official partner
  of the university, Centerdata uses the panel to collect research data through online
  surveys. These data primarily support scientific research and policy development
  in the (experimental) social, economic, and behavioral sciences. However, researchers
  from other field, such as health, the humanities, and digital science, also make
  use of the LISS panel.
