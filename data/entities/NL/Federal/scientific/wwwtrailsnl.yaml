description: TRAILS is a prospective cohort study, which started in 2001 with population cohort
  and 2004 with a clinical cohort (CC). Since then, a group of 2500 young people from the
  Northern part of the Netherlands has been closely monitored in order to chart and explain
  their mental, physical, and social development. These TRAILS participants have been measured
  every two to three years, by means of questionnaires, interviews, and all kinds of tests.
