description: Paired Omics Data Platform (PoDP) was created to streamline access to
  paired omics data so humans and computers can access and read paired datasets as
  well as record and exploit validated links between BGCs and metabolites. The aim
  of the PoDP is to connect public metabolomics datasets to their genomic origins.
  The PoDP does not store any metabolomics or genomics datasets, but captures metadata
  defining pairs of omics datasets in existing public databases and platforms already
  validated and utilized by the genomics and metabolomics communities.
