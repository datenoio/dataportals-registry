description: The Longitudinal Aging Study Amsterdam (LASA) is a long-term, multidisciplinary
  cohort study of older adults in the Netherlands, started in 1992, tracking physical,
  cognitive, emotional, and social functioning. It includes multiple measurement “waves”
  over decades, allowing researchers to study trajectories and predictors of aging.
  Access to LASA data requires submitting a research proposal, which is reviewed by
  a steering committee; the data are not open publicly but are shared under conditions
  to ensure scientific use.
