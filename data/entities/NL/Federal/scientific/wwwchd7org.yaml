description: The CHD7 database contains locus-specific, anonymised mutation data on
  both published and unpublished variants of the CHD7 gene related to the CHARGE syndrome
  phenotype. It can be searched for patients and their clinical phenotype or for mutations.
  It can be used as a central, quick reference database for anyone who encounters
  a variant in the CHD7 gene. Mutations are numbered according to the current reference
  sequence (GenBank Accession no. NM017780.2).
