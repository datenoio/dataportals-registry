description: The Repository SCP is the institutional repository for the Netherlands Institute for Social
  Research (SCP), which is a government agency which conducts research into the social aspects of all
  areas of government policy. The main fields studied are health, welfare, social security, the labour
  market and education, with a particular focus on the interfaces between these fields. The reports published
  by SCP are widely used by government, civil servants, local authorities and academics.
