description: Health-RI XNAT (BMIAXNAT) is the national medical imaging archive for
  Dutch research projects. Guest users can browse the public project catalog; some
  collections are downloadable and others require a data use agreement. Public projects
  include EuCanImage/AFRICAI challenge datasets, AMYPAD, EPAD, the Erasmus Glioma
  Database, MAMA-MIA, and the WORC radiomics database. The former xnat.bmia.nl host
  redirects here.
