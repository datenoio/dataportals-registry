description: The DNB Household Survey (DHS) supplies longitudinal data to the international
  academic community, with a focus on the psychological and economic aspects of financial
  behavior. The study comprises information on work, pensions, housing, mortgages, income,
  assets, loans, health, economic and psychological concepts, and personal characteristics.
  The DHS data are collected from 2,000 households participating in the CentERpanel.
