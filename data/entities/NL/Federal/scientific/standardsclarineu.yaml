description: 'CLARIN Standards Information System provides information on the LRT (Language Resources
  and Technology) standards and data formats used across CLARIN. CLARIN (https://www.clarin.eu/content/about-clarin
  ) stands for "Common Language Resources and Technology Infrastructure" and is an ERIC (European Research
  Infrastructure Consortium), a distributed network of language-resource and language-research centres
  across Europe (and beyond). CLARIN centres often allow for data depositions for archiving or processing,
  in formats that correspond to their research profiles.

  The primary aim of the CLARIN SIS is to aggregate and visualise information on data deposition formats
  used by CLARIN centres and on standards recommended to centres and to individual users. Its secondary
  aims include providing the basis for research on data formats and aggregating data from other Research
  Infrastructures that focus on various aspects of Digital Humanities.

  Information provided by the SIS is open access and can be retrieved via API.'
