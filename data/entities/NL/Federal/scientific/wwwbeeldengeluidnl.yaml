description: Sound and Vision has one of the largest audiovisual archives in Europe. The institute
  manages over 70 percent of the Dutch audiovisual heritage. The collection contains more
  than a million hours of television, radio, music and film from the beginning in 1898 until
  today. All programs of the Dutch public broadcasters come in digitally every day. Individuals
  and institutions entrust their collection to Sound and Vision as well.
