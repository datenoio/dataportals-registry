description: The Overview of Medical Research in the Netherlands (OMON), previously the Dutch Trial Register
  (LTR), is a register in which a part of the clinical studies in The Netherlands are registered. OMON
  currently includes all research from the old National Trial Register (NTR) and Toetsingonline registries
  and more recent studies registered in the Research Portal and CTIS. The Central Committee on Research
  Involving Human Subjects (CCMO) manages the register. CCMO is accountable to the Ministry of Health,
  Welfare and Sport and is a non-profit organisation. OMON is an official data provider to the International
  Clinical Trial Registry Platform (ICTRP) of the World Health Organization (WHO).
