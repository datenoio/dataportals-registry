description: The Adjectives Project is a website that collects interesting examples
  and theorems of schemes and morphisms in algebraic geometry. The aim of this project
  is to gain a better understanding of the many adjectives regarding schemes and morphisms,
  and the relation between them. The website can be used to find examples of schemes
  and morphisms with certain adjectives. It also uses the theorems to automatically
  make deductions about the properties of the schemes and morphisms.
