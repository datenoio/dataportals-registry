description: "The AlphaFill databank contains computational structure models from\
  \ the AlphaFold Protein Structure Database and the Big Fantastic Virus Database\
  \ that are enriched with co-factor, ligand and ion coordinates that are transplanted\
  \ from experimental structure models (from PDB-REDO) by homology. The level of sequence\
  \ identity, the global and local structure similarity, and the atomic clashes between\
  \ the transplant and the protein are used as descriptors to assess transplant quality.\
  \ \nThe web interface also allows the filling of user-provided structure models."
