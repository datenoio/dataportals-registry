description: Daily Korean equity data published as static JSON and CSV with no signup
  or API key — T+1 settled closes for KOSPI, KOSDAQ and KONEX listings, DART regulatory
  filings with the time of receipt, quarterly earnings including preliminary figures,
  and median market-adjusted returns by filing type. Derived from Korean public-sector
  open data (Financial Services Commission, DART). An OpenAPI 3.1 spec and a remote
  MCP server are published alongside the files.
