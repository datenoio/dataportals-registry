description: Public MiraMon Map Server of the GRUMETS research group (Universitat
  Autònoma de Barcelona / CREAF). The root page catalogs the map browsers and WMS
  collections hosted on the server, including official ICC cartography and
  orthophotos of Catalonia, the Land Cover Map of Catalonia (MCSC), SatCat Landsat
  imagery, digital climatic atlases (Catalonia, Aragon, Iberian Peninsula,
  Andorra), THALASSA sea-surface temperature and chlorophyll maps, EUROPARC
  protected areas, and world soil cover and elevation layers.
