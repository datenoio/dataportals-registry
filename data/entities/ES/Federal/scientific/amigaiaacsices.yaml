description: The AMIGA project (Analysis of the interstellar Medium of Isolated GAlaxies)
  involves the identification and study of a statistically significant sample of the most
  isolated galaxies in the local Universe. Our goal is to quantify the properties of different
  phases of the interstellar medium in these galaxies which are likely to be least affected
  by their external environment.
