description: The Ersilia Model Hub is a unified open‑source platform offering pretrained
  AI/ML models for drug discovery in infectious and neglected diseases. You can run
  models online (no coding needed) or download them for local inference. It also enables
  contributions of models from literature or new custom models, promoting open access
  and reuse. As part of Ersilia’s mission, it empowers research in low‑resource settings
  by making AI/ML tools more accessible.
