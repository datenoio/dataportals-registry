description: Collaborative repository of protein structure images generated by citizen
  scientists and researchers as part of the Proteins Mosaic Q Project. Images are
  produced using Jmol with a standardized color scheme that highlights amino acid
  chemical types (nonpolar, polar, acidic, basic, special), enabling visual inspection
  of the spatial clustering pattern known as the Mosaic Q. The repository supports
  the gathering of independent visual evidence for a conserved structural property
  across protein structures.
