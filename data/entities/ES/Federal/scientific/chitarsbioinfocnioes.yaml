description: ChiTaRS 5.0 is the latest and most comprehensive chimeric transcript
  repository, with 111 582 annotated entries from eight species, including 23 167
  known human cancer breakpoints. The database includes unique information correlating
  chimeric breakpoints with 3D chromatin contact maps, generated from public datasets
  of chromosome conformation capture techniques (Hi–C). In this update, we have added
  curated information on druggable fusion targets matched with chimeric breakpoints,
  which are applicable to precision medicine in cancers. The introduction of a new
  section that lists chimeric RNAs in various cell-lines is another salient feature.
  Finally, using text-mining techniques, novel chimeras in Alzheimer's disease, schizophrenia,
  dyslexia and other diseases were collected in ChiTaRS. Thus, this improved version
  is an extensive catalogue of chimeras from multiple species. It extends our understanding
  of the evolution of chimeric transcripts in eukaryotes and contributes to the analysis
  of 3D genome conformational changes and the functional role of chimeras in the etiopathogenesis
  of cancers and other complex diseases.
