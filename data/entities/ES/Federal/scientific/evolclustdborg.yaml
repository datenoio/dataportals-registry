description: 'EvolClustDB is a public and browsable database of evolutionarily conserved
  gene clusters pre-computed with the EvolClust algorithm (Marcet-Houben M and Gabaldón
  T (2020)).


  This algorithm identifies groups of neighboring genes whose proximity is significantly
  conserved across evolution compared to the genome average. This prediction is performed
  pairwise in an all against all comparisons of the genomes of interest, and then
  predicted gene clusters are grouped into multi-species families based on shared
  homologous gene content. Visualization allows inspecting gene order per species
  in a phylogenetic context (species or taxonomy tree), enabling inference of potential
  evolutionary events. EvolclustDB provides gene cluster visualization through the
  PhyD3'
