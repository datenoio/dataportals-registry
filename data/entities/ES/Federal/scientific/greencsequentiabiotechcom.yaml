description: The Green Non-Coding Database (GreeNC) is a repository of lncRNAs annotated
  in plants and algae. By using the same pipeline to annotate lncRNAs and organizing
  them in a central database we aim to provide a tool for the scientific community
  that can boost the research on this class of transcripts. The GreeNC database provides
  information about sequence, genomic coordinates, coding potential and folding energy
  for all the identified lncRNAs.
