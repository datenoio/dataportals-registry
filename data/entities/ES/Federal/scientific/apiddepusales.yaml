description: APID Interactomes (Agile Protein Interactomes DataServer) provides information
  on the protein interactomes of numerous organisms, based on the integration of known
  experimentally validated protein-protein physical interactions (PPIs). The interactome
  data includes a report on quality levels and coverage over the proteomes for each
  organism included. APID integrates PPIs from primary databases of molecular interactions
  (BIND, BioGRID, DIP, HPRD, IntAct, MINT) and also from experimentally resolved 3D
  structures (PDB) where more than two distinct proteins have been identified. This
  collection references protein interactors, through a UniProt identifier.
