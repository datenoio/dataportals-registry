description: PhylomeDB is a unique knowledge base providing public access to minable
  and browsable catalogues of pre-computed, genome-wide collections of annotated sequences,
  alignments and phylogenies (i.e. phylomes) of homologous genes, as well as to their
  corresponding phylogeny-based orthology and paralogy relationships. In addition,
  PhylomeDB trees and alignments can be downloaded for further processing to detect
  and date gene duplication events, infer past events of inter-species hybridization
  and horizontal gene transfer, as well as to uncover footprints of selection, introgression,
  gene conversion, or other relevant evolutionary processes in the genes and organisms
  of interests. The v5 release also represents a significant core data expansion,
  with the database providing access to 534 phylomes, comprising over 8 million trees,
  and homology relationships for genes in over 6000 species. This makes PhylomeDB
  the largest and most comprehensive public repository of gene phylogenies
