description: The version 1.0 of the open database contains 1,151,268 brain signals of 2 seconds
  each, captured with the stimulus of seeing a digit (from 0 to 9) and thinking about it,
  over the course of almost 2 years between 2014 & 2015, from a single Test Subject David
  Vivancos. All the signals have been captured using commercial EEGs (not medical grade),
  NeuroSky MindWave, Emotiv EPOC, Interaxon Muse & Emotiv Insight, covering a total of 19
  Brain (10/20) locations.
