description: 'LW ERIC is the e-Science European Research Infrastructure for Biodiversity
  and Ecosystem Research. It provides access to a multitude of datasets, e-Services
  and tools enabling the construction and operation of Virtual Research Environments
  (VREs) through innovative technologies, which permit the accelerated capture of
  data, their analysis and knowledge-based decision-making support for biodiversity
  and ecosystem management. It can be split into 2 groups of services: BER_e-Infra
  & BER_VREs.


  BER_VREs consists of 3 cutting-edge technologies:


  LifeBlock, a Blockchain technology for transparency and immutability, guaranteeing
  FAIR-compliant data.

  Tesseract, the technical composability layer to integrate web services, enabling
  the development of VREs for users to combine and arrange services and software into
  multiple workflows.

  The Artificial Intelligence virtual laboratory (vLab), an online service allowing
  users to locate others working on similar subjects and the hubs that link them.

  Within BiCiKL, LW ERIC will support virtual access to BER_VREs.'
