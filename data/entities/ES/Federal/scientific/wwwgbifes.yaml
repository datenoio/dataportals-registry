description: 'GBIF Spain maintains this data repository, built using an installation
  of the GBIF Integrated Publishing Toolkit (IPT). Able to assign DOIs to datasets,
  it ensures the data is disseminated in standardized format in order to facilitate
  wider reuse and integration of the data, for example into GBIF.org. GBIF Spain supports
  researchers in Spain by providing them helpdesk assistance and by hosting their
  data for free in this repository. It has already been used to publish/host data
  in scientific publications, e.g. http://dx.doi.org/10.15470/qomfu6 which is the
  data this Scientific Data publication is based on: http://dx.doi.org/10.1038/sdata.2016.85'
