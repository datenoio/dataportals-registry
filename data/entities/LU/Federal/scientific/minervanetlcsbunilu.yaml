description: 'The MINERVA Net registry increases Findability and improves Accessibility
  and Interoperability of pathway and disease maps. These maps (see more at disease-maps.io)
  are systems biology resources, standardising graphical and computational representation
  of knowledge. This effort is complementary to pathway databases like Reactome or
  Wikipathways.


  MINERVA Net allows users who host their maps using the MINERVA Platform (minerva.uni.lu)
  to register their content and make it visible and accessible via a dedicated API.
  A demonstration of use of MINERVA Net for automated access and comparison of different
  maps can be found here: doi.org/10.1002/pro.4565.'
