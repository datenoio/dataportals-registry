description: Nextstrain is a project to harness the scientific and public health potential
  of pathogen genome data. It’s made up of many different parts that all work together.
  Through our website, nextstrain.org, we provide a continually-updated view of publicly
  available data with powerful analyses and visualizations showing pathogen evolution
  and epidemic spread. Through our open-source software tools, we aim to help you
  analyze and visualize your own data in the same way. Our goal is to aid epidemiological
  understanding and improve outbreak response.
