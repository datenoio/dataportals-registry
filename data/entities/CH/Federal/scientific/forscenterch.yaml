description: FORS – Swiss Centre of Expertise in the Social Sciences is a national
  research data infrastructure that supports the accessibility, preservation, and
  reuse of research data in the social sciences. As a CoreTrustSeal-certified repository,
  FORS adheres to internationally recognised standards of responsible data stewardship,
  ensuring that research data are managed, stored, and made accessible in a secure
  and sustainable manner, both now and in the future. FORS supports Swiss social science
  researchers and institutions by offering expert guidance on data management, documentation,
  and sharing. It fosters a culture of secondary data use and transparency by acquiring,
  curating, and disseminating high-quality quantitative and qualitative datasets.
  In addition to its repository services, FORS conducts large-scale surveys and methodological
  research, and collaborates with international partners to promote global access
  to trustworthy and reusable research data. FORS shares data with SWISSUbase, but
  is a distinct entity.
