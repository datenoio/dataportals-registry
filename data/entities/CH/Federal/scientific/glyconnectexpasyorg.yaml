description: GlyConnect is a knowledgebase of glycoproteins spanning protein, glycosite
  and glycan information. It is a platform designed to investigate the relationships
  between glycans, the proteins that carry them and the proteins that bind them via
  the UniLectin sister project. The underlying database stores curated data on glycosylation
  extracted from literature and preserving the contextual information relative to
  species, original cell line, tissue and disease. GlyConnect is the central resource
  of the Glyco@Expasy collection hosted at SIB - Swiss Institute of Bioinformatics.
