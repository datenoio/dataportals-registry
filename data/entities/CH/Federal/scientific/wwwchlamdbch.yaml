description: ChlamDB is a comparative genomics database covering the entire Chlamydiae
  phylum as well as their closest relatives belonging to the Planctomycetes-Verrucomicrobiae-Chlamydiae
  (PVC) superphylum. Genomes can be compared, analyzed and retrieved using accessions
  numbers of the most widely used databases including COG, KEGG ortholog, KEGG pathway,
  KEGG module, Pfam and InterPro. Candidate effectors of the Type III secretion system
  (T3SS) were identified using four in silico methods. The identification of orthologs
  among all PVC genomes allows users to perform large-scale comparative analyses and
  to identify orthologs of any protein in all genomes integrated in the database.
  Phylogenetic relationships of PVC proteins and their closest homologs in RefSeq,
  comparison of transmembrane domains and Pfam domains, conservation of gene neighborhood
  and taxonomic profiles can be visualized using dynamically generated graphs, available
  for download. As a central resource for researchers working on chlamydia, chlamydia-related
  bacteria, verrucomicrobia and planctomyces, ChlamDB facilitates the access to comprehensive
  annotations and integrates multiple tools for comparative genomic analyses.
