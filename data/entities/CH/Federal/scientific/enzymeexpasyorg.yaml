description: ENZYME is a repository of information relative to the nomenclature of
  enzymes. It is primarily based on the recommendations of the Nomenclature Committee
  of the International Union of Biochemistry and Molecular Biology (IUBMB) and it
  describes each type of characterized enzyme for which an EC (Enzyme Commission)
  number has been provided. The database is complete and up to date. It is regularly
  updated to reflect updates and additions to the nomenclature.
