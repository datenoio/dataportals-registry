description: 'LAPaL is a repository for information on long-acting (LA) technologies
  patents and licences. As of Sep 2025, it comprises 37 long-acting platform technologies
  and 50 LA formulations with many potential applications in the fields of HIV prevention
  and treatment, hepatitis B treatment, malaria treatment, type 2 diabetes and metabolic
  disorders management, pain management and contraception, among other applications.

  In 2023, and through a collaboration with the Center of Excellence of Long Acting
  Therapeutics and the Long-Acting/Extended Release Antiretroviral Research Resource
  Program, a new section was added to LAPaL, with 10 compounds with long half-life
  or that could be formulated in a manner that enables extended release. We are also
  collaborating with major initiatives and groups, such as AVAC, to synergise efforts
  and support the global community to deliver effectively in the HIV prevention space.

  Additionally, a visualisation tool (Landscape) is available for the selection of
  investigated and approved long-acting compounds in the HIV and TB fields and the
  related clinical trials. It provides information on the clinical trials pipeline
  of a set of compounds and filing data for the most advances products.'
