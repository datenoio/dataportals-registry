description: The mOTUs database is a comprehensive microbial reference constructed
  by clustering universal single-copy phylogenetic marker genes from reference genomes,
  single-cell assemblies, and metagenome-assembled genomes. It currently includes
  over 124,000 species-level taxonomic units, many of which are represented only by
  metagenomic data. This database supports taxonomic profiling of microbial communities.
