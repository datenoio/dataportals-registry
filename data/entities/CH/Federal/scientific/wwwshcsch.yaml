description: The Swiss HIV Cohort Study (SHCS), established in 1988, is a systematic longitudinal
  study enrolling HIV-infected individuals in Switzerland. It is a collaboration of all Swiss
  University Hospital infectious disease outpatient clinics, two large cantonal hospitals,
  all with affiliated laboratories, and with affiliated smaller hospitals and private physicians
  carrying for HIV patients. The Swiss Mother and Child HIV Cohort Study (MoCHiV) is integrated
  into the SHCS.
