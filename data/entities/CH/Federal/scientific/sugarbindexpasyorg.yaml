description: The SugarBind Database (SugarBindDB) was created in 2002 as part of an
  effort by the MITRE Corporation (http://www.mitre.org) to develop a pathogen-capture
  technology based on the binding of viral, bacterial and biotoxin lectins to specific
  glycans (aka, sugars, carbohydrates) displayed on glycoprotein films. The database
  content results from compiling publicly available information. In 2010, the 2008
  version of the database was migrated from MITRE Corporation to the SIB Swiss Institute
  of Bioinformatics in Geneva, Switzerland. From then, substantial changes in the
  database design and usage were undertaken and previous content was significantly
  extended.
