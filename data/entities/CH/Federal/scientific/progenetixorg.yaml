description: The Progenetix database provides an overview of copy number abnormalities
  in human cancer from Comparative Genomic Hybridization (CGH) experiments. Progenetix
  is the largest curated database for whole genome copy number profiles in cancer.
  The current dataset  contains more than 130'000 profiles from genomic CNV screening
  experiments. This data covers 700 diagnostic entities according to the NCIt Neoplasm
  Core  and the International Classification of Disease in Oncology (ICD-O 3). Additionally,
  the website attempts to lists all publications referring to cancer genome profiling
  experiments.
