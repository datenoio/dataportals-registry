description: ModelArchive is the archive for structural models which are not based
  on experimental data and complements the PDB archive for experimental structures
  and PDB-Dev for integrative structures. The ModelArchive is being developed following
  the "Workshop on Applications of Protein Models in Biomedical Research" held at
  the University of California, San Francisco in July 2008 for applications of protein
  models in biomedical research. ModelArchive is a repository for depositions of computed
  models of macromolecular structures which are not based on experimental data. The
  models can consist of any combination of proteins, RNA, DNA, or carbohydrates and
  include small molecules bound to them. Deposited models are findable, accessible,
  interoperable and reusable. Depositions are assigned a DOI to be included in manuscripts
  for which the model was generated.
