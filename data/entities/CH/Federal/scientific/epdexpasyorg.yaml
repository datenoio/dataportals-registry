description: 'The Eukaryotic Promoter Database (EPD) provides accurate transcription
  start site (TSS) information for promoters of 15 model organisms, from human to
  yeast to the malaria parasite Plasmodium falciparum. While the original database
  was a manually curated database based on published experiments, new promoter collections
  are now produced entirely automatically (under the name “EPDnew”) based on high-throughput
  transcript mapping data and high-quality gene annotation resources. Corresponding
  functional genomics data can be viewed in a genome browser, queried or analyzed
  via web interfaces, or exported in standard formats like FASTA or BED for subsequent
  analysis with other tools; of note, EPD is tightly integrated with two tool suites
  developed by our group: ChIP-Seq and Signal Search Analysis, for analysis of chromatin
  context and sequence motif respectively. EPD provides promoter viewers, designed
  with the aim of integrating and displaying information from different sources about,
  for instance, histone marks, transcription factor-binding sites or SNPs with known
  phenotypes. These viewers rely upon the UCSC genome browser as a visualization platform,
  which enables users to view data tracks from EPD jointly with tracks from UCSC or
  public track hubs.'
