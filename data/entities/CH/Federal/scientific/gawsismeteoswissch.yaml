description: 'The Global Atmosphere Watch (GAW) is a worldwide system established
  by the World Meteorological Organization, a United Nations agency, to monitor trends
  in the Earth''s atmosphere.  GAWSIS is the official catalogue of GAW stations and
  Contributing networks. It provides the GAW community and other interested people
  with an up-to-date, searchable data base of : station characteristics, measurements
  programs and data available, instrument, contact people, bibliographic references.
  GAWSIS also serves as a repository for supporting documents.'
