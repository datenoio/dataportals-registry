description: 'The Koç University Institutional Academic Repository (KUHub Research)
  is a state-of-the-art academic repository that consolidates all academic outputs—such
  as articles, conference proceedings, theses, research data, and more—produced by
  the university since its establishment in 1993.


  KUHub Research adheres to the principles of Open Access and FAIR (Findable, Accessible,
  Interoperable, Reusable), providing access to the bibliographic records, research
  data, and full texts of research outputs. Equipped with innovative features such
  as Author Profile pages and enhanced tools, KUHub Research aims to enhance the visibility
  of researchers both nationally and internationally. KUHub Research aims to preserve
  and maintain Koç University''s valuable academic legacy for future generations while
  also serving the needs of today’s researchers.


  For more information or inquiries please contact openaccess@ku.edu.tr'
