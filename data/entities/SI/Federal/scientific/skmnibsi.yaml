description: 'Stress Knowledge Map (SKM) is a knowledge graph resulting from the integration
  of dispersed published information on plant molecular responses to biotic and abiotic
  stressors. SKM enables interactive exploration of its contents, and represents a
  basis for network and dynamical modelling of responses. SKM contains two complementary
  resources: the Plant Stress Signalling model (PSS) and the Comprehensive Knowledge
  Network (CKN).'
