description: The Indian Crop Phenome Database (ICPD) is a centralized and structured repository
  that archives high-quality phenotypic data collected from Indian crop field experiments. It
  supports a wide range of crops, experimental conditions, and agronomic traits. The database
  is aligned with international metadata standards, provides persistent unique IBDC accessions,
  and promotes the FAIR principles (Findable, Accessible, Interoperable, Reusable). ICPD facilitates
  data submission, search, visualization, and download for researchers, breeders, and policy
  makers.
