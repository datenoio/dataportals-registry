description: SigMol is a specialized repository of quorom sensing signaling molecules (QSSMs)
  in prokaryotes. SigMol harbors information on QSSMs pertaining to different quorum sensing
  signaling systems namely acylated homoserine lactones (AHLs), diketopiperazines (DKPs), 4-
  hydroxy-2-alkylquinolines (HAQs), diffusible signal factors (DSFs), autoinducer-2 (AI-2) and
  others. The database includes biological as well as chemical aspects of signaling molecules.
  Biological information includes genes, preliminary bioassays, identification assays and applications,
  while chemical detail comprises of IUPAC name, SMILES and structure.
