description: ProGlycProt is a manually curated, comprehensive web repository of experimentally
  characterized glycoproteins and glycosyltransferases that are involved in protein glycosylation,
  in prokaryotes, exclusively. The website is a focused effort to provide concise and relevant
  information derived from rapidly expanding literature on prokaryotic glycoproteins, attached
  glycans, their glycosylating enzyme(s), their specificities, mutants, glycosylation linked
  genes, and genomic content thereof, in a cross-referenced, interactive manner.
