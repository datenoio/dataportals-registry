description: LokDhaba is a structured repository of Indian election results, covering both national
  (Lok Sabha) and state assembly elections from 1962 onwards. It provides cleaned and organized
  datasets, including candidate and constituency-level information, for researchers, journalists,
  and students. The data are assembled from official sources and enhanced with contextual variables,
  and users can explore and download them for analysis.
