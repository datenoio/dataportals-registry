description: PROXiMATE is a database of thermodynamic data for more than 6000 missense mutations
  in 174 heterodimeric protein-protein complexes, supplemented with interaction network data
  from STRING database, solvent accessibility, sequence, structural and functional information,
  experimental conditions and literature information. Additional features include complex structure
  visualization, search and display options, download options and a provision for users to upload
  their data.
