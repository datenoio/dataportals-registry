description: CHAVI - The Comprehensive Archive of Imaging is the first imaging biobank from
  India with an exclusive focus on Oncological Imaging. CHAVI was designed as a research collaboration
  between Tata Medical Center, Kolkata and Indian Institute of Technology, Kharagpur. Researchers,
  academicians and industry are welcome to collaborate and use the wealth of imaging data available
  in CHAVI subject to our terms and conditions of use. Please note that all users who would
  like to download the imaging data available in CHAVI will need to complete a user profile,
  user agreement form as well as provide us with a brief statement of the purpose for which
  they would like to use these images. All images have been de-identified but certain sets of
  images may require additional licensing prior to use. Collaborators who would like to contribute
  imaging data to CHAVI would be provided with a free copy of the CHAVI de-identification system
  on premises.
