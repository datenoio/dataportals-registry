description: National data warehouse (STP Dados) of Sao Tome and Principe for monitoring
  national development priorities and the Sustainable Development Goals. Coordinated
  by the Direcção de Planeamento of the Ministério do Planeamento, Finanças e Economia
  Azul, with INE and sector agencies, and UNDP and UNFPA support. Launched in 2021.
  Publishes official indicators, an indicator metadata hub, thematic dashboards (including
  MICS 6 and SDGs), and publications. Built on Drupal under the Data for All / CSF
  stack. The public site is HTTP-only.
