description: ARPHA Preprints provides a preprint (not peer-reviewed, not copyedited
  and not typeset versions of manuscripts) service for those manuscripts submitted
  to journals hosted on the ARPHA Platform that have selected this service. Preprints
  are optional, therefore authors need to confirm during submission whether they want
  their manuscript to be posted as a preprint. ARPHA Preprints is not open for direct
  submission of preprints, but only through the submission systems of the participating
  ARPHA journals. The scope and the article type of preprints are determined by those
  of the journal.
