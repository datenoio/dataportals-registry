description: "OpenBiodiv utilizes semantic publishing workflows, text mining, common\
  \ standards, ontology modelling and graph database technologies to establish a robust\
  \ infrastructure for creating and managing a Biodiversity Knowledge Graph.\n\nOpenBiodiv\
  \ encompasses data extracted from full-text article XMLs published by Pensoft and\
  \ taxonomic treatments extracted by Plazi from journals of other publishers. The\
  \ data from both sources are converted to RDF and are integrated in a graph database\
  \ which contains the OpenBiodiv-O ontology and a RDF version of the GBIF taxonomic\
  \ backbone. OpenBiodiv provides the following services: XML-to-RDF conversion workflow\
  \ and software for JATS TaxPub XML versions of journal articles, RDF conversion\
  \ of taxonomic hierarchies in CSV (example: GBIF taxonomic backbone), a triple store\
  \ of close to one billion triples of facts and metadata extracted from literature,\
  \ SPARQL endpoint, accessible for regular queries and federated queries with other\
  \ domain-specific or generic endpoints, and predefined SPARQL queries reflecting\
  \ different research questions. \nWithin BiCIKL, OpenBiodiv will be developed to\
  \ provide a LOD version of data liberated from the literature to make them interoperable\
  \   with other data infrastructures throughout the biodiversity data life cycle."
