description: EpiFactors is a web-accessible database that provides broad information
  about human proteins and complexes involved in epigenetic regulation. It also lists
  corresponding genes and their expression levels in several samples, in particular
  458 human primary cell samples, 255 different cancer cell lines and 134 human post-mortem
  tissues. Each protein and complex entry has been provided with links to external
  public resources.
