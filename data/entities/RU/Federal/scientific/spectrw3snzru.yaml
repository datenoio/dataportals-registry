description: SPECTR-W3 provides experimental, theoretical, and compiled data on the
  spectroscopic properties of atoms and ions. It contains information such as ionization
  potentials, energy levels, spectral lines, transition probabilities, oscillator
  strengths, and collisional cross-sections, all extracted from published scientific
  literature and contributions from researchers. The database is widely used in atomic
  physics, plasma spectroscopy, and related fields, and is one of the largest repositories
  of spectroscopic data for highly charged ions.
