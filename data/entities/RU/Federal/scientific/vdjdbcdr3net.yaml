description: The primary goal of VDJdb is to facilitate access to existing information
  on T-cell receptor antigen specificities, i.e. the ability to recognize certain
  epitopes in certain MHC contexts. Our mission is to both aggregate the scarce TCR
  specificity information available so far and to create a curated repository to store
  such data. In addition to routine database updates providing the most up-to-date
  information, we make our best to ensure data consistency and fight irregularities
  in TCR specificity reporting with a complex database validation scheme.
