description: Hosted cloud of the Sputnik Web platform operated by its vendor, Geoscan.
  Publishes georeferenced 3D models, terrain, orthomosaics and vector layers as numbered
  /location/{id} pages with a public examples gallery, while customer projects can
  be shared via access codes or kept private. The gallery includes models of Russian
  and international sites. Live access could not be verified in September 2026 from
  outside Russia, where DNS resolution returns a loopback address; the Internet Archive
  received a live response from the service in August 2025.
