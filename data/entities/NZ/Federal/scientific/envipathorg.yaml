description: enviPath is both a database and a prediction system, for the microbial
  biotransformation of organic environmental contaminants. The database provides the
  possibility to store and view experimentally observed biotransformation pathways,
  and supports the annotation of pathways with experimental and environmental conditions.
  The pathway prediction system provides different relative reasoning models to predict
  likely biotransformation pathways and products.
