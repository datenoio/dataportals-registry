description: The Physiome Model Repository (PMR) is the main online repository for
  the IUPS Physiome Project, providing version and access controlled repositories,
  called workspaces, for users to store their data. PMR also provides a mechanism
  to create persistent access to specific revisions of a workspace, termed exposures.
  Exposure plugins are available for specific types of data (e.g., CellML or FieldML
  documents) which enable customizable views of the data when browsing the repository
  via a web browser, or an application accessing the repository’s content via web
  services.
