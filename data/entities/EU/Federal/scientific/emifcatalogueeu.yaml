description: The EMIF catalogue contains extensive metadata on a number of European
  health data resources, such as registries, EHRs, biobanks etc., organized by a number
  of communities, such as EMIF-EHR, EMIF-AD, EPAD, ADVANCE, BigData@Heart, PIONEER
  etc. The metadata collected is the data available, the data governance procedures,
  contact details etc. The catalogue intends to comprise different vertical projects
  through the creation of communities, such as EMIF-Electronic Health Record Data
  (EMIF-EHR) and EMIF-Alzheimer’s Disease (EMIF-AD), the BigData@Heart (for cardiovascular)
  and PIONEER (for prostate cancer) projects, supporting distinct databases and users.
