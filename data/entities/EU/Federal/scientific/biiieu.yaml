description: BioImage Informatics Index (BIII) is a bioimaging resource that describes
  software tools, training materials and imaging datasets with the aim of helping
  researchers find, identify and propagate image analysis tools or workflows. BIII
  aims to help biologists find any tool or workflow available for a particular image
  analysis problem; software and algorithm developers find missing tools (or components);
  and bioimaging analysts identify and edit workflows. It also helps raise awareness
  of bioimaging analysis solutions, even when they are not associated with a publication.
