description: The ISO Data Archive contains various sets of data products that the
  user can download for independent scientific analysis. These are the pipeline products,
  that are kept on disk at the ESDC (ESAC Science Data Center), in Madrid, Spain and
  accessible through the ISO Data Archive interface. The pipeline products have been
  subjected to a scientific validation by the Instrument Teams. Additional software
  generates the so-called browse products to facilitate browsing through the archive
  and the identification of the data to download. In addition, the ISO Data Archive
  contains the so-called 'Highly Processed Data Products' (HPDP). These products include
  DATA (images, spectra etc.), which have been processed beyond the pipeline and/or
  using new, refined algorithms and therefore have been improved to any degree compared
  to the pipeline products, as well as any resulting CATALOGUES and ATLASES.
