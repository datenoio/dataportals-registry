description: ARIADNE is a research infrastructure for archaeology. Its main objective
  is to support research, learning and teaching by enabling access to digital resources
  and innovative new services. It does this by maintaining a catalogue of digital
  datasets, by promoting best practices in the management and use of digital data
  in archaeology, by offering training and advice, and by supporting the development
  of innovative new services for archaeology.
