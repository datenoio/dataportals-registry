description: Joint “Space Data Preservation Archive” (formerly indicated as “EO Cold Back-up
  Archive”) used to receive, ingest and archive EO and other ESA directorates space data for
  long-term preservation. The archive is interfaced with EO and Science missions PDGSs through
  Front End Circulators (PE-FE and Mercury) ensuring internal and external interfaces for
  data records and associated technical content exchange and circulation.
