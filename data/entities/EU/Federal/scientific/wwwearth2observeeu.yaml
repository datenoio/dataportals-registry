description: EartH2Observe brings together the findings from European FP projects DEWFORA,
  GLOWASIS, WATCH, GEOWOW and others. It will integrate available global earth observations
  (EO), in-situ datasets and models and will construct a global water resources re-analysis
  dataset of significant length (several decades). The resulting data will allow for improved
  insights on the full extent of available water and existing pressures on global water resources
  in all parts of the water cycle.
