description: ARES (Aerosol Remote Sensing) is the ACTRIS (Aerosol, Cloud and Trace
  Gases Research Infrastructure) Data Centre unit for aerosol remote sensing profiling.
  ACTRIS-ARES host and manage the ACTRIS-EARLINET database, that represents a comprehensive,
  quantitative, and statistically significant collection of data for the aerosol distribution
  on European scale. ARES provides data curation, data processing and data access
  services for ACTRIS aerosol remote sensing data coming from lidar and photometer
  observations. Additionally, ARES hosts and manage the EARLINET web site and offers
  data services and digital tools to EARLINET and beyond. Major objectives also include
  the development and validation of new synergetic remote sensing algorithms, and
  the continuous evaluation of the representation of atmospheric aerosol parameters
  in climate and weather forecast models.
