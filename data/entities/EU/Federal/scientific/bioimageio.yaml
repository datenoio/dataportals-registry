description: The BioImage Model Zoo is a community-driven, fully open resource where
  standardized pre-trained models can be shared, explored, tested, and downloaded
  for further adaptation or direct deployment in multiple end user-facing tools (e.g.,
  ilastik, deepImageJ, QuPath, StarDist, ImJoy, ZeroCostDL4Mic, CSBDeep). To enable
  everyone to contribute and consume the Zoo resources, we provide a model standard
  to enable cross-compatibility, a rich list of example models and practical use cases,
  developer tools, documentation, and the accompanying infrastructure for model upload,
  download and testing.
