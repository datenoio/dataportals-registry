description: The European Social Survey (ESS) is an academically driven cross-national
  survey that has been conducted across Europe since its establishment in 2001. Every
  two years, face-to-face interviews are conducted with newly selected, cross-sectional
  samples. The survey measures the attitudes, beliefs and behaviour patterns of diverse
  populations in more than thirty nations. The ESS data including the integrated data
  file for each round, methodological data and contextual information are available
  for download via the ESS Data Portal. Summary data and main data variables are also
  searchable from this portal.
