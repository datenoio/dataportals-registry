description: STOREDB provides infrastructure for sharing data and resources in radiation
  biology and epidemiology. It is a platform for the archiving and sharing of primary
  data and outputs of all kinds, including epidemiological and experimental data,
  from research on the effects of radiation. It also provides a directory of bioresources
  and databases containing information and materials that investigators are willing
  to share. STORE supports the creation of a radiation research commons.
