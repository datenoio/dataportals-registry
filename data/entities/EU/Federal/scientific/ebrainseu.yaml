description: EBRAINS is a platform for sharing brain research data ranging in type
  as well as spatial and temporal scale. The EBRAINS data curation service aims to
  provide maximum impact, visibility, reusability, and longevity. The user interface
  of the EBRAINS Knowledge Graph allows you to easily find data of interest. EBRAINS
  hosts a wide range of data types and models from different species. All data are
  well described and can be accessed immediately for further analysis.
