description: The European Union Observatory for Nanomaterials (EUON) provides information
  about existing nanomaterials on the EU market. Whether you are developing policies
  in the area, a consumer or representing industry or a green NGO, the information
  on the EUON offers interesting reading about the safety, innovation, research and
  uses of nanomaterials. The EUON is funded by the European Commission. It is hosted
  and maintained by the European Chemicals Agency (ECHA).
