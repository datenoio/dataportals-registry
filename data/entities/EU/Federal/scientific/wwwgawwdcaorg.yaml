description: The World Data Centre for Aerosols (WDCA) is the data repository and archive
  for microphysical, optical, and chemical properties of atmospheric aerosol of the World
  Meteorological Organisation's (WMO) Global Atmosphere Watch (GAW) programme. The goal of
  the Global Atmosphere Watch (GAW) programme is to ensure long-term measurements in order
  to detect trends in global distributions of chemical constituents in air and the reasons
  for them.
