  placed on the market in the European Union. The database contains classification
  and labelling information on notified and registered substances received from manufacturers
  and importers in the framework of the REACH and CLP Regulations ((EC) No 1907/2006
  and No 1272/2008) in their C&L notifications or registration dossiers.
