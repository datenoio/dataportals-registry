description: SHARE, the Survey of Health, Ageing and Retirement in Europe, is a research
  infrastructure for studying the effects of health, social, economic and environmental
  policies over the life-course of European citizens and beyond. SHARE-ERIC uses the
  SHARE Research Data Center to provide the SHARE data as soon as possible with the
  entire scientific community. Access to the SHARE data is provided free of charge
  on the basis of a release policy that gives quick and convenient access to all scientific
  users world-wide after individual registration.
