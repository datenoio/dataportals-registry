description: DiSSCover is a platform for curating and annotating digital specimens,
  which serve as digital surrogates for physical specimens. It provides access to
  all specimen-related data, including metadata (where, when, by whom), digital media
  and derived or related data like sequence data, chemical composition and sampled
  environment. Users, including researchers, taxonomic experts and citizen scientists,
  can annotate and enrich specimen data to support science, with future integration
  of approved annotations pending a community review process. The annotations are
  stored as FAIR Digital Objects (with a persistent identifier).
