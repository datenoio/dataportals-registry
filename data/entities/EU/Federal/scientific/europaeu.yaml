description: Eurobarometer is a series of public opinion surveys conducted regularly
  on behalf of the European Commission to measure attitudes and perceptions of people
  across the European Union. It covers a wide range of topics such as politics, social
  issues, economy, environment and public policy. The database provides access to
  survey data, reports and analysis that support research and decision‑making on European
  public opinion.
