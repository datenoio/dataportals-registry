  medicinal products commencing in the European Union from 1 May 2004 onwards. The
  EudraCT database has been established in accordance with Directive 2001/20/EC. Please
  note that as of 31 January 2023, creation and submission of new Clinical Trial Applications
  (CTAs) for trials to be conducted in the EU/EEA is no longer allowed through EudraCT
  and must be performed through the Clinical Trials Information System
