description: KCDC is a public data centre created to share the data from the KASCADE
  and KASCADE‑Grande cosmic-ray experiments. It provides open access to hundreds of
  millions of recorded “air-shower” events, allowing both scientists and non-experts
  to explore high-energy astroparticle physics data. KCDC offers not only raw and
  reconstructed data, but also metadata, documentation, and tools (including example
  analyses) to help users understand and reuse the data meaningfully.
