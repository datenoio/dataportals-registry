description: DIGGER is an essential resource for studying the mechanistic consequences
  of alternative splicing such as isoform-specific interaction and consequence of
  exon skipping. The database integrates information of domain-domain and protein-protein
  interactions with residue-level interaction evidence from co-resolved structures.
  DIGGER allows users to seamlessly switch between isoform and exon-centric views
  of the interactome and to extract sub-networks of relevant isoforms (isoforms specific
  PPIs).
