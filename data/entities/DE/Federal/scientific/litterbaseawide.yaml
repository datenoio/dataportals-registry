description: LITTERBASE summarises results from scientific studies in understandable
  global maps and figures and opens scientific knowledge on marine litter to the public.
  These publications form the basis of continuously updated maps and figures for policy
  makers, authorities, scientists, media and the general public on the global amount,
  distribution and composition of marine litter and its impacts on aquatic life. The
  portal conveys a broad, fact-based understanding of this environmental problem.
  It provides a text-based publication search interface as well as a map viewer to
  retrieve litter data in a geographical context, with further information available
  from the underlying publication.
