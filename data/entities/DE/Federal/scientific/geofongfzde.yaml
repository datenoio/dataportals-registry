description: GEOFON seeks to facilitate cooperation in seismological research and
  earthquake and tsunami risk mitigation by providing rapid open transnational access
  to seismological data and source parameters of large earthquakes, and keeping these
  data accessible in the long term. It pursues these aims by operating and maintaining
  its own global network of permanent seismic stations in cooperation with local partners,
  facilitating real-time access to data from this network and those of many partner
  networks and plate boundary observatories, and providing a FAIR archive for seismological
  data. It also serves as the permanent archive for the Geophysical Instrument Pool
  at Potsdam (GIPP). Using real-time data streams, GEOFON provides rapid automatic
  earthquake parametric information to the scientific community, tsunami warning centres
  worldwide, organizations involved in rescue operations, news media and the general
  public. GEOFON is one of the nodes of the European Integrated Data Archive (EIDA)
  and a key nodal member of the European-Mediterranean Seismological Centre (EMSC).
