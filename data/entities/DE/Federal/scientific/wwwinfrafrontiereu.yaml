description: The European Mouse Mutant Archive – EMMA is the INFRAFRONTIER’s non-profit
  repository for the collection, archiving (via cryopreservation) and distribution
  of relevant mutant mouse and rat strains essential for basic biomedical research.
  The laboratory mouse is the most important mammalian model for studying genetic
  and multi-factorial diseases in human beings. The comprehensive physical and data
  resources of EMMA support basic biomedical and preclinical research, and the available
  research tools and mouse/rat models of human disease offer the opportunity to develop
  a better understanding of molecular disease mechanisms and may provide the foundation
  for the development of diagnostic, prognostic and therapeutic strategies.
