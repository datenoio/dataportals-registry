description: MLentory is a knowledgebase that stores and rationalises ML models found
  on the web. It harmonizes that data, and makes it available and searchable on an
  FDO (FAIR Digital Object) registry. The system is intended to extract ML (Machine
  Learning) model information from different platforms, normalize that data in a common
  format, store it, and share it in a FDO registry to facilitate Information Retrieval
  and comparison/recommendation systems.
