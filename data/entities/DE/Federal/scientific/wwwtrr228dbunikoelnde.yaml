description: The TRR228 Database (TRR228DB) is a research data repository created
  for the DFG-funded Collaborative Research Centre Transregio 228. It archives and
  provides access to datasets produced by project researchers, including measured
  and modeled data, geodata, reports, publications, and images. The database covers
  interdisciplinary topics such as agriculture, ecology, economy, infrastructure,
