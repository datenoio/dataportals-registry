description: MORPHYLL is a database for acquisition of ecophysiologically-relevant
  morphometric data of fossil leaves, mainly from the Paleogene geologic period. It
  contains digitized fossil leaves from various collections and supports searches
  for specific taxa, locations, and morphometry. Queries and images are publicly available,
  while full access to the complete set of data including morphometry and high resolution
  images is available upon request.
