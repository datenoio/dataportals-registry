description: The main goal of the project is to build models of all polyhedra in a
  collective endeavor (citizen art) and, to date, all polyhedra with up to nine vertices
  have been made available for adoption. Users can adopt an individual polyhedron,
  give it a name and then help it take shape by building a model; this “Adopt a Polyhedron”
  project allows users to actively participate in mathematics with the building of
  geometric models as the focus.
