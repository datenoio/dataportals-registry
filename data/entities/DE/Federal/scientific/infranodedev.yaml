description: InfraNode is a free, keyless REST API (and MCP server) that normalises
  open public data for German cities behind one consistent interface. It aggregates
  official open sources (DWD weather, UBA air quality, Bundesnetzagentur, SMARD electricity
  market, BORIS land values, Destatis regional statistics, DELFI/GTFS public transit,
  BKG and others) into a uniform JSON envelope per city, with per-field source, license
  and required attribution. Open source (Apache-2.0), no API key or signup. A reproducible
  open-data snapshot is archived on Zenodo (DOI 10.5281/zenodo.20752355).
