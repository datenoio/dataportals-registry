description: HALO is a Gulfstream G-550 aircraft specifically equipped with numerous
  in situ and remote sensing instruments. It allows to study important scientific
  questions with regard to atmospheric chemistry, atmospheric physics, climate research,
  satellite validations, and Earth system observations. It enables the university-based
  atmospheric and Earth system research community in Germany in partnership with colleagues
  from the national research centers to perform state-of-the-art science utilizing
  HALO as a unique infrastructure.
