description: 'The AIMe registry is a community-driven reporting platform for AI in
  biomedicine that the FeatureCloud team developed. It aims to enhance the accessibility,
  reproducibility, and usability of biomedical AI models and allows future revisions
  by the scientific community. AIMe stands for “artificial intelligence in biomedical
  research” and consists of a user-friendly web service, which guides authors of new
  AIs through the AIMe standard, a generic minimal information standard that allows
  reporting of any biomedical AI system. As such, the paper serves one of FeatureCloud’s
  main objectives, namely increasing transparency and thereby maximizing societal
  acceptance and patient trust. The AIMe registry for artificial intelligence in biomedical
  research consists of a user-friendly web service that guides authors of new AIs
  through the AIMe standard, a generic minimal information standard that allows reporting
  of any biomedical AI system. Once the AIMe standard has been reported, a database
  entry and an HTML report along with a unique AIMe identifier are created. The latter
  serves to keep the entry openly accessible and can be disseminated by the authors,
  for example by inclusion in a manuscript. The AIMe2021 standard is divided into
  five sections: Metadata, Purpose, Data, Method and Reproducibility providing YAML
  specification for download.'
