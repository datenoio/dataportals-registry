description: LIAS is a global information system for Lichenized and Non-Lichenized
  Ascomycetes. It includes several interoperable data repositories. In recent years,
  the two core components ‘LIAS names’ and ‘LIAS light’ have been enlarged. LIAS light
  stores phenotypic trait data. The component ‘LIAS names’ is a platform for managing
  taxonomic names and classifications. 'LIAS names' and ‘LIAS light’ also deliver
  content data to the Catalogue of Life, acting as the Global Species Database (GSD)
  for lichens. LIAS gtm is a database for visualising the geographic distribution
  of lichen traits. LIAS is powered by the Diversity Workbench database framework
  with several interfaces for data management and publication.
