description: PhageDive is a specific database for bacteriophages and archaeal viruses.
  Built on the BacDive model, it gathers and links all the experimental data and metadata
  of the viruses present in different culture collections. Its implementation aims
  to facilitate access to all viruses information for the scientific community. The
  database covers taxonomy, host strain, phage morphology, life cycle, origin and
  genomic data.
