description: The ROCEEH Out of Africa Database (ROAD) is web-based research database
  that integrates archaeological, paleoanthropological, paleontological, and environmental
  data from prehistoric sites across Africa and Eurasia dating from about 3 million
  to 20 000 years ago. It links geographic and chronological information with cultural
  and fossil records to support studies of early human evolution and dispersal. ROAD
  pulls data from thousands of scientific publications and lets users search, map,
  and analyze this multidisciplinary information.
