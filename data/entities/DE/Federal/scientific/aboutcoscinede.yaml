description: Coscine is a platform for research data management (RDM) that is being
  developed at RWTH Aachen University. Researchers from all fields can create projects
  there, store data including the associated metadata, share it with other project
  members and archive the research data for ten years after the project in accordance
  with good scientific practice. The metadata is stored using so-called application
  profiles. Coscine enables compliance with the FAIR principles by bundling research
  data, metadata, interfaces and PIDs in a linked data set according to the "FAIR
  Digital Objects" model. Coscine's functions can be accessed both via the web interface
  and via APIs, enabling automated processes.
