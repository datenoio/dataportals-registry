description: 'ISGCI is an encyclopaedia of graphclasses with an accompanying java
  application that aids research about particular graph classes. Researchers can:
  check the relation between graph classes and get a witness for the result; draw
  clear inclusion diagrams; colour these diagrams according to the complexity of selected
  problems; find the P/NP boundary for a problem; save diagrams as Postscript, GraphML
  or SVG files; and find references on classes, inclusions and algorithms.'
