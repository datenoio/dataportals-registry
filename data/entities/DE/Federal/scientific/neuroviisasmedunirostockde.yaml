description: Database of all known neuronal connections of the rat brainstem. Connections
  are directed, weighted and bilateral. It is built using the neuroVIISAS platform.
  The Brainstem Connectome is a highly structured neuroontology composed of datasets
  from over 1,000 peer-reviewed original research publications. It contains more than
  35,000 specific experimental observations and over 18,000 neuronal connections.
