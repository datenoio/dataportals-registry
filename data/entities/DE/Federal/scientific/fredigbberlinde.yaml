description: The Freshwater Research and Environmental Database is the central data
  repository for IGB Leibniz-Institute of Freshwater Ecology and Inland Fisheries.
  It is were we store and share environmental data from observations of lakes, rivers,
  peatlands and other freshwater habitats. In FRED you can find continuous data collected
  over several decades for our long-term research programme at the lakes Müggelsee,
  Stechlinsee, Arendsee and the river Spree, as well as environmental data derived
  from short-term projects in aquatic ecosystems.
