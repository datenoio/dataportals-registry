description: BiNHum is a joint project of five natural history museums and research
  collections representing the Humboldt-Ring. BiNHum is a data portal for the consolidation
  of collection data from the Humboldt-Ring institutes and their associate. It provides
  querying of the biodiversity data, data mining, data standardisation, and digitized
  data. Collection objects from herbaria, zoological and palaeontological collections
  of the participating institutions and partners can be searched.
