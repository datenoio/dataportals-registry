description: The tables in Regular Graphs contain numbers of simple connected k-regular
  graphs on n vertices and girth at least g with given parameters n,k,g. If a number
  in the table is a link, then further information about the graphs (such as adjacency
  lists or shortcode files) is available. Most of the numbers were obtained by the
  computer program GENREG which not only computes the number of regular graphs for
  the chosen parameters but also constructs the desired graphs.
