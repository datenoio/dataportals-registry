description: The FactGrid database is a collaborative, multilingual knowledge platform
  that hosts structured research data from a wide range of scholarly projects. It
  primarily contains biographical, historical, genealogical, and prosopographical
  data, as well as information on events, places, institutions, and relationships
  between individuals. The platform is widely used in the humanities and social sciences,
  particularly in history, archival studies, and digital humanities research.
