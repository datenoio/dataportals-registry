description: 'DSMZCellDive was created to enable decision-making on the best cell
  model for research questions by provision of curated data. Originally set up for
  visualising gene expression data of DSMZ cell lines, DSMZCellDive now harbours Short
  tandem repeat (STR) for cell line authentication, Cyctochrome c oxidase (COI), and
  Human leukocyte antigen (HLA) data. With this dataset, customers are able to retrieve
  the optimal model cell line for their needs and gain information on these.

  Currently, gene expression profiles can be obtained for 157 DSMZ human cell lines,
  4629 short tandem repeat (STR) reference data sets , 960 short DSMZ cell line descriptions,
  and 164 human leukocyte antigen (HLA) data. Tumour types include leukemia and lymphoma
  tumour subtypes, breast cancer, retinoblastoma, and neuroblastoma tumour entities.
  STR profiles can be mapped, top10 expressing cell lines for genes are displayed,
  and enzyme connections to the BRENDA database are given.'
