description: ICSD (Inorganic Crystal Structure Database) was founded in 1977 on the
  initiative of Prof. Bergerhoff (University of Bonn). Since 1985, FIZ Karlsruhe has
  been involved in the production of the database with various partners; since 2017,
  FIZ Karlsruhe has been solely responsible for the product. ICSD is the world’s largest
  database for fully determined inorganic crystal structures and contains the crystallographic
  data of published crystalline inorganic structures, including atom coordinates,
  dating back to 1913. Organometallic and theoretical structures have been added within
  the past years.
