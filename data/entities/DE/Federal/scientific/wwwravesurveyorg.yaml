description: RAVE is a large spectroscopic survey that collected data on the motion,
  physical properties, and chemical composition of stars in the Milky Way. Combined
  with astrometric data from missions like Gaia, it helps scientists understand the
  structure and evolution of our Galaxy. RAVE was one of the first major surveys in
  Galactic Archaeology, followed by others like SEGUE, LAMOST, and APOGEE. The RAVE
  collaboration has published 6 data releases. The 6th and final data release (DR6
  or FDR) is based on 518387 observations of 451783 unique stars. Rave observations
  were taken between 12 April 2003 and 4 April 2013.
