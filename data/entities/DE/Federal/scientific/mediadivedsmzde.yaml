description: Cultivation media are a substantial part of many fields of life sciences
  and are key for successful cultivation and therefore achieving a deeper understanding
  of microorganisms. Despite their fundamental importance, cultivation media as data
  resource are mostly neglected, especially in terms of standardization and availability.
  We present MediaDive (https://mediadive.dsmz.de), a comprehensive and expert-curated
  cultivation media database, which comprises recipes, instructions and molecular
  compositions of almost 3,200 standardized cultivation media for more than 40,000
  microbial strains from all domains of life. MediaDive is designed to enable broad
  range applications from every-day-use in research and diagnostic laboratories to
  knowledge-driven support of new media design and artificial intelligence-driven
  data mining. A number of intuitive search and comparison tools is fostering these
  approaches. External user engagement is covered by a dedicated media builder tool.
