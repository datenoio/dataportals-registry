description: The COVID-19 NMR Repository aims to make as many viral RNA and proteins
  as possible available for NMR work and screen them using a fragment library. Originally,
  the goal of the project was to determine RNA and protein structures of SARS-CoV-2
  and to investigate the drugability of those structures by small molecules. As the
  initial work has been completed, they continue to investigate viral research via
  NMR and beyond.
