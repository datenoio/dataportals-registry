description: CORUM is a database that provides a manually curated repository of experimentally
  characterized protein complexes from mammalian organisms, mainly human (64%), mouse
  (16%) and rat (12%). Each protein complex is described by a protein complex name,
  subunit composition, function as well as the literature reference that characterizes
  the respective protein complex.
