description: PlanMine is an integrated web resource of data & tools to mine Planarian
  biology. Transcriptomes and the genome of the planarian model species S. mediterranea
  are available, as well as transcriptomes of “wild” planarian species and a broad
  range of parasitic and non-parasitic flatworms for comparative analysis. PlanMine
  can be searched by sequence (using BLAST) or by annotation. Mineable information
  includes BLAST homologies, GO-terms, orthologues in other planarian species, gene
  expression information and taxonomic information on the represented species.
