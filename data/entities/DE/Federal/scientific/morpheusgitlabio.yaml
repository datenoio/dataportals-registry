description: The public MorpheusML model repository collects, curates, documents and
  tests computational models for multi-scale and multicellular biological systems.
  Model must be encoded in the model description language MorpheusML. Subsections
  of the repository distinguish published models from contributed non-published and
  example models. New models are simulated in Morpheus or Artistoo independently from
  the authors and results are compared to published results. Successful reproduction
  is documented on the model's webpage. Models in this repository are included into
  the CI and test pipelines for each release of the model simulator Morpheus to check
  and guarantee reproducibility of results across future simulator updates. The model’s
  webpage provides a History-link to all past model versions and edits that are automatically
  tracked via Git. Each model is registered with a unique and persistent ID of the
  format M..... The model description page (incl. the biological context and key results
  of that model), the model’s XML file, the associated paper, and all further files
  (often simulation result videos) connected with that model can be retrieved via
  a persistent URL of the format https://identifiers.org/morpheus/M.....
