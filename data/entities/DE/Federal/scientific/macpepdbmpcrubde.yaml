description: We presented MaCPepDB, which provides a fast and reliable way to get
  mass-based information about tryptic peptides of the complete UniProtKB. It can
  provide help for designing targeted proteomic experiments or tracking down the protein
  origin of peptides. The web interface of the database allows easy access, and the
  REST API facilitates the inclusion of the provided information into larger proteomics
  workflows.
