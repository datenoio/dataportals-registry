description: This is a repository of the Max Planck Institute for Mathematics in the
  Sciences in Leipzig, dedicated to mathematical research data. In particular, the
  purpose of this repository is to collect scripts and code, to explain applications
  of mathematical software, to showcase additional examples to paper publications,
  and more generally to host supplementary material developed for research projects
  or discussed in workshops. MathRepo is in the process of restructuring so that its
  content meets the FAIR Principles for sustainable research. In the future, MathRepo
  will follow the guidelines developed by the Mathematical Research Data Initiative
  MaRDI.
