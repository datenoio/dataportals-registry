description: The World Radiation Monitoring Center (WRMC) is the central archive of
  the Baseline Surface Radiation Network (BSRN). The BSRN is aimed detecting important
  changes in the earth's radiation field at the earth's surface which may be related
  to climate changes. All radiation measurements are stored together with their collocated
  surface and upper-air meteorological observations and station metadata in an integrated
  database. In 2004 the BSRN was designated as the global baseline network for surface
  radiation for the Global Climate Observing System (GCOS). The BSRN stations also
  contribute to the Global Atmospheric Watch (GAW). Since 2011 the BSRN and the Network
  for the Detection of Atmospheric Composition Change (NDACC) have reached a formal
  agreement to become cooperative networks.
