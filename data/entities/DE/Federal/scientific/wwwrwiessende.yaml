description: The Research Data Center Ruhr (FDZ RUHR) is a research data infrastructure
  operated by the RWI – Leibniz Institute for Economic Research. It specializes in
  providing georeferenced small-scale regional data as well as anonymized individual
  and household datasets for scientific research. The center focuses on topics such
  as regional inequality, real estate markets, and environmental effects, mainly within
  regional and applied economics.
