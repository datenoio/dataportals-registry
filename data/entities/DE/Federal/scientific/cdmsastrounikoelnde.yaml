description: The Cologne Database for Molecular Spectroscopy (CDMS) is an online scientific
  catalog of spectral line data for atoms and molecules of astrophysical and atmospheric
  interest. It provides transition frequencies, intensities, energy levels, and related
  parameters used in radio and sub-millimeter astronomy and molecular spectroscopy.
  The classic catalog version documents these spectral lines to support identification
  and analysis of molecular signals in space.
