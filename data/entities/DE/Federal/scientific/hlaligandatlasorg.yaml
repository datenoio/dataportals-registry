description: The HLA Ligand Atlas is a comprehensive collection of tissue and HLA
  allele specific HLA ligands that are naturally presented. The data was generated
  in standardized mass spectrometry experiments and analyzed using a well defined
  computational analysis workflow. We provide an easy to use query interface to quickly
  identify peptides of interest in the database, e.g. using sequence patterns or by
  specifying a tissue or HLA allele of interest. Query results can be exported and
  the complete HLA Ligand Atlas can be downloaded.
