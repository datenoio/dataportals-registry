description: The MaRDI Portal is the central entry point for MaRDI’s research data
  infrastructure, which includes services, data, and a highly curated connected mathematical
  knowledge graph. It is driven by the fact that while there are available many sources
  research data and related services in mathematics they are hosted as stand-alone
  solutions and often do not allow for a FAIR use. This hinders the development of
  services for automatic or systematic data retrieval in a standardized way in many
  areas of the mathematical science. With the MaRDI Portal, we provide metadata of
  the federated data sources according to the FAIR principles and access to services
  developed within MaRDI for specific data types. Furthermore, through connections
  of the different items (data, publications, software, algorithms, models and many
  more) the MaRDI Portal provides access to a very large knowledge graph dedicated
  to mathematics. Based on the knowledge graph many new services can be built to provide
  specific solutions for the mathematical community and beyond.
