description: The METASPACE platform hosts an engine for metabolite annotation of imaging
  mass spectrometry data as well as a spatial metabolite knowledgebase of the metabolites
  from thousands of public datasets provided by the community. The METASPACE engine
  open online platform provides tools for integrated into validated workflows for
  clinical use exploratory analysis. Submit or interact with high-resolution imaging
  mass spectrometry (HR imaging MS) spatial data, explore knowledgeable annotations
  from all datasets using the interactive interface, collaborate with project team
  members on dataset annotation, or export the metabolite annotations to mine hundreds
  of thousands of metabolites found in community-provided datasets.
