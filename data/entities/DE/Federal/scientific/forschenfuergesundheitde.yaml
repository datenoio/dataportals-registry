description: The FDPG is the German Portal for Medical Research Data, a central online
  platform that allows researchers to request and access pseudonymized patient data
  and biosamples from routine clinical care at German university hospitals for scientific
  studies. It was developed as part of the Medical Informatics Initiative (MII) and
  harmonizes data from multiple university medical sites under common standards to
  support research while complying with data protection regulations.
