description: The Geochemistry of Rocks of the Oceans and Continents (GEOROC) database
  is a collection of published analyses of igneous rocks and mantle xenoliths. It
  contains major and trace element concentrations, radiogenic and nonradiogenic isotope
  ratios as well as analytical ages for whole rocks, glasses, minerals and inclusions.
  Samples come from 11 different geological settings. Metadata include, among others,
  geographic location with latitude and longitude, rock class and rock type, alteration
  grade, analytical method, laboratory, reference materials and references.
