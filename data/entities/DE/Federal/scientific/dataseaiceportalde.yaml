description: The data and image archive of meereisportal.de is an open data portal
  providing sea ice data for the Arctic and Antarctic. In addition to graphic representations
  of the underlying verified data and derived data products, it is also possible to
  download the data for further processing. It is intended as a service both for scientific
  groups performing research on sea ice and as a platform for communicating the results
  of their research. Information is available in German and English. The URL seaiceportal.de
  is used to designate those areas of the website, such as this data portal, which
  are available in English.
