description: The Nothobranchius furzeri Information Network (NFIN) is a resource dedicated
  to the short-lived killifish Nothobranchius furzeri, a powerful vertebrate model
  for research on development and aging. The database hosts several types of data,
  including a high-quality draft genome of the inbred GRZ strain, genome-wide variation
  data from different natural and laboratory populations, and a transcriptome browser
  with annotated protein-coding genes. These datasets support studies on genetic diversity,
  lifespan, molecular mechanisms of aging, and comparative analyses with other fish
  models.
