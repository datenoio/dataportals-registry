description: DEPOD - the human DEPhOsphorylation Database is a manually curated database
  collecting human active and inactive phosphatases, their experimentally verified
  protein and non-protein substrates, and dephosphorylation site information, and
  pathways in which they are involved. It also provides links to popular kinase databases
  and protein-protein interaction databases for these phosphatases and substrates.
