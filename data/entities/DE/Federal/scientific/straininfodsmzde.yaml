description: In microbiology, the communication and comparison of research findings
  and data is often complicated by the existence of a number of different designation
  and identifiers for the same strain. StrainInfo is a service developed to provide
  a resolution of microbial strain identifiers by storing culture collection numbers,
  their relations, and culture-associated data.
