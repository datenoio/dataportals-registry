description: RADAR4Memory is a low-threshold and easy-to-use service for the sustainable
  publication and preservation of research data in the historical sciences and other
  disciplines working with historical data. It offers free publication for any data
  type and format according to the FAIR principles, regardless of the researcher's
  institutional affiliation. Thanks to persistent identifiers (DOI) and a guaranteed
  retention period of at least 25 years, the research data will remain available,
  citable and findable in the long term. The service is currently aimed exclusively
  at researchers at publicly funded research institutions and universities as well
  as non-commercial academies, galleries, libraries, archives and museums in Germany.
  No contract is required to publish the data and no fees are charged. The upload,
  organization, annotation and curation of the research data as well as the peer review
  process (as an optional step) and finally the publication are the responsibility
  of the researchers.
