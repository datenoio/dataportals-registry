description: The International Centre for Global Earth Models (ICGEM) is a service
  that collects, archives, and makes available global gravity field models of the
  Earth  to the public in a standardized format. These models include both static
  and temporal solutions and can be downloaded, visualized interactively, or used
  within web-based calculation tools to derive gravity field functionals like geoid
  heights and gravity anomalies.
