description: The Modular Observation Solutions for Earth Systems (MOSES) Data Discovery
  Portal was created to facilitate access to data and information obtained in MOSES
  campaigns. MOSES is an Earth and Environment observing system comprising highly
  flexible and mobile observation modules specifically designed to investigate the
  interactions of short-term events and long-term trends across Earth compartments.
  Heat waves, hydrological extremes, ocean eddies and permafrost thaw are the main
  focuses of this resource.
