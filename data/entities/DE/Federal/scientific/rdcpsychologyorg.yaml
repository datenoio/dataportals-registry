description: 'The Research Data Center (RDC) at ZPID (formerly PsychData) provides
  a method for publishing and reusing psychological research data from the diverse
  fields of psychological research. The service offer of the RDC comprises the following
  three pillars: providing support for the documentation of research data, assistance
  in archiving research data (e.g., in PsychArchives), and provision of datasets and
  analysis structures (e.g., PsychOpen CAMA) for reuse.'
