description: The site contains a database of number fields up to degree 19 which are
  represented by a minimal polynomial of a primitive element. The database contains
  polynomials for all transitive groups up to that degree, even for most of the possible
  combinations of signature and Galois group. Up to degree 7, the fields with minimal
  (absolute) discriminant with given Galois group and signature have been included.
  Furthermore, the minimal fields in degree 8 have been included for all imprimitive
  groups and some of the primitive cases.
