description: SMART (Simple Modular Architecture Research Tool) is a web resource providing
  simple identification and extensive annotation of protein domains and the exploration
  of protein domain architectures. It allows the identification and annotation of
  genetically mobile domains and the analysis of domain architectures. More than 500
  domain families found in signalling, extracellular and chromatin-associated proteins
  are detectable. These domains are extensively annotated with respect to phyletic
  distributions, functional class, tertiary structures and functionally important
  residues. Each domain found in a non-redundant protein database as well as search
  parameters and taxonomic information are stored in a relational database system.
  User interfaces to this database allow searches for proteins containing specific
  combinations of domains in defined taxa.
