description: The human pluripotent stem cell registry (hPSCreg) is a public registry
  and data portal for human embryonic and induced pluripotent stem cell lines (hESC
  and hiPSC). The Registry provides comprehensive and standardized biological and
  legal information as well as tools to search and compare information from multiple
  hPSC sources and hence addresses a translational research need. To facilitate unambiguous
  identification over different resources, hPSCreg automatically creates a unique
  standardized name for each cell line registered. In addition to biological information,
  hPSCreg stores extensive data about ethical standards regarding cell sourcing and
  conditions for application and privacy protection. hPSCreg is the first global registry
  that holds both, manually validated scientific and ethical information on hPSC lines,
  and provides access by means of a user-friendly, mobile-ready web application.
