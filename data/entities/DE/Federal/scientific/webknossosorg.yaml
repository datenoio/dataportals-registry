description: webKnossos is an open-source data sharing and annotation platform for
  multi-terabyte 2D and 3D electron-microscopy (EM) and light-microscopy (LM) datasets.
  Core features are fast 3D data streaming, link-sharing to specific locations in
  the data, and collaborative annotation features (volume labelling, line-segment
  annotation and more). Users may browse and view publicly-available data, while registered
  users can search, download and analyze database content.
