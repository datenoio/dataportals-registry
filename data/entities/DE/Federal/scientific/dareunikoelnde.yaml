description: The Digital Averroes Research Environment (DARE) collects and edits the
  works of the Andalusian Philosopher Averroes or Abū l-Walīd Muḥammad Ibn Aḥmad Ibn
  Rušd. DARE makes accessible online digital editions of Averroes’s works, and images
  of all textual witnesses, including manuscripts, incunabula, and early prints. Averroes’s
  writings and the scholarly literature are documented in a bibliographical database.
