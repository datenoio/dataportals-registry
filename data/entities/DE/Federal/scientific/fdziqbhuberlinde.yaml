description: "For more than 20 years, Germany has been building up an extensive collection\
  \ of data within the framework of international and national school performance\
  \ studies (e.g. PISA, IGLU, IQB Trends in Student Achievement), which enables systematic\
  \ analyses of framework conditions, processes and outcomes in the education system.\n\
  \nThis potential can only be fully exploited if researchers from different disciplines\
  \ have access to the data.\n\nTo make this possible, the Federal Ministry of Education\
  \ and Research (BMBF) established the Research Data Centre (FDZ at the Institute\
  \ for Educational Quality Improvement (IQB) in 2007. Since 2011, the FDZ at the\
  \ IQB has been part of the Centre for International Student Assessment (ZIB).\n\n\
  The FDZ at IQB is intensively involved in the further development of the research\
  \ data infrastructure in the education sector. It fulfils two core tasks:\n\n  \
  \  It makes the data sets of national and international school performance studies\
  \ in Germany available to the scientific community for re- and secondary analyses.\n\
  \    It is active in the promotion of young researchers by offering advice for young\
  \ researchers and events for the methodological training of young researchers (e.g.\
  \ twice-yearly academies on methods of empirical educational research)."
