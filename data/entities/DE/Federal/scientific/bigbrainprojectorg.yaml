description: The BigBrain database contains an ultra-high-resolution 3D reconstruction
  of a human post-mortem brain, created by slicing, staining, and scanning it at microscopic
  detail. It offers precise anatomical information, such as local morphology, cell
  densities, and connectivity, beyond what current standard neuroimaging can capture,
  especially in highly folded cortical and subcortical regions.
