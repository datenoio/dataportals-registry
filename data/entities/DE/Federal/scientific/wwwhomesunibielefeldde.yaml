description: The Multiply Perfect Numbers Page is an archive of more than five thousand
  multiply perfect numbers. The archive gives the logarithm of the logarithm, the
  number of distinct prime factors, the number of consecutive small factors, the exponents
  of the primes, etc. (in short, enough information to construct the base representation
  of a desired multiply perfect number) plus historical information such as the name
  of the discoverer and the date of discovery.
