description: The MIRRI Information System (MIRRI-IS) provides access to high-quality
  microbial resources made available by its 50+ partner biorepositories, covering
  all types of microorganisms, such as bacteria (and their cognate bacteriophages),
  archaea, fungi (including yeasts), eukaryotic viruses, micro-algae and other microbiological
  material such as cell lines, natural or constructs carrying plasmids, DNA libraries,
  and genomic DNA. It also provide users with all relevant information and associated
  contextual data (metadata) about the microbial resources, as available – e.g. taxonomy,
  ecology, pathogenicity, morphology, physiology, chemical characterization, DNA barcoding
  or genomics.
