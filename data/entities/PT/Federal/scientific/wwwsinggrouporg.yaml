description: The database aims to bridge the gap between agent repositories and studies documenting
  the effect of antimicrobial combination therapies. Most notably, our primary aim is to compile
  data on the combination of antimicrobial agents, namely natural products such as AMP. To
  meet this purpose, we have developed a data curation workflow that combines text mining,
  manual expert curation and graph analysis and supports the reconstruction of AMP-Drug combinations.
