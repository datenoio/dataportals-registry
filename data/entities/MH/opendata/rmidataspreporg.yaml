description: National environment data portal for the Republic of the Marshall Islands
  in the SPREP Inform network. Publishes public environmental datasets for download,
  monitoring, and decision-making, including biodiversity, coastal and marine, climate,
  land, inland waters, and GIS files. Not a cross-government open data portal. The
  hostname returns Cloudflare HTTP 526 (invalid origin SSL) as of August 2026 and
  does not currently serve DKAN or DCAT endpoints.
