description: CareJobs.Now publishes free open data on US healthcare job postings and
  posted pay, read daily from the career sites of about 270 hospitals, health systems
  and care companies. JSON and CSV files list open jobs by kind of job and employer
  and posted hourly pay by kind of job, with no key required. An archived release
  is deposited on Zenodo under CC BY 4.0.
