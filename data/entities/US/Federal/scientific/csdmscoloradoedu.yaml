description: CSDMS is a virtual home for a vibrant and growing community of about 1,000 international
  modeling experts and students who study the dynamic interactions of lithosphere, hydrosphere,
  cryosphere, and atmosphere at Earth’s surface. Participating in cross-disciplinary groups,
  members develop integrated software modules that predict the movement of water, sediment,
  and nutrients across landscapes and into the ocean.
