description: PPMI is an observational clinical study to verify progression markers
  in Parkinson’s disease. The study is designed to establish a comprehensive set of
  clinical, imaging and biosample data that will be used to define biomarkers of PD
  progression. Once these biomarkers are defined, they can be used in therapeutic
  studies. The clinical, imaging and biologic data are accessible to researchers in
  real time through the website. If used as a public resource without login, this
  resource functions as a dashboard.
