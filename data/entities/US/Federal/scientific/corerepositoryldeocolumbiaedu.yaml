description: The Lamont-Doherty Core Repository (LDCR) contains one of the world’s most unique
  and important collection of scientific samples from the deep sea. Sediment cores from every
  major ocean and sea are archived at the Core Repository. The collection contains approximately
  72,000 meters of core composed of 9,700 piston cores; 7,000 trigger weight cores; and 2,000
  other cores such as box, kasten, and large diameter gravity cores.
