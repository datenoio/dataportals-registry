description: MoonProt Database is a manually curated, searchable, internet-based resource
  with information about the over 200 proteins that have been experimentally verified
  to be moonlighting proteins. Moonlighting proteins comprise a class of multifunctional
  proteins in which a single polypeptide chain performs multiple biochemical functions
  that are not due to gene fusions, multiple RNA splice variants or pleiotropic effects.
  The availability of this organized information provides a more complete picture
  of what is currently known about moonlighting proteins. The database will also aid
  researchers in other fields, including determining the functions of genes identified
  in genome sequencing projects, interpreting data from proteomics projects and annotating
  protein sequence and structural databases. In addition, information about the structures
  and functions of moonlighting proteins can be helpful in understanding how novel
  protein functional sites evolved on an ancient protein scaffold, which can also
  help in the design of proteins with novel functions.
