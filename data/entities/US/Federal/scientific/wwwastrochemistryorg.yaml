description: Collaboration between the astronomers, laboratory chemists and theoretical
  chemists at the facilities of NASA's Ames Research Center resulted in the collection
  of PAH spectra known as The NASA Ames PAH IR Spectroscopic Database. Collaboration
  with different institutes, across several countries, helped mature the database
  and allowed for the construction of the web-portal with its data and tools. Initially
  intended for astronomers to explain the astronomical unidentified infrared bands
  and to investigate the "PAH hypothesis", now the spectral data and developed paradigms
  prove also valuable to, e.g., chemists, environmentalists, pharmacologists and nano-technologists.
