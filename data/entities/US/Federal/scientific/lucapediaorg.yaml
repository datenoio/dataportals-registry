description: LUCApedia was established to aggregate and unify the results of studies
  aimed at describing early life through a variety of bioinformatics approaches and
  pair them with a number of enzymological characteristics predicted in previous studies
  to reflect catalysts important in the early evolution of life. Users may query the
  webserver for individual proteins to rapidly identify evidence of deep ancestry.
  Advanced users may download the database as a series of flat files and use it to
  discover trends in early enzymatic and metabolic evolution and to test hypotheses
  related to early life. Datasets corresponding to studies predicting characteristics
  of the Last Universal Common Ancestor (LUCA) have been mapped against a number of
  reference databases.
