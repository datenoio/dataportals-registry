description: The Chandra Data Archive (CDA) plays a central role in the operation
  of the Chandra X-ray Center (CXC) by providing support to the astronomical community
  in accessing Chandra data. The CDA offers access to digital archives through powerful
  query engines, including VO-compliant interfaces and also serves as a permanent
  storage repository of contributed data products by authors who have processed images
  or other pertinent and valuable datasets that are essential to their publications.
