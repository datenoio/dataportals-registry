description: The Open Data Commons for Traumatic Brain Injury (DC-TBI) was created
  by the TBI community to mitigate dark data in TBI research. The ODC-TBI also aims
  to increase transparency with individual-level data, enhance collaboration, facilitate
  advanced analytics, and conform to increasing mandates by funders and publishers
  to make data accessible. Members of the ODC-TBI have access to a private digital
  lab space managed by the PI or multi-PIs for dataset storage and sharing. The PIs
  can share their labs’ datasets with the registered members of the ODC-TBI community
  and make their datasets public and citable. The ODC-TBI implements stewardship principles
  that scientific data be made FAIR (Findable, Accessible, Interoperable and Reusable)
  and has been widely adopted by the international TBI research community.
