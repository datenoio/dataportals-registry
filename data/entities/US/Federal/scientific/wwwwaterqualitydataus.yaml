description: The Water Quality Portal (WQP) is the premiere source of discrete water-quality
  data in the United States and beyond. This cooperative service integrates publicly
  available water-quality data from the United States Geological Survey (USGS) National
  Water Information System (NWIS), the Environmental Protection Agency (EPA) Water
  Quality eXchange (WQX), STOrage and RETrieval (STORET) Data Warehouse, and over
  thousands of state, federal, tribal, and local agencies. The Water Quality Portal
  integrates both discrete and continuous monitoring data (file archival) via discrete
  warehouse API services.
