description: The NSF GAGE Facility promotes research by providing access to data that our
  community of geodetic scientists uses for quantifying the motions of rock, ice and water
  that are monitored by a variety of sensor types at or near the Earth's surface. After processing,
  these data enable millimeter-scale surface motion detection and monitoring at discrete points,
  and high-resolution strain imagery over areas of tens of square meters to hundreds of square
  kilometers.
