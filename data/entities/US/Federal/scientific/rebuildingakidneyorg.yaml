description: This site contains data generated by (Re)Building a Kidney (RBK), an
  NIDDK-funded consortium of research projects working to optimize approaches for
  the isolation, expansion, and differentiation of appropriate kidney cell types and
  their integration into complex structures that replicate human kidney function.
  RBK's goal is to coordinate and support studies that will result in the ability
  to generate or repair nephrons that can function within the kidney. This resource
  includes data from both the RBK project and the GenitoUrinary Development Molecular
  Anatomy Project (GUDMAP). Data submission is restricted to members of the Consortium
  only.
