description: 'OLAC, the Open Language Archives Community, is an international partnership
  of institutions and individuals who are creating a worldwide virtual library of language
  resources by: (i) developing consensus on best current practice for the digital archiving
  of language resources, and (ii) developing a network of interoperating repositories and
  services for housing and accessing such resources. The OLAC system has 2016 been integrated
  with the Linguistic Linked Open Data Cloud.'
