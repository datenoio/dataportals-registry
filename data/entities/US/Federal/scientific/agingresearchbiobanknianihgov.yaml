description: The AgingResearchBiobank was officially announced in January 2019 with
  a mission to provide a state-of-the-art inventory system for the storage, maintenance
  and distribution of biospecimens and associated data from numerous NIA-funded longitudinal
  studies on aging and on clinical trials with the broader scientific community; foster
  compliance with NIH/NIA resources sharing policies; and, foster science advances
  to ultimately help extend the healthy, active years of life for the world’s fast-growing
  population of older adults. Starting on October 2023, the AgingResearchBiobank is
  also hosting and distributing imaging data available for some of our study collections.
