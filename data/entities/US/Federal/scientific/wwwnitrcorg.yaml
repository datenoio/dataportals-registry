description: 'The Neuroimaging Informatics Tools and Resources Collaboratory Image
  Repository (NITRC-IR) provides searchable and downloadable publicly available data
  sets for neuroimaging research. This includes thousands of DICOM, NIfTI and BIDS
  normal subjects and those with diagnoses such as schizophrenia, ADHD, autism, and
  Parkinson''s. NITRC’s scientific focus includes: MR, PET/SPECT, CT, EEG/MEG, optical
  imaging, clinical neuroimaging, computational neuroscience, and imaging genomics
  software tools, data, and computational resources.'
