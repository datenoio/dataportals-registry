description: The NCMA (National Center for Marine Algae and Microbiota) is a scientific
  resource that maintains one of the world’s largest and most diverse collections
  of marine algae, microalgae, and related microorganisms for research and industry.
  It provides cultured strains, biological data (including phenotypic trait data),
  and distribution services to scientists and companies globally. The database supports
  research in biology, oceanography, and biotechnology by preserving, cataloguing,
  and making these living strains and associated information available.
