description: 'The Vivli data repository provides a global data-sharing and analytics
  platform serving all elements of the international research community. It is focused
  on sharing individual participant-level data from completed clinical trials to serve
  the international research community. Vivli acts as a neutral broker between data
  contributor and data user and the wider data sharing community. Vivli is a non-profit
  organization focused on data sharing and analysis. Vivli provides managed access
  for human subject clinical research data. At a minimum, Vivli will make data available
  for researchers for 10 years, unless they are contractually unable to do so. On
  an ongoing basis, Vivli evaluates its data holdings with regard to maintaining access
  and reserves the right to discontinue the distribution of a data collections when
  deemed appropriate.When materials are deaccessioned, the data are no longer publicly
  accessible at Vivli, although they may still be preserved in Vivli’s storage vault.
  Because digital files are assigned a persistent digital object identifier (DOI),
  the study description is still available to view, but is not searchable through
  Vivli. Web crawlers are instructed to ignore the descriptions (via the robots exclusion
  protocol).

  For more information about Vivli’s policy, please contact Vivli at support@vivli.org

  It provides a no-charge period for data only available within their secure research
  environment. There are costs after the no-charge time period ends. Vivli supports
  managed access as well as embargoing generally and during peer review. Vivli is
  funded via grants and member fees.'
