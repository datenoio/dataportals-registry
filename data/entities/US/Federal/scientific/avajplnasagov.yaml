description: AVA is a large depository of volcanic data. For 1,549 recently active
  volcanos listed by the Smithsonian Global Volcanism Program, the AVA has collected
  the entirety of high-resolution multispectral ASTER data and made it available to
  the public. Also included are digital elevation maps, NOAA ash advisories, alteration
  zone imagery, and thermal anomaly reports. LANDSAT7 data are also being processed.
