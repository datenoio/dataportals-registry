description: Brain Image Library (BIL) is an NIH-funded public resource serving the
  neuroscience community by providing a persistent centralized repository for brain
  microscopy data. Data scope of the BIL archive includes whole brain microscopy image
  datasets and their accompanying secondary data such as neuron morphologies, targeted
  microscope-enabled experiments including connectivity between cells and spatial
  transcriptomics, and other historical collections of value to the community. The
  BIL Analysis Ecosystem provides an integrated computational and visualization system
  to explore, visualize, and access BIL data without having to download it.
