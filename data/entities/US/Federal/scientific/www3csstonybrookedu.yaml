description: This site contains several collections of important classes of graphs,
  all converted to the graph format used by Combinatorica, a package for teaching
  and research in discrete mathematics, particularly combinatorics and graph theory.
  These graphs can be used to test conjectures, by explictly testing whether a given
  property holds on all small trees, bipartite graphs, etc. Experiments with Random
  labeled graphs are typically easy to construct, but experiments with them are typically
  wasteful because isomorphic copies can be repeatedly generated, and unconvincing
  because they do not systematically look for all possible counter-examples. These
  graph collections represent complete sets of interesting unlabeled graphs, and permit
  typically testing all relevant graphs up to a non-trivial number of vertices.
