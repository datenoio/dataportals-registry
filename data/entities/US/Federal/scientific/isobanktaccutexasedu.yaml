description: IsoBank is a multi-organization effort to build a common repository for
  stable isotope data. Our goal is to provide a common repository for stable isotope
  measurement data originating from any context, and to support easy location and
  access to this data by the research community. The IsoBank repository provides a
  searchable database of stable isotope measurements based on a rich metadata schema
  developed through community input from researchers who generate and use stable isotope
  data.
