description: The Cancer Data Service (CDS) is a data repository under the NCI's Cancer
  Research Data Commons (CRDC) infrastructure for storing cancer research data generated
  by NCI funded programs. CDS provides secure and authorized storage and data sharing
  capabilities in the cloud for studies that do not have a repository specific for
  their data type or are wait listed or not approved by that repository for storage.  CDS
  hosts both controlled and open access data. Permission to access controlled data
  on CDS is obtained through the NCBI’s dbGaP system. CDS hosts data and offers analysis
  capabilities through the NCI Cloud Resources. Seven Bridges Cancer Genomics Cloud,
  one of the NCI’s Cloud Resources, can be used to search and analyze data. Seven
  Bridges-CGC is established on Amazon Web Services (AWS).
