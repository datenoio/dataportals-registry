description: The Image Attribution Framework Development Repository is a system for
  neuroimaging data citation and credit with a practical implementation that meets
  the objectives of unique identification, data use tracking, and integration with
  traditional credit attribution systems. This reference implementation was created
  which mirrors the structure of the Neuroimaging Informatics Tools and Resources
  Clearinghouse (NITRC) neuroimaging data repository using the XNAT platform. DOIs
  can be assigned upon dataset upload, meaning that project-level identifiers as well
  as per-image DOIs are created. Note that this reference implementation is for illustration
  purposes. It is expected that ultimate success of this concept will be through the
  implementation of these recommendations within existing data hosts, and not through
  this reference implementation itself.
