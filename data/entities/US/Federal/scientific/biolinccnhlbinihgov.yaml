description: The goal of Biologic Specimen and Data Repository Information Coordinating
  Center (BioLINCC) is to facilitate and coordinate the existing activities of the
  NHLBI Biorepository and the Data Repository and to expand their scope and usability
  to the scientific community through a single web-based user interface. BioLINCC
  provides a wealth of information on historical NHLBI clinical and epidemiologic
  studies which have data or biospecimens in the NHLBI repositories, and includes
  study summaries, references, and study operational documents.
