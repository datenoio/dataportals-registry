description: Resources.data.gov is an online repository of policies, schema standards,
  tools, and best practices containing various case studies and other resources to
  support data governance, management, exchange, and use throughout the federal government.
  Resources.data.gov is an effort by the Office of Management and Budget, the Office
  of Government Information Services of the National Archives, and the General Services
  Administration to provide an online repository of guidance and tools to implement
  the OPEN Government Data Act and the Federal Data Strategy. resources.data.gov serves
  a broader purpose as the central repository for Federal Enterprise Data resources
  and guidance on how to manage and use Federal data. The repository will be frequently
  updated with additional tools and resources and will be developed in an open, collaborative
  manner.
