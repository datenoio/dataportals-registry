description: VectorSurv was formed as a partnership of the Mosquito and Vector Control
  Association of California, representing more than 60 local mosquito and vector control
  agencies in California; the California Department of Public Health; and the Davis
  Arbovirus Research and Training (DART) Lab at the University of California, Davis.
  In recent years, VectorSurv has expanded to include other states, and the system
  now serves California, Utah, New Jersey, Hawaii, North Carolina, Tennessee, and
  the U.S. territory of Guam.
