description: Gene regulation plays a fundamental role in shaping tissue identity,
  function, and response to perturbation. Regulatory processes are controlled by complex
  networks of interacting elements, including transcription factors, miRNAs and their
  target genes. The structure of these networks helps to determine phenotypes and
  can ultimately influence the development of disease or response to therapy. We developed
  GRAND (https://grand.networkmedicine.org) as a database for computationally-inferred,
  context-specific gene regulatory network models that can be compared between biological
  states, or used to predict which drugs produce changes in regulatory network structure.
  The database includes 12 468 genome-scale networks covering 36 human tissues, 28
  cancers, 1378 unperturbed cell lines, as well as 173 013 TF and gene targeting scores
  for 2858 small molecule-induced cell line perturbation paired with phenotypic information.
  GRAND allows the networks to be queried using phenotypic information and visualized
  using a variety of interactive tools. In addition, it includes a web application
  that matches disease states to potentially therapeutic small molecule drugs using
  regulatory network properties.
