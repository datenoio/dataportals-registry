description: A premier source for United States cancer statistics, SEER gathers information
  related to incidence, prevalence, and survival from specific geographic areas that represent
  28 percent of the population, as well as compiles related reports and reports on the national
  cancer mortality rates. Their aim is to provide information related to cancer statistics
  and decrease the burden of cancer in the national population. SEER has been collecting data
  from cancer cases since 1973.
