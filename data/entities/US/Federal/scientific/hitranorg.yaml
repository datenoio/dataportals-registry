description: HITRAN is an acronym for high-resolution transmission molecular absorption
  database. HITRAN is a compilation of spectroscopic parameters that a variety of
  computer codes use to predict and simulate the transmission and emission of light
  in the atmosphere. HITRAN data is predominantly used in atmospheric science and
  astrophysics, but it has many applications throughout science, industry, and technology.
