description: The Astromaterials Data System is a NASA funded data infrastructure that
  supports the preservation, discovery, access and analysis of laboratory analytical
  data generated by the study of astromaterials samples. The Astromaterials Data System
  operates the Astromaterials Data Repository (AstroRepo), which archives, publishes
  and makes accessible data generated by the study of lunar samples (samples collected
  during the Apollo missions), meteorites, interstellar dust, solar wind, presolar
  grains, and other extraterrestrial materials. AstroRepo follows international best
  practices for trusted data repositories. The Astromaterials Data System is operated
  at the Lamont-Doherty Earth Observatory of Columbia University as part of a suite
  of data systems for Earth and planetary sample data (chemical, mineralogical, and
  petrological observations), including EarthChem, the System for Earth Sample Registration,
  and the Library of Experimental Phase Relations.
