description: The Stem Cell Commons were initiated by the Harvard Stem Cell Institute
  to develop a community for stem cell bioinformatics. This open source environment
  for sharing, processing and analyzing stem cell data brings together stem cell data
  sets with tools for curation, dissemination and analysis. Standardization of the
  analytical approaches will enable researchers to directly compare and integrate
  their results with experiments and disease models in the Commons.
