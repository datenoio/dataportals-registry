description: NGEE-Tropics (Next Generation Ecosystems Experiments–Tropics) is a scientific
  data archive that provides access to environmental datasets from tropical forest
  ecosystems. It gathers observational, experimental, modeling, and remote sensing
  data collected to improve understanding of tropical ecosystem processes and their
  representation in Earth system models. The database supports data sharing, long-term
  preservation, and reuse of ecological, hydrological, meteorological, and vegetation-related
  datasets following FAIR data principles.
