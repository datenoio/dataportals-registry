description: The National Energy Research Scientific Computing Center (NERSC) is a
  U.S. Department of Energy (DOE) Office of Science User Facility that serves as the
  primary high-performance computing center for scientific research sponsored by the
  Office of Science. Located at Lawrence Berkeley National Laboratory, the NERSC Center
  serves more than 7,000 scientists at national laboratories and universities researching
  a wide range of problems in combustion, climate modeling, fusion energy, materials
  science, physics, chemistry, computational biology, and other disciplines.
