description: RIDIE is a registry of impact evaluations related to development in low
  and middle income countries. The purpose of the registry is to enhance the transparency
  and quality of evaluation research as well as to provide a repository of impact
  evaluation studies for researchers, funders, and others. RIDIE will register any
  development impact evaluation that rigorously attempts to estimate the causal impacts
  of a program, including but not limited to randomized control trials. It is intended
  to be a prospective registry in which researchers and evaluators can record information
  about their evaluation designs before conducting the analysis, as well as update
  information as the study proceeds and post findings upon study completion.
