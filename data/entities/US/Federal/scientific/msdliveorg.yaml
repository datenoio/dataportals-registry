description: The MultiSector Dynamics – Living, Intuitive, Value-adding, Environment
  (MSD-LIVE) is a collaborative data and computational platform for the MultiSector
  Dynamics community, operating under the MultiSector Dynamics program area within
  the Earth and Environmental Systems Modeling program of the U.S. Department of Energy’s
  Office of Science. MSD-LIVE is a flexible and scalable data and code management
  system combined with a distributed computational platform that will enable MSD researchers
  to document and archive their data, run their models and analysis tools, and to
  share their data, software, and multi-model workflows within a robust Community
  of Practice. MSD-LIVE will facilitate a new open, collaborative, resource-rich,
  technology-facilitated, community-driven way of doing MSD research. MSD-LIVE will
  accelerate progress, facilitate and incentivize collaboration, and enhance the scientific
  impact and visibility of the MSD community.
