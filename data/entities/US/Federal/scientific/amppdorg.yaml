description: The Accelerating Medicines Partnership – Parkinson’s Disease (AMP PD)
  is a public-private partnership formed for the purpose of identifying and validating
  diagnostic, prognostic, and progression biomarkers for Parkinson’s Disease.  To
  accomplish this goal, AMP PD harmonized longitudinal clinical data from seven large
  existing cohorts and conducted whole genome sequencing, longitudinal transcriptomics,
  and longitudinal proteomics analyses from their existing blood, CSF, and/or brain
  tissue samples.  AMP PD data, along with the federated, international Global Parkinson’s
  Genetics Program (GP2) data, exists in the Google Cloud and is accessible and analyzable
  on the Verily/Broad Institute’s Terra Platform.
