description: "The Allen Institute for Brain Science aims to accelerate neuroscience\
  \ research worldwide with the release of large-scale, publicly available atlases\
  \ of the brain. The Brain Science Institute is the Allen Institute’s (https://alleninstitute.org)\
  \ oldest scientific division, established in 2003 by founder Paul G Allen, has generated\
  \ several foundational data resources for the neuroscience community for exploring\
  \ the brain at the level of gene expression, connectivity, and, most recently, individual\
  \ cell types and synapses. \nThe Allen Institute for Brain Science is currently\
  \ focused on defining and understanding the cell types of the mammalian brain to\
  \ ultimately better understand brain development, evolution and disease. \nThe Allen\
  \ Brain Map portal provides access to high quality data and web-based applications\
  \ created for the benefit of the global research community."
