description: PHIDIAS is a web-based database and analysis system that aims to manually
  curate, computationally analyze, and address different scientific issues in the
  areas of pathogen-host interactions (PHI, or called host-pathogen interactions or
  HPI). PHIDIAS has emphasized the study of those pathogens that cause various infectious
  diseases in humans and animals. The recently published Victors analysis program
  is a relatively independent system within the PHIDIAS database and analysis resource.
