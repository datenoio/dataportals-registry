description: The USDA Economics, Statistics and Market Information System (ESMIS)
  contains >2,000 reports and datasets from several agencies of the U.S. Department
  of Agriculture (USDA), including the National Agricultural Statistics Service(NASS),
  the Economic Research Service (ERS), the Agricultural Marketing Service (AMS), the
  World Agricultural Outlook Board (WAOB) and the Foreign Agricultural Service (FAS).
  This repository provides immediate access to historical publications that are no
  longer in production, as well as current publications that are actively published.
  These materials cover U.S. and international agriculture and related topics. Mann
  Library at Cornell University developed and maintains this site.
