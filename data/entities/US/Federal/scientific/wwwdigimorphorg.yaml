description: DigiMorph is a digital library of high-resolution X-ray computed tomography
  (CT) scans that provides 2D and 3D visualizations of the internal and external structure
  of living and extinct organisms. It offers access to a vast archive of digital biological
  morphology data, including fossils, skeletons, and soft-tissue specimens, ideal
  for biological, paleontological, anatomical and evolutionary studies.
