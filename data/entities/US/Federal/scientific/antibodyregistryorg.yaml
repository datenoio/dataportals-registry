description: 'The Antibody Registry exists to give researchers a way to universally
  identify antibodies used in publications. The registry lists many commercial antibodies
  from about 200 vendors which have each been assigned a unique identifier. If the
  antibody that you are using does not appear in the list, an entry can be made by
  filling in as little as 2 pieces of information: the catalog number and the url
  of the vendor where our curators can find information and material data sheets.
  Many optional fields can also be filled in that will help curators identify the
  reagent. After submitting an antibody, you are given a permanent identifier that
  can be used in publications. This identifier even if it is later found to be a duplicate,
  can be quickly traced back in the antibody registry. We never delete records, but
  we collapse duplicate entries on a regular basis (the old identifiers are kept to
  help with search).'
