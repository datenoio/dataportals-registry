description: ModBase (https://salilab.org/modbase) is a database of annotated comparative
  protein structure models. The models are calculated by ModPipe, an automated modeling
  pipeline that relies primarily on Modeller for fold assignment, sequence-structure
  alignment, model building, and model assessment (https://salilab.org/modeller/).
  ModBase currently contains almost 30 million reliable models for domains in 4.7
  million unique protein sequences. ModBase allows users to compute or update comparative
  models on demand, through an interface to the ModWeb modeling server (https://salilab.org/modweb).
