description: The National Microbiome Data Collaborative seeks to address fundamental
  roadblocks in microbiome data science and gaps in transdisciplinary collaboration.
  The NMDC aims to support microbiome data exploration through a sustainable data
  discovery platform that promotes open science and shared-ownership across a broad
  and diverse community of researchers, funders, publishers, societies, and other
  Collaborators. The NMDC open source microbiome science gateway leverages existing
  resources and enables comprehensive access to multidisciplinary microbiome data
  and standardized, reproducible data products.
