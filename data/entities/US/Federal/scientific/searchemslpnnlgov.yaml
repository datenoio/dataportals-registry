description: The EMSL NEXUS User Portal supports the management, sharing, and reporting
  of BER user facility data generated onsite by users and User organizations. EMSL
  is one of the 28 U.S. Department of Energy Office of Science user facilities. EMSL
  is housed on the campus of Pacific Northwest National Laboratory in Richland, Washington.
  DOE’s Biological and Environmental Research (BER) program supports EMSL and several
  other user facilities who are conducting research related to the fundamental understanding
  and prediction of complex biological, Earth, and environmental systems for energy
  and infrastructure security. As a user facility, EMSL provides shared laboratory
  resources, instrumentation, and expertise to the scientific community. Access to
  EMSL resources is determined by a competitive peer-review proposal award process
  as part of the user program. For purposes of reporting EMSL user data to DOE, EMSL
  tracks the number of active projects, active users by project, user institutions
  by project, as well as the number of distinct users and User institutions.
