description: BioSimulations is a web application for sharing and re-using biomodels,
  simulations, and visualizations of simulations results. BioSimulations supports
  a wide range of modeling frameworks (e.g., kinetic, constraint-based, and logical
  modeling), model formats (e.g., BNGL, CellML, SBML), and simulation tools (e.g.,
  COPASI, libRoadRunner/tellurium, NFSim, VCell). BioSimulations aims to help researchers
  discover published models that might be useful for their research and quickly try
  them via a simple web-based interface.
