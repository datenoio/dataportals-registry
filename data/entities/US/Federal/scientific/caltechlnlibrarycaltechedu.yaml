description: Lab Notes Online presents historic scientific data from the Caltech Archives'
  collections in digital facsimile. Beginning in the fall of 2008, the first publication in
  the series is Robert A. Millikan's notebooks for his oil drop experiments to measure the
  charge of the electron, dating from October 1911 to April 1912. Other laboratory, field,
  or research notes will be added to the archive over time.
