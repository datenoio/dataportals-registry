description: The Center for Expanded Data Annotation and Retrieval (CEDAR) Workbench
  is a database of metadata templates that define the data elements needed to describe
  particular types of biomedical experiments. The templates include controlled terms
  and synonyms for specific data elements. CEDAR is an end-to-end process that enables
  community-based organizations to collaborate to create metadata templates, investigators
  or curators to use the templates to define the metadata for individual experiments,
  and scientists to search the metadata to access and analyze the corresponding online
  datasets.
