description: The Objectively Analyzed air-sea Fluxes (OAFlux) project is a research
  and development project focusing on global air-sea heat, moisture, and momentum
  fluxes. The project is committed to produce high-quality, long-term, global ocean
  surface forcing datasets from the late 1950s to the present to serve the needs of
  the ocean and climate communities on the characterization, attribution, modeling,
  and understanding of variability and long-term change in the atmosphere and the
  oceans.
