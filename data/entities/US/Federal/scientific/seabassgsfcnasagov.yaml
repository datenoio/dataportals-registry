description: SeaWiFS Bio-optical Archive and Storage System (SeaBASS) is a publicly
  shared archive of in situ oceanographic and atmospheric data maintained by the NASA
  Ocean Biology Processing Group (OBPG). Archived data include measurements of apparent
  and inherent optical properties, phytoplankton pigment concentrations, and other
  related oceanographic and atmospheric data, such as water temperature, salinity,
  stimulated fluorescence, and aerosol optical thickness. Data are collected using
  a number of different instrument packages, such as profilers, buoys, and hand-held
  instruments, and manufacturers on a variety of platforms, including ships and moorings.
