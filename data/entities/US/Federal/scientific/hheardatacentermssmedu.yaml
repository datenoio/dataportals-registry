description: Human Health Exposure Analysis Resource (HHEAR) Data Center provides
  a data repository for storing epidemiologic and biomarker data for CHEAR and HHEAR
  research studies to improve our knowledge of the comprehensive effects of environmental
  exposures on human health throughout the life course. Registered users will have
  access to publicly available deidentified datasets. In addition, there is a publicly
  accessible HHEAR ontology that provides a common vocabulary with unambiguous definitions
  of concepts and variables across studies to allow for pooling of studies.
