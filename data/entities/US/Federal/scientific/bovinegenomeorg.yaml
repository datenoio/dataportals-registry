description: BovineMine integrates the bovine reference genome assembly with many
  other biological data sets, including genomes of other species. The sheep and goat
  genomes allow comparison across ruminants. Model organism data (human, mouse, rat)
  allow well-curated data sets to be applied to ruminants using orthology.
