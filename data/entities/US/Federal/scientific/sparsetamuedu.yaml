description: 'The SuiteSparse Matrix Collection (formerly known as the University
  of Florida Sparse Matrix Collection), is a large and actively growing set of sparse
  matrices that arise in real applications. The Collection is widely used by the numerical
  linear algebra community for the development and performance evaluation of sparse
  matrix algorithms. It allows for robust and repeatable experiments: robust because
  performance results with artificially-generated matrices can be misleading, and
  repeatable because matrices are curated and made publicly available in many formats.'
