description: RDCA-DAP is an FDA-funded initiative that provides a centralized and
  standardized infrastructure to support and accelerate rare disease characterization
  with the goal of accelerating therapy development across rare diseases. RDCA-DAP
  promotes the sharing of existing patient-level data and encourages the standardization
  of new data collection. By integrating data in a format suitable for analytics,
  RDCA-DAP accelerates the understanding of disease progression (including sources
  of variability to optimize the characterization of subpopulations), clinical outcome
  measures and biomarkers, and facilitates the development of mathematical models
  of disease and innovative clinical trial designs.
