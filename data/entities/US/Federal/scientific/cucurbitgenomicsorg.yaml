description: The recent genome sequence assemblies of major cucurbit crop species,
  including cucumber, melon, watermelon and pumpkin have made it feasible to use advanced
  genomic approaches in cucurbit breeding. Under the CucCAP project (http://cuccap.org),
  the Cucurbit Genomics Database (CuGenDB) aims to accelerate the breeding progress
  of cucurbit crops. Tripal was used to help manage, store, distribute and analyze
  the large amount of recently generated genotype and phenotype data. CuGenDB integrates
  genetic, genomics, transcriptomics and other biological data.
