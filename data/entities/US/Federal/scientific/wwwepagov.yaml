description: EPA worked initially with the U.S. Geological Survey to identify aquatic
  ecotoxicity benchmark values from risk assessments developed by EPA for individual
  pesticides during previous re-registration programs. The Overview of the Ecological
  Risk Assessment Process and ecological risk assessments developed for individual
  pesticides provide an understanding of the ecotoxicity data used to develop benchmarks.
  Comparing a measured concentration of a pesticide in water with an Aquatic Life
  Benchmark can be helpful in interpreting monitoring data and in identifying and
  prioritizing sites and pesticides that may require further investigation.
