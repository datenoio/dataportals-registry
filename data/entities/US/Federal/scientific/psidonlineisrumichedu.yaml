description: The Panel Study of Income Dynamics (PSID) is a longitudinal panel survey
  of American families, conducted by the Survey Research Center at the University
  of Michigan. The PSID measures economic, social, and health factors over the life
  course of families over multiple generations. Data have been collected from the
  same families and their descendants since 1968. It has been claimed that it is the
  world’s longest running household panel survey.
