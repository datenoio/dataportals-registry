description: SCEC's mission includes gathering data on earthquakes, both in Southern California
  and other locales; integrate the information into a comprehensive understanding of earthquake
  phenomena; and communicate useful knowledge for reducing earthquake risk to society at large.
  The SCEC community consists of more than 600 scientists from 16 core institutions and 47
  additional participating institutions. SCEC is funded by the National Science Foundation
  and the U.S. Geological Survey.
