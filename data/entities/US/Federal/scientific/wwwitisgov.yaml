description: The Integrated Taxonomic Information System (ITIS) provides taxonomic
  information on plants, animals, fungi, and microbes of North America and the world.
  The goal is to create an easily accessible database with reliable information on
  species names and their hierarchical classification. The database will be reviewed
  periodically to ensure high quality with valid classifications, revisions, and additions
  of newly described species. The ITIS includes documented taxonomic information of
  flora and fauna from both aquatic and terrestrial habitats.
