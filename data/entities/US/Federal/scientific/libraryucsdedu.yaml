description: The UC San Diego Library Digital Collections (DC) is a curated repository
  for sharing and preserving research data. Digital Object Identifiers (DOIs) are
  provided for all research datasets, so the data can be cited easily and accessed
  persistently. The contents of the DC are replicated in Chronopolis, a certified,
  geographically distributed preservation system designed to prevent catastrophic
  loss of data. Most research datasets are openly accessible, although submissions
  are restricted to University affiliates.
