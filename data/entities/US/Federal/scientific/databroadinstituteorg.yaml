description: The Broad Bioimage Benchmark Collection (BBBC) is a collection of freely
  downloadable microscopy image sets. Researchers are encouraged to use these image
  sets as reference points when developing, testing, and publishing new image analysis
  algorithms for the life sciences. In addition to the images themselves, each set
  includes a description of the biological application and some type of "ground truth"
  (expected results).
