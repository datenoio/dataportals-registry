description: The CAS (Chemical Abstracts Service) Registry is the CAS substance collection,
  and is a division of the American Chemical Society and contains databases of chemical
  information. CAS Registry Numbers (often referred to as CAS RNs or CAS Numbers)
  are universally used to provide a unique, unmistakable identifier for chemical substances.
  A CAS Registry Number itself has no inherent chemical significance but provides
  an unambiguous way to identify a chemical substance or molecular structure when
  there are many possible systematic, generic, proprietary or trivial names. For common
  and frequently regulated chemicals the related CAS Common Chemistry database, an
  open community resource with nearly 500,000 chemical substances from CAS REGISTRY,
  is available. For more unique substances, complete and submit a CAS Registry Lookup
  service order form and receive results within 24 hours.
