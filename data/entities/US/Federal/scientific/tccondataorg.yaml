description: TCCON is a network of ground-based Fourier Transform Spectrometers recording
  direct solar spectra in the near infrared spectral region. From these spectra, accurate
  and precise column-averaged abundances of CO2, CH4, N2O, HF, CO, H2O, and HDO are
  retrieved and reported here. A technical report describing the retrievals is found
  here; solar and telluric spectral linelists used in the retrievals are publically
  available.
