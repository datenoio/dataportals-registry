description: 'The Qualitative Data Repository (QDR) is a dedicated archive for storing
  and sharing digital data (and accompanying documentation) generated or collected
  through qualitative and multi-method research in the social sciences. QDR provides
  search tools to facilitate the discovery of data, and also serves as a portal to
  material beyond its own holdings, with links to U.S. and international archives.
  The repository’s initial emphasis is on political science. Four beliefs underpin
  the repository''s mission: data that can be shared and reused should be; evidence-based
  claims should be made transparently; teaching is enriched by the use of well-documented
  data; and rigorous social science requires common understandings of its research
  methods.'
