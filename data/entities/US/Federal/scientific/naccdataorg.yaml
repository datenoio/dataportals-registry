description: The Uniform Data Set (UDS) is a longitudinal data set representing the
  entire enrollment of the NIA Alzheimer's Disease Centers since 2005. It features
  demographic, clinical, and neuropsychological testing data collected through annual
  clinical examinations on more than 46,000 participants. The NACC Neuropathology
  Data Set contains data from standardized neuropathological evaluations on more than
  7,000 participants with UDS data, as well as 11,000 participants prior to the UDS.
