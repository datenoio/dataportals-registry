description: MIMIC-III (Medical Information Mart for Intensive Care III) is a large,
  freely-available database comprising deidentified health-related data associated
  with over forty thousand patients who stayed in critical care units of the Beth
  Israel Deaconess Medical Center between 2001 and 2012. The database includes information
  such as demographics, vital sign measurements made at the bedside (~1 data point
  per hour), laboratory test results, procedures, medications, caregiver notes, imaging
  reports, and mortality (both in and out of hospital). MIMIC supports a diverse range
  of analytic studies spanning epidemiology, clinical decision-rule improvement, and
  electronic tool development. I
