description: The Arabidopsis Information Portal (Araport) is an open-access online
  community resource for Arabidopsis research. Araport enables biologists to navigate
  from the Arabidopsis thaliana Col-0 reference genome sequence to its associated
  annotation including gene structure, gene expression, protein function, and interaction
  networks. Araport offers gene and protein reports with orthology, expression, interactions
  and the latest annotation, plus analysis tools, community apps, and web services.
  Araport is free and open-source. Registered members can save their analysis, publish
  science apps, and post announcements.
