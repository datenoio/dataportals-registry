description: 'The Berkeley Drosophila Genome Project (BDGP) is a consortium of the
  Drosophila Genome Center, funded by the National Human Genome Research Institute,
  National Cancer Institute, and Howard Hughes Medical Institute, through its support
  of work in the Susan Celniker, Ben Brown, and Gary Karpen laboratories.


  The goals of the Drosophila Genome Center are to finish the sequence of the euchromatic
  genome of Drosophila melanogaster to high quality and to generate and maintain biological
  annotations of this sequence. In addition to genomic sequencing, the BDGP is 1)
  producing gene disruptions using P element-mediated mutagenesis on a scale unprecedented
  in metazoans; 2) characterizing the sequence and expression of cDNAs; and 3) developing
  informatics tools that support the experimental process, identify features of DNA
  sequence, and allow us to present up-to-date information about the annotated sequence
  to the research community.


  The information produced in this project is available for download from this page,
  but the primary method of accessing the annotations is via FlyBase and other similar
  resources.'
