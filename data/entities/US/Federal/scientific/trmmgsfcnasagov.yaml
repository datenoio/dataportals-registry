description: TRMM is a research satellite designed to improve our understanding of the distribution
  and variability of precipitation within the tropics as part of the water cycle in the current
  climate system. By covering the tropical and sub-tropical regions of the Earth, TRMM provides
  much needed information on rainfall and its associated heat release that helps to power
  the global atmospheric circulation that shapes both weather and climate.
