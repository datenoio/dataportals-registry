description: The International Laser Ranging Service (ILRS) provides global satellite and
  lunar laser ranging data and their related products to support geodetic and geophysical
  research activities as well as IERS products important to the maintenance of an accurate
  International Terrestrial Reference Frame (ITRF). The service develops the necessary global
  standards/specifications and encourages international adherence to its conventions.
