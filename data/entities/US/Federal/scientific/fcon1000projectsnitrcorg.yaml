description: Autism Brain Imaging Data Exchange (ABIDE) is a resource serving Autism
  spectrum disorders (ASD) data. The Autism Brain Imaging Data Exchange (ABIDE) provides
  previously-collected resting state functional magnetic resonance imaging (R-fMRI)
  datasets for the purpose of data sharing in the broader scientific community. ABIDE
  is intended to facilitate discovery science and comparisons across samples. In accordance
  with HIPAA guidelines and 1000 Functional Connectomes Project / INDI protocols,
  all datasets are anonymous, with no protected health information included. Data
  is available for download from the ABIDE website and for searching via partner websites.
