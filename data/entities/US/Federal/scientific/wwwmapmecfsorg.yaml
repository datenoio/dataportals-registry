description: mapMECFS houses Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS)
  research data and results from across many biological and clinical disciplines.
  This interactive data portal enables exploration and access to complex experimental
  data with the goal of advancing ME/CFS discoveries, including diagnosis and treatments.
  Data types shared on mapMECFS include, but are not limited to, metabolomics, gene
  expression, microbiome, demographic, health and survey data, and others.
