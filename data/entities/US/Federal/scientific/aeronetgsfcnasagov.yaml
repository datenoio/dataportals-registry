description: The AErosol RObotic NETwork (AERONET) database stores information collected
  by ground-based remote sensing aerosol networks originally established by NASA and
  LOA-PHOTONS (CNRS). AERONET includes data on aerosol optical, microphysical and
  radiative properties for aerosol research as well as characterization and validation
  of satellite retrievals with other databases. The network imposes standardization
  of instruments, calibration, processing and distribution. AERONET also provides
  globally distributed observations of spectral aerosol optical Depth (AOD), inversion
  products, and precipitable water in diverse aerosol regimes.
