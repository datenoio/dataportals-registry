description: The Scientific Registry of Transplant Recipients (SRTR) is a U.S. database
  that compiles, manages, and analyzes data on all organ transplants and donations
  nationwide. It receives monthly data from the Organ Procurement and Transplantation
  Network (OPTN), the Centers for Medicare & Medicaid Services (CMS), and other health
  sources. SRTR provides reports and analyses to transplant centers, policymakers,
  and researchers to monitor outcomes and improve transplant performance.
