description: Structure Function Linkage Database (SFLD) is a database of enzymes classified
  by linking sequences to chemical function. A hierachical systems is used to classify
  enzymes by family or superfamily other category levels include functional domain,
  subgroup and suprafamily. The archive does not contain the interactive functionality
  found in the original SFLD, such as search capabilities. Instead, the archive is
  a static snapshot of the data in the SFLD as of April 2019, and will not be updated.
  Interactive features are no longer available. However, the superfamily hierarchy
  may be browsed, and archived alignments, sequence similarity networks, and reaction
  similarity networks are available for download. Though SFLD sequence sets, alignments,
  and networks are not being updated, they may still provide a starting point for
  exploration and hypothesis generation.
