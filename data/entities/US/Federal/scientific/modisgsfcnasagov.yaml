description: MODIS (or Moderate Resolution Imaging Spectroradiometer) is a key instrument
  aboard the Terra (originally known as EOS AM-1) and Aqua (originally known as EOS PM-1)
  satellites. Terra's orbit around the Earth is timed so that it passes from north to south
  across the equator in the morning, while Aqua passes south to north over the equator in
  the afternoon.
