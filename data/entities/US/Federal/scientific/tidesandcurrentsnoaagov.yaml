description: NOAA’s Center for Operational Oceanographic Products and Services (CO-OPS)
  provides accurate, reliable, and timely tides, water levels, currents, and other
  coastal oceanographic and meteorological information. CO-OPs supports safe and efficient
  maritime commerce and transportation, help protect public health and safety, and
  promote robust, resilient coastal communities. CO-OPS maintains ocean observing
  infrastructure, including more than 200 permanent water level stations on the U.S.
  coasts and Great Lakes, an integrated system of real-time sensors concentrated in
  busy seaports, and temporary meters that collect observations for tidal current
  predictions. Through these systems, they provide historic and real-time data, forecasts,
  predictions, and scientific analyses that protect life, the economy, and the environment
  on the coast.
