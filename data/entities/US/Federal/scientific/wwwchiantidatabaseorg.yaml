description: CHIANTI is an open, critically evaluated atomic database for spectroscopic
  diagnostics of astrophysical plasmas. It provides detailed atomic data (energy levels,
  wavelengths, radiative and collisional rates) used to calculate emission line and
  continuum spectra from optically thin plasmas in stars, the Sun, and other cosmic
  sources.
