description: The Natural Resources Conservation Service Web Soil Survey (NRCS WSS)
  provides soil data and information produced by the National Cooperative Soil Survey.
  NRCS has soil maps and data available online for more than 95 percent of counties
  in the USA. Soil surveys can be used for general farm, local, and wider area planning.
  Within the USA, this site is provided as the authoritative government source of
  soil survey information.
