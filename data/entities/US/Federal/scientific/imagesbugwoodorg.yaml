description: Bugwood Image Database System is an online repository of high-quality
  images related to insects, invasive species, plant diseases, forestry, agriculture,
  and natural resource management. It is managed by the Center for Invasive Species
  and Ecosystem Health at the University of Georgia and provides access to scientifically
  documented images for research, education, outreach, and species identification.
  The database contains curated image collections contributed by researchers, institutions,
  and professionals, with associated metadata describing the organisms, locations,
  and topics represented.
