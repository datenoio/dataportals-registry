description: The USGS investigates the occurrence, quantity, quality, distribution,
  and movement of surface and underground waters and disseminates the data to the
  public, State and local governments, public and private utilities, and other Federal
  agencies involved with managing our water resources. The USGS Water Data for the
  Nation provide access to these data collected at approximately 1.9 million sites
  in all 50 States, the District of Columbia, Puerto Rico, the Virgin Islands, Guam,
  American Samoa and the Commonwealth of the Northern Mariana Islands.
