description: The Integrated Resource for Reproducibility in Macromolecular Crystallography
  (IRRMC) was created to make the raw data of protein crystallography more widely
  available. The IRRMC identifies, catalogs and provides metadata related to datasets
  that could be used to reprocess the original diffraction data. The intent of this
  project is to make the resulting three-dimensional structures more reproducible
  and easier to modify and improve as processing methods advance.
