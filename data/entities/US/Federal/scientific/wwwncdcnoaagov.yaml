description: Climate Data Online (CDO) provides free access to NCDC's archive of global
  historical weather and climate data in addition to station history information.
  These data include quality controlled daily, monthly, seasonal, and yearly measurements
  of temperature, precipitation, wind, and degree days as well as radar data and 30-year
  Climate Normals. The data available through CDO is available at no charge and can
  be viewed online or ordered and delivered via email.
