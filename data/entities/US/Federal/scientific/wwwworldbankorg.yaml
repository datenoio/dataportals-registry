description: 'The Worldwide Governance Indicators (WGI) are a set of six composite
  indicators developed by the World Bank to measure perceptions of governance quality
  across more than 200 countries. They cover six key dimensions: voice and accountability,
  political stability, government effectiveness, regulatory quality, rule of law,
  and control of corruption. The data come from over 30 surveys and expert assessments,
  combined using a statistical model that also provides margins of error.'
