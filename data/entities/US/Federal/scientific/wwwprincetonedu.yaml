description: 'Our lab investigates how cognition manifests in, and is influenced by, the social
  contexts in which it occurs. We focus: 1) on how conversational interactions can reshape
  memory, by promoting shared remembering and shared forgetting, and 2) on how socio-cognitive
  processes affect the formation of collective memories and beliefs, and the dynamics of collective
  decisions.'
