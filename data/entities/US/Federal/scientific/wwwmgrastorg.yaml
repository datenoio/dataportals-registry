description: The MG-RAST server is an open source system for annotation and comparative analysis
  of metagenomes. Users can upload raw sequence data in fasta format; the sequences will be
  normalized and processed and summaries automatically generated. The server provides several
  methods to access the different data types, including phylogenetic and metabolic reconstructions,
  and the ability to compare the metabolism and annotations of one or more metagenomes and
  genomes.
