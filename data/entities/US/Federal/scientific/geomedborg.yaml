description: 'The Genomic Observatories Meta-Database (GEOME) is a web-based database
  that captures the who, what, where, and when of biological samples and associated
  genetic sequences. GEOME helps users with the following goals: ensure the metadata
  from your biological samples is findable, accessible, interoperable, and reusable;
  improve the quality of your data and comply with global data standards; and integrate
  with R, ease publication to NCBI''s sequence read archive, and work with an associated
  LIMS. The initial use case for GEOME came from the Diversity of the Indo-Pacific
  Network (DIPnet) resource.'
