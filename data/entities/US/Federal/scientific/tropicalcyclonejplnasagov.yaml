description: 'The JPL Tropical Cyclone Information System is being actively developed
  to help scientists improve their understanding and forecasting of hurricanes. It
  has two components: a set of near real-time portals that integrate model forecast
  with multi-parameter satellite and airborne observations from a variety of instruments
  and platforms, providing interactive visualization and some on-line analysis tools
  that work with both observations and models, and a 12-year global archive of multi-satellite
  hurricane observations.'
