description: 'The Immunology Database and Analysis Portal (ImmPort) data repository
  was created for the exploration of clinical and basic research data on immunology
  and associated findings. ImmPort intends to promote effective data sharing across
  the basic, clinical and translational research communities. It collects data both
  from clinical and mechanistic studies on human subjects and from immunology studies
  on model organisms. The ImmPort ecosystem consists of four components: private data,
  shared data, data analysis, and resources-for data archiving, dissemination, analyses,
  and reuse.'
