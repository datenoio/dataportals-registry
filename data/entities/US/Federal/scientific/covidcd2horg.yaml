description: The National COVID Cohort Collaborative (N3C) is a collaboration among
  the NCATS-supported Clinical and Translational Science Awards (CTSA) Program hubs,
  the National Center for Data to Health (CD2H), distributed clinical data networks
  (PCORnet, OHDSI, ACT, TriNetX), and other partner organizations, with overall stewardship
  by NIH’s National Center for Advancing Translational Sciences (NCATS). The N3C aims
  to improve the efficiency and accessibility of analyses with COVID-19 clinical data,
  expand our ability to analyze and understand COVID, and demonstrate a novel approach
  for collaborative pandemic data sharing.
