description: Reframedb is a comprehensive open-access, drug repositioning screening
  set of 12,000 compounds that was assembled by combining three widely-used commercial
  drug competitive intelligence databases (Clarivate Integrity, GVK Excelra GoStar
  and Citeline Pharmaprojects), together with extensive patent mining of small molecules
  that have been dosed in humans. To date ~12,000 compounds (~80% of compounds identified
  from data mining) have been purchased or synthesized, and subsequently plated for
  screening.
