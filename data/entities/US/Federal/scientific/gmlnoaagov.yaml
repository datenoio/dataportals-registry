description: The Antarctic Ultraviolet (UV) Monitoring Network was established in
  1987 by the National Science Foundation (NSF) Division of Polar Programs in response
  to serious ozone depletion reported in Antarctica. Biospherical Instruments (BSI)
  installed the first instruments in 1988 and operated the network until 2009*. NSF
  transitioned operation of the Antarctic UV Network to NOAA/ESRL/GMD in 2010. This
  network provides data to researchers studying the effects of ozone depletion on
  terrestrial and marine biological systems, ozone hole monitoring, validation of
  satellite observations, and verification of atmospheric radiation transfer models.
  *Data of the former NSF UV Monitoring Network and the current NOAA networks are
  now distributed via the website, which also provides extensive information on the
  network's instrumentation, data processing, quality control, and data format.
