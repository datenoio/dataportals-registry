description: The DescribePROT database provides access to amino acid-level annotations
  of protein structure and function, which include 3 experimentally validated and
  19 putative characteristics. It covers hundreds of complete proteomes of popular
  and model organisms. Users can search it in multiple ways, interact with the data
  using an interactive graphical interface, and download data at various scales including
  individual proteins, entire proteomes, and whole database. The annotations in DescribePROT
  are useful for a broad spectrum of studies that include investigations of protein
  structure and function, development and validation of predictive tools, and supporting
  efforts in understanding molecular underpinnings of diseases and development of
  therapeutics.
