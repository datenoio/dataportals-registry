description: iDigBio is the US national resource for digitized information about vouchered
  natural history collections within the context established by the NIBA community
  strategic plan and is supported through funds from the NSF's ADBC (Advancing Digitization
  of Biodiversity Collections) program. Through ADBC, data and images for millions
  of biological specimens are being made available in electronic format for the research
  community, government agencies, students, educators, and the general public.
