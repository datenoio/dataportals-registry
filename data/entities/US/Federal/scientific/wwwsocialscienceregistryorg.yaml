description: The American Economic Association Randomized Controlled Trials (AEA RCT)
  Registry stores randomised controlled trials from economics and other social sciences.
  A central registry that lists ongoing, complete and withdrawn trials is important
  as a source of results for meta-analysis and as a resource to find out about available
  survey instruments and data. In April 2012, the AEA executive committee decided
  to establish such a registry for economics and other social sciences.
