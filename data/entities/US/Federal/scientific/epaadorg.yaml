description: EPAAD (ApoE Pathobiology in Aging and Alzheimer's Disease) was established
  to serve as a source of existing and new knowledge on apoE, links to publications
  and datasets relevant to apoE in aging and Alzheimer's disease, a list of currently
  available resources, and a forum for discussion. Our mission is to provide current
  knowledge and the latest findings on apoE biology while providing information on
  resources and a platform for data sharing.
