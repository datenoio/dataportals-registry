description: The USDA Agricultural Marketing Service (AMS) Cotton Program maintains a National
  Database (NDB) in Memphis, Tennessee for owner access to cotton classification data. The
  NDB is computerized telecommunications system which allows owners or authorized agents of
  owners to retrieve classing data from the current crop and/or the previous four crops. The
  NDB stores classing information from all 10 regional classing offices.
