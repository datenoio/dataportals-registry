description: The JGI Genomes OnLine Database, is a resource for comprehensive access
  to information regarding genome and metagenome sequencing projects, and their associated
  metadata. Information in GOLD is organized into levels to include Study, Organism
  or Biosample, Sequencing Project (SP), and Analysis Project (AP). All four levels,
  along with their complex list of metadata fields and controlled vocabulary (CV)
  terms, are connected to each other in a lucid framework to enhance scientific discovery.
  GOLD is a curated resource serving the research community and your input is critical
  to ensure high quality, accurate metadata in GOLD.
