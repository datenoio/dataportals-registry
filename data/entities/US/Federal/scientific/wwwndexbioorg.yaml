description: NDEx is an online commons where scientists can upload, share, and publicly
  distribute biological networks and pathway models. The NDEx Project maintains a
  web-accessible public server, a documentation website, provides seamless connectivity
  to the Cytoscape desktop application as well as programmatic access using a variety
  of languages including Python, Java and R. NDEx users can easily create accounts
  or sign in using their Google credentials thanks to the supported open authentication
  (OAUTH2) method and mint DOIs for their networks to use in publications or include
  in other resources for long term access.
