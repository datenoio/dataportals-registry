description: The Resource Identification Portal was created in support of the Resource
  Identification Initiative, which aims to promote research resource identification,
  discovery, and reuse. The portal offers a central location for obtaining and exploring
  Research Resource Identifiers (RRIDs) - persistent and unique identifiers for referencing
  a research resource. A critical goal of the RII is the widespread adoption of RRIDs
  to cite resources in the biomedical literature and other places that reference their
  generation or use. RRIDs use established community identifiers where they exist,
  and are cross-referenced in the RII system where more than one identifier exists
  for a single resource.
