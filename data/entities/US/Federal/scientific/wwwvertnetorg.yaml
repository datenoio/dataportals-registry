description: VertNet is a NSF-funded collaborative project that makes biodiversity
  data free and available on the web. VertNet is a tool designed to help people discover,
  capture, and publish biodiversity data. It is also the core of a collaboration between
  hundreds of biocollections that contribute biodiversity data and work together to
  improve it. VertNet is an engine for training current and future professionals to
  use and build upon best practices in data quality, curation, research, and data
  publishing.
