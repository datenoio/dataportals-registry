description: The Precipitation Processing System (PPS) evolved from the Tropical Rainfall
  Measuring Mission (TRMM) Science Data and Information System (TSDIS). The purpose of the
  PPS is to process, analyze and archive data from the Global Precipitation Measurement (GPM)
  mission, partner satellites and the TRMM mission. The PPS also supports TRMM by providing
  validation products from TRMM ground radar sites.
