description: 'The Hymenoptera Genome Database (HGD) is a genome informatics resource
  that supports the research of insects of the order Hymenoptera (e.g. bees, wasps,
  ants). HGD is divided into three main divisions: BeeBase, which hosts bee genomes
  and the Bee Pests and Pathogens resource; NasoniaBase, which hosts the genome of
  the Jewel wasp (Nasonia vitripennis); and the Ant Genomes Portal, which hosts the
  genomes of several ant species.'
