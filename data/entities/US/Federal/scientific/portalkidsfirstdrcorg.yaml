description: The Common Fund’s Gabriella Miller Kids First Pediatric Research Program
  (Kids First) has developed the Kids First Data Resource, a large-scale data resource
  to help researchers uncover new insights into the biology of childhood cancer and
  structural birth defects. It provides clinically annotated genomic data and is integrated
  with several tools to accelerate pediatric disease research. The Kids First Data
  Resource Portal allows users to query, or search, Kids First datasets, build virtual
  cohorts, or collections, of individual participants, and identify datasets for analysis.
  CAVATICA, built by Seven Bridges Genomics, allows users to run bioinformatics workflows
  in a cloud-based environment.
