description: The Polyhedron Database is a plain-text database of polyhedra (3D geometric
  solids). The numeric data is normally accurate to about 1e-11. The solids include
  the regular polyhedra (0-8), Archimedean (9-21), some prisms and anti-prisms (22-31),
  Archimdean duals (32-44), the Johnson solids (all convex polyhedra with regular
  faces, 45-136) and some weird solids (137-141).
