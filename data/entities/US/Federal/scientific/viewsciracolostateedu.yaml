description: The Federal Land Manager Environmental Database (FED) is an environmental
  data platform developed by the Cooperative Institute for Research in the Atmosphere
  at Colorado State University. It provides access to air quality, atmospheric, and
  emissions-related data to support federal land managers in assessing environmental
  impacts, particularly visibility and air pollution effects on protected areas. The
  database integrates monitoring data, modeling outputs, and analytical tools to assist
  in regulatory and environmental decision-making.
