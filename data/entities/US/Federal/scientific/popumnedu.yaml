description: 'The Minnesota Population Center (MPC) is a University-wide interdisciplinary
  cooperative for demographic research. The MPC serves more than 80 faculty members and research
  scientists from eight colleges and institutes at the University of Minnesota. As a leading
  developer and disseminator of demographic data, we also serve a broader audience of some
  50,000 demographic researchers worldwide. MPC is a DataONE member node: https://search.dataone.org/#profile/US_MPC.'
