description: NASA's OceanColor Web is in charge of the collection, processing, calibration,
  validation, archive and distribution of ocean-related products from a large number
  of operational, satellite-based remote-sensing missions providing ocean color, sea
  surface temperature and sea surface salinity data to the international research
  community since 1996. The OB.DAAC is one of the Earth Observing System Data and
  Information System (EOSDIS) Distributed Active Archive Centers (DAACs) that archive
  and distribute earth science data, managed by NASA's Earth Science Data and Information
  System Project (ESDIS), as part of the Earth Science Data Systems (ESDS) Program.
