description: AIRS, the Atmospheric Infrared Sounder on NASA's Aqua satellite, gathers
  infrared energy emitted from Earth's surface and atmosphere globally, every day.
  Its data provides 3D measurements of temperature and water vapor through the atmospheric
  column along with a host of trace gases, surface and cloud properties. AIRS data
  are used by weather prediction centers around the world to improve their forecasts.
  They are also used to assess the skill of climate models and in applications ranging
  from volcanic plume detection to drought forecasting.
