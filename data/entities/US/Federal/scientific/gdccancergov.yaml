description: The National Cancer Institute’s (NCI’s) Genomic Data Commons (GDC) is
  a data sharing The National Cancer Institute's Genomic Data Commons (GDC) was created
  to promote precision medicine in oncology. It supports the import and standardization
  of genomic and clinical data from cancer research programs. The GDC contains NCI-generated
  data from some of the largest and most comprehensive cancer genomic datasets, including
  The Cancer Genome Atlas (TCGA) and Therapeutically Applicable Research to Generate
  Effective Therapies (TARGET). For the first time, these datasets have been harmonized
  using a common set of bioinformatics pipelines, so that the data can be directly
  compared. As a growing knowledge system for cancer, the GDC also enables researchers
  to submit data, and harmonizes these data for import into the GDC.
