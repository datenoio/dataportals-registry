description: The IEDB provides the scientific community with a central repository
  of freely accessible epitope data and epitope prediction and analysis resources.
  The IEDB is a publicly accessible, comprehensive immune epitope database containing
  peptidic linear and conformational epitopes and non peptidic epitopes such as lipids,
  metals, drugs, carbohydrates, etc, with published or submitted antibody, T cell,
  MHC binding or MHC ligand elution experimental assays. Epitope data related to infectious
  diseases, allergy, autoimmunity and transplant tested in humans, non human primates,
  and any other species can be found in the IEDB.
