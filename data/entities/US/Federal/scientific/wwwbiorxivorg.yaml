description: bioRxiv is a free online archive and distribution service for unpublished
  preprints in the life sciences. It is operated by Cold Spring Harbor Laboratory,
  a not-for-profit research and educational institution. By posting preprints on bioRxiv,
  authors are able to make their findings immediately available to the scientific
  community and receive feedback on draft manuscripts before they are submitted to
  journals. Articles in the physical sciences, mathematics, or social sciences should
  only be posted on bioRxiv if they have direct relevance to the life sciences. Articles
  in these areas that are not relevant to life sciences should instead be posted on
  servers such as arXiv, which bioRxiv is intended to complement.
