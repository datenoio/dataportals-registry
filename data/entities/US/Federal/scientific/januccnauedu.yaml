description: The Census provides information about edge-transitive graphs of degree
  4. This fourth edition shows graphs of up to 512 vertices. The main part of the
  census is the Table, which is a list of all graphs in the census with the name,
  the size of the symmetry group, girth, diameter and other information. Each line
  has a link to an individual page for that graph, with more information about the
  graph. A spreadsheet version of the Table is available, and a MAGMA version of the
  Census itself is also available. In either form, the Table is the place to browse
  for graphs of a certain Order.
