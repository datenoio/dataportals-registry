description: The AD Knowledge Portal is a platform for accessing data, analyses, and
  tools that the National Institute on Aging’s (NIA) Alzheimer's Disease Translational
  Research Program generates through several initiatives. The program encourages open-science
  collaborations that share resources early in the research life cycle. The AD Knowledge
  Portal initially hosted data from the Accelerating Medicines Partnership in Alzheimer’s
  Disease (AMP-AD) Target Discovery and Preclinical Validation Project. The AD Knowledge
  Portal now includes “omics” data from human samples and experimental model systems,
  as well as bioinformatic analyses from research teams and cross-consortium working
  groups. Please note that, while the data are publicly searchable, a login is required
  to download data sets.
