description: The Multi-angle Imaging SpectroRadiometer (MISR) measurements are designed to
  improve understanding of the Earth’s environment and climate. MISR provides radiometrically
  and geometrically calibrated images in four spectral bands at each of nine widely-spaced
  angles. Spatial sampling of 275 and 1100 meters is provided on a global basis. All MISR
  data products are available in HDF-EOS format, and select products are available in netCDF
  format.
