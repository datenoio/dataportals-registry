description: The Alaska Satellite Facility is a data processing facility and satellite-tracking
  ground station within the Geophysical Institute at the University of Alaska Fairbanks.
  The facility’s mission is to make remote-sensing data accessible. Its work is central
  to polar processes research including wetlands, glaciers, sea ice, climate change,
  permafrost, flooding and land cover such as changes in the Amazon rainforest. The
  ASF DAAC is one of the Earth Observing System Data and Information System (EOSDIS)
  Distributed Active Archive Centers (DAACs) that archive and distribute earth science
  data, managed by NASA's Earth Science Data and Information System Project (ESDIS),
  as part of the Earth Science Data Systems (ESDS) Program.
