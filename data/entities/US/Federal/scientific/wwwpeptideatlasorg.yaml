description: The PeptideAtlas Project provides a publicly-accessible database of peptides
  identified in tandem mass spectrometry proteomics studies and software tools. Mass
  spectrometer output files are collected for human, mouse, yeast, and several other
  organisms, and sequence and spectral library searches are applied. Analyses are
  performed to produce a probability of correct identification for all results in
  a uniform manner, together with false discovery rates at the whole-atlas level.
