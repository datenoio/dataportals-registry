description: The National Center for Health Statistics (NCHS) Data Query System (DQS)
  is a free online tool that provides quick access to thousands of health estimates
  across more than 180 topics. It allows users to filter data by age, sex, race, data
  source, time period, and visualize results in tables, charts and maps. DQS is designed
  to simplify data discovery, enabling benchmarking, trend analysis, disparity research,
  program planning and evidence-based policy decisions.
