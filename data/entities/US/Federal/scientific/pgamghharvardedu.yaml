description: 'PrimerBank is a public resource for PCR primers. These primers are designed
  for gene expression detection or quantification (real-time PCR). PrimerBank contains
  over 306,800 primers covering most known human and mouse genes. There are several
  ways to search for primers: GenBank Accession, NCBI protein accession, NCBI Gene
  ID, Gene Symbol, PrimerBank ID or Keyword (gene description) or you can blast your
  gene sequence against the primerbank Sequence DB.'
