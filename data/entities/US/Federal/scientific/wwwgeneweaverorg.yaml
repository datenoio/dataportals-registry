description: The GeneWeaver data and analytics website is a publically available resource
  for storing, curating and analyzing sets of genes from heterogeneous data sources.
  The system enables discovery of relationships among genes, variants, traits, drugs,
  environments, anatomical structures and diseases implicitly found through gene set
  intersections. By enumerating the common and distinct biological molecules associated
  with all subsets of curated or user submitted groups of gene sets and gene networks,
  GeneWeaver empowers users with the ability to construct data driven descriptions
  of shared and unique biological processes, diseases and traits within and across
  species.
