description: 'MetaCyc is the largest curated collection of metabolic pathways currently
  available. It provides a comprehensive resource for metabolic pathways and enzymes
  from all domains of life. The pathways in MetaCyc are experimentally determined,
  small-molecule metabolic pathways, and are curated from the primary scientific literature.
  Most reactions in MetaCyc pathways are linked to one or more well-characterized
  enzymes, and both pathways and enzymes are annotated with reviews, evidence codes,
  and literature citations.  As of 2025 MetaCyc describes 3,260 pathways and 20,040
  reactions curated from 80,000 publications.

  MetaCyc is a general reference on metabolic pathways, and is used for metabolic
  reconstruction from sequenced genomes, and for gap-filling metabolic models.'
