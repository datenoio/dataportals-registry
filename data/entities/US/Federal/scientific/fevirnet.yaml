description: The Fast Evidence Interoperability Resources (FEvIR) Platform is a website
  and cloud-based system for creating, editing, viewing, and sharing scientific knowledge
  in an electronic form designed to standardize data exchange using the Health Level
  Seven International (HL7®) Fast Healthcare Interoperability Resources (FHIR®) standard.
  The FEvIR Platform is in development to support living systematic reviews, living
  guidelines, sharing across citation repositories, knowledge portals, and other projects
  related to scientific communication. The FEvIR Platform includes Builder, Viewer
  and Converter tools that support the creation and visualization of FHIR Resources
  for representing evidence, evidence variables, evidence reports, citations, and
  knowledge artifact assessments. For example, you can use the Citation Builder to
  create a citation by entering data in easy-to-use data entry fields (like Title,
  Abstract, Last revision date, etc.) and the system will automatically create a citation
  record in a FHIR Citation Resource form for machine use. You can use the Citation
  Viewer to view any citation in the FHIR form and view it in an easy-to-understand
  form. And you can use the MEDLINE-to-FEvIR Converter to submit the PubMed Identifier
  (PMID) and the system will create a full FHIR Citation Resource for you automatically.
  To support standard terminologies (called Code Systems) we built a CodeSystem Builder
  and CodeSystem Viewer on the FEvIR Platform.
