description: This project is the first to combine the notion of a data repository
  with real-time visual analytics for interactive data mining and exploratory analysis
  on the web. This large comprehensive collection of data is useful for making significant
  research findings as well as benchmark data sets for a wide variety of applications
  and domains and includes relational, attributed, heterogeneous, streaming, spatial,
  and time series data as well as non-relational machine learning data. All data sets
  are easily downloaded into a standard consistent format. We also have built a multi-level
  interactive visual analytics engine that allows users to visualize and interactively
  explore the data in a free-flowing manner.
