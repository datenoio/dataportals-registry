description: The NIMH Repository and Genomics Resource (NRGR) is the largest biorepository
  supporting genomics in psychiatry, providing access to biomaterials (DNA, plasma,
  RNA, lymphoblastoid cell lines, induced pluripotent stem cells, etc.) and phenotypic
  data collected from nearly 200,000 well-characterized, high-quality control and
  patient samples from a wide-range of mental illnesses across ancestrally diverse
  populations. The NRGR also provides access to some genomic data sets, including
  some which do not have biosamples available in the repository, such as data sets
  generated by the Psychiatric Genomics Consortium, the CommonMind Consortium, and
  the PsychENCODE consoritum.
