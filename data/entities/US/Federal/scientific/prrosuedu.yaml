description: The Polar Rock Repository (PRR) is a research collection hosted by the
  Byrd Polar and Climate Research Center at Ohio State University, funded by the National
  Science Foundation’s Office of Polar Programs. It offers access to over 60,000 rock,
  core and dredge samples collected from Antarctica and the Southern Ocean, along
  with associated field notes, maps, thin sections and media. The online database
  enables researchers and educators to discover and request these materials for study
  or teaching.
