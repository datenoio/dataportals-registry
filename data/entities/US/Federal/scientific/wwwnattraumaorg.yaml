description: The National Trauma Research Repository (NTRR) is a comprehensive web
  platform for uploading and managing research datasets to support data sharing among
  trauma investigators. The Coalition for National Trauma Research (CNTR) is leading
  this collaborative effort funded by the Department of Defense (DoD) to advance trauma
  care. Investigators at the National Trauma Institute (NTI), in collaboration with
  the National Institutes of Health Center for Information Technology and Sapient
  Government Services, are creating the centralized, cloud-based data repository and
  discovery portal of trauma research data from numerous studies conducted throughout
  the United States.  The NTRR enables researchers to share data and collaborate on
  secondary analyses as well as combine and analyze data across studies. The repository
  is also a resource for researchers in developing data sharing plans to meet new
  funding and publishing requirements.
