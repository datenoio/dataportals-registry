description: Since 2016, the IMG/VR database has provided access to the largest collection
  of viral sequences obtained from (meta)genomes. The 3rd version of IMG/VR (Sept
  2020) is composed of 18,373 cultivated and 2,314,329 uncultivated viral genomes
  (UViGs), nearly tripling the total number of sequences compared to the previous
  version. UViGs in IMG/VR are reported as single viral contigs, integrated proviruses,
  or genome bins, and are annotated with a new standardized pipeline including genome
  quality estimation using CheckV, taxonomic classification reflecting the latest
  ICTV update, and expanded host taxonomy prediction. The new IMG/VR interface enables
  users to efficiently browse, search, and select UViGs based on genome features and/or
  sequence similarity.
