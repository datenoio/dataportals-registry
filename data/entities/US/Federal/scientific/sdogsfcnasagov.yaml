description: The Solar Dynamics Observatory (SDO) is a NASA mission launched in 2010
  to study the Sun and its influence on Earth and the solar system. It continuously
  observes the Sun in high resolution, capturing detailed images and measurements
  of the solar atmosphere, magnetic fields, and energy output. SDO data helps scientists
  understand solar activity such as sunspots, flares, and coronal mass ejections.
  The mission provides open, real-time data that supports both scientific research
  and space-weather forecasting.
