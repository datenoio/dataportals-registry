description: The SAP Data Catalog provides a searchable inventory of confidential
  datasets held by the 16 U.S. federal statistical agencies, describing each dataset's
  content, methodology, access conditions, and availability. Rather than storing the
  data itself, the catalog helps researchers discover relevant data assets and submit
  standardized applications for access to restricted-use datasets. It is designed
  to streamline and harmonize access to confidential federal statistical data for
  approved research projects.
