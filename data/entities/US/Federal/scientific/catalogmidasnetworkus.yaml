description: The MIDAS Catalog is a web-based platform hosted by the MIDAS (Models
  of Infectious Disease Agent Study) Network Coordination Center that provides information
  on a curated collection of resources (e.g., datasets, software, repositories, etc.)
  pertinent to the field of infectious disease modeling, along with access to the
  MIDAS Curated Archive of Global Public Health Data, which is an archive of worldwide
  official public health data retrieved from ministries of health, public health agencies,
  and other governmental websites. Each entry in the Catalog contains key information
  about the resource, such as a detailed description of the software or dataset content
  (language, geographic region, time frame, topics, license, etc.), link to the resource,
  information about related data, information about creators, downloadable data (for
  the Curated Archive only), and more.
