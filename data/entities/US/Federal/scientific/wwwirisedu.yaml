description: IRIS offers free and open access to a comprehensive data store of raw geophysical
  time-series data collected from a large variety of sensors, courtesy of a vast array of
  US and International scientific networks, including seismometers (permanent and temporary),
  tilt and strain meters, infrasound, temperature, atmospheric pressure and gravimeters, to
  support basic research aimed at imaging the Earth's interior. IRIS has merged with UNAVCO
  to form EarthScope Consortium!
