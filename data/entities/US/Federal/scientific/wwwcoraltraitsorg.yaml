description: The Coral Trait Database is a growing compilation of scleractinian coral
  life history trait, phylogenetic and biogeographic data. It is an open source research
  initiative that aims to make all observations and measurements of Scleractinian
  corals accessible in order to more rapidly advance coral reef science. Anyone collecting
  coral trait data (e.g., collected in field and laboratory studies, extracted from
  the literature, or by other means) can join and contribute to the growing data compilation.
  The citation system has been carefully designed to ensure full transparency about
  the origin of each individual data point as well as larger data compilations of
  other peoples' data (such as data extracted from literature for meta-analyses).
