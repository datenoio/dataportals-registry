description: OpenWorm aims to build the first comprehensive computational model of the Caenorhabditis
  elegans (C. elegans), a microscopic roundworm. With only a thousand cells, it solves basic
  problems such as feeding, mate-finding and predator avoidance. Despite being extremely well
  studied in biology, this organism still eludes a deep, principled understanding of its biology.
