description: The Climate Hazards Center (CHC) supports integrated research focused
  on understanding, anticipating, preparing for, and responding to climate hazards,
  with regional foci on developing countries in Africa, South/Central America, and
  Asia, as well as the Western US. Three geographic domains— climate, hazards, and
  spatial methods—form the core competencies, or pillars, of the CHC. The CHC Data
  Archive stores the data generated by the CHC.
