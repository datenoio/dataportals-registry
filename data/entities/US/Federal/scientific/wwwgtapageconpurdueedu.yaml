description: The GTAP Database is a globally consistent set of economic accounts,
  covering bilateral trade, production, consumption, and intermediate use of goods
  and services. It also includes information on taxes, subsidies, trade protection,
  and transport margins. Extensions provide additional data on land use, energy, emissions,
  and other policy-relevant issues. This comprehensive dataset supports research on
  trade, environment, climate, and global economic policy.
