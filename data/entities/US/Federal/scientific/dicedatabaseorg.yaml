description: The DICE (Database of Immune Cell Expression, Expression quantitative
  trait loci (eQTLs) and Epigenomics) project aims to understand the role of common
  genetic variations in human disease by (i) generating reference transcriptomic and
  epigenomic maps in human immune cell types from healthy subjects, (ii) identifying
  functional single nucleotide polymorphisms (SNPs) that affect gene expression (eQTLs
  and chromatin QTLs) in immune cells, and (iii) identifying regulatory mechanisms
  and novel target genes implicated in the development of human disease. These datasets
  will help reveal the effects of disease risk-associated genetic polymorphisms on
  specific immune cell types, providing mechanistic insights into pathogenesis.
