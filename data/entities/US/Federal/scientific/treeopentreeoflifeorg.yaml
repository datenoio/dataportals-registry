description: The tree of life links all biodiversity through a shared evolutionary history.
  This project will produce the first online, comprehensive first-draft tree of all 1.8 million
  named species, accessible to both the public and scientific communities. Assembly of the
  tree will incorporate previously-published results, with strong collaborations between computational
  and empirical biologists to develop, test and improve methods of data synthesis.
