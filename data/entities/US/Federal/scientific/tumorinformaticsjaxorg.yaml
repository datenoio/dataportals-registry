description: 'The Mouse Tumor Biology (MTB) Database supports the use of the mouse
  as a model system of human cancers by providing access to information on and data
  for: spontaneous and induced tumors in mice, genetically defined mice (inbred, hybrid,
  mutant, and genetically engineered strains of mice) in which tumors arise, genetic
  factors associated with tumor susceptibility in mice, somatic genetic-mutations
  observed in tumors, and Patient Derived Xenograft (PDX) models.'
