description: OpenAltimetry is a cyberinfrastructure platform for discovery, access,
  and visualization of data from NASA’s ICESat and ICESat-2 missions. These laser
  profiling altimeters are being used to measure changes in the topography of Earth’s
  ice sheets, vegetation canopy structure, and clouds and aerosols. A new paradigm
  for data access was required to serve the needs of a diverse scientific community
  seeking to take advantage of these unique observations. OpenAltimetry, which is
  the product of a collaboration between UNAVCO, the National Snow and Ice Data Center
  (NSIDC), the Scripps Institution of Oceanography and San Diego Supercomputer Center
  at UC San Diego, was custom-built to meet these needs.
