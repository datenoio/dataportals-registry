description: The Vaccine Investigation and Online Information Network (VIOLIN) is
  a web-based central resource that integrates vaccine literature data mining, vaccine
  research data curation and storage, and curated vaccine data analysis for vaccines
  and vaccine candidates developed against various pathogens of high priority in public
  health and biological safety. The vaccine data includes research data from vaccine
  studies using humans, natural and laboratory animals. VIOLIN annotates, extracts
  and stores vaccine-related, peer-reviewed papers from PubMed. The curated vaccine-related
  information contains many categories such as general pathogenesis, protective immunity,
  vaccine preparation and characteristics, host responses including vaccination protocol
  and efficacy against virulent pathogen infections. All data within the database
  is edited manually and is derived primarily from peer-reviewed publications. The
  curated data is stored in a relational database and can be queried using various
  VIOLIN search programs.
