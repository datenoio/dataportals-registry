description: Climate is controlled by the amount of sunlight absorbed by Earth and
  the amount of infrared energy emitted to space. These quantities–together with their
  difference–define Earth’s radiation budget (ERB). The Clouds and the Earth’s Radiant
  Energy System (CERES) project provides satellite-based observations of ERB and clouds.
  It uses measurements from CERES instruments flying on several satellites along with
  data from many other instruments to produce a comprehensive set of ERB data products
  for climate, weather and applied science research.
