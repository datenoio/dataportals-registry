description: The Primate Aging Database (PAD) is a web-based searchable database that
  contains body composition, blood chemistry, and other biological data collected
  across the lifespans of healthy non-human primates (NHPs) in captivity and in wild
  populations. The PAD was developed to study aging in NHPs and can be used for analyses
  of species and sex differences in normal aging processes, the examination of the
  impact of diet and environment on aging, studies on biomarkers of aging, and the
  establishment of a normal range for comparison to values obtained from experimental
  or diseased groups.
