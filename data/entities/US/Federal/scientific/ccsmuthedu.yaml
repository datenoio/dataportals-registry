description: SPASCER was designed to help understand the heterogeneity of tissue organizations,
  region-specific microenvironment, and intercellular interactions across tissue architectures
  at multiple levels. SPASCER contains datasets from 43 studies, including 1 082 sub-datasets
  from 16 organ types across four species. scRNA-seq was integrated to deconvolve/map
  spatial transcriptomics, and processed with spatial cell-cell interaction, gene
  pattern and pathway enrichment analysis. Cell-cell interactions and gene regulation
  network of scRNA-seq from matched spatial transcriptomics were performed as well.
