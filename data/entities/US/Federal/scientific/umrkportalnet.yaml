description: 'UMRK is a PostgreSQL database consisting of a series of eight tables:
  g_data: data for simple complex Lie algebras; orbit_data: data for nilpotent orbits
  of simple complex Lie algebras; wrep_data: data for the irreducible representations
  of Weyl groups of simple complex Lie algebras; ss_data: data for the root subsystems
  of simple complex Lie algebras; levi_data: data for the Levi subsystems of simple
  complex Lie algebras; psilevi_data: data for pseudo-Levi subsubsystems (corresponding
  to subsets of the extended simple roots); realform_data: data for the real forms
  simple complex Lie algebras; wcc_data : data for the conjugacy classes of Weyl groups
  of simple complex Lie algebras.'
