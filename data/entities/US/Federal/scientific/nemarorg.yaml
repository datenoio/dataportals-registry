description: NEMAR (Neuroelectromagnetic Data Archive and Tools Resource) is a repository
  and computational resource for sharing, visualizing, and analyzing human neuroelectromagnetic
  data, including electroencephalography (EEG), magnetoencephalography (MEG), and
  intracranial electrophysiology datasets. NEMAR supports FAIR data sharing through
  the use of community standards and provides tools for data exploration, processing,
  and reuse.
