description: 'The Argo observational network consists of a fleet of 3000+ profiling autonomous
  floats deployed by about a dozen teams worldwide. WHOI has built about 10% of the global
  fleet. The mission lifetime of each float is about 4 years. During a typical mission, each
  float reports a profile of the upper ocean every 10 days. The sensors onboard record fundamental
  physical properties of the ocean: temperature and conductivity (a measure of salinity) as
  a function of pressure.'
