description: An online mathematical database and reference on congruence subgroups
  of the group PSL(2, ℤ) — a fundamental object in number theory and the theory of
  modular forms. It presents tables and data for congruence subgroups of the modular
  group PSL(2, ℤ), including information such as group level, index, genus, and other
  structural invariants, and includes links to sub-tables, statistics, and often accompanying
  MAGMA code used to generate and analyze the groups.
