description: The purpose of this project is to identify differences in healthcare
  access and use and predictors of health behaviors for youth in foster care compared
  to demographically similar youth never in foster care, using data elements that
  are commonly available in the electronic health record and child welfare record,
  with the long-term goal of supporting the delivery of prevention and intervention
  efforts to promote health equity for young people in foster care. Summary data is
  provided to promote transparency and open data sharing. To encourage collaboration
  and additional analysis, beyond summary and descriptive data, to answer questions
  about healthcare delivery and addressing health needs that will promote evidence-based
  practice and healthcare delivery decisions, these data are made available through
  a data use agreement with the PI, Sarah Beal (sarah.beal@cchmc.org).
