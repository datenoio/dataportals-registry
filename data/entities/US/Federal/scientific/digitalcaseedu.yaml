description: The Kelvin Smith Library Digital Collections is the institutional digital
  repository of Case Western Reserve University. It provides access to digitized archival
  materials, historical photographs, manuscripts, university records, rare books,
  and other special collections preserved by the library. The platform supports research,
  teaching, and public access by making curated digital representations of unique
  cultural and historical resources available online. It serves as a discovery and
  preservation system for materials documenting the history of the university and
  broader regional and scholarly communities.
