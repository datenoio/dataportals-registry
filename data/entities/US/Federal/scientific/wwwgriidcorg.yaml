description: GRIIDC is a multidisciplinary data repository that stores and disseminates
  data primarily collected or generated from the Gulf of Mexico region. Data can be
  searched and downloaded for free and data can be stored for a fee. Datasets are
  assigned digital object identifiers and are described with ISO-19115-2 metadata.
  Our mission is to ensure a data and information legacy that promotes continual scientific
  discovery and public awareness of coastal and marine ecosystems.
