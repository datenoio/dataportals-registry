description: The NHGRI Genomic Data Science Analysis, Visualization, and Informatics
  Lab-space (AnVIL) is a unified computing environment for genomics data storage,
  management, and analysis. The AnVIL is a federated cloud platform designed to manage
  and store genomics and related data, enable population-scale analysis, and facilitate
  collaboration through the sharing of data, code, and analysis results. By inverting
  the traditional model of data sharing, the AnVIL eliminates the need for data movement
  while also adding security measures for active threat detection and monitoring and
  provides scalable, shared computing resources for any researcher. The core data
  management and analysis components of the AnVIL currently consists of Terra, Gen3,
  Galaxy, RStudio/Bioconductor, Dockstore, and Jupyter. In addition, several flagship
  genomics datasets are available within the AnVIL. The AnVIL is intended to create
  opportunities for analysis, collaboration, and data sharing that are needed to drive
  research and to make discoveries through the joint analysis of genomes together
  with associated clinical and molecular data types.
