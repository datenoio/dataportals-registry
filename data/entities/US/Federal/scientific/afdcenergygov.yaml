description: The Alternative Fuels Data Center (AFDC) provides a wealth of information
  and data on alternative and renewable fuels, advanced vehicles, fuel-saving strategies,
  and emerging transportation technologies. This site features interactive tools,
  calculators, and mapping applications to aid in the implementation of these fuels,
  vehicles, and strategies. The AFDC functions as a dynamic online hub, providing
  information, tools, and resources for transportation decision makers seeking domestic
  alternatives that diversify energy sources and help businesses make wise economic
  choices.
