description: This is a data archive funded by the NIH BRAIN Initiative, to ingest,
  harmonize, aggregate, store, visualize, and disseminate human invasive neurophysiology
  data, including EEG, ECoG, LFP, single unit activity, etc. The archive also houses
  synchronized behavioral, imaging, demographic, and other key data. The archive is
  specifically designed to help BRAIN Initiative researchers organize and analyze
  their data while fulfilling data-sharing directives from federal agencies and their
  respective institutions.
