description: REGARDS is an observational study of risk factors for stroke in adults 45 years
  or older. 30,239 participants were recruited between January 2003 and October 2007. They
  completed a telephone interview followed by an in-home physical exam. Measurements included
  traditional risk factors such as blood pressure and cholesterol levels, and an echocardiogram
  of the heart.
