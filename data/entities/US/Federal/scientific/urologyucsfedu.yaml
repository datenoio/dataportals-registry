description: CaPSURE™ is a longitudinal, observational study of approximately 15,000 men with
  all stages of biopsy-proven prostate cancer. Patients have enrolled at 43 community urology
  practices, academic medical centers, and VA hospitals throughout the United States since
  1995. CEASAR stands for Comparative Effectiveness Analysis of Surgery and Radiation. The
  ongoing goal of CEASAR is to help learn more about what prostate cancer treatments work
  best, for which patients, in whose hands.
