description: The goal of NGEE–Arctic is to reduce uncertainty in projections of future climate
  by developing and validating a model representation of permafrost ecosystems and incorporating
  that representation into Earth system models. The new modeling capabilities will improve
  our confidence in model projections and will enable scientist to better respond to questions
  about processes and interactions now and in the future.
