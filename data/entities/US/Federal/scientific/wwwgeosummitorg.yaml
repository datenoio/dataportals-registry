description: Greenland Environmental Observatory (GEOSummit) provides long term year round
  data on core atmospheric measurements, spatial phenomena, ice sheets, and the Arctic Environment.
  These data are available to researchers through the National Science Foundation's Science
  Coordination Office (SCO) which coordinates all research at GEOSummit. Currently there is
  not a central platform for multi-collaborator data distribution.
