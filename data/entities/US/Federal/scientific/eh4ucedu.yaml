description: The Chromium Epigenomics Toxicology (EpiCrDB) database contains a variety
  of epigenomics experimental assays relating to research on how Cr(VI) perturbs chromatin
  organization and dynamics. This data is used in reseach into how its toxicity may
  be attributed to epigenetic carcinogenicity. Manually-annotated sample and experiment
  metadata is included to facilitate FAIR data access. Hexavalent chromium [Cr(VI)]
  compounds are well-established respiratory carcinogens utilized in industrial processes.
  While inhalation exposure constitutes an occupational risk affecting mostly chromium
  workers, environmental exposure from drinking water contamination is a widespread
  gastrointestinal carcinogen, affecting millions of people throughout the world.
  The mechanism of action of Cr(VI) at the molecular level is poorly understood.
