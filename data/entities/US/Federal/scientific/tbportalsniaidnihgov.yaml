description: NIAID’s TB Portals Program is a multi-national collaboration for TB data
  sharing and analysis to advance TB research. As a global consortium of clinicians,
  scientists, and IT professionals from 77 sites in 20 countries throughout eastern
  Europe, Asia, and sub-Saharan Africa, the TB Portals Program is a web-based, open-access
  repository of multi-domain TB data and tools for its analysis. Researchers can find
  linked socioeconomic/geographic, clinical, laboratory, radiological, and genomic
  data from over 19,000 international published TB patient cases with an emphasis
  on drug-resistant tuberculosis.
