description: The OpenMadrigal project seeks to develop and support an on-line database for
  geospace data. The project has been led by MIT Haystack Observatory since 1980, but now
  has active support from Jicamarca Observatory and other community members. Madrigal is a
  robust, World Wide Web based system capable of managing and serving archival and real-time
  data, in a variety of formats, from a wide range of ground-based instruments.
