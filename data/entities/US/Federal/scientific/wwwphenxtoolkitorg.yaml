description: The PhenX (consensus measures for Phenotypes and eXposures) Toolkit is
  a web-based catalog of recommended, standard measures of phenotypes and environmental
  exposures for use in biomedical research. The PhenX Toolkit offers well-established,
  broadly validated measures of phenotypes and exposures relevant to investigators
  in human genomics, epidemiology, and biomedical research. The measures in the Toolkit
  are selected by Working Groups of domain experts using a consensus process. The
  Toolkit provides detailed protocols, information about the measures, and tools to
  help investigators incorporate PhenX measures into their studies.
