description: 'The UniPROBE (Universal PBM Resource for Oligonucleotide Binding Evaluation)
  database hosts data generated by universal protein binding microarray (PBM) technology
  on the in vitro DNA binding specificities of proteins.

  We have retained the status of this resource as ''Ready'', however please note the
  following message from the UniPROBE developers: We are aware that certain functionalities,
  such as various web tools, on the UniPROBE webpages are currently not working. You
  should nevertheless be able to download the PBM data; please contact us if you are
  unable to download any of the data and we will help you to get access to the data.
  UniPROBE is currently an unfunded, publicly available resource. Please let us know
  if you are interested in volunteering to further develop UniPROBE in a dedicated
  capacity, such as a self-funded Masters or PhD thesis project.'
