description: The National Map provides access to base geospatial information to describe
  the landscape of the United States and its territories. The National Map supports
  data download, digital and print versions of topographic maps, geospatial data services,
  and online viewing. The geographic information available from The National Map includes
  boundaries, elevation, geographic names, hydrography, land cover, orthoimagery,
  structures, and transportation. The majority of The National Map effort is devoted
  to acquiring and integrating medium-scale (nominally 1:24,000 scale) geospatial
  data for the eight base layers from a variety of sources and providing access to
  the resulting seamless coverages of geospatial data. The National Map also serves
  as the source of base mapping information for derived cartographic products, including
  1:24,000 scale US Topo maps and georeferenced digital files of scanned historic
  topographic maps.
