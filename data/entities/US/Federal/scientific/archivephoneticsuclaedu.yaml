description: The UCLA Phonetics Archive is a digital repository that preserves and
  provides access to speech recordings and related linguistic materials from a wide
  variety of languages around the world. The archive supports research in phonetics,
  phonology, linguistics, and language documentation by making audio recordings and
  associated metadata available to researchers, educators, and students. Many of the
  collections document endangered or underrepresented languages, contributing to their
  long-term preservation and study. The archive serves as both a research resource
  and a historical record of linguistic diversity.
