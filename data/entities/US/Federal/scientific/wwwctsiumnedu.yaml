description: The data in the U of M’s Clinical Data Repository comes from the electronic health
  records (EHRs) of more than 2 million patients seen at 8 hospitals and more than 40 clinics.
  For each patient, data is available regarding the patient's demographics (age, gender, language,
  etc.), medical history, problem list, allergies, immunizations, outpatient vitals, diagnoses,
  procedures, medications, lab tests, visit locations, providers, provider specialties, and
  more.
