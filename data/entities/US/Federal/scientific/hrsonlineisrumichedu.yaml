description: The Health and Retirement Study (HRS) is a longitudinal panel study that surveys
  a representative sample of more than 26,000 Americans over the age of 50 every two years.
  The study has collected information about income, work, assets, pension plans, health insurance,
  disability, physical health and functioning, cognitive functioning, genetic information
  and health care expenditures.
