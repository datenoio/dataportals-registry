description: Data Sharing for Demographic Research (DSDR) supports the demographic
  community by disseminating, archiving, and preserving data relevant for population
  studies. The mission of DSDR is to serve as a locus of information for researchers
  who collect, analyze, and distribute primary data as well as researchers who analyze
  secondary data. DSDR aims to foster interdisciplinary collaborations between Demography
  and other disciplines. DSDR is located within ICPSR and supported by the Population
  Dynamics Branch (PDB) of the Eunice Kennedy Shriver National Institute of Child
  Health and Human Development (U24 HD048404).
