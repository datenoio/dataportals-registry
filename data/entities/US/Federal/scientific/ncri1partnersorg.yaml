description: The PRO-ACT database is an open-access repository of anonymized clinical
  trial data focused on amyotrophic lateral sclerosis (ALS). It compiles patient-level
  information from multiple Phase II and Phase III trials, including clinical outcomes,
  demographics, and longitudinal disease progression measures. The database is designed
  to support biomedical research, particularly statistical analysis and machine learning
  approaches to understand ALS progression.
