description: BIOS is a system designed to enable the management, visualization, and analysis
  of biogeographic data collected by the California Department of Fish and Wildlife and its
  partner organizations. BIOS integrates GIS, relational database management, and ESRI's ArcGIS
  Server technology to create a statewide, integrated information management tool that can
  be used on any computer with access to the Internet.
