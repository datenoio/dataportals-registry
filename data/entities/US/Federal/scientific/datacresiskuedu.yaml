description: The Open Polar Radar Data Products is the data repository for the Center
  for Remote Sensing and Integrated Systems (CReSIS) at the University of Kansas,
  hosting radar and geospatial datasets collected over polar and snow regions (e.g.,
  Greenland and Antarctica). The database includes products from multiple radar systems
  like accumulation radar, snow radar, and radar depth sounders that help map ice
  sheets, snow, and related features.
