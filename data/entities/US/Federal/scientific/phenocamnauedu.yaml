description: The PhenoCam database is an open, global network of ground‑based digital
  cameras that continuously capture and archive time‑lapse images of vegetation to
  monitor seasonal changes and plant phenology (e.g., leaf emergence and senescence).
  These imagery and derived data products provide detailed, near‑surface observations
  of ecosystem dynamics across diverse biomes, supporting ecological research on vegetation
  patterns and climate impacts.
