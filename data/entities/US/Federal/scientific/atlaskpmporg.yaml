description: The Kidney Tissue Atlas is a part of the National Institute of Diabetes
  and Digestive and Kidney Diseases (NIDDK), Kidney Precision Medicine Project (KPMP)
  initiative in part of a multi-site collaboration comprised of patients, clinicians,
  and investigators from across the United States. The Atlas Repository provides access
  to the datasets being generated by KPMP. The datasets available in the repository
  are a combination of raw and processed data from KPMP participant biopsies and reference
  tissue samples. Datasets are routinely added as they are generated and QCed prior
  to release.
