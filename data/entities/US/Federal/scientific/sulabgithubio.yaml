description: Drug Mechanism Database (DrugMechDB) compiles curated mechanism of action
  linking a drug to a disease. Most drug mechanisms are described simply as a protein
  target, or a pathway, that then treats the disease. However, there are usually more
  steps across a biological knowledge graph required to traverse from the target through
  its mechanism to the reduction of a disease. DrugMechDB catalog a subset of known
  drug-disease indications as a path through a network of biomedical entities.
