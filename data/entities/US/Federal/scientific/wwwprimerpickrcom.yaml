description: Primer PICKR (Publication Integrations for Composite Knowledge Ranking)
  is an open, continuously updated database that converts more than 7,000,000 community-validated
  oligonucleotides from over 400,000 published papers into ranked, ready-to-use RT-qPCR
  primer pairs. Sequences are aligned to reference transcriptomes and assembled into
  pairs across more than 30,000 genes in ten model organisms, including human, mouse,
  rat, pig, cow, rhesus monkey, zebrafish, fruit fly, C. elegans, and Xenopus. Each
  pair is scored on citation frequency, biophysical properties, and primer-pair synergy.
  Experimental validation of 154 human primer pairs spanning the full score distribution
  demonstrated near-perfect amplification success above a PICKR score of 80. Primer
  PICKR is free, open-source, and CC BY 4.0 licensed.
