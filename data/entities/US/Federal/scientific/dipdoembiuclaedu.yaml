description: The database of interacting protein (DIP) database stores experimentally
  determined interactions between proteins. It combines information from a variety
  of sources to create a single, consistent set of protein-protein interactions. The
  data stored within the DIP database were curated, both manually by expert curators
  and automatically using computational approaches that utilize the the knowledge
  about the protein-protein interaction networks extracted from the core DIP data.
