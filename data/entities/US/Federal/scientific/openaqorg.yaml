description: OpenAQ is a global open-access air quality database that aggregates and
  harmonizes real-time and historical ground-level air pollution measurements from
  thousands of sources around the world. It provides this data in a standardized,
  machine-readable format that anyone can access via an interactive map tool (OpenAQ
  Explorer) or the OpenAQ API. They also provide an R client and a Python SDK to access
  the API.
