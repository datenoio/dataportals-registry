description: FILER repository is a database developed by the National Institute on
  Aging Genetics of Alzheimer's Disease Data Storage Site (NIAGADS) with the most
  comprehensive harmonized, indexed, and searchable human functional genomic and annotation
  data collection. FILER is built to provide scalable, streamlined access to massive
  FG data collections across diverse omics data types and assays in consistent, BED-based
  formats. FILER integrates >100,000 genomic data tracks across >1,100 cell types
  curated, harmonized, and integrated from >40 data sources and >50 assay types.
