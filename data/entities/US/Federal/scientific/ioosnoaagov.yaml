description: U.S. IOOS is a vital tool for tracking, predicting, managing, and adapting to
  changes in our ocean, coastal and Great Lakes environment. A primary focus of U.S. IOOS
  is integration of, and expedited access to, ocean observation data for improved decision
  making. The Data Management and Communication (DMAC) subsystem of U.S. IOOS serves as a
  central mechanism for integrating all existing and projected data sources.
