description: The NINDS Human Cell and Data Repository (NHCDR) provides access to fibroblast
  and/or induced pluripotent stem cell (iPSC) lines for a number neurological disorders
  within the NINDS mission as well as healthy controls.  NHCDR also supports access
  to unique iPSC collections from NeuroLINCS, PDBP, LEFFTDS and Target ALS with associated
  metadata.  A GMP-grade iPSC line and corresponding research grade iPSC line are
  also available through the NHCDR.
