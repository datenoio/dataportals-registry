description: 'EarthCube is a community program that advances partnerships and collaborative
  platforms for aimed to increase data sharing across the geoscience community through
  tools, methods, standards, architectures, and creating community connections. GeoCODES
  is an NSF EarthCube program effort to better enable cross-domain discovery of and
  access to geoscience data and research tools. GeoCODES is made up of three components
  respectively: 1) an evolving standard for exposing data called science on schema,
  2) a set of tools to index relevant data from partners within the Council of Data
  Facilities who have adopted science on schema, plus a prototype portal to query
  that data, and 3) a resource registry by which to register and discover relevant
  tools.'
