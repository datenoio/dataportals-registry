description: The Global Unique Device Identification Database (GUDID - pronounced
  "Good ID") is a database administered by the FDA as part of the UDI system. The
  GUDID contains device identification information submitted by device companies to
  the FDA. The GUDID contains ONLY the Device Identifier (DI), which serves as the
  primary key to obtain information in the database. Production Identifiers (PI) are
  not submitted to or stored in the GUDID, but GUDID data indicates which PIs are
  on the device label. Many data elements in the GUDID correspond to information on
  the medical device label. The figure below shows a fictitious medical device label
  and identifies the GUDID data elements that appear on the label. Please refer to
  the FDA UDI website for more information about GUDID data elements.
