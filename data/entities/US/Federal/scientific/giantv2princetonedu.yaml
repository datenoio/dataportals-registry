description: GIANT2 (Genome-wide Integrated Analysis of gene Networks in Tissues)
  is an interactive web server that enables biomedical researchers to analyze their
  proteins and pathways of interest and generate hypotheses in the context of genome-scale
  functional maps of human tissues. With GIANT2, researchers can explore predicted
  tissue-specific functional roles of genes and reveal changes in those roles across
  tissues, all through interactive multi-network visualizations and analyses.
