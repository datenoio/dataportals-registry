description: 'The NIH Common Fund Human Microbiome Project (HMP) was established in
  2008, with the mission of generating resources that would enable the comprehensive
  characterization of the human microbiome and analysis of its role in human health
  and disease. The HMP has characterized the microbial communities found at several
  different sites on the human body: nasal passages, oral cavity, skin, gastrointestinal
  tract, and urogenital tract.'
