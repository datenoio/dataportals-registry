description: MycoBank was created for the mycological community (as well as scientific
  community more generally) to document new mycological names, combinations and associated
  data (such as descriptions and illustrations). Pairwise sequence alignments and
  polyphasic identifications of fungi and yeasts against curated references databases
  are available. Nomenclatural experts will be available to check the validity, legitimacy
  and linguistic correctness of the proposed names in order to avoid nomenclatural
  error. Deposited names can remain confidential until after publication as required.
  Once public, the names are accessible through MycoBank, Index Fungorum, GBIF and
  other international biodiversity initiatives, where they will further be linked
  to other databases. MycoBank will (when applicable) provide onward links to other
  databases containing, for example, living cultures, DNA data, reference specimens
  and pleomorphic names linked to the same holomorph. Authors intending to publish
  nomenclatural novelties are encouraged to contribute.
