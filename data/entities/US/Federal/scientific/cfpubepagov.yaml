description: The ECOTOXicology Knowledgebase (ECOTOX) is a source for locating single
  chemical toxicity data for aquatic life, terrestrial plants and wildlife. ECOTOX
  was created and is maintained by the U.S.EPA's Center for Computational Toxicology
  and Exposure's (CCTE's) Great Lakes Toxicology Ecology Division (GLTED). ECOTOX
  integrates three previously independent databases - AQUIRE, PHYTOTOX, and TERRETOX
  - into a unique system which includes toxicity data derived predominantly from the
  peer-reviewed literature, for aquatic life, terrestrial plants, and terrestrial
  wildlife, respectively.
