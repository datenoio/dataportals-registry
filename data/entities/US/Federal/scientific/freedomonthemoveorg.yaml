description: Freedom on the Move (FOTM) is a free, crowdsourced digital humanities
  database that documents the lives of enslaved people in North America who resisted
  slavery by escaping. It is built from thousands of historical runaway advertisements
  published in newspapers from the colonial period through the U.S. Civil War, preserving
  information about individuals, their families, skills, and acts of resistance. The
  database supports historical research, education, genealogy, and public engagement
  with the history of slavery and freedom.
