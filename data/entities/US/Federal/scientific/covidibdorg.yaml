description: Surveillance Epidemiology of Coronavirus Under Research Exclusion (SECURE-IBD)
  is an international, pediatric and adult database to monitor and report on outcomes
  of COVID-19 occurring in IBD patients. The goals of the registry is to rapidly define
  the impact of COVID-19 on patients with IBD and how factors such as age, comorbidities,
  and IBD treatments impact COVID outcomes.
