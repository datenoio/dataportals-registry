description: The Cacao Genome Database (CGD) is a database storing information on
  the genome of Theobroma cacao. The sequenced genotype, Matina 1-6, is representative
  of the genetic background most commonly found in the cacao producing countries,
  enabling results to be applied to current commercial cultivars. Before viewing the
  data, users have to agree that they will not seek any intellectual property protection
  over the data, including gene sequences contained in the database. The Information
  Access Agreement allows any cacao breeders and other researchers to freely use the
  genome information to develop new cacao varieties. This allows for a level playing
  field and a healthy competitive environment that will ultimately benefit the sustainability
  of cacao production in the long term.
