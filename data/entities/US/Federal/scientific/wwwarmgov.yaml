description: The Atmospheric Radiation Measurement (ARM) Data Archive stores continuous
  measurements—supplemented by field campaigns—and provides data products that promote
  the advancement of climate models. ARM data include routine data products, value-added
  products (VAPs), field campaign data, complementary external data products from
  collaborating programs, and data contributed by ARM principal investigators for
  use by the scientific community. Data quality reports, graphical displays of data
  availability/quality, and data plots are also available from the ARM Data Center.
  These data are available free of charge to the public.
