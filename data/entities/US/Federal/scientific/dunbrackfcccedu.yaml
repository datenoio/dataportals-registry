description: "The Protein Sequence Culling Server (PISCES) is a database with a simple\
  \ filter-and-download interface created to produce lists of sequences from the Protein\
  \ Data Bank (PDB) using a number of entry- and chain-specific criteria and mutual\
  \ sequence identity. The purpose of the database is to provide the longest list\
  \ possible of the highest resolution structures that fulfil certain sequence identity\
  \ and structural quality cut-offs. It uses a combination of PSI-BLAST and structure-based\
  \ alignments to determine sequence identities. PISCES has two ways of producing\
  \ subsets of sequences from larger sets: \n1. Subsets of protein chains and sequences\
  \ culled from the entire PDB according to structure quality and maximum mutual sequence\
  \ identity, and \n2. Subsets of protein chains and sequences culled from a list\
  \ of PDB chains or PDB entries input by the user, according to structure quality\
  \ and maximum mutual sequence identity"
