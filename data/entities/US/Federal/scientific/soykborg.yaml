description: Soybean Knowledge Base (SoyKB), is a comprehensive all-inclusive web
  resource developed for soybean translational genomics and molecular breeding. SoyKB
  stores information about genes/proteins, miRNAs/sRNAs, metabolites, SNPs, plant
  introduction (PI lines) and traits. It handles the management and integration of
  soybean genomics and multi-omics data along with gene function annotations, biological
  pathway and trait information. It has many useful tools including gene family search,
  multiple gene/metabolite analysis, motif analysis tool, protein 3D structure viewer
  and data download and upload capacity. It has a user-friendly web interface together
  with genome browser and pathway viewer, which displays data in an intuitive manner
  to the soybean researchers, breeders and consumers. The QTLs, SNP, GWAS and traits
  information is seamlessly integrated in our newly developed suite of tools for the
  In Silico Breeding Program. It allows integration and extraction of the data in
  a tabular format as well as graphical visualization in our in-house Chromosome Visualizer.
  It also supports integration and visualization of Genotype by Sequencing (GBS) data
  for molecular breeding and phenotypic inferences. In addition, SoyKB now has capacity
  for incorporation of DNA methylation data and fast neutron mutation datasets. It
  is also linked seamlessly with P3DB for phosphorylation data. We have also incorporated
  suite of tools for differential expression analysis for microarray, transcriptomics
  RNA-seq, proteomics and metabolomics datasets. It includes access to gene lists,
  Venn diagrams, Volcano plots, functional annotations and pathway analysis. SoyKB
  is now powered by the iPlant Cyber-Infrastructure. The website is hosted on the
  iPlant’s advanced computing infrastructure established to leverage the data analysis
  capabilities.
