description: The THEMIS database provides comprehensive scientific observations collected
  by the NASA THEMIS mission, including field and plasma measurements from five spacecraft
  and ground-based auroral/magnetic data over northern North America. It offers fully
  accessible data products and software tools for researchers to study the Earth’s
  magnetosphere and solar wind interactions. The database includes descriptions of
  instruments, data products, and retrieval methods, and is openly available to the
  scientific community under NASA policy.
