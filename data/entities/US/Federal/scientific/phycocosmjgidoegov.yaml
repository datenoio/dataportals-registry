description: PhycoCosm is a comparative algal genomics portal developed by the U.S.
  Department of Energy’s Joint Genome Institute, providing access to genome sequences,
  annotations, and multi-omics data for over a hundred algal species. It offers interactive
  web tools for exploring, comparing, and visualizing algal genomes and related functional
  information across diverse lineages.
