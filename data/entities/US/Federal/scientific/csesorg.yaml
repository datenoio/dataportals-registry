description: The Comparative Study of Electoral Systems (CSES) is an international
  research database that integrates post-election survey data from more than 60 countries
  into a harmonized dataset for comparative political analysis. It combines individual-level
  survey responses with district- and country-level variables on electoral systems,
  voting results, and political institutions. The database is designed to support
  research on voting behavior, democratic representation, and the effects of electoral
  systems across different political contexts.
