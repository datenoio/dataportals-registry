description: 'The CDHA assists researchers to create, document, and distribute public use
  microdata on health and aging for secondary analysis. Major research themes include: midlife
  development and aging; economics of population aging; inequalities in health and aging;
  international comparative studies of health and aging; and the investigation of linkages
  between social-demographic and biomedical research in population aging.'
