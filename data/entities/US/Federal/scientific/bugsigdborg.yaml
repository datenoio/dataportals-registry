description: BugSigDB is a Semantic MediaWiki for manually-curated summaries of the
  design, execution, and signatures resulting from human microbiome studies. It standardizes
  microbial taxa using the NCBI taxonomy, study conditions using the Experimental
  Factor Ontology, and sampled body sites using the Uberon Anatomy Ontology. It also
  collects information on study design, sample size, experimental methods, statistical
  analysis, and microbial diversity. Data can be viewed on the site or exported for
  bulk analysis.
