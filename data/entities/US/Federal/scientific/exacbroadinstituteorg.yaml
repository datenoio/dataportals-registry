description: The Exome Aggregation Consortium (ExAC) is a coalition of investigators
  seeking to aggregate and harmonize exome sequencing data from a variety of large-scale
  sequencing projects, and to make summary data available for the wider scientific
  community. The ExAC Browser spans 60,706 unrelated individuals sequenced as part
  of various disease-specific and population genetic studies. All of the raw data
  from these projects have been reprocessed through the same pipeline, and jointly
  variant-called to increase consistency across projects.
