description: The exRNA Atlas is the data and metadata repository of the Extracellular
  RNA Communication Consortium (ERCC), an NIH Common Fund initiative to learn more
  about exRNAs in a variety of different contexts. The exRNA Atlas includes small
  RNA sequencing and qPCR-derived exRNA profiles from human and mouse biofluids. All
  RNA-seq datasets are processed using version 4 of the exceRpt small RNA-seq pipeline.
  ERCC-developed quality metrics are uniformly applied to the datasets. The exRNA
  Atlas accepts submissions for RNA-seq or qPCR data.
