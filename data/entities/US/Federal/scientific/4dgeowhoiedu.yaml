description: Jason is a remotely operated vehicle (ROV) deep-diving vessel that gives
  shipboard scientists immediate, real-time access to the sea floor. Jason is connected
  by a long fiberoptic tether to its research ship. The 10-km (6 mile) tether delivers
  power and instructions to Jason and fetches data from it. As part of the Jason ROV
  project, the Virtual Van data acquisition system was developed to automatically
  captures the information in the control-van during ROV operations including up to
  four simultaneous video sources, vehicle data, scientific instrument data, and event
  data. All this information is accessible via a web-browser in real-time and is also
  available to the scientists after the cruise for post-cruise data access and analysis.
