description: The Dfam database is a open collection of DNA Transposable Element sequence
  alignments, hidden Markov Models (HMMs), consensus sequences, and genome annotations.
  Dfam represents a collection of multiple sequence alignments, each containing a
  set of representative members of a specific transposable element family. These alignments
  (seed alignments) are used to generate HMMs and consensus sequences for each family.
  The Dfam website gives information about each family, and provides genome annotations
  for a collection of core genomes.
