description: Data portal for the Human Tumor Atlas Network (HTAN). HTAN is a National
  Cancer Institute (NCI)-funded Cancer Moonshot initiative to construct 3-dimensional
  atlases of the dynamic cellular, morphological, and molecular features of human
  cancers as they evolve from precancerous lesions to advanced disease.  Data available
  on the HTAN Portal is open access. Certain data types with the potential for re-identification
  are available in restricted access through dbGAP.
