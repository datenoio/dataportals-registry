description: Remote Sensing Systems is a world leader in processing and analyzing microwave
  data from satellite microwave sensors. We specialize in algorithm development, instrument
  calibration, ocean product development, and product validation. We have worked with more
  than 30 satellite microwave radiometer, sounder, and scatterometer instruments over the
  past 40 years. Currently, we operationally produce satellite retrievals for SSMIS, AMSR2,
  WindSat, and ASCAT.
