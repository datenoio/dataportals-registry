description: The AMRDC Data Repository provides archival, preservation, access, and
  metadata authoring services for Antarctic meteorological data, managing data from
  submission to end-user retrieval. The repository accepts datasets from accredited
  organizations and researchers engaged in research related to Antarctic meteorology
  and climatology. Data within the AMRDC Repository is made accessible to the larger
  Antarctic research community with metadata and publishing information for open-access
  use.
