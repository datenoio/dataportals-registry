description: The Sloan Digital Sky Survey (SDSS) is a large-scale international astronomy
  project that has systematically mapped the sky through imaging and spectroscopic
  surveys since 2000. It provides open access to extensive datasets on stars, galaxies,
  quasars, and the large-scale structure of the Universe. SDSS combines observational
  data, catalogs, and derived measurements into a comprehensive resource used for
  research in astronomy, astrophysics, and cosmology.
