description: The exposome represents the sum of all exposures during the life-span
  of an organism (from chemicals to microbes, viruses, radiation and other sources).
  Exposome chemicals are a major component of the exposome and are known to alter
  activities of cellular pathways and structures. In humans, exposome chemicals are
  transported throughout the body, linking chemical exposures to phenotypes such as
  such as cancer, ageing or diabetes. The Blood Exposome DB is a collection of chemical
  compounds and associated information that were automatically extracted by text mining
  the content of PubMed and PubChem databases. The database also unifies chemical
  lists from metabolomics, systems biology, environmental epidemiology, occupational
  expossure, toxiology and nutrition fields.
