description: The INCLUDE (INvestigation of Co-occurring conditions across the Lifespan
  to Understand Down syndromE) Project is an NIH-wide collaboration that seeks to
  improve health and quality-of-life for people with Down syndrome. The INCLUDE Project
  Data Coordinating Center and partners created the INCLUDE Data Hub, a centralized
  data resource that allows access to large-scale clinical and multi-omics datasets
  specific to Down syndrome and supports collaborative, cloud-based analysis to accelerate
  scientific discoveries related to Down syndrome and its co-occurring conditions.
