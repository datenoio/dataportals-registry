description: PolymiRTS (Polymorphism in microRNAs and their TargetSites) is a database
  of naturally occurring DNA variations in microRNA (miRNA) seed regions and miRNA
  target sites. MicroRNAs pair to the transcripts of protein-coding genes and cause
  translational repression or mRNA destabilization. SNPs and INDELs in miRNAs and
  their target sites may affect miRNA-mRNA interaction, and hence affect miRNA-mediated
  gene repression.
