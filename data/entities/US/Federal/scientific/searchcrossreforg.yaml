description: The Funder Registry is an open registry of persistent identifiers for
  grant-giving organizations around the world. FundRef is the result of collaboration
  between funding agencies and publishers that correlates grants and other funding
  with the scholarly output of that support. Publishers participating in FundRef add
  funding data to the bibliographic metadata they already provide to Crossref for
  reference linking. FundRef data includes the name of the funder and a grant or award
  number. Metadata includes funder names, alternate names, and abbreviations.
