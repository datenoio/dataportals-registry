description: 'DataFed is a web services-based software that non-intrusively mediates between
  autonomous, distributed data providers and users. The main goals of DataFed are: Aid air
  quality management and science by effective use of relevant data - Facilitate the access
  and flow of atmospheric data from provider to users - Support the development of user-driven
  data processing value chains. DataFed Catalog links searchable Datafed applications worldwide.'
