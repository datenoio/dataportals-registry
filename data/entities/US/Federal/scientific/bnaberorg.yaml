description: 'Discovery of Broadly Neutralizing Antibodies (bNAbs) has given a great
  boost to HIV vaccine research. Study of bNAbs capable of neutralizing a broad array
  of different HIV strains is important for a number of reasons: (i) structures of
  antigens co-crystallized with bNAbs are used as templates in HIV vaccine design;
  (ii) bNAbs can be effective as therapeutics; (iii) preventive use of bNAbs is a
  promising direction in AIDS care. The goal of bNAber is to collect, analyze, compare
  and present bNAbs data, thus helping researchers to create HIV vaccine.'
