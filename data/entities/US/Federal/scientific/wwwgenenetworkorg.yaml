description: GeneNetwork is a group of linked data sets and tools used to study complex
  networks of genes, molecules, and higher order gene function and phenotypes. GeneNetwork
  combines more than 25 years of legacy data generated by hundreds of scientists together
  with sequence data (SNPs) and massive transcriptome data sets (expression or eQTL
  data sets). GeneNetwork was created in 1994 as The Portable Dictionary of the Mouse
  Genome, and became WebQTL in 2001. In 2005 it was renamed GeneNetwork.
