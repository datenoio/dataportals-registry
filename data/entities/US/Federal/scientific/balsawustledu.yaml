description: Brain Analysis Library of Spatial maps and Atlases (BALSA) is a database
  for hosting and sharing neuroimaging and neuroanatomical datasets for human and
  primate species. BALSA houses curated, user-created Study datasets, extensively
  analyzed neuroimaging data associated with published figures and Reference datasets
  mapped to brain atlas surfaces and volumes in human and nonhuman primates as a general
  resource (e.g., published cortical parcellations). ConnectomeDB powered by BALSA
  is designed for distributing HCP-Young Adult and related HCP-style processed imaging
  and phenotypic datasets. Datasets in BALSA may include PMID and/or DOI that links
  them directly to relevant publications.
