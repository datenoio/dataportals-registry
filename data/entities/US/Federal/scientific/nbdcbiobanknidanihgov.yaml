description: 'The mission of the National Institute on Drug Abuse (NIDA), part of
  the National Institutes of Health, is to advance science on the causes and consequences
  of drug use and addiction and to apply that knowledge to improve individual and
  public health. NIDA, in collaboration with other NIH Institutes, Centers, and Offices,
  and other federal partners, supports two large prospective developmental studies,
  the Adolescent Brain Cognitive Development SM (ABCD) Study and the HEALthy Brain
  and Child Development (HBCD) Study. The NIH Brain Development Cohorts (NBDC) Biorepository
  Portal serves two major purposes for the ABCD and HBCD studies: It facilitates the
  collection of samples by study staff, and it maintains a database of stored samples
  and sample associated metadata for the research community. Researchers can browse
  the inventory of available samples using the Biospecimen Explorer, and request biospecimens
  to conduct their own analyses. By providing these services, the NBDC Biorepository
  Portal aims to further support research on child and adolescent health and development.'
