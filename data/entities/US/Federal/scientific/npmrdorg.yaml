description: The Natural Products Magnetic Resonance Database is a freely available
  cloud-based, user-friendly, FAIR electronic database. NP-MRD accepts NMR data and
  associated metadata from newly undertaken NP studies. The NP-MRD accepts raw (time
  domain data, processed spectra, assigned chemical shifts, J-couplings, RDCs, etc.),
  and meta-data (structures, sources, methods, taxonomy, geospatial data, etc) from
  natural products ranging from purified substances to crude extracts, in all major
  solvents. The NP-MRD includes NPs such as vitamins, minerals, and probiotics as
  well as small molecules derived from plants, fungi, bacteria, marine organisms,
  or animals.
