description: The Yale University Open Data Access (YODA) Project at the Center for
  Outcomes Research and Evaluation advocates for the responsible sharing of clinical
  research data. The Project is committed to open science and data transparency, and
  supports research attempting to produce concrete benefits to patients, the medical
  community, and society as a whole. Through experience and input from the public
  and stakeholders, the YODA Project has iteratively developed a model to make data
  available to researchers in a sustainable way, in which data sharing becomes a part
  of the clinical research enterprise of the future. The mission of the YODA Project
  is to not only increase access to clinical research data, but to promote its use
  to generate new knowledge.
