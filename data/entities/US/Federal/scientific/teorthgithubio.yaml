description: The Analytic Number Theory Exponent Database (ANTEDB) is an ongoing project
  to systematically record known theorems for various exponents appearing in analytic
  number theory, as well as the relationships between them. Currently, the database
  is recording facts and conjectures on exponent pairs, exponential sum bounds, zero-density
  and moment bounds for the Riemann zeta-function, large value estimates, additive
  energy bounds and exponents related to prime distributions, amongst other results.
  The database aims to organise and record theorems and relationships as both human-readable
  proofs and as executable python code.
