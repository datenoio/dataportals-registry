description: 'The SWATHAtlas at the Institute for Systems Biology is a resource for
  planning your DIA/SWATH™ experiments, depositing published experimental high-quality
  spectral assay libraries, and exploring the results of these uploaded datasets.

  The SWATHAtlas project makes available spectral libraries that are designed to aid
  in SWATH™ data processing for several species. It enables the ability to query and
  explore a set of seed datasets on-line, custom analysis of SWATH™ datasets in the
  repository. Users have the option to analyze and repair spectral ion libraries using
  the DIALib-QC tool.'
