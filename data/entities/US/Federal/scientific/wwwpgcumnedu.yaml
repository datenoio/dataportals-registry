description: The Polar Geospatial Center (PGC) Data Archive makes research data regarding
  both poles available by working with researchers on mapping and remote sensing projects
  in the most remote locations on Earth. The archive of many open data products such
  as digital elevation models, historic and contemporary polar maps, and historic
  aerial photography. Open data is available at no cost. Licensed data, namely commercial
  satellite imagery, is available to PGC core users only.
