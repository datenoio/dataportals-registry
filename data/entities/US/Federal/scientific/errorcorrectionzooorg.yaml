description: The Error Correction Zoo collects and organizes error-correcting codes.
  Error correction is what ensures that the audio in your phone calls remains sharp,
  your hard drives do not deteriorate too quickly, and signals can be reliably transmitted
  to remote satellites. Code entries form the primary content of the EC Zoo. An entry
  can be a specific instance of a well-known code or a large family of codes, depending
  on community interest. Each entry is processed into a dedicated up-to-date webpage
  for its code family, collecting original work, related protocols, and real-world
  implementations.
