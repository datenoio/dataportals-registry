description: The Immunological Genome Project (ImmGen) is a collaborative group of
  immunology and computational biology laboratories that perform a thorough dissection
  of gene expression and its regulation in the immune system of the mouse.  The project
  defines gene expression signatures and modules, regulatory elements in the genome,
  their connectivity, and the factors that control them.  The data and metadata are
  publicly accessible through ImmGen’s dedicated interfaces, and may also be visualized
  using tools available on the website.
