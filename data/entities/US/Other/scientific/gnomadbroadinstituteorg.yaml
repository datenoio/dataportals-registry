description: The Genome Aggregation Database (gnomAD) aggregates and harmonizes exome
  and genome sequencing data from large-scale projects and publishes summary allele
  frequencies for the wider scientific community. The v4 dataset (GRCh38) spans 730,947
  exome sequences and 76,215 whole-genome sequences from unrelated individuals of
  diverse ancestries.
