description: 'The National Repository is a nationwide distributed electronic database
  in which academic texts are accumulated, stored and systemized.

  Academic text is a work of a scientific, scientific and technical, educational nature.


  The following types of academic texts in electronic form should be included in the
  NRAT:


  dissertations for the scientific degrees and abstracts of dissertations;

  qualification graduation work of higher education applicants;

  articles in scientific publications, including all articles (set of articles) on
  the basis of protection of which the degree has been awarded;

  monographs, including those for which a scientific degree has been awarded;

  scientific publications;

  reports on scientific, scientific and technical activities;

  deposited scientific works;

  textbooks, tutorials and other scientific, scientific and teaching materials;

  publications published by authors on online platforms for the exchange of scientific
  publications.

  The National Repository consists of a central repository maintained by the National
  Repository Manager, and local repositories maintained by institutional participants.'
