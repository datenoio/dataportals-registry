description: SKCDC is a provincial centre that collects, standardizes, and shares data on
  wild species and ecological communities in Saskatchewan, Canada. It integrates observations
  from the public, researchers, and other sources to produce species lists, conservation rankings
  (local, national, global), and maps. Its mission is to support biodiversity conservation
  by providing accessible, high-quality information to inform planning, policy, and management.
