description: The Toronto Police Service Open Data Portal is an open public database that provides
  access to crime, traffic, and public safety datasets collected by the Toronto Police Service.
  It includes downloadable data on reported incidents, major crime indicators, traffic collisions,
  and related statistics, with personal identifying information removed for privacy. The portal
  supports transparency and research by allowing users to explore, analyze, and visualize
  public safety trends in Toronto.
