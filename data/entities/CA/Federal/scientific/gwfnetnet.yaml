description: GWFNet is an online data catalogue developed within the Global Water
  Futures (GWF) program to support water science research. It serves as a centralized
  portal that indexes and describes datasets, models, observation sites, publications,
  and research projects related to freshwater systems. Rather than hosting raw data
  itself, GWFNet provides structured metadata to help researchers discover and connect
  water-related scientific resources.
