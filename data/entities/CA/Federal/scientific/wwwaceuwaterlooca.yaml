description: SCISAT, also known as the Atmospheric Chemistry Experiment (ACE), is a Canadian
  Space Agency small satellite mission for remote sensing of the Earth's atmosphere using
  solar occultation. The satellite was launched on 12 August 2003 and continues to function
  perfectly. The primary mission goal is to improve our understanding of the chemical and
  dynamical processes that control the distribution of ozone in the stratosphere and upper
  troposphere, particularly in the Arctic.
