description: CANUE (Canadian Urban Environmental Health Research Consortium) provides
  standardized, postal-code level environmental exposure data across Canada. The database
  includes air pollution, green and blue spaces, weather and climate, as well as urban
  and socioeconomic indicators. Its purpose is to link these data with health research
  to better understand how urban environments affect human health.
