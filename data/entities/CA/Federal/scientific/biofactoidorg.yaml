description: Biofactoid (biofactoid.org) helps authors share a searchable representation
  of their interactions (e.g. binding, gene expression, post-translational modification)
  between genes or gene products, as well as chemicals. This information, with author
  attribution, is shared in social media and public databases, such as Pathway Commons,
  where it can be discovered and analyzed in the context of a large and growing corpus
  of knowledge. Biofactoid (biofactoid.org) is a public, academic project between
  groups at Harvard University, University of Toronto and Oregon Health & Science
  University to help improve the way we share and search for research findings.
