description: Fly-FISH documents the expression and localization patterns of Drosophila
  mRNAs at the cellular and subcellular level during early embryogenesis and third
  instar larval tissues. A high-resolution, high-throughput fluorescence detection
  method is used to detect expressed mRNAs. The data can be accessed by searching
  the localization categories, searching for specific genes or browsing the list of
  tested genes.
