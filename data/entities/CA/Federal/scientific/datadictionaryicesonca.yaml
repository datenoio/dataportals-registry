description: The ICES Data Repository consists of record-level, coded and linkable health
  data sets. It encompasses much of the publicly funded administrative health services records
  for the Ontario population eligible for universal health coverage since 1986 and is capable
  of integrating research-specific data, registries and surveys. Currently, the repository
  includes health service records for as many as 13 million people.
