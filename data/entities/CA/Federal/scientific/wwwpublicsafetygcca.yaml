description: The Canadian Disaster Database (CDD) contains detailed disaster information
  on more than 1000 natural, technological and conflict events (excluding war) that
  have happened since 1900 at home or abroad and that have directly affected Canadians.
  The database describes where and when a disaster occurred, the number of injuries,
  evacuations, and fatalities, as well as a rough estimate of the costs. As much as
  possible, the CDD contains primary data that is valid, current and supported by
  reliable and traceable sources, including federal institutions, provincial/territorial
  governments, non-governmental organizations and media sources. Data is updated and
  reviewed on a semi-annual basis.
