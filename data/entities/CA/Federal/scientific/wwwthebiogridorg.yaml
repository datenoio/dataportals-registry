description: The Biological General Repository for Interaction Datasets (BioGRID)
  is a public database that archives and disseminates genetic and protein interaction
  data from model organisms and humans. BioGRID currently holds over 1,740,000 interactions curated
  from both high-throughput datasets and individual focused studies, as derived from
  over 70,000+ publications in the primary literature. Complete coverage of the entire
  literature is maintained for budding yeast (S. cerevisiae), fission yeast (S. pombe)
  and thale cress (A. thaliana), and efforts to expand curation across multiple metazoan
  species are underway. All data are freely provided via our search index and available
  for download in many standardized formats.
