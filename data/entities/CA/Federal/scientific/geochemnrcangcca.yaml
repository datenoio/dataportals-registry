description: This website is the public interface to the "Canadian Database of Geochemical
  Surveys". The database has two long-term goals. Firstly, it aims to catalogue all of the
  regional geochemical surveys that have been carried out across Canada, beginning in the
  1950s. Secondly, it aims to make the raw data from those surveys available in a standardised
  format. Over 1,500 surveys have been catalogued.
