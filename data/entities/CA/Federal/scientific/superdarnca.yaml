description: 'The SuperDARN Canada database provides open access to data collected
  from five Canadian HF radars: Saskatoon, Clyde River, Inuvik, Rankin Inlet, and
  Prince George. It includes FITACF data that track ionospheric plasma motion, useful
  for studying space weather and solar‑terrestrial interactions. Users can explore
  data availability with a built-in inventory tool and download datasets directly
  using the provided interface.'
