description: The International Human Epigenome Consortium (IHEC) coordinates the production
  of reference epigenome maps through the characterization of the regulome, methylome,
  and transcriptome from a wide range of tissues and cell types. The IHEC Data Portal
  provides discovery, visualization, analysis, download, and sharing of epigenomics
  data, is the official source to navigate through IHEC datasets, and represents a
  strategy for unifying the distributed data produced by international research consortia.
