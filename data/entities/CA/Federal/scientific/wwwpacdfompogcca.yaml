description: The Institute of Ocean Sciences (IOS)/Ocean Sciences Division (OSD) data archive
  contains the holdings of oceanographic data generated by the IOS and other agencies and
  laboratories, including the Institute of Oceanography at the University of British Columbia
  and the Pacific Biological Station. The contents include data from British Columbia coastal
  waters and inlets, British Columbia continental shelf waters, open ocean North Pacific waters,
  Beaufort Sea and the Arctic Archipelago.
