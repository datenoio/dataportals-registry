description: MouseBytes is an open-access high-throughput pipeline and database for
  rodent touchscreen-based cognitive assessment. It employs advanced web technologies
  and is connected to a database/repository of cognitive data obtained using touchscreen
  technology which allows its use without any software installation. Not only can
  users deposit their original data, but they are also able to extract, export, share
  and re-analyze data obtained from other laboratories and benefit from data visualization.
