description: The Large Fire Database (LFDB) is a compilation of forest fire data from all
  Canadian agencies, including provinces, territories, and Parks Canada. The data set includes
  only fires greater than 200 hectares in final size; these represent only a few percent of
  all fires but account for most of the area burned (usually more than 97%). Therefore, the
  LFDB can be used for spatial and temporal analyses of landscape-scale fire impacts.
