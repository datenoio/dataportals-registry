description: The Human Reference Protein Interactome Mapping Project (HuRI) is a repository,
  created by the Center for Cancer Systems Biology (CCSB) at Dana-Farber Cancer Institute,
  which stores the data from the ongoing work on the first complete reference map
  of the human protein-protein interactome network. All pairwise combinations of human
  protein-coding genes are systematically being interrogated to identify which are
  involved in binary protein-protein interactions. HuRI has grown in several distinct
  stages primarily defined by the number of human protein-coding genes amenable to
  screening for which at least one Gateway-cloned Open Reading Frame (ORF) was available
  at the time of the project. Three proteome-scale human PPI datasets are available
  via HuRI. PPI datasets generated in systematic screens on smaller sets of our human
  ORF collection have also been included. Also included are all PPIs identified in
  screens using different protein isoforms from the same gene as generated by alternative
  splicing.
