description: GeneMANIA is an online functional genomics database that helps researchers
  explore gene function by finding genes related to input gene lists based on large
  sets of functional association data like co-expression, protein interactions, pathways,
  and co-localization. The system integrates data from many publicly available biological
  datasets to predict gene function and visualize gene–gene relationships.
