description: The Open Data Commons for Spinal Cord Injury is a cloud-based community-driven
  repository to store, share, and publish spinal cord injury research data. There
  are several challenges for scientific reproducibility and bench-to-bedside translation.
  For example, only research and data that are published actually get disseminated,
  a phenomenon known as publication bias. Published research reflects to only a small
  fraction of all data collected, and data that do not lead to publication are largely
  ignored, hidden away in filing cabinets and hard drives. This results in an abundance
  of inaccessible scientific data known as “dark data”. Even when research is disseminated,
  it is usually in the form of summary reports of aggregated data (e.g. averages across
  individual subjects) such as scientific articles. The fact that the individual subject-level
  data are inaccessible further contributes to dark data. The spinal cord injury (SCI)
  community created the ODC-SCI to mitigate dark data in SCI research. The ODC-SCI
  also aims to increase transparency with individual-level data, enhance collaboration,
  facilitate advanced analytics, and conform to increasing mandates by funders and
  publishers to make data accessible. Members of the ODC-SCI have access to a private
  digital lab space managed by the PI or multi-PIs for dataset storage and sharing.
  The PIs can share their labs’ datasets with the registered members of the ODC-SCI
  community and make their datasets public and citable. The ODC-SCI implements stewardship
  principles that scientific data be made FAIR (Findable, Accessible, Interoperable
  and Reusable) and has been widely adopted by the international SCI research community.
