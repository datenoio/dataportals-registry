description: 'The Canada Vigilance Adverse Reaction Online Database contains information
  about suspected adverse reactions (also known as side effects) to health products.
  Adverse reaction reports are submitted by: consumers and health professionals, who
  submit reports voluntarily; and manufacturers and distributors (also known as market
  authorization holders), who are required to submit reports according to the Food
  and Drugs Act. Data is stored from 1965 onwards.'
