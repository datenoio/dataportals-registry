description: TheCellMap.org is an open-access database that stores, visualizes, and
  enables exploration of genetic interaction networks from both yeast (Saccharomyces
  cerevisiae) and human cells. It integrates genome-wide Synthetic Genetic Array (SGA)
  data in yeast with CRISPR-based perturbation screens in human cells to map functional
  relationships between genes. Users can interactively browse global networks, extract
  subnetworks, and explore gene functions or functional modules.
