description: PathBank is an interactive, visual database containing more than 100
  000 machine-readable pathways found in model organisms such as humans, mice, E.
  coli, yeast, and Arabidopsis thaliana. The majority of these pathways are not found
  in any other pathway database. PathBank is designed specifically to support pathway
  elucidation and pathway discovery in metabolomics, transcriptomics, proteomics,
  and systems biology. All PathBank pathways include information on the relevant organelles,
  subcellular compartments, protein complex cofactors, protein complex locations,
  metabolite locations, chemical structures, and protein complex quaternary structures.
  The database is easily browsed and supports full text, sequence, and chemical structure
  searching.
