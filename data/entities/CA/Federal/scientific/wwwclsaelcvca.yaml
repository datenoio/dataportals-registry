description: The Canadian Longitudinal Study on Aging (CLSA) is a large, national, long-term
  study of more than 50,000 individuals who were between the ages of 45 and 85 when recruited.
  These participants will be followed until 2033 or death. The aim of the CLSA is to find
  ways to help us live long and live well, and understand why some people age in healthy fashion
  while others do not.
