description: BenchSci offers a free application to academic and non-profit researchers
  to help select appropriate antibodies for their research based on data from over
  14M publications and 12.4 million products. Using the platform, scientists are able
  to filter for their experimental context, find previously verified antibody products,
  and leverage cross-reactivity analysis to reduce redundant purchases per target
  and design more successful experiments. BenchSci also has an expanded Reagent Selection
  app commercially available to help scientists find appropriate products across seven
  different reagent and model system types.
