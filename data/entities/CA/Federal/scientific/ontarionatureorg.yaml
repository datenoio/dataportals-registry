description: Reptiles and amphibians are collectively known as herpetofauna and are a unique
  part of Ontario’s biodiversity. An earlier atlas, called the Ontario Herpetofaunal Summary
  Atlas, provided extensive information about where many of the province’s reptiles and amphibians
  occurred. The Atlas is transitioning into a new era, with Ontario Nature wrapping-up the
  data collection phase of this project as of December 1, 2019.
