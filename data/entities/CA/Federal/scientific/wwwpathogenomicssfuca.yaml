description: OrtholugeDB contains Ortholuge-based orthology predictions for completely
  sequenced bacterial and archaeal genomes. It is also a resource for reciprocal best
  BLAST-based ortholog predictions, in-paralog predictions (recently duplicated genes)
  and ortholog groups in Bacteria and Archaea. The Ortholuge method improves the specificity
  of high-throughput orthology prediction.
