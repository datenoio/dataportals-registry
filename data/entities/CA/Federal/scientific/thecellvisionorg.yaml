description: The Cell Vision is a web-accessible scientific repository and visualization
  platform for high-content microscopy image data and associated quantitative results
  from large-scale cell screening experiments. It hosts hundreds of thousands of fluorescence
  microscopy images and analysis outputs, enabling users to explore, compare, and
  extract information about subcellular morphology, protein localization, and abundance
  in single cells.
