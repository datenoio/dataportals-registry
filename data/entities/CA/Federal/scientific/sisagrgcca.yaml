description: The NSDB is the set of computer readable files which contain soil, landscape,
  and climatic data for all of Canada. It serves as the national archive for land resources
  information that was collected by federal and provincial field surveys, or created by land
  data analysis projects. The NSDB includes GIS coverages at a variety of scales, and the
  characteristics of each named soil series.
