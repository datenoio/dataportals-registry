description: The Forest Climate Change Data Catalogue is a collection of data sets that are
  relevant to the Canadian forest sector under a changing climate. Created by Canadian Forest
  Service scientists, these data sets include static maps, raw data, and interactive maps
  that cover all of Canada. Data themes include drought, fire, climate and tree distribution;
  multiple climate scenarios are projected to the year 2100.
