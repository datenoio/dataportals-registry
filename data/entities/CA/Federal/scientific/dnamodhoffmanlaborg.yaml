description: DNAmod is an open-source database (https://dnamod.hoffmanlab.org) that
  catalogues DNA modifications and provides a single source to learn about their properties.
  The database annotates the chemical properties and structures of all curated modified
  DNA bases, and a much larger list of candidate chemical entities. DNAmod includes
  manual annotations of available sequencing methods, descriptions of their occurrence
  in nature, and provides existing and suggested nomenclature. DNAmod enables researchers
  to rapidly review previous work, select mapping techniques, and track recent developments
  concerning modified bases of interest.
