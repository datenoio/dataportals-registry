description: The National Forest Inventory (NFI) is a collaborative effort involving federal,
  provincial and territorial government agencies. They monitor a network of twenty thousand
  sampling points across Canada on an ongoing basis to provide information on the state of
  Canada's forests and a continuous record of forest change. They provide data and products
  to forest science researchers, forest policy decision-makers and interested stakeholders.
