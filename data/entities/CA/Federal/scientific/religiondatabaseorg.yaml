description: The Database of Religious History (DRH), originally launched by the Cultural
  Evolution of Religion Research Consortium at the University of British Columbia,
  is now an independent global academic initiative. It serves as a centralized, expert-authored
  repository of standardized and qualitative data on the history of religions, integrating
  references, images, and analytical tools. It enables scholars and the public to
  explore, visualize, and verify historical patterns, compare scholarly perspectives,
  and document differing interpretations.
