description: The Catalog of Inferred Sequence Binding Preferences (CIS-BP) is a library of
  transcription factor (TF) DNA binding motifs and specificities. The data are organized in
  a user friendly manner for ease of searching, browsing, and downloading. CIS-BP also includes
  built-in web tools for scanning DNA sequences for putative TF binding sites, predicting
  the DNA binding motif of a given TF, and identifying a TF that might recognize a given DNA
  motif.
