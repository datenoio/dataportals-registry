description: 'The Global Proteome Machine Database (gpmDB holds the minimum amount
  of information necessary for common bioinformatics-related tasks (such as sequence
  assignment validation) rather than being a complete record of a proteomics experiment.
  It was also created to aid in the process of validating peptide MS/MS spectra as
  well as protein coverage patterns. Most of the data is held in a set of XML files:
  the database serves as an index to those files, allowing for rapid lookups and reduced
  database storage requirements.'
