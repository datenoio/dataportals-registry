description: Strathcona County is committed to being an open and transparent government. Data
  is available license free, in a digital format, to be used by the public to analyze, download
  or connect to data sets creating applications and services for the benefit of all members
  of the County. The catalogue includes data such as civic address, contours, neighbourhoods,
  orthophotos, storm, street network, water, waste water and much more.
