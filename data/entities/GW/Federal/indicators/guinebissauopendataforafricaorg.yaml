description: Guinea-Bissau country portal on the African Development Bank Open Data
  for Africa platform (Africa Information Highway / Knoema). Provides official national
  statistical indicators compiled with the Instituto Nacional de Estatística and hosts
  the IMF e-GDDS National Summary Data Page. The portal is published in Portuguese,
  English, and French. INE previously pointed at this hostname rather than the
  guineab.opendataforafrica.org alias.
