description: ViBrism DB is a database for anatomical gene expression maps and topological co-expression
  network graphs created with original techniques of microtomy-based gene expression measurements,
  Transcriptome Tomography. The DB is equipped with a WebGL-based 2D/3D visualization platform,
  BAH viewer, and a network viewer. Users can access a total of 172,022 datasets of coding/non-coding
  transcripts and lncRNAs, present in the mouse brains at four post-natal stages. Expression
  maps are seen in the whole anatomical context of 3D MR images of the brains. In situ hybridization
  images and anatomical area maps are browsable in the same space of 3D expression maps. Created
  images are shareable using URLs, including scene-setting parameters. The DB is expandable
  by community activity.
