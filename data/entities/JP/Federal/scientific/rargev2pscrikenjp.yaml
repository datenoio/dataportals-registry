description: RARGE II provides basic information about the Arabidopsis genome, such as information
  related to cDNA sequences and transposon insertion mutants. To create it, publicly available
  information for a total of 66,209 Arabidopsis mutant lines was used, including loss-of-function
  (RATM and TARAPPER) and gain-of-function (AtFOX and OsFOX) lines, as well as phenotype data
  gained through the mapping of descriptions onto Plant Ontology (PO) and Phenotypic Quality
  Ontology (PATO) terms.
