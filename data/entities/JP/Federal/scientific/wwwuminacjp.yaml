description: UMIN-CTR is a Clinical Trials Registry hosted by the japanese University Hospital
  Medical Information Network (UMIN). UMIN-CTR has been recognized by the ICMJE as an "acceptable
  registry". At a minimum, a paper should be received for consideration by an ICMJE-affiliated
  journal, if the corresponding trial is registered by the appropriate deadline with UMIN-CTR.
  The WHO is developing the International Clinical Trials Registry Platform (ICTRP) project
  in order to collect various clinical trial registry systems throughout the world under fixed
  standards as "member registries" and "associate registries. "
