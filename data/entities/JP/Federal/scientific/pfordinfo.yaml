description: REFOLDdb is a resource for the optimization of protein refolding, referring to
  published methods employed in the refolding of recombinant proteins. It stores a collection
  of published experimental approaches and records for refolding proteins. It contains data
  converted from the original REFOLD database that had been created and updated until 2009 by
  Monash University in Australia, as well as data retrieved from articles on refold technologies
  published since 2009.
