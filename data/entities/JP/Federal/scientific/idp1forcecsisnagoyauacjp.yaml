description: The Protein Structural Change DataBase (PSCDB) presents the structural changes
  found in proteins, represented by pairs of ligand-free and ligand-bound structures of identical
  proteins, and links these changes to ligand-binding.  It classifies protein structural changes
  into 7 classes, in terms of the ligand binding sites and the location where the dominant motion
  occurs.
