description: This database is a collection of quantitative information about cell division dynamics
  in early Caenorhabditis elegans embryos when each of all essential embryonic genes is silenced
  individually by RNA interference (RNAi). The information is obtained by combining four-dimensional
  differential contrast interference (DIC) microscopy and computer image processing. The information
  collection provides novel opportunities for developing quantitative and computational approaches
  towards understanding animal development.
