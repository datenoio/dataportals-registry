description: IDEAL (Intrinsically Disordered proteins with Extensive Annotations and Literature)
  is a collection of experimentally-verified intrinsically disordered proteins (IDPs) that cannot
  adopt stable globular structures under physiological conditions. IDEAL contains manually curated
  annotations on IDPs in locations, structures, and functional sites such as protein binding
  regions and post-translational modification sites together with references and structural
  domain assignments.
