description: This site hosts a database of self‑dual codes — lists and data files of codes over
  various rings and finite fields that are equal to their own dual. These include binary self‑dual
  codes (codes over the field with 2 elements); Hermitian and Euclidean self‑dual codes over
  GF(4) (the finite field with 4 elements); Ternary self‑dual codes (codes over GF(3)); Self‑dual
  codes over rings like ℤ₄, ℤ₆, etc.
