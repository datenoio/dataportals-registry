description: GlycoProtDB is a glycoprotein database providing information of Asn (N)-glycosylated
  proteins and their glycosylated site(s), which were constructed by employing a bottom-up strategy
  using actual glycopeptide sequences identified by LC/MS-based glycoproteomic technologies.
  The database is searchable using gene ID, gene name, and its description (protein name) as
  query. Each data sheet of glycproteins is based on a single amino acid sequence in Wormpep
  database for C.elegans and NCBI Refseq database for mouse. The sheet presents actually detected
  N-glycosylation site(s) which are displayed each capturing methods of glycopeptide subset,
  e.g., lectins Concanavalin A, wheat germ agglutinin (WGA), or HILIC (hydrophilic interaction
  chromatography), as well as potential N-glycosylation sites (NX[STC], X≠P). Protein sequences,
  which have common glycopeptide sequence(s), are linked each other.
