description: The Human Genetic Variation Database (HGVD) aims to provide a central resource
  to archive and display Japanese genetic variation and association between the variation and
  transcription level of genes. The database currently contains genetic variations determined
  by exome sequencing of 1,208 individuals and genotyping data of common variations obtained
  from a cohort of 3,248 individuals. The HGVD browser can be used to view allele and genotype
  frequencies, number of samples, coverages, and expression QTL (eQTL) significances.
