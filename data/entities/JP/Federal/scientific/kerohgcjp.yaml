description: The Database of Kashiwa Encyclopedia for human genome mutations in Regulatory
  regions and their Omics contexts (DBKERO) stores transcriptome information with
  a catalogue of genomic variations including public SNP data and epigenome information
  to enable further in-depth analyses on the disease-causing molecular mechanisms.
  Recent additions include genomic variation datasets and epigenome variation datasets
  focusing on the Japanese population. These datasets were collected as a series of
  genome-wide association studies and as part of International Human Epigenome Consortium
  (IHEC) projects. The goal is to have this database serve as a model case for the
  genomic, epigenomic and transcriptomic variations occurring in particular ethnic
  backgrounds and underlying various diseases. Clinical samples data were also associated
  with data from various model systems such as drug perturbation datasets using cultured
  cancer cells.
