description: GreenPhylDB (https://www.greenphyl.org) is a database designed to facilitate
  the exploration of gene families and homologous relationships among plant genomes,
  including staple crops critically important for global food security. GreenPhylDB
  is available since 2007, after the release of the Arabidopsis thaliana and Oryza
  sativa genomes and has undergone multiple releases. With the number of plant genomes
  currently available, it becomes challenging to select a single reference for comparative
  genomics studies but there is still a lack of databases taking advantage several
  genomes by species for orthology detection. GreenPhylDBv5 introduces the concept
  of comparative pangenomics by harnessing multiple genome sequences by species. We
  created 19 pangenes and processed them with other species still relying on one genome.
  In total, 46 plant species were considered to build gene families and predict their
  homologous relationships through phylogenetic-based analyses.
