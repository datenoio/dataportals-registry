description: YeastIP is a gene database for the molecular taxonomy and phylogeny of
  yeasts. It contains the major barcodes of all the species of the subphylum Saccharomycotina,
  tools to establish the identification of yeasts to the species level, and associated
  phylogenetic relationships. The YeastIP database offers easy and immediate access
  to the type strain or representative strain sequences of each species. In addition,
  associated information is available in a simple, clear interface, with expert-validated
  sequences. YeastIP allows easy retrieval of these sequences through the use of a
  search tool. YeastIP was developed with the intention of helping both nonspecialists
  and taxonomists to establish rapid identification and phylogenetic reconstruction.
