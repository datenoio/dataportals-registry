description: The Earth Orientation Parameters Product Center (EOP-PC) is a scientific
  data service operated by the Paris Observatory that provides access to Earth Orientation
  Parameters (EOP), which describe variations in the Earth's rotation and orientation
  in space. The resource distributes observational and derived datasets used for geodesy,
  astronomy, satellite navigation, and Earth science applications. It serves as a
  repository of validated Earth orientation products contributed by international
  observing techniques and coordinated through global geodetic services.
