description: The CDPP Archive (Centre de Données de la Physique des Plasmas) is a
  long-term scientific repository operated by CNES for the preservation and dissemination
  of plasma physics and space mission data. It provides access to calibrated datasets,
  metadata, documentation, and quicklook products from numerous space missions studying
  the Earth's magnetosphere, the solar wind, planets, and the heliosphere. The archive
  supports standardized data discovery through the REGARDS platform and follows international
  metadata standards (SPASE) to facilitate interoperability and long-term preservation
