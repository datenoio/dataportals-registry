description: 'Shanoir (SHAring iN vivO Imaging Resources) is an open source neuroinformatics
  software designed to provide a self-hosted infrastructure to share, archive, search
  and visualize imaging data. It provides a user-friendly secure web access and offers
  an intuitive workflow to facilitate the collecting and retrieving of imaging data
  from multiple sources (including hospital PACS) and a wizard to make the completion
  of metadata easy. Shanoir comes along many features such as pseudonymization of
  data, support for multi-center clinical studies.


  The Shanoir software is governed by the Shanoir consortium, membership is open to
  all interested: https://project.inria.fr/shanoir/consortium/.'
