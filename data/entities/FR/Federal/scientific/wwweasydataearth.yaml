description: EaSy Data (for Earth System Data) is the French data repository for the environmental
  domain. It allows researchers in the Environmental and Earth sciences to publish their data
  and obtain a DOI. Submissions must comply with the scope defined by the communities. Data
  are moderated by community scientists before validation. Metadata are based on community
  standards (ISO 19115) and are exposed via standard API (CSW and OGC API).
