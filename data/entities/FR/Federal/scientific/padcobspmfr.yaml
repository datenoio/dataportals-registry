description: The Paris Astronomical Data Centre is a scientific data repository managed
  by the Observatoire de Paris that provides access to a wide range of astronomical
  and space-related datasets, including sky images, spectra, simulation data, and
  planetary science data. It supports standardised access through the Virtual Observatory
  (VO) protocols, allowing researchers to query and retrieve data efficiently. PADC
  hosts multiple interconnected services and tools for visualisation and analysis,
  and it contributes to international data sharing standards in astronomy.
