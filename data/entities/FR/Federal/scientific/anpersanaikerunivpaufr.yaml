description: ANPERSANA is the digital library of IKER (UMR 5478), a research centre specialized
  in Basque language and texts. The online library platform receives and disseminates primary
  sources of data issued from research in Basque language and culture. As of today, two corpora
  of documents have been published. The first one, is a collection of private letters written
  in an 18th century variety of Basque, documented in and transcribed to modern standard Basque.
