description: 'The Viral Host Range database (VHRdb) represents a unique resource for
  the community to rapidly find, document analyze and disseminate data related to
  the range of hosts that a virus can infect. Over the years, countless host range
  experiments have been performed in many laboratories. However, these data are not
  readily available to the community and are therefore underexploited.


  The VHRdb is an online resource that centralizes experimental data related to the
  host range of viruses. While it originates from bacteriophages and bacteria interaction
  studies, its design is compatible with viruses infecting all living forms. Users
  can browse publicly available data to find which host is infected by a virus, and
  vice versa. Users can also upload their own data, with the option to keep it private
  or make it public, analyze results across independent sets of data, generate and
  visualize outputs. Data implemented in the VHRdb are linked to users and, if available,
  to publications and sequence identifiers.


  The VHRdb is an initiative from the Debarbieux lab and is developed and maintained
  in collaboration with the Bioinformatics and Biostatistics Hub of Institut Pasteur.


  If you wish to import a collection or very sizable data into the VHRdb, please do
  no hesitate to contact us to arrange details such as specific identifiers (see Documentation).'
