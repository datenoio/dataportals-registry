description: The ESCAPE Open-source Scientific Software and Service Repository (OSSR)
  is a sustainable open-access repository to share scientific software, services and
  datasets to the astro-particle-physics-related communities and enable open science.
  It is built as a curated Zenodo community (https://zenodo.org/communities/escape2020)
  integrated with several tools to enable a complete software life-cycle. The ESCAPE
  Zenodo community welcomes entries that support the software and service projects
  in the OSSR such as user-support documentation, tutorials, presentations and training
  activities. It also encourages the archival of documents and material that disseminate
  and support the goals of ESCAPE.
