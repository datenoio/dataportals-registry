description: The Paleontology database hosts data obtained from X-ray Computed Tomography
  experiments at ESRF. While the ESRF data portal hosts the raw data from the experiments,
  this space provides access to processed tomograms and, in some cases, associated
  derivatives (images, movies, 3D meshes). Data are only deposited here upon request
  from the experimental teams and relevant parties (museum curators, researchers involved
  in the analysis). Data hosted here cover a wide taxonomical spectrum and can represent
  complete specimens or specific close-ups depending on the case.
