description: RELMIN collects, studies and publishes legal texts defining the status
  of religious minorities in medieval Europe. The corpus of texts is rich and varied,
  spanning ten centuries over a broad geographical area; these texts, in Latin, Arabic,
  Greek, Hebrew and Aramaic (and also in Medieval Spanish, Portuguese, and other European
  vernaculars), are dispersed in libraries and archives across Europe. The texts are
  now gathered in the RELMIN Database in their original language, with translations
  and commentaries.
