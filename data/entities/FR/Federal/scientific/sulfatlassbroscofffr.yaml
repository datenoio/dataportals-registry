description: Widespread in nature, sulfated biomolecules are highly diverse in chemical
  structure and biological function. These compounds include sulfate esters (ROSO3-)
  and sulfamates (RN(H)SO3-) and range from small molecules to complex polymers. Sulfatases
  cleave sulfate groups from such molecules and constitute a biologically and industrially
  important group of enzymes. However, the number of sulfatases which have been characterized
  is limited in comparison to the huge diversity of the sulfated compounds. In the
  context of the explosion of genomic data, the functional annotation of sulfatases
  is thus particularly prone to flaws and misinterpretations. A classification system
  allowing for a better prediction of substrate specificity and for setting the limit
  of functional annotations was therefore urgently needed for sulfatases. SulfAtlas
  describes the family and sub-families of structurally-related sulfatases. Sub-families
  are created based on phylogenetic analyses and essentially correspond to different
  substrate specificities. Experimental evidences for the activity of new sulfatases
  will be regularly updated.
