description: The PlantRNA database compiles tRNA gene sequences retrieved from fully
  annotated plant nuclear, plastidial and mitochondrial genomes. For each tRNA gene,
  the linear secondary structure is given as well as biological information. This
  includes 5'- and 3'- flanking sequences, A and B box sequences, region of transcription
  initiation and poly(T) transcription termination stretches, tRNA intron sequences,
  aminoacyl-tRNA synthetases and enzymes responsible for tRNA maturation and modification.
  Data on mitochondrial import of nuclear-encoded tRNAs as well as the bibliome for
  the respective tRNAs and tRNA binding proteins are also included.
