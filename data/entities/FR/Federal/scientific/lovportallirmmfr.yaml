description: LovPortal is the OntoPortal Alliance vocabulary repository for
  domain-agnostic Linked Open Vocabularies and other semantic artefacts. Hosted by
  LIRMM, it mirrors content curated through the LOV platform and provides browsing,
  search, annotation, and REST access. It is not a direct-upload catalog; vocabularies
  are submitted via LOV first.
