description: The Open Neuroscience Graph is an open-access, curated knowledge graph
  that maps the open science ecosystem in neuroscience as a browsable digital garden.
  Built from an Obsidian vault and published as a static website using Quartz, the
  project replaces traditional linear presentation with a networked structure of interlinked
  Markdown notes. Bidirectional links, full-text search, and an integrated graph visualization
  allow users to navigate thematic relationships dynamically rather than sequentially.
  The complete source material is openly available to sustain, replicate and extend
  the resource, including all Markdown content, media attachments, Quartz configuration
  files, and site customizations. Researchers, educators, and open-science practitioners
  may explore the site directly, download the vault for offline use in Obsidian, or
  fork the material to build new, derivative knowledge bases.
