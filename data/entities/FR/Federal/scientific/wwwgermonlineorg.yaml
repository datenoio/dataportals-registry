description: GermOnline is a cross-species database gateway focusing on high-throughput
  expression data relevant for germline development, the meiotic cell cycle and mitosis
  in healthy versus malignant cells. The portal provides access to the Saccharomyces
  Genomics Viewer (SGV) which facilitates online interpretation of complex data from
  experiments with high-density oligonucleotide tiling microarrays that cover the
  entire yeast genome.
