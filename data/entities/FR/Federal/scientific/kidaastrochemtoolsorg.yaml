description: KIDA (KInetic Database for Astrochemistry) is a database of kinetic data
  of interest for astrochemical (interstellar medium and planetary atmospheres) studies.
  KIDA is a project initiated by different communities in order to 1) improve the
  interaction between astrochemists and physico-chemists and 2) simplify the work
  of modeling the chemistry of astrophysical environments. Here astrophysical environments
  stand for the interstellar medium and planetary atmospheres. Both types of environments
  use similar chemical networks and the physico-chemists who work on the determination
  of reaction rate coefficients for both types of environment are the same.
