description: ReMap is a large scale integrative analysis of DNA-binding experiments
  for Homo sapiens, Mus musculus, Drosophila melanogaster and Arabidopsis thaliana
  transcriptional regulators. The catalogues are the results of the manual curation
  of ChIP-seq, ChIP-exo, DAP-seq from public sources (GEO, ENCODE, ENA).  ReMap (https://remap.univ-amu.fr)
  aims to provide manually curated, high-quality catalogs of regulatory regions resulting
  from a large-scale integrative analysis of DNA-binding experiments in Human, Mouse,
  Fly and Arabidopsis thaliana for hundreds of transcription factors and regulators.
  In this 2022 update, we have uniformly processed >11 000 DNA-binding sequencing
  datasets from public sources across four species.  The four regulatory catalogs
  are browsable through track hubs at UCSC, Ensembl and NCBI genome browsers. Finally,
  ReMap 2022 comes with a new Cis Regulatory Module identification method, improved
  quality controls, faster search results, and better user experience with an interactive
  tour and video tutorials on browsing and filtering ReMap catalogs.
