description: RENAG (Réseau NAtional GNSS permanent) is the French national research
  infrastructure for continuous GNSS (Global Navigation Satellite System) observations,
  providing long-term scientific data from a network of permanent stations. It acquires,
  archives, validates, and distributes GNSS data that support geoscience research
  such as crustal deformation, sea-level change, and atmospheric studies.
