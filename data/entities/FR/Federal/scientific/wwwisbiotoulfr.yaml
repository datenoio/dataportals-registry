description: 'This database provides a list of insertion sequences (IS) isolated from
  bacteria and archae. It is organized into individual files containing their general
  features (name, size, origin, family.....) as well as their DNA and potential protein
  sequences. Some of the entries have been identified as individual elements by their
  insertion activities but a growing number are included from their description in
  sequenced bacterial genomes. It also includes certain transposons, in particular,
  members of the Tn3 family of replicative transposons.

  Note from the FAIRsharing team: we have classified the status of the resource as
  ''uncertain'' because we can''t access the data, and we are making every effort
  to engage with the resource owners to understand if it is a temporary issue or if
  the resource is no longer active.'
