description: CropMRepository provides an accessible online location for storing and
  efficiently retrieving and sharing simulation models of soil and crop growth biophysical
  processes. Models are stored in the open-source format Crop Modeling MetaLanguage
  (Crop2ML) developed and supported by the Agricultural Model Exchange Initiative
  (AMEI). CropMRepository and Crop2ML follow the Minimum Information Required in the
  Annotation of Models (MIRIAM) and the Open Modeling Foundation (OMF) sets of guidelines
  that define how a model should be encoded, annotated, and documented in order to
  be successfully distributed, exchanged and ultimately reused.All models are provided
  under an open-source license. This means that the models are available freely for
  use, modification, and distribution, to all users. The models deposited in CropMRepository
  are citable by using the unique and perennial model identifier assigned to each
  model.
