description: 'VizieR is a library of published astronomical catalogues --tables and
  associated data-- with verified and enriched data, accessible via multiple interfaces.
  Query tools allow the user to select relevant data tables and to extract and format
  records matching given criteria. To be deposited within VizieR, data must be related
  to a publication in a refereed journal, either as tables or catalogues actually
  published, or as a paper describing the data and their context. VizieR is certified
  by the CoreTrustSeal. DOI: 10.26093/cds/vizier'
