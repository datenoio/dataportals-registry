description: Quetelet-Progedo is Progedo's data repository dedicated to quantitative
  social sciences and humanities. Its data collection currently includes administrative,
  survey (aggregate- and individual-level), geographic, and historical data that cover
  a wide range of themes such as education, labour, wages, demography, family, health,
  migration, etc. These data have primarily been produced by French government agencies
  (notably the French National Institute of Statistics and Economic Studies (INSEE)[5]
  and, more recently, by academic researchers. Quetelet-Progedo, as a product of Progedo,
  has been jointly funded by the French Ministry of Higher Education and Research
  and the CNRS. Please note that the majority of the data and documentation is in
  French.
