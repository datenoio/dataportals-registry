description: The ECRIN Clinical Research Metadata Repository is a portal allowing
  users to search for studies using a variety of criteria and identify the data objects
  (trial registrations, results summaries, journal articles, protocols etc.) associated
  with them. The repository is intended to support researchers and reviewers locate
  available data objects of all types, from a wide variety of sources. Where the data
  is publicly available, links are provided to directly access the data object. For
  controlled data, links to information about data access are available.
