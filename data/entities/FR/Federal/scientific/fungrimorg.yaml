description: The Mathematical Functions Grimoire (Fungrim) is an open source library
  of formulas and data for special functions. Fungrim currently consists of 457 symbols
  (named mathematical objects), 3130 entries (definitions, formulas, tables, plots),
  and 82 topics (listings of entries). The Fungrim website provides a permanent ID
  and URL for each entry, symbol or topic. All data in Fungrim is represented in semantic
  form designed to be usable by computer algebra software.
