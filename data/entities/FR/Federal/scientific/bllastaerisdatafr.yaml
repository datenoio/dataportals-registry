description: 'BLLAST is a research programme aimed at exploring the late afternoon transition
  of the atmospheric boundary layer. The late afternoon period of the diurnal cycle of the
  boundary layer is poorly understood. This is yet an important transition period that impacts
  the transport and dillution of water vapour and trace species. The main questions adressed
  by the project are: - How the turbulence activity fades when heating by the surface decreases?'
