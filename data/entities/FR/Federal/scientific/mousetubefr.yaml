description: "mouseTube is a database dedicated to mouse ultrasonic communication.\
  \ mouseTube aims at gathering mouse ultrasonic vocalisations recordings and making\
  \ them available for the community. \nmousetube associates a set of metadata to\
  \ download links of raw files of mouse vocalization recordings hosted on repositories\
  \ by the owners of these files.\nMembers sharing data on mouseTube are fully responsible\
  \ for the content of raw files and the accuracy of the metadata provided. mouseTube\
  \ data are freely available and can be used for subsequent publications with appropriate\
  \ references.\nThis is a temporary version of MouseTube.\nThis 0.5 version uses\
  \ the same database as the 0.0 version but with more recent and safer technologies.\
  \ The main improvement is that data are now accessible without authentication.\n\
  If you want to share vocalization files, please contact us. This version does not\
  \ allow to share file but we can do it manually.\nWe are currently developing a\
  \ new version (v1.0) with more functionalities."
