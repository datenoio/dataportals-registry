description: 'IPPI-DB is a database of modulators of protein-protein interactions.
  It contains exclusively small molecules and therefore no peptides. The data are
  retrieved from the literature either peer reviewed scientific articles or world
  patents. A large variety of data is stored within IPPI-DB: structural, pharmacological,
  binding and activity profile, pharmacokinetic and cytotoxicity when available, as
  well as some data about the PPI targets themselves.'
