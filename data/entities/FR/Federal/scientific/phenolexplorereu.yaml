description: Phenol-Explorer is the first comprehensive database on polyphenol content
  in foods. The database contains more than 35,000 content values for 500 different
  polyphenols in over 400 foods. These data are derived from the systematic collection
  of more than 60,000 original content values found in more than 1,300 scientific
  publications. Each of these publications has been critically evaluated before inclusion
  in the database.
