description: Géo-PRCM / GEOPRCM is the regional marine geoportal of the Regional Partnership
  for Coastal and Marine Conservation in West Africa (PRCM). It publishes fisheries, marine
  protected area, biodiversity, and coastal threat layers for Mauritania, Senegal, Cabo Verde,
  Guinea, The Gambia, Sierra Leone, and Guinea-Bissau. The former webgis.prcmarine.org host
  redirects to this ArcGIS Hub.
