description: West African Coastal Regional Observatory (ORLOA / WACA) GeoNode for monitoring
  the marine and coastal environment. Covers coastal erosion, pollution, and shoreline change
  for Benin, Côte d'Ivoire, The Gambia, Ghana, Guinea, Guinea-Bissau, Liberia, Mauritania,
  Senegal, Sierra Leone, Togo, and São Tomé and Príncipe. The TLS certificate chain is incomplete
  as of August 2026; the GeoNode APIs still respond.
