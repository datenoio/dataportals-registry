description: PlutoF platform has been designed for storing and managing biodiversity
  data over the web. PlutoF provides database and computing services for the taxonomical,
  ecological, phylogenetical, etc. research. ​ The purpose of the platform is to provide
  synergy through common modules for the specimens, samples, classifications, taxon
  names, analytical tools, etc. This resource is both a software platform as well
  as a repository in its own right. This records describes the PlutoF repository,
  rather than the software.
