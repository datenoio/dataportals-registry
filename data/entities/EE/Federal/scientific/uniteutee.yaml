description: 'UNITE is a database and sequence management environment centered on
  the eukaryotic nuclear ribosomal ITS region. All eukaryotic ITS sequences from the
  International Nucleotide Sequence Database Collaboration are clustered to approximately
  the species level (distance between species in steps of 0.5%), and all such species
  hypotheses are given a DOI to facilitate unambiguous scientific communication and
  data assembly. The user can interact with these species hypotheses (e.g., SH1566366.08FU)
  in various ways, and third-party sequence and metadata annotation are supported.
  Registration is needed to access the more powerful features of the accompanying
  PlutoF workbench. A range of search and query options are available, and precompiled
  reference datasets for local sequence similarity searches and HTS pipelines are
  available for download. Owing to the mycological roots of UNITE, two versions of
  the release files are available: all eukaryotes (including fungi), and fungi only.
  UNITE is a community effort that relies on the scientific expertise of its users
  – please consider contributing by, e.g., annotating sequences of your taxa of expertise.'
