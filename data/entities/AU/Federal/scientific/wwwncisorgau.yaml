description: The National Coronial Information System (NCIS) is a secure database
  of information on deaths reported to a coroner in Australia and New Zealand. The
  NCIS contains data on almost 500,000 cases, investigated by a coroner. Data includes
  demographic information on the deceased, contextual details on the nature of the
  fatality and searchable medico-legal case reports including the coronial finding,
  autopsy and toxicology report and police notification of death. The database is
  available to coroners to assist investigations and access is available on application
  (subject to ethics approval processes) for research projects.
