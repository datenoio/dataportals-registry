description: 'The aim of EcoPlots is to harmonise plot-based ecology data from different
  sources to enable integrated search and access to data based on different jurisdiction,
  data sources, feature types, parameters and temporal extent.

  The EcoPlots is developed based on semantic data integration approach, each of the
  data sources are mapped to the TERN Plot ontology. Datasets are generally received
  from custodians in various forms including PostgreSQL database and CSV file format
  . In data ingestion process, each of the source datasets are mapped to a TERN Plot
  ontology including identifying and mapping domain feature types, parameters and
  categorical values to TERN controlled vocabularies, performing data validation routines
  and resolving taxonomic names. All data are organised in Resource Description Framework
  (RDF) and stored in a triple store.'
