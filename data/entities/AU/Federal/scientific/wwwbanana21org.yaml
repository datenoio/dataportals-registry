description: The vast majority of the bananas currently grown and consumed were not
  conventionally bred but are selections made over probably thousands of years from
  naturally occurring hybrids. Cultivated bananas are very nearly sterile and as a
  consequence are not propagated from seed but rather through vegetative propagation,
  primarily suckers as well as more recently micropropagated or tissue cultured bananas.
  These factors, very old selections, near sterility and vegetative propagation, mean
  that these bananas have not been genetically improved either for resistance or improved
  quality and are becoming increasing in affected by serious pests and diseases.
