description: The Advanced Ecological Knowledge and Observation System from the Terrestrial
  Ecosystem Research Network (TERN AEKOS) focuses on ecological plot data that are
  generated by land-based ecosystem projects that use survey, monitoring and experimental
  studies to collect raw data on plants, animals (including traits) and their immediate
  environments at the same location. Plot data are observations sampled by using scientific
  techniques such as quadrants, grids, transects, animal trap arrays and other structured
  sampling techniques.
