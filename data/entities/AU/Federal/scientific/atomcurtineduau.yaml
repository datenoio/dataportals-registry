description: The CCC method yields accurate excitation and ionisation cross sections for atomic
  and ionic targets which are well-modelled by one or two valence electrons above a Hartree-Fock
  core. Inner core ionisation can be a major contributor to the total ionisation cross section.
  Such contributions can be estimated using various forms of Born-based approximations.
