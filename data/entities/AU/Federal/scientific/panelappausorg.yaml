description: PanelApp Australia is a public knowledge base of virtual gene panels
  for human disorders, used by Australian diagnostic laboratories, clinicians, and
  researchers. It is an instance of Genomics England PanelApp, first deployed by Australian
  Genomics in 2019 and now supported by Genomics Australia. The panels API publishes
  curated gene panels with disease groups and evidence grades.
