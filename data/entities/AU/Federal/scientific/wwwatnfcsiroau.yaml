description: All observations obtained with the Parkes radio telescope are made available
  to the general community after an embargo period. Usually this embargo period is set to
  18 months after the observation. The catalogue includes all published rotation-powered pulsars,
  including those detected only at high energies. It also includes Anomalous X-ray Pulsars
  (AXPs) and Soft Gamma-ray Repeaters (SGRs) for which coherent pulsations have been detected.
