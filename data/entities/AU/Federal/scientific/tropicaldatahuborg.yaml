description: The Tropical Data Hub (TDH) is an open portal enabling researchers to
  submit information relating to the tropics in an open and collaborative way. The
  TDH complements existing data repositories and will come to be acknowledged as the
  definitive source of information relating to the tropics, both within Australia
  and internationally. The information available through within the TDH relates to
  the physical and natural environment, societies and communities (e.g. linguistic
  and cultural data), and economies. The use of metadata will ensure that the TDH
  is readily accessible to governments, researchers and the business sector.
