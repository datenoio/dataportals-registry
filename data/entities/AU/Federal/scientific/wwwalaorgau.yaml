description: The Atlas of Living Australia (ALA) combines and provides scientifically collected
  data from a wide range of sources such as museums, herbaria, community groups, government
  departments, individuals and universities. Data records consist of images, literature, molecular
  DNA data, identification keys, species interaction data, species profile data, nomenclature,
  source data, conservation indicators, and spatial data.
