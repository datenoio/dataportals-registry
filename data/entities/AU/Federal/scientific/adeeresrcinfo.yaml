description: The Australian Drosophila Ecology and Evolution Resource (ADEER) is a
  disciplinary research data repository that provides open access to datasets on the
  ecology, evolution, genomics, and biogeography of Australian Drosophila species.
  The repository includes long-term clinal surveys, species distribution records,
  genomic datasets, and phenotypic data collected by the Hoffmann Lab and collaborating
  researchers. ADEER was developed to preserve, curate, and share these datasets for
  studies of evolutionary biology, climate adaptation, and biodiversity.
