description: TISSUES is a weekly updated web resource that integrates evidence on
  tissue expression from manually curated literature, proteomics and transcriptomics
  screens, and automatic text mining. All evidence to common protein identifiers and
  Brenda Tissue Ontology terms is mapped, and confidence scores that facilitate comparison
  of the different types and sources of evidence are assigned. These scores are visualized
  on a schematic human body to provide a convenient overview.
