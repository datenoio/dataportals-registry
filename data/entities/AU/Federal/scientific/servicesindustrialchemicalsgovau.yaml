description: The Australian Industrial Chemicals Introduction Scheme (AICIS) replaced
  the National Industrial Chemicals Notification and Assessment Scheme (NICNAS) as
  the national regulator for the importation and manufacture (introduction) of industrial
  chemicals in Australia. Assessments are conducted on the hazards and risks to human
  health and the environment from the introduction and use of industrial chemicals
  in Australia. The scope of the assessments varies and may include hazard characteristics,
  risk assessments and risk management recommendations to regulators and standard
  setting bodies in Australian and state and territory governments.
