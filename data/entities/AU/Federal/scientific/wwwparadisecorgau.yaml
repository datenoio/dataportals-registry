description: PARADISEC (the Pacific And Regional Archive for Digital Sources in Endangered
  Cultures) is a digital archive that preserves recordings and materials documenting
  endangered languages and small cultures, mainly from the Pacific and Southeast Asia.
  It provides access to audio, text, and visual data collected through fieldwork,
  ensuring they are safely digitized and catalogued according to international archiving
  standards.
