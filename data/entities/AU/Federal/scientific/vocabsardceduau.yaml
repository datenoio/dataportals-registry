description: Research Vocabularies Australia (RVA) helps users access and reuse vocabularies
  for all areas of research. Some vocabularies are hosted by the Australian Research
  Data Commons (ARDC) and can be accessed directly through the RVA, otherwise links
  are provided to the vocabulary owner’s web page. Research Vocabularies Australia
  also allows you to create and/or publish a vocabulary as well as integrate an existing
  vocabulary into your own system.
