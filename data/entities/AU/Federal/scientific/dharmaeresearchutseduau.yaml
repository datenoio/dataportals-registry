description: DHARMAE (Data Hub of Australian Research on Marine and Aquatic Ecocultures)
  is a disciplinary research data repository hosted by the University of Technology
  Sydney (UTS). It brings together interdisciplinary datasets related to water, marine
  systems, ecology, and cultural knowledge, including Indigenous and local community
  perspectives. The repository supports the discovery and reuse of research data linked
  to environmental and social studies of aquatic ecosystems, particularly in Australia.
  It is mainly used to store and share curated research project data within a controlled
  research infrastructure.
