description: The project aims to examine and index the genomic diversity through the generation
  of complete mitochondrial and nuclear genome sequences of sharks and rays of the Pacific
  Rim. There is a huge diversity of elasmobranch fishes in this region, but many species are
  under threat because of poor management and conservation measures in many countries. It
  is absolutely critical that species’ identities are correct for conservation and fisheries
  management purposes.
