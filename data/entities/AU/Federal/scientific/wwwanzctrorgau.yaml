description: The Australian New Zealand Clinical Trials Registry (ANZCTR) is an online
  register of clinical trials being undertaken in Australia, New Zealand and elsewhere.
  The ANZCTR includes trials from the full spectrum of therapeutic areas of pharmaceuticals,
  surgical procedures, preventive measures, lifestyle, devices, treatment and rehabilitation
  strategies and complementary therapies. The ANZCTR mandatory data items comply with
  the minimum dataset requirements of the International Committee of Medical Journal
  Editors (ICMJE) and the World Health Organization (WHO).
