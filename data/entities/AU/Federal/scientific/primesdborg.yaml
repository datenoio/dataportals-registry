description: PRIMESDB is a systems biology platform that is being developed to enable
  the collection, integration and analysis of state-of-the-art genomics, proteomics
  and mathematical modelling data being generated by the PRIMES project. PRIMES is
  investigating the role of protein interaction machines in oncogenic signalling with
  a particular focus on the EGFR network. PRIMESDB provides a centralised knowledgebase
  and analysis platform for cancer protein interaction networks.
