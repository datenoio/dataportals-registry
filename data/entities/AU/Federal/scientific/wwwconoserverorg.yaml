description: ConoServer is a database specializing in sequences and structures of
  peptides expressed by marine cone snails. The database gives access to protein sequences,
  nucleic acid sequences and structural information on conopeptides. ConoServer's
  data are first collected from the peer reviewed literature and from publicly available
  databases, including UniProtKB/Swiss-Prot, NCBI nucleotide (nt), and the World Wide
  Protein Data Bank. The data are then curated manually, which include the addition
  of references, the analysis of sequence regions, the identification of cysteine
  frameworks and gene superfamilies, and the identification of mature peptides in
  the precusor sequences.
