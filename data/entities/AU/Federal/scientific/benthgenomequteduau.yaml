description: Nicotiana benthamiana originates from the remote regions of northern
  Australia. It is used extensively in laboratories around the world for many types
  of research including metabolic engineering, plant-microbe interactions, RNAi, vaccine
  production and functional genomics. This site aims to provide easy access to our
  latest genome and transcriptome assemblies of both laboratory and wild strains of
  Nicotiana benthamiana.
