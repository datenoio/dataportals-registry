description: cropPAL2020 provides a tool to investigate subcellular localisation in
  a growing number of crop species through the unification of disparate datasets and
  by the provision of web services through an accessible interface. Users can construct
  powerful queries or interrogate their protein sets resulting in a one-stop-shop
  for protein localisation and protein location relationships. The compendium of cropPAL2020
  houses large scale proteomic (MS/MS), fluorescence protein (FP) localisation as
  well as Protein-Protein Interaction (PPI) inferred from Arabidopsis PPI experimentation.
  The cropPAL2020 search interface provides flexible options of refining or interrogating
  protein data sets by location, interactions, protein properties and bibliographic
  information.
