description: BloodChIP Xtra is a user-friendly database that facilitates genome-wide
  exploration and visualization of transcription factor (TF) occupancy and chromatin
  configuration in rare primary human hematopoietic stem (HSC-MPP) and progenitor
  (CMP, GMP, MEP) cells and acute myeloid leukemia (AML) cell lines (KG-1, ME-1, Kasumi1,
  TSU-1621-MT), along with chromatin accessibility and gene expression data from these
  and primary patient AMLs.  An interactive web interface allows users to explore
  the regulatory landscape of any gene across multiple blood cell types, and then
  associate the epigenetic/regulatory profile with gene expression across healthy
  and leukemic cells. All queries, as well as the complete database, can be exported
  by the user for further data analysis.
