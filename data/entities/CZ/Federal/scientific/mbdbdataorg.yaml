description: Molecular Biophysics Database (MBDB) is a data repository for providing
  rich metadata along raw measurement data from Biophysical techniques. MBDB makes
  the raw measurement data citable by issuing Digital Object Identifiers (DOIs), through
  DataCite. MBDB collects raw data produced in experiments with biomolecular samples,
  biological material or other material, using molecular biophysics methods, such
  as Microscale Thermophoresis (MST), Biolayer interferometry (BLI), Surface Plasmon
  Resonance (SPR) and others.
