description: This is the place where you can find an updated list of the published
  mitochondrial sequences coming from the ancient DNA samples (aDNA). The main interest
  of our database lies in the anatomically modern Homo sapiens samples, ranging from
  the late Paleolithic to roughly Iron Age times, focusing on an Euroasian geographical
  area. We provide both the mtDNA sequences (in FASTA format), and the metadata for
  the samples (ID, date, geolocation, site, culture, mtDNA haplogroup, etc.), available
  to download in a comma-separated (CSV) text file.
