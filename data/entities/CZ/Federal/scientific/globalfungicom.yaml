description: GlobalFungi is a collection and validation of data published on the composition
  of fungal communities in terrestrial environments including soil and plant-associated
  habitats. Users can search for individual sequences, fungal species hypotheses,
  species or genera, to get a visual representation of their distribution in the environment
  and to access and download sequence data and metadata. In addition, the user interface
  also allows authors to submit data from studies not yet covered and in this way
  to help to build the resource for the community of researchers in systematics, biogeography,
  and ecology of fungi.
