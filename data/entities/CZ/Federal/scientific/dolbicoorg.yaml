description: Dolbico, the Database Of Local Biomolecular Conformers, stores DNA structural
  data including the information about DNA local spatial arrangement. The main aim
  of Dolbico is the exploration of DNA structure at a local level. The analysis of
  local DNA structure is based on a classification system that uses 9 torsional angles
  (7 backbone angles and two glycosidic torsions) to categorize dinucleotides into
  several distinct conformational families. The implemented classification workflow
  is able not only to classify dinucleotides into already existing classes, but is
  also able to discover new classes in new solved DNA structures.
