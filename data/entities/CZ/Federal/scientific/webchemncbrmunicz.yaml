description: ValidatorDB is a collection of validation results for the entire Protein
  Data Bank. Annotation (3-letter code) of HET residues larger than 6 heavy atoms
  is inspected, i.e. if the residue has the same topology and stereochemistry as the
  model ligand or residue stored in the wwCCD. Validation reports for the entire database
  can be inspected as well as for the arbitrary set of PDB entries or PDB annotations
  (3-letter residue code). Results are available in graphical form via Web UI and
  can be downloaded in the form of CSV files for further inspection.
