description: 'FireProtDB is a comprehensive, manually curated database of the protein
  stability data for single-point mutants.

  Proteins find their use in numerous biomedical and biotechnological applications.
  Naturally occurring proteins usually cannot withstand harsh industrial environments
  since they have evolved to function under mild conditions. Increasing protein stability
  is one of the key determinants of protein applicability. The predictive power of
  the current computational tools is compromised by the limited experimental data
  that would allow a rigorous training and testing.

  This database combines the published datasets from ProTherm and ProtaBank, the data
  extracted from the recent literature, and the measurements collected in our laboratory.
  The annotations were obtained from VariBench and HotSpot Wizard. The graphical user
  interface is designed to facilitate both types of the expected use: (i) the interactive
  explorations of individual entries on the level of a protein or a mutation and (ii)
  the construction of highly customized, machine learning-friendly datasets using
  advanced searching and filtering.'
