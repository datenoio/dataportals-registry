description: TeloBase is a curated database containing computationally predicted and
  experimentally confirmed telomere sequences of species across the whole tree of
  life. It contains information from the literature (1978 – September 2022) and predicted
  telomere motifs from publicly available NGS data stored in the SRA database (NCBI)
  and user submitted data. TeloBase is supplemented by internal taxonomy utilizing
  popular on-line taxonomic resources that enables in-house data filtration and graphical
  visualisation of telomere DNA evolutionary dynamics in the form of heat tree plots.
  Its manual and other relevant data (raw results from NGS data analysis and Atlas
  of telomere sequences) can be accessed on https://www.ceitec.eu/chromatin-molecular-complexes/rg51/tab?tabId=125#TeloBase.
