description: mzCloud is a web-based mass spectral database designed to support the
  identification of small molecules using tandem mass spectrometry. It contains an
  extensively curated collection of high-quality MSⁿ spectra organized into searchable
  spectral trees, along with compound structures, fragments, and related metadata.
  Researchers can search the database to match experimental spectra and aid in compound
  identification, and registered users can build custom spectral libraries.
