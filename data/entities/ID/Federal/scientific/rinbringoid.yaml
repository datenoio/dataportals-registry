description: The National Scientific Repository (RIN) is an application for managing data and outputs from research, development, assessment, and application activities. RIN can be used by researchers or research institutions to manage research data. RIN was developed by the Scientific Data and Documentation Centre of the Indonesian Institute of Sciences (PDII LIPI) on the basis of the Dataverse Network project, which is an open platform for scientific data from all fields of science built by the international community with the initiator of IQSS - Harvard University.
