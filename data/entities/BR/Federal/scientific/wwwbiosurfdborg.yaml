description: 'BioSurfDB is a online database for biodegradation and biosurfactants.
  It is a curated relational information system integrating data from: (i) metagenomes;
  (ii) organisms; (iii) biodegradation relevant genes; proteins and their metabolic
  pathways; (iv) bioremediation experiments results, with specific pollutants treatment
  efficiencies by surfactant producing organisms; and (v) a biosurfactant-curated
  list, grouped by producing organism, surfactant name, class and reference. The main
  goal of this repository is to gather information on the characterization of biological
  compounds and mechanisms involved in biosurfactant production and/or biodegradation
  and make it available in a curated way and associated with a number of computational
  tools to support studies of genomic and metagenomic data.'
