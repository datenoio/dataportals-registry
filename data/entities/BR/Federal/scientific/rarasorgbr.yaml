description: The Brazilian Online Atlas of Rare Diseases service from the National
  Network of Rare Diseases. This portal was developed to disseminate information from
  the nationally representative survey about the epidemiology, clinical picture, diagnostic
  and therapeutic resources used and costs with rare diseases of genetic and non-genetic
  origin in Brazil, in addition to other relevant information and knowledge involving
  the domain of rare diseases. Although the database was collected in Portuguese,
  there is a translation of the metadata and supporting documentation in English available
  and linked from this record (10.5281/zenodo.13643431).
