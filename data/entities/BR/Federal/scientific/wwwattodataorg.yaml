description: The Amazon Tall Tower Observatory (ATTO) Data Portal is an interdisciplinary
  platform for storing, sharing, exchanging, and publishing data collected by the
  ATTO research consortium. Its core goal is to improve understanding of biogeochemical
  cycles and energy fluxes across the geosphere, biosphere, and atmosphere in the
  Amazon region and to feed that understanding into climate and Earth system models.
