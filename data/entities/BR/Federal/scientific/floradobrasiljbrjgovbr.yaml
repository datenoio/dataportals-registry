description: In 2010, Brazil published the Catalog of Plants and Fungi of Brazil and
  launched the first online version of the List of Species of the Brazilian Flora,
  meeting Target 1 of the Global Strategy for Plant Conservation (GSPC-CBD). This
  botanical milestone was only achieved due to the commitment of more than 400 Brazilians
  and foreign taxonomists who worked on a platform where information about our flora
  was included and disseminated in real time. The "Brazilian List", as it was popularly
  known, closed in November 2015 with the publication of five papers and their respective
  databases dealing with the different groups of fungi and plants. We enthusiastically
  present in 2016, the brand new system that houses the Brazilian Flora 2020 project,
  aiming to achieve Target 1 established for 2020 by the GSPC-CBD. This new project
  icludes provisions to include descriptions, identification keys and illustrations
  to all species of plants, algae and fungi known in the country. The Brazilian Flora
  2020 project is part of the Reflora Programme and is being conducted with the support
  of the Sistema de Informação sobre a Biodiversidade Brasileira (SiBBr). At the moment
  has nearly 700 scientists working in a network to prepare the monographs. These
  researchers are also responsible for nomenclatural information and geographic distribution
  (coverage in Brazil, endemism and biomes), as well as valuable data regarding life
  forms, substrate and vegetation types for each species. The search results on this
  page include information on endangered species (thanks to the cooperation with the
  Centro Nacional de Conservação da Flora) and allow access to the Index Herbariorum
  (due to the collaboration of The New York Botanical Garden). Besides this information,
  users can also access images of herbarium specimens, including nomenclatural types,
  from both the Reflora Virtual Herbarium and INCT Virtual Herbarium of Flora and
  Fungi; as well as images of live plants and scientific illustrations with all images
  included by the experts in each group.
