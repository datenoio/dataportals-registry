description: 'O Atlas Costeiro da Área de Proteção Ambiental Costa dos Corais (APACC)
  apresenta os principais resultados da tese de doutorado de Julia Caon Araujo, desenvolvida
  no âmbito da Universidade Federal do Rio de Janeiro, intitulada “Mapeamento de recifes
  de coral: integrando sensoriamento remoto e dados ecológicos”. O atlas disponibiliza
  três produtos cartográficos da zona costeira da APACC (até 30 m de profundidade):
  Modelo Digital de Elevação (batimetria), Mapa geomorfológico (tipos de relevo);
  Mapa bentônico (tipos de fundo). A elaboração dos produtos baseou-se no processamento
  digital de imagens Sentinel-2, aliado à integração de dados ecológicos obtidos em
  campo, utilizados para calibração e validação das classificações. Public SeaSketch
  project exposing 3 published overlay layers without sign-in; sketch editing may
  require an account.'
