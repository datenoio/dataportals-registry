description: The Finnish Social Science Data Archive (FSD) is a national-level service
  resource for research and teaching in Finland. FSD promotes data sharing and curates
  and disseminates digital research data for research, teaching and studying purposes.
  FSD serves both Finnish and international users. FSD is an expert in the curation
  and preservation of digital research data collected to study society, people and
  culture. FSD focuses on acquiring Social Science data, but data from other relevant
  fields (Arts and Humanities, Education, and Health Science) is also archived. FSD
  is Finland's service provider for CESSDA ERIC, the Consortium of European Social
  Science Data Archives.
