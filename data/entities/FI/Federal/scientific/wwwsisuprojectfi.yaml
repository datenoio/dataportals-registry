description: The Sequencing Initiative Suomi (SISu) search engine offers a way to
  search for data on sequence variants in the Finnish population. It provides valuable
  summary data for researchers and clinicians as well as other researchers with an
  interest in genetics in Finland. With SISu, you can examine the attributes and appearance
  of different variants in Finnish cohorts and see their aggregate distribution in
  Finland visualized on a map. The SISu project is an international collaboration
  between multiple research groups aiming to build tools for genomic medicine.
