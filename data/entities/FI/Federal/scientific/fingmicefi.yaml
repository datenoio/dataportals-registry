description: Building of this virtual electron microscopy (EM) image library on normal
  mouse tissues is initiated as part of an EOSC-Life project at the Biocenter Oulu
  Transgenic and Tissue Phenotyping, and Electron Microscopy Core Facilities, University
  of Oulu, Finland, in collaboration with Infrafrontier. The open-access, annotated
  EM image library presents educative reference information for researchers using
  gene modified mice as disease or pre-clinical models. By providing a deeper understanding
  of tissues at ultrastructural level, it eases and aids in understanding structural
  changes and related phenotypes in mouse models. This resource is currently in development.
