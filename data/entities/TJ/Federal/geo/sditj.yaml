description: Historical GeoNode spatial data infrastructure known as the Open Center,
  developed by the Aga Khan Agency for Habitat with the Committee for Emergency Situations
  and Civil Defense and the Main Department of Geology. It catalogued hazard-risk
  layers and disaster-risk assessments for Tajikistan. The sdi.tj hostname no longer
  resolves (24 August 2026).
