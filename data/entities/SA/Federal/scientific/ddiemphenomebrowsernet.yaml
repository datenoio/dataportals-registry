description: DDIEM - Drug Database for inborn errors of metabolism is a database on
  therapeutic strategies for inborn errors of metabolism. These strategies are classified
  by mechanism and outcome in DDIEM ontology. DDIEM uses this ontology to categorize
  the experimental treatments that have been proposed or applied. The database includes
  descriptions of the phenotypes addressed by the treatment and drugs participating
  in treatment and procedures.
