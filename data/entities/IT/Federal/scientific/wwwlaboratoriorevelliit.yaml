description: 'WHIP is a database of individual work histories, based on Inps administrative
  archives. The reference population is made up by all the people – Italian and foreign –
  who have worked in Italy even only for only a part of their working career. A large representative
  sample has been extracted from this population: in the standard file the sampling coefficient
  is about 1: 180, for a dynamic population of about 370,000 people (figures will be doubled
  in the full edition).'
