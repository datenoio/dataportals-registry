description: DISNOR is a resource that uses a comprehensive collection of disease
  associated genes, as annotated in DisGeNET, to interrogate SIGNOR (https://signor.uniroma2.it)
  in order to assemble disease-specific logic networks linking disease associated
  genes by causal relationships. DISNOR is an open resource where more than 4000 disease-networks,
  linking ~ 2800 disease genes, can be explored. For each disease curated in DisGeNET,
  DISNOR links disease genes through manually annotated causal relationships and the
  inferred 'patho-pathways' can be visualised at different level of complexity.
