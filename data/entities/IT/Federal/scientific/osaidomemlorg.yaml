description: 'Based on the 2025 paper (https://arxiv.org/abs/2505.16619), the OSAI
  AI Ecosystem is a simple interactive, community-maintained digital resource. Its
  primary function is to serve as a practical registry that supports the implementation
  of Open and Sustainable AI (OSAI) principles in the life sciences.


  The core of the resource is a direct mapping of the paper''s OSAI recommendations
  (for reusability, reproducibility, and environmental sustainability) to a living
  collection of over 300 real-world components.


  These components include a wide array of tools, platforms, standards, and resources
  that researchers can use to build more sustainable, reusable, and transparent AI.
  The registry is designed to help researchers "stop searching and start implementing"
  by allowing them to filter for resources based on their specific goals, such as
  finding reproducibility tools or sustainability supports.


  The resource is supported by an open community-maintained GitHub repository: https://github.com/BioComputingUP/OSAI_ecosystem.'
