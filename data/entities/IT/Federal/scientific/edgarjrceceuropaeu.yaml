description: The Emissions Database for Global Atmospheric Research (EDGAR) is a global,
  independent inventory of human-caused greenhouse gas and air pollutant emissions
  compiled by the European Commission’s Joint Research Centre. It provides consistent,
  long-term estimates of emissions by country, sector, and grid cell, based on international
  statistics and standard methodologies. EDGAR’s data help scientists, policymakers,
  and modelers analyze historical trends and support climate change research and policy
  assessments.
