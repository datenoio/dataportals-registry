description: QUADRatlas is a database of experimentally-derived and computationally
  predicted RNA G-quadruplex (RG4s) in the human transcriptome, enriched with biological
  function and disease associations. QUADRatlas includes known interactions of RG4s
  with RNA-binding proteins (RBPs), complemented with an extensive RBP binding sites
  dataset. Users can thus intersect RG4s with their potential regulators and effectors,
  enabling the formulation of novel hypotheses on RG4 regulation, function and pathogenicity.
  To support this capability, we provide analysis tools for predicting whether an
  RBP can bind RG4s, RG4 enrichment in a gene set, and de novo RG4 prediction. Genome-browser
  and table views allow exploring, filtering, and downloading the data quickly for
  individual genes and in batch.
