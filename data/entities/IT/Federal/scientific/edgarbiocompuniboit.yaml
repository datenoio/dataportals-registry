description: The database of Disease-Gene Associations with annotated Relationships
  (eDGAR) is a database for collecting and organizing the data on gene/disease associations
  as derived from OMIM, Humsavar and ClinVar. For each heterogeneous or polygenic
  disease, eDGAR provides information on the relationship among the proteins encoded
  by the involved genes, including transcription factors and protein-protein interactions.
