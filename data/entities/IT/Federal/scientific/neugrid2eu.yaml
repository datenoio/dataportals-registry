description: NeuGRID is a secure data archiving and HPC processing system. The neuGRID platform
  uses a robust infrastructure to provide researchers with a simple interface for analysing,
  searching, retrieving and disseminating their biomedical data. With hundreds of investigators
  across the globe and more than 10 million of downloadable attributes, neuGRID aims to become
  a widespread resource for brain analyses.
