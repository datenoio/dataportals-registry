description: The Eukaryotic Ribosomal Internal Transcribed Spacer 1 Database (ITSoneDB)
  is a collection of eukaryotic ribosomal RNA Internal Transcribed Spacer 1 (ITS1)
  sequences. It is intended to provide a curated reference database aimed at ITS1-based
  metagenomic surveys. Each ITS1 is mapped on the NCBI reference taxonomy with its
  start and end positions precisely annotated. ITSoneDB has been developed in agreement
  to the FAIR guidelines by enabling the users to query and download its content through
  a simple web-interface and access relevant metadata by cross-linking to European
  Nucleotide Archive.
