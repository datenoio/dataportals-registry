description: Phaidra (Permanent Hosting, Archiving and Indexing of Digital Resources
  and Assets) is the University of Padua Library System’s platform for long-term archiving
  of digital collections. Phaidra hosts various types of digital objects (antiquarian
  books, manuscripts, photographs, wallcharts, maps, learning objects, films, archive
  material and museum objects). Phaidra offers a search facility to identify specific
  objects, and each object can be viewed, downloaded, used and reused to the extent
  permitted by law and by its associated licences. The objects in the digital collections
  on the Phaidra platform are sourced from libraries (in large part due to the digitisation
  projects promoted by the Library System itself), museums and archives at the University
  of Padua and other institutions, including the Ca’ Foscari University and the Università
  Iuav in Venice.
