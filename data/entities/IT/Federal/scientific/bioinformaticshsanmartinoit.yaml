description: 'CLIMA 2 is the result of an integration effort aimed at including all
  certified STR profiles of human cell lines in a unique database. The contents of
  the database are dynamically summarized (i.e., they are always up-to-date) in a
  table in the home page. CLIMA can be used to identify researcher''s cell lines.
  Moreover, it can be searched either by name or by locus. The identification of a
  cell line is performed according to the standard ANSI/ATCC ASN-0002-2011 on "Authentication
  of Human Cell Lines: Standardization of STR Profiling".'
