description: AMS Acta is the institutional open access repository which enables the
  researchers of the Alma Mater Studiorum - University of Bologna to share, preserve
  and showcase their scientific works making them easily accessible, citable and reusable.
  The repository collects and disseminates unpublished research such as preprints,
  technical reports, working papers, conference proceedings, research data and software.
  Moreover, it collects series and books published by the University Departments and
  Research teams.
