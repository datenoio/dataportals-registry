description: 'The GRSF, the Global Record of Stocks and Fisheries, integrates data from three
  authoritative sources: FIRMS (Fisheries and Resources Monitoring System), RAM (RAM Legacy
  Stock Assessment Database) and FishSource (Program of the Sustainable Fisheries Partnership).
  The GRSF content publicly disseminated through this catalogue is distributed as a beta version
  to test the logic to generate unique identifiers for stocks and fisheries.'
