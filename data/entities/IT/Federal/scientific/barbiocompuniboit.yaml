description: 'BAR 3.0 is a server for the annotation of protein sequences relying
  on a comparative large-scale analysis on the entire UniProt. With BAR 3.0 and a
  sequence you can annotate when possible: function (Gene Ontology), structure (Protein
  Data Bank), protein domains (Pfam). Also if your sequence falls into a cluster with
  a structural/some structural template/s we provide an alignment towards the template/templates
  based on the Cluster-HMM (HMM profile) that allows you to directly compute your
  3D model. Cluster HMMs are available for downloading.'
