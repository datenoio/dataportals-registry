description: Burckhardtsource.org is a digital humanities database that hosts a critical
  online edition of letters sent to the Swiss cultural historian Jacob Burckhardt.
  It contains around a thousand documents from more than 300 correspondents, offering
  insights into 19th-century European cultural and intellectual life. The platform
  provides scans, transcriptions, metadata, and semantic annotations, allowing users
  to search, link, and visualize the correspondence.
