description: 'The Italian Integrated Ocean Observing System (IT-IOOS), initiated by
  the PNRR project ITINERIS, is a national initiative aiming to coordinate and harmonize
  national marine observations and provide a single access point to all Italian marine
  data. IT-IOOS integrates and harmonize data collected by various Research Infrastructures
  (RIs) with the aim of guaranteeing access to Italian facilities, services, and marine
  data and ensuring long-term monitoring of Essential Ocean Variables (EOVs), Essential
  Biodiversity Variables (EBVs), and Essential Climate Variables (ECVs). Data collected
  from a wide range of platforms and technologies, including moorings, floats, drifters,
  gliders, and research vessels, models, are harmonized and made accessible from the
  IT-IOOS portal. IT-IOOS adopted the FAIR principles—Findable, Accessible, Interoperable,
  and Reusable. All data are structured in a way that promotes seamless integration
  with other datasets. This accessibility empowers marine stakeholders to leverage
  the data effectively, fostering collaboration across different disciplines and enhancing
  the potential for innovative solutions to emerge. IT-IOOS builds upon Italy’s active
  involvement in Research Infrastructures (RIs), which have been established to share
  facilities, resources, and services to monitor the environment and ensure their
  long-term sustainability. RIs contributing to IT-IOOS includes the Italy''s nodes
  and facilities of EMSO ERIC, EURO-ARGO ERIC, DANUBIUS, ICOS, JERICO, eLTER, EUROFLEETS
  and SIOS as well as three significant Italian infrastructures: Laboratori Nazionali
  del Sud, N/R Laura Bassi, and GeoSciences-MER The IT-IOOS has been designed as a
  distributed system to enhance the collection and sharing of oceanographic data.
  This design adheres to the guidelines established by the Italian Oceanographic Commission
  (COI), a national body of the UNESCO Intergovernmental Oceanographic Commission,
  which has emphasized the necessity of a unique portal where all Italian marine monitoring
  systems, modeling results, and marine data are displayed and easily accessible.
  By aligning with these national and international standards, IT-IOOS strengthens
  Italy''s capacity to contribute to global ocean observation efforts, fostering innovation
  and sustainability in marine science.'
