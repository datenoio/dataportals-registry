description: Regional Database System (RDS) is ICIMOD’s clearing house for curated
  datasets across the Hindu Kush Himalaya. It supports search by title, abstract,
  keywords, and geographic extent, dataset download after registration, and a Data
  Explorer for maps and charts. ICIMOD is a regional intergovernmental centre based
  in Kathmandu serving Afghanistan, Bangladesh, Bhutan, China, India, Myanmar, Nepal,
  and Pakistan.
