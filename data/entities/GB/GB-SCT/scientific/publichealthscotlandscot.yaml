description: "The COVID-19 Research Repository has been developed by Public Health\
  \ Scotland (PHS) with an aim to bring together and provide access to Scottish COVID-19\
  \ research on a single shared platform in order to promote Scottish research to\
  \ an international audience.\n\nThe main objectives of the repository are to:\n\n\
  \    -make research easier to find\n    -raise awareness of Scottish research\n\
  \    -track, understand and report on the impact of this work\n   - reduce duplication\
  \ of effort\n    -encourage a collaborative, cross-sectoral approach to COVID-19\
  \ research in Scotland\n    -provide full-text open access to research wherever\
  \ possible\n    -ensure permanent preservation of PHS research"
