description: The Infectious Diseases Data Observatory (IDDO) assembles clinical, laboratory
  and epidemiological data on a collaborative platform to be shared with the research
  and humanitarian communities. The data are analysed to generate reliable evidence
  and innovative resources that enable research-driven responses to the major challenges
  of emerging and neglected infections. Data is organized into research themes, with
  both submitters storing and requesters asking for data via the central IDDO platform.
  Certain data (listed in data inventories or available via various portals) is available
  publicly, while the rest must be applied and permission received for.
