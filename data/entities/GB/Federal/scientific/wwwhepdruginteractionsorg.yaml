description: Currently 170 million people worldwide are infected with the hepatitis
  C virus (HCV) and >300 million with hepatitis B (HBV). Although interferon-free
  combination direct acting antivirals (DAAs) regimens have improved tolerability
  and efficacy for HCV-infected patients, drug-drug interactions (DDIs) have the potential
  to cause harm due to liver dysfunction, multiple comorbidities and comedications.
  This web site was established in 2010 by members of the Department of Pharmacology
  at the University of Liverpool to offer a resource for healthcare providers, researchers
  and patients to be able to understand and manage drug-drug interactions.
