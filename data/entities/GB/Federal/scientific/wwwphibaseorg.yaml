description: "PHI-base database contains expertly curated molecular and biological\
  \ information on genes proven to affect the outcome of pathogen-host interactions.\
  \ PHI-base catalogues experimentally verified pathogenicity, virulence and effector\
  \ genes from fungal, Oomycete and bacterial pathogens, which infect animal, plant,\
  \ fungal and insect hosts. An online community  curation portal, called PHI-Canto\
  \ (https://canto.phi-base.org) supports article curation by authors with datasets\
  \ being displayed at http://phi5.phi-base.org.\nData and source code availability:\
  \ All data sets are available from Github at  https://github.com/PHI-base. \nDiscussion\
  \ board: curation issues for community curation can be discussed and followed using\
  \ the PHI-canto curation tracker (https://github.com/PHI-base/curation)\nFunding:\
  \ PHI-base is funded from the UK Biotechnology and Biological Sciences Research\
  \ Council (BBSRC) [BB/S020020/1]. \nCitation reference: Urban, M. et al (2022).\
  \ NAR doi: 10.1093/nar/gkab1037"
