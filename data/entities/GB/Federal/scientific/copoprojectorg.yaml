description: 'Collaborative OPen Omics (COPO) is an online platform that serves as
  a metadata broker, facilitating the description of research data like reads, samples,
  images, sequence annotations, assemblies and data files in alignment with the FAIR
  (Findability, Accessibility, Interoperability and Reusability) principles.


  By supporting various community-recognised metadata standards, data formats and
  Application Programming Interface (API) methods, COPO ensures that data is accurately
  described, discoverable and can be easily integrated across different systems. This
  promotes enhanced collaboration, better data management, and long-term preservation
  thereby, making scientific outputs more accessible and reusable for a wider audience.


  Submitted data are stored in public repositories, enabling open access and ensuring
  that valuable research outputs are shared, reused, and built upon by the global
  research community. COPO integrates with key international data repositories promoting
  the open exchange of scientific data and advancing discoveries in various fields
  of life sciences.'
