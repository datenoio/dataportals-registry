description: UK Data Service (UKDS) provides unified access to the UK's largest collection
  of social, economic and population data for research and teaching purposes covering
  a range of different disciplines. The majority of our data are fully anonymised,
  unless otherwise specified in the relevant online catalogue records, and are therefore
  not suitable for genealogical users or family historians. The UK Data Service is
  funded by the Economic and Social Research Council (ESRC) to meet the data needs
  of researchers, students and teachers from all sectors, including academia, central
  and local government, charities and foundations, independent research centres, think
  tanks, and business consultants and the commercial sector.
