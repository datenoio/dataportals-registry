description: 'FlyAtlas 2 is the RNA-Seq successor to the original FlyAtlas (which
  was based on microarray analysis). Specifically, FlyAtlas 2 now provides access
  to: transcript information, sex-specific data for adult somatic tissues, and micro-RNA
  genes. FlyAtlas2 supports search by gene, category or tissue; and functionality
  has been improved through mobile support and the option to download results in spreadsheet
  format. Gene coverage has been extended by the inclusion of microRNAs and many of
  the RNA genes included in Release 6 of the Drosophila reference genome. The web
  interface has been modified to accommodate the extra data, but at the same time
  has been adapted for viewing on small mobile devices. Users also have access to
  the RNA-Seq reads displayed alongside the annotated Drosophila genome in the (external)
  UCSC browser, and are able to link out to the previous FlyAtlas resource to compare
  the data obtained by RNA-Seq with that obtained using microarrays.'
