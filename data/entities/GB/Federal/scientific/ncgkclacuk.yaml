description: The Network of Cancer Genes (NCG) contains information on duplicability,
  evolution, protein-protein and microRNA-gene interaction, function, expression and
  essentiality of cancer genes from manually curated publications . NCG also provides
  information on the experimental validation that supports the role of these genes
  in cancer and annotates their properties (duplicability, evolutionary origin, expression
  profile, function and interactions with proteins and miRNAs).
