description: Genomics England PanelApp is a publically-available knowledgebase that
  allows virtual gene panels related to human disorders to be created, stored and
  queried. It includes a crowdsourcing tool that allows genes to be added or reviewed
  by experts throughout the worldwide scientific community, providing an opportunity
  for the standardisation of gene panels, and a consensus on which genes have sufficient
  evidence for disease association. The diagnostic grade ‘Green’ genes and their modes
  of inheritance in the Version 1+ PanelApp virtual gene panels are used to direct
  the variant tiering process for the interpretation of genomes in the 100,000 Genomes
  Project and for the National Health Service England Genomic Medicine Service. As
  panels in PanelApp are publically available, they can also be utilised by others.
  Experts are asked to register (https://panelapp.genomicsengland.co.uk/accounts/registration/)
  in order to review and rate the genes on the panel to indicate whether there is
  a diagnostic-grade level of evidence for the gene to be implicated in a given disease.
  Bioinformaticians can access the data via the PanelApp API (https://panelapp.genomicsengland.co.uk/#!API).
  More detailed background information, instructions and updates can be found on the
  PanelApp homepage tabs.
