description: The International Mouse Phenotyping Consortium (IMPC) produces a publicly-available
  repository that stores information on IMPC processes, data and annotations. The
  IMPC is an international effort by 19 research institutions to identify the function
  of every protein-coding gene in the mouse genome by switching off or ‘knocking out’
  each of the roughly 20,000 genes that make up the mouse genome.
