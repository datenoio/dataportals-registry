description: Initiated in 2013, DMDD has the ambitious goal of identifying all embryonic
  lethal knockout lines made at the Wellcome Trust Sanger institute, through their
  work as a major centre for creation of individual mouse gene knockouts. DMDD uses
  a combination of comprehensive 3D imaging, tissue histology, immunocytochemistry
  and transcriptomics to identify abnormalities in embryo and placental structure
  for each embryonic lethal line. All data is made freely available via this web site,
  enabling individual researchers to identify lines relevant to their own research.
  The DMDD programme is coordinating its work with similar international efforts through
  the umbrella of the International Mouse Phenotyping Consortium.
