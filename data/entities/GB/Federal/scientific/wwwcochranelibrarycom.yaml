description: The Cochrane Library is a collection of databases in medicine and other
  healthcare specialities that contain different types of evidence to inform healthcare
  decision-making. Data in the Cochrane Library comes from the Cochrane Database of
  Systematic Reviews (CDSR), the Cochrane Central Register of Controlled Trials (CENTRAL),
  and Cochrane Clinical Answers (CCA). The Cochrane Library uses a subscription-based
  model, with many governments purchasing country-wide access. A more limited version
  of the Library is available for free.
