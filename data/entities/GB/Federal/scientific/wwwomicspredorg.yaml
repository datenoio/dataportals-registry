description: OmicsPred is a resource for predicting multi-omics data (proteomics,
  metabolomics, transcriptomics etc.) directly from genotypes. To do this, we use
  extensive multi-omics data to train genetic scores using machine learning. Here,
  you can explore and download the genetic scores for a wide range of biomolecular
  traits in human blood as well as the summary statistics of their associations with
  key traits and diseases in the UK Biobank.
