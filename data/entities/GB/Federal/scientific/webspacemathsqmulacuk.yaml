description: DesignTheory.org is a research project funded by the U.K. Engineering
  and Physical Sciences Research Council to provide various resources for Design Theory
  through the Internet. The project aims to cover theoretical, computational, and
  statistical aspects of combinatorial designs. In particular, one of its goals is
  the development of an on-line database of designs useful for mathematicians and
  statisticians in academia and industry.
