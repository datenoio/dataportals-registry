description: The World Wide Molecular Matrix (WWMM) is an electronic repository for unpublished
  chemical data. WWMM is an open collection of information of small molecules. The "Matrix"
  in WWMM is influenced by William Gibson's vision of a cyberinfrastructure where all knowledge
  is accessible. The WWMM is an experiment to see how far this can be taken for chemical compounds.
