description: The IMEx consortium is an international collaboration between a group of major
  public interaction data providers who have agreed to share curation effort and develop and
  work to a single set of curation rules when capturing data from both directly deposited
  interaction data or from publications in peer-reviewed journals, capture full details of
  an interaction in a “deep” curation model, perform a complete curation of all protein-protein
  interactions experimentally demonstrated within a publication, make these interaction available
  in a single search interface on a common website, provide the data in standards compliant
  download formats, make all IMEx records freely accessible under the Creative Commons Attribution
  License.
