description: The EPD has been created and is maintained by the Lamond group in the
  University of Dundee. It combines a polyglot persistent database and web-application
  that provides open access to integrated proteomics data for >30 000 proteins from
  published studies on human cells and model organisms. It is designed to provide
  a user-friendly interface, featuring graphical navigation with interactive visualizations
  that facilitate powerful data exploration in an intuitive manner. The EPD offers
  a flexible and scalable ecosystem to integrate proteomics data with genomics information,
  RNA expression and other related, large-scale datasets.
