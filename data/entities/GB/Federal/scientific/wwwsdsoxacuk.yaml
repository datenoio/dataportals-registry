description: The Sustainable Digital Scholarship (SDS) service offers a platform for
  hosting and publishing digital research outputs as well as resources and consultations
  to support University of Oxford researchers to achieve digital sustainability. The
  SDS platform is a good fit for many non-traditional digital outputs and empowers
  researchers to manage and sustain innovative research projects, driving global visibility
  and championing open scholarship. On publication of a record, a versioned digital
  object identifier (DOI) is automatically assigned for citation and attribution.
