description: MORF (Multi-Omics Research Factory) was initially created by the BBSRC-funded
  DETOX project, led by Prof. Gavin Thomas at the University of York, to manage large
  and complex multi-omics datasets. Built by biologists for biologists, it allows
  the whole team to access the data securely from their browser, without the need
  for programming skills. As data becomes publicly available, it can be accessed and
  further analysed here. MORF's tools are also freely-available and include the MORF
  genome browser, which incorporates over 100 microbial genomes, and MORFlux, a flux
  balance analysis (FBA) modelling tool.
