description: The UK Solar System Data Centre (UKSSDC) is the Natural Environment Research
  Council's (NERC) Designated Data Centre for the Solar terrestrial physics and chemistry.
  It provides a central archive and data centre facility for Solar System science
  in the UK. The UKSSDC supports data archives for the whole UK solar system community
  encompassing solar, inter-planetary, magnetospheric, ionospheric and geomagnetic
  science. The UKSSDC is part of RAL Space based at the STFC run Rutherford Appleton
  Laboratory in Oxfordshire.
