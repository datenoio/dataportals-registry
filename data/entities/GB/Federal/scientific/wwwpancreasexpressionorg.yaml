description: The Pancreatic Expression Database (PED) is a repository for pancreatic-derived
  -omics data. With a generic web-based system, the database provides the research
  community with an open access tool to mine currently available pancreatic cancer
  experimental data sets generated by using large-scale transcriptomic, genomic, proteomic,
  miRNA and methylomic platforms. The website also provides users with the opportunity
  to include their own published dataset in the database.
