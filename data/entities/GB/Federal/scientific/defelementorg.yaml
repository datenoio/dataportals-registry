description: DefElement is an encyclopedia of finite element definitions. The website
  contains a collection of definitions of finite elements, including commonly used
  elements such as Lagrange, Raviart–Thomas, Nédélec (first kind), and Nédélec (second
  kind) elements, and more exotic elements such as serendipity, Hermite, P1-iso-P2,
  and Regge elements. DefElement currently contains the definition of 67 elements.
