description: The Twenty-07 Study was set up in 1986 in order to investigate the reasons for
  differences in health by socio-economic circumstances, gender, area of residence, age, ethnic
  group, and family type. 4510 people are being followed for 20 years. The initial wave of
  data collection took place in 1987/8, when respondents were aged 15, 35 and 55. The final
  wave of data collection took place in 2007/08 when respondents were aged 35, 55 and 75.
