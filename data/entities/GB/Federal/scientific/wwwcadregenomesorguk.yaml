description: This project aims to support the international Aspergillus research community
  by gathering all genomic information regarding this significant genus into one resource
  - The Central Aspergillus REsource (CADRE). CADRE facilitates visualisation and
  analyses of data using the Ensembl software suite. Much of our data has been extracted
  from Genbank and augmented with the consent of the original sequencing groups. This
  additional work has been carried out using both automated and manual efforts, with
  support from specific annotation projects and the general Aspergillus community.
