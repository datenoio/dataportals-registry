description: PhytoPath is a new bioinformatics resource that integrates genome-scale data
  from important plant pathogen species with literature-curated information about the phenotypes
  of host infection. Using the Ensembl Genomes browser, it provides access to complete genome
  assembly and gene models of priority crop and model-fungal, oomycete and bacterial phytopathogens.
  PhytoPath also links genes to disease progression using data from the curated PHI-base resource.
