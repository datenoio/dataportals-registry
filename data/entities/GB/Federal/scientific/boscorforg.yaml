description: The British Ocean Sediment Core Research Facility (BOSCORF) is based at the Southampton
  site of the National Oceanography Centre and is Britain’s national deep-sea core repository.
  BOSCORF is responsible for long-term storage and curation of sediment cores collected through
  UKRI-NERC research programmes. We promote secondary usage of sediment core samples and analytical
  data relating to the sample collection.
