description: GPnotebook is a concise synopsis of the entire field of clinical medicine
  focused on the needs of the General Practitioner with material organised systematically
  to ensure rapid retrieval of information. The content of GPnotebook is based on
  clinical practice in the United Kingdom and provides a clinical reference for general
  practitioners and medical students; it may also be a useful reference resource for
  other health professionals. As well as being a clinical reference, GPnotebook also
  aims to be a tool for clinical education, clinical governance and continuing professional
  development.
