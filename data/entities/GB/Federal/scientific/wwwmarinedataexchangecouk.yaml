description: The Marine Data Exchange (MDE) is the first of its kind and a world leading
  digital platform of industry survey data, research and evidence that was created
  by The Crown Estate in 2013. It provides a digital platform for offshore industries
  to share survey data collected throughout the lifetime of offshore projects, and
  hosts new data and research generated through programmes such as The Crown Estate’s
  Offshore Wind Evidence and Change (OWEC) programme. Through this approach, we can
  ensure that existing data and evidence drives positive impact, whilst identifying
  and addressing data and evidence gaps. The significant evidence base on the MDE
  – which is currently over 500TB of data – will be important in accelerating offshore
  wind deployment to reach net zero by 2050, achieving energy security, and in driving
  holistic evidence-based decisions that support the protection and enhancement of
  the marine environment. By making this wealth of data freely available through cutting-edge
  technology, we give offshore projects in the UK a valuable head start, helping those
  involved to make informed, evidence-based decisions and address consenting and planning
  challenges.
