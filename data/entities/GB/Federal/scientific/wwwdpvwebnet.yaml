description: DPVweb provides a central source of information about viruses, viroids
  and satellites of plants, fungi and protozoa. Comprehensive taxonomic information,
  including brief descriptions of each family and genus, and classified lists of virus
  sequences are provided. The database also holds detailed, curated, information for
  all sequences of viruses, viroids and satellites of plants, fungi and protozoa that
  are complete or that contain at least one complete gene. The database will not be
  updated with sequence or taxonomic data from Aug 2013.
