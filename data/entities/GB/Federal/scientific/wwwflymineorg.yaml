description: FlyMine is an integrated database of genomic, expression and protein
  data for Drosophila, Anopheles and C. elegans. Its main focus is genomic and proteomics
  data for Drosophila and other insects. It provides access to integrated data at
  a number of different levels, from browsing to construction of complex queries,
  which can be executed on either single items or lists.
