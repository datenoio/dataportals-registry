description: The Environmental Change Network is the UK’s long-term environmental monitoring
  and research (LTER) programme. We make regular measurements of plant and animal communities
  and their physical and chemical environment. Our long-term datasets are used to increase
  understanding of the effects of climate change, air pollution and other environmental pressures
  on UK ecosystems.
