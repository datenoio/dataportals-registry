description: The Polygenic Score Catalog is an open database of published polygenic
  scores (PGS; also referred to as polygenic risk scores [PRS] or genetic/genomic
  risk scores [GRS]).  Each PGS in the Catalog is consistently annotated with relevant
  metadata; including scoring files (variants, effect alleles/weights), annotations
  of how the PGS was developed and applied, and evaluations of their predictive performance.
