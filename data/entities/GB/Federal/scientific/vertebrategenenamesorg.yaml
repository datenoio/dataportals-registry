description: The Vertebrate Gene Nomenclature Committee (VGNC) is an extension of
  the established HGNC (HUGO Gene Nomenclature Committee) project that names human
  genes. VGNC is responsible for assigning standardized names to genes in selected
  vertebrate species that lack a nomenclature authority; currently these are chimpanzee,
  macaque, dog, cat, cattle, pig and horse. The VGNC also coordinates with the existing
  vertebrate nomenclature committees, MGNC (mouse), RGNC (rat), CGNC (chicken), XNC
  (Xenopus frog) and ZNC (zebrafish), to ensure genes are named in line with their
  human homologs.
