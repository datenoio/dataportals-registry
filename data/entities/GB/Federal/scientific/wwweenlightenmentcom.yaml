description: Electronic Enlightenment—EE—is a digital resource for the study of the
  letter and its place in the rich writing cultures of the ‘long’ eighteenth century.
  Based on the best critical editions, EE benefits from collaboration with a large
  network of university presses, editors, scholars, and students who have contributed
  texts, and continues to grow by adding more archive/print editions and commissioning
  born-digital correspondences. EE is a wide-ranging online collection of edited correspondence
  of the early modern period, linking people across Europe, the Americas and Asia
  from the early 17th to the mid-19th century.
