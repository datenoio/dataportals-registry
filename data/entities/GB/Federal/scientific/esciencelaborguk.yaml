description: The BioCatalogue provided a common interface for registering, browsing
  and annotating Web Services to the Life Science community. Services in the BioCatalogue
  could be described and searched in multiple ways based upon their technical types,
  bioinformatics categories, user tags, service providers or data inputs and outputs.
  They were also subject to constant monitoring, allowing the identification of service
  problems and changes and the filtering-out of unavailable or unreliable resources.
  The system was accessible via a human-readable ‘Web 2.0’-style interface and a programmatic
  Web Service interface. The BioCatalogue followed a community approach in which all
  services can be registered, browsed and incrementally documented with annotations
  by any member of the scientific community.
