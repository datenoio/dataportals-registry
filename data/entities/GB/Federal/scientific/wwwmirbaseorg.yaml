description: The miRBase database is a searchable database of published miRNA sequences
  and annotation. Each entry in miRBase represents a predicted hairpin portion of
  a miRNA transcript (termed mir in the database), with information on the location
  and sequence of the mature miRNA sequence (termed miR). Both hairpin and mature
  sequences are available for searching and browsing, and entries can also be retrieved
  by name, keyword, references and annotation.
