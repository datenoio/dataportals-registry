description: ionomicHUB provides curated ionomic data on many thousands of plant samples
  freely available to the public. It is an international collaborative cyber research
  environment to help identify and understand the genes and gene networks that function
  to control the ionome, the mineral nutrient and trace element composition of an
  organism or tissue. The iHUB is a collaborative workspace with components that integrate
  both cyberinfrastructure and human interactions to maximize both community access
  to ionomic resources, and knowledge extraction from these resources.
