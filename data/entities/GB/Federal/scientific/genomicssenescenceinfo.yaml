description: 'The Human Ageing Genomic Resources (HAGR) is a collection of databases
  and tools for the biology and genetics of ageing. HAGR features several databases
  with high-quality, manually-curated data: 1) GenAge, a database of genes associated
  with ageing in humans and model organisms; 2) AnAge, an extensive collection of
  longevity records and complementary traits for over 4,000 vertebrate species; and
  3) GenDR, a database containing both gene mutations that interfere with dietary
  restriction-mediated lifespan extension and consistent gene expression changes induced
  by dietary restriction.'
