description: KnetMiner is a knowledge platform for genes, traits, diseases and their
  interactions across species. We integrate a range of open-access data, transform
  into a knowledge graph and augment with new text-mined relationships. Free KnetMiner
  resources include Arabidopsis, wheat, rice and COVID-19 (publicly funded). Many
  other species specific datasets can be subscribed to for a fee. In addition to web-based
  access, the knowledge graphs can also be accessed programmatically through RDF-SPARQL
  and Neo4j-Cypher endpoints.
