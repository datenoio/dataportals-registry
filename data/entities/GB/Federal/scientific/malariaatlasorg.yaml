description: The Malaria Atlas Project (MAP) brings together researchers based around the
  world with expertise in a wide range of disciplines from public health to mathematics, geography
  and epidemiology. We work together to generate new and innovative methods of mapping malaria
  risk. Ultimately our goal is to produce a comprehensive range of maps and estimates that
  will support effective planning of malaria control at national and international scales.
