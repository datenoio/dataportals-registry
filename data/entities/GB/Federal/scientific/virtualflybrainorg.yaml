description: VFB is an interactive tool for neurobiologists to explore the detailed
  neuroanatomy, neuron connectivity and gene expression of Drosophila melanogaster.
  Our goal is to make it easier for researchers to find relevant anatomical information
  and reagents. We integrate the neuroanatomical and expression data from the published
  literature, as well as image datasets onto the same brain template, making it possible
  to run cross searches, find similar neurons and compare image data on our 3D Viewer.
