description: "SignaLink 3.0 is an integrated resource to analyze signaling pathway\
  \ cross-talks, transcription factors, miRNAs and regulatory enzymes. Main features:\n\
  \n    - A signaling network resource with known and predicted information for human\
  \ and model organisms\n    - Manually curated dataset of major signaling pathways\
  \ - including curated data from resources such as ACSN, InnateDB, Reactome and Signor\n\
  \    - Extends pathways with integrated regulatory resources to contain pathway-specific\
  \ transcription factors, miRNA, scaffolds and post translational modifying enzymes\n\
  \    - Proteins are classified by pathway position (core/non-core) and function\
  \ (ligand, receptor, mediator, etc.)\n    - Signaling interactions are directed\
  \ and labeled with PubMed IDs of the publications of experimental evidence\n   \
  \ - A multi-layered network structure allows the selection of user-specific details\n\
  \    - Allows filtering based on tissue or sub-cellular localization\n    - Supporting\
  \ downloads in csv or psimi tab formats"
