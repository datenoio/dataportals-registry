description: The SAbDab (Structural Antibody Database) is a specialized bioinformatics
  resource that collects and organizes all publicly available antibody structures
  deposited in the Protein Data Bank (PDB). It provides consistently curated annotations
  including antibody sequences, heavy/light chain pairings, antigen information, structural
  classifications, and binding affinity data. Researchers can search, visualize, and
  download individual antibody structures or customized datasets for structural and
  computational analyses.
