description: Galaxies, made up of billions of stars like our Sun, are the beacons that light
  up the structure of even the most distant regions in space. Not all galaxies are alike,
  however. They come in very different shapes and have very different properties; they may
  be large or small, old or young, red or blue, regular or confused, luminous or faint, dusty
  or gas-poor, rotating or static, round or disky, and they live either in splendid isolation
  or in clusters.
