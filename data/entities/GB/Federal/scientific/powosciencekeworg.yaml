description: The Plants of the World Online portal (POWO), is a database created to
  store information on all the world's known seed-bearing plants.Coverage will increase
  over time. Data comes from a variety of sources which are both monographic (global)
  and regional in scope. These data sources vary in the extent to which comprehensive
  synonymy is included, their stage of development (proximity to publication) and
  the degree to which they have been exposed to peer review.
