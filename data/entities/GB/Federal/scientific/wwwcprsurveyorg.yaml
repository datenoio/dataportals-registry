description: The Continuous Plankton Recorder (CPR) Survey has been monitoring the
  pulse of the oceans through the plankton since 1931. The CPR is a robust and reliable
  instrument designed to capture plankton samples over huge areas of ocean. The CPR
  is usually towed from the stern of volunteer merchant ships such as RoRo and Container
  Ships. However this versatile recorder has also been deployed from large sailing
  vessels, fishing boats and super tankers. The methodology has been used across the
  world's oceans, as well as in the North Sea, the Mediterranean, the Baltic, and
  in freshwater lakes.
