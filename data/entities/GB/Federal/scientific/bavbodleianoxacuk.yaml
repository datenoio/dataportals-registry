description: Through the generous support of The Polonsky Foundation, this project
  made 1.5 million digitized pages freely available. Portions of the Biblioteca Apostolica
  Vaticana (Vatican Library) and the Bodleian Libraries’ collections of Hebrew manuscripts,
  Greek manuscripts, and incunabula were selected for digitization by a team of scholars
  and curators from around the world. The selection process was informed by a balance
  of scholarly and practical concerns; conservation staff at the Bodleian and Vatican
  Libraries worked with curators to assess not only the significance of the content,
  but the physical condition of the items, prioritizing items that are robust enough
  to withstand being transported to the imaging studio and handled by the photographers.
  In order to preserve the integrity and completeness of the manuscript collections,
  the libraries also agreed to digitize whole collections where appropriate. While
  the Vatican and the Bodleian had been creating digital images from our collections
  for a number of years, this project provided an opportunity for both libraries to
  increase the scale of their digitization services. In both cases, this meant significant
  investments in the equipment, infrastructure and people that make digitization possible.
  Over the course of this project, both libraries also revealed information about
  their digitization techniques and methods.
