description: G4Atlas is a transcriptome-wide G-quadruplex database containing and
  visualising transcriptome RNA G-quadruplex (rG4) experimental data, generated from
  rG4-seq, chemical profiling and ligand-binding methods. rG4 is a vital RNA tertiary
  structure motif that involves the base pairs on both Hoogsteen and Watson-Crick
  faces of guanines, and is relevant to the post-transcriptional regulation of gene
  expression. RNA secondary structure prediction information across both experimentally
  identified and unidentified rG4s is also included to enable users to display any
  potential competitive folding between rG4 and RNA secondary structures. As such,
  G4Atlas allows users to explore the general functions of rG4s in diverse biological
  processes, and provides a starting point for further data-driven deep learning algorithms
  to examine rG4 structural features.
