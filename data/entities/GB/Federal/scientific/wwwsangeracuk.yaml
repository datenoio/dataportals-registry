description: The Wellcome Sanger Institute Data Resources provide access to a wide
  range of large-scale genomic and biological datasets generated by the institute’s
  research programs. These resources include human, pathogen, cancer, cellular, and
  biodiversity genomics data, often produced through international collaborations
  and major sequencing initiatives. The platform serves as a gateway to datasets,
  archives, and data portals that support biomedical and life science research worldwide.
