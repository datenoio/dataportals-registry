description: 'This archive is an Institutional Repository for NERC Staff. It contains
  metadata and full text (where possible) for published papers, reports, maps and
  other outputs from four of the NERC Research Centres: the British Antarctic Survey,
  British Geological Survey, the Centre for Ecology & Hydrology and the National Oceanographic
  Centre. It is also accessible to Staff at NERC''s Swindon Office. A RSS feed is
  available. NORA provides information on research outcomes for NERC''s intramural
  research to the RCUK Gateway to Research system. Subject specialities are atmospheric
  science, earth science, earth observation, environmental maths and statistics, marine,
  polar, science based archaeology, technology and e-science, terrestrial and freshwater
  science. Not all items are available in full-text on this site, however they are
  linked to subscription based external sites. RSS and Atom feeds are available.'
