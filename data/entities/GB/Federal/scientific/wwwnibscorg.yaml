description: 'The UK Stem Cell Bank (UKSCB) facilitates the use and sharing of quality-controlled
  stem cell lines to support scientific research and clinical development of stem
  cell therapies.  The work of the UK Stem Cell Bank covers three main areas: banking
  for all UK-derived human embryonic stem cell lines, research in the standardisation,
  quality and safety of human pluripotent stem cell (hPSC)-based products, and regulation
  regarding international best practice, policies and guidelines relating to stem
  cell use and regulation around the world.'
