description: The University has followed all of the children born in Aberdeen in 1921, 1936,
  and 1950-1956 as they grow and age. Collectively these groups are known as the ABERDEEN
  BIRTH COHORTS, and are a jewel in the crown of Scottish health research and have helped
  to advance our understanding of aging well. The Children of the 1950s study is a population-based
  resource for the study of biological and social influences on health across the life-course
  and between generations.
