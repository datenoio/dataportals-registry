description: The European Xenopus Resource Centre (EXRC) is situated in Portsmouth, United
  Kingdom and provides tools and services to support researchers using Xenopus models. The
  EXRC depends on researchers to obtain and deposit Xenopus transgenic and mutant lines, Xenopus
  in-situ hybridization clones, Xenopus specific antibodies and other resources with the centre.
  EXRC staff perform quality assurance testing on these reagents and then makes them available
  to the community at cost.
