description: PDX Finder is an open repository for the upload and storage of clinical,
  genomic and functional Patient-Derived Xenograph (PDX) data which provides a comprehensive
  global catalogue of PDX models available for researchers across distributed repository
  databases. Integrated views are provided for histopathological image data, molecular
  classification of tumors, host mouse strain metadata, tumor genomic data and metrics
  on tumor response to chemotherapeutics. The data model for PDX Finder is based on
  the minimal information standard for PDX models developed in collaboration with
  a broad range of stakeholders who create and/or use PDX models in basic and pre-clinical
  cancer research.
