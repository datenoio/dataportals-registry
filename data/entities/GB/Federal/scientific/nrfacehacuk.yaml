description: The National River Flow Archive (NRFA) is the primary archive of daily
  and peak river flows for the United Kingdom. The archive incorporates daily, monthly
  and flood peak data from over 1600 gauging stations. The NRFA holds a wide range
  of hydrological information to assist in the understanding and interpretation of
  measured river flows. In addition to time series of gauged river flow, the data
  centre maintains hydrometric information relating to the gauging stations and the
  catchments they command and data quantifying other parts of the hydrological cycle.
