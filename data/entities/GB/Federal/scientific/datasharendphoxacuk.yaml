description: The NSHD46 Database is an online showcase of the National Survey of Health
  and Development 1946 birth cohort, listing variables and metadata collected over
  decades of follow‑up. It allows researchers to browse and discover clinical, biological,
  questionnaire, and life‑course data from the study before applying for access. While
  only non‑sensitive summary information is displayed, it helps researchers plan and
  request detailed data for health and population research.
