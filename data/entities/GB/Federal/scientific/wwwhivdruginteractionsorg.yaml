description: Around 37 million individuals are living worldwide with HIV and although
  advances in therapy have yielded effective regimens, individual antiretroviral drugs
  are amongst the most therapeutically risky for drug-drug interactions (DDI) presenting
  significant risks to patients and a challenge for health care providers to ensure
  safe and appropriate prescribing. In order to address this, the Liverpool Drug Interactions
  website was established in 1999 by members of the Department of Pharmacology at
  the University of Liverpool to provide a freely available drug-drug interaction
  resource.
