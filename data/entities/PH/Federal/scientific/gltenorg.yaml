description: "The Global Long-Term Agricultural Experiment Network (GLTEN) is a network\
  \ of long-term agricultural experiments. The GLTEN was launched in May 2018 with\
  \ the aim of establishing and supporting a collaborative network within the international\
  \ agricultural science community. \nThe aim of the GLTEN metadata portal is to increase\
  \ the visibility of long-term agricultural experiments and provide new opportunities\
  \ for collaborations and data re-use. The GLTEN Metadata portal uses a defined metadata\
  \ schema to provide consistent descriptions of over 200 LTEs, representing diverse\
  \ and contrasting climate regions and environments, as well as multiple crop systems\
  \ and land management schemes."
