description: GeoNode 3.1.0 Climate Change Risk Visualization Platform for Antigua
  and Barbuda, published by the Department of Environment under a Green Climate Fund
  National Adaptation Plan project. Hosts 16 public climate-hazard layers covering
  hurricane wind, storm surge, and average annual loss. REST, CSW, and OAI-PMH are
  live; GeoServer OGC services currently return HTTP 502.
