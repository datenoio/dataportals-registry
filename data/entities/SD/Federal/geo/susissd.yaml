description: Sudan Soil Information System (SUSIS), created in 2016, is the national
  repository for collecting, storing, and sharing soil and land-resource information
  that previously existed only as scattered hard-copy maps, reports, and databases.
  Publishes regional soil datasets (East, Kordofan, North, North Darfur, South, and
  South Darfur) at 0–30, 30–60, and 60–100 cm depths. Some products are downloadable;
  others are available on request. No public machine-readable catalog API was found.
