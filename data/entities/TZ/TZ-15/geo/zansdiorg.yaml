description: Zanzibar Spatial Data Infrastructure (ZanSDI) is the Revolutionary Government
  of Zanzibar's GeoNode geoportal for discovering, sharing, and managing geospatial
  information across Unguja and Pemba. It lists cadastral, environmental, marine,
  and planning layers with CSW and OGC services. Some commercial downloads require
  payment.
