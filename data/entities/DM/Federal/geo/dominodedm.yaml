description: National GeoNode geoportal (DomiNODE) for Dominica's public GIS repository.
  Publishes spatial datasets, maps, and metadata covering land use, cadastre, environment,
  and base mapping, with CSW and OGC services. Maintained jointly by the Physical
  Planning Division, Lands and Surveys Division, and the Information and Communication
  Technology Unit.
