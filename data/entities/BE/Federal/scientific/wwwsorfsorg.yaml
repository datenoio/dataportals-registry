description: 'sORFs.org is a database for sORFs identified using ribosome profiling.
  Starting from ribosome profiling, sORFs.org identifies sORFs, incorporates state-of-the-art
  tools and metrics and stores results in a public database. Two query interfaces
  are provided, a default one enabling quick lookup of sORFs and a BioMart interface
  providing advanced query and export possibilities. At present, sORFs.org harbors
  263 354 sORFs that demonstrate ribosome occupancy, originating from three different
  cell lines: HCT116 (human), E14_mESC (mouse) and S2 (fruit fly).'
