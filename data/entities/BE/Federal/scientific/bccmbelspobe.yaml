description: 'BCCM/IHEM is a fungal culture collection specialized in medical and
  veterinary isolates. About 15.000 strains are available from all over the world:
  yeasts and filamentous fungi, pathogens, allergenic species, strains producing mycotoxins,
  reference strains, teaching material, etc. It also comprises the Raymond Vanbreuseghem
  collection. The BCCM/IHEM collection makes strains publicly available for medical,
  pharmaceutical and biological research, as well as for method validation, testing
  or educational purposes. Deposits of strains for public access are without costs
  for the depositor. The collection also offers a range of services including trainings
  in mycology and identifications of strains.'
