description: The WDC-SILSO is an activity of the Operational Directorate “Solar Physics
  and Space Weather” also known internationally as the Solar Influences Data analysis
  Center (SIDC). The SIDC is a department of the Royal Observatory of Belgium. Its
  mission is to preserve, develop and diffuse the knowledge of the long-term variations
  of solar activity, as a reference input to studies of the solar cycle mechanism
  and of the solar forcing on the Earth’s climate.
