description: IDEM is an interdisciplinary and multifaceted database of manuscripts and printed
  books that are relevant to the Alamire Foundation's research and activities. It therefore
  especially focuses on the musical heritage of the Low Countries from the early Middle Ages
  until 1800. IDEM is designed to be an online, freely accessible platform and tool for the
  preservation, study, and valorisation of the music heritage of the Low Countries.
