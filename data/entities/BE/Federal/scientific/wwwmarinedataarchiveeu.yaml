description: 'Scientific data are unique and need to be prevented from being lost.
  For this reason VLIZ developed the Marine Data Archive: a secure, online system
  where researchers can archive their data files in a well-documented manner. The
  MDA holds data from a wide range of international, European, and Flemish projects.
  It is free for anyone to use: to archive and manage their data, as a personal, project,
  or institutional archive, and as an open repository for data publication. Data of
  any type -- raw, processed, structured, data products, documents, images, etc --
  can be archived in the MDA. Data in the MDA are made public by linking them to the
  Integrated Marine Information System, or to any other catalogue.'
