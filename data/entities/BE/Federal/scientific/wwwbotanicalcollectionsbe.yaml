description: 'Botanical Collections is a data portal developed and hosted by Meise
  Botanic Garden, where the digitized herbarium specimens and the living collection
  accessions of the Garden can be consulted. As evidenced by its generic name, the
  portal''s scope is wider than just the Garden''s collections and includes other
  botanical collections in Belgium or any other interested institutions abroad. As
  of 2022, a few other Belgian collections can already be found on the platform and
  more are expected to be added in the context of the DiSSCo Flanders project (https://dissco-flanders.be).


  The portal allows users to search for specimens by various data elements such as
  kind of specimen, taxonomy, collector and location. Users can also view high resolution
  images and see the location of origin of specimens or the current location of accessions
  through a Google Maps plugin. Web API access is  possible, but not yet documented.'
