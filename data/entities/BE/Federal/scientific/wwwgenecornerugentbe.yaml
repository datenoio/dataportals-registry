description: The BCCM/GeneCorner Plasmid Collection warrants the long-term storage
  and distribution of plasmids, microbial host strains and DNA libraries of fundamental,
  biotechnological, educational or general scientific importance. The focus is on
  the collection of recombinant plasmids that can replicate in a microbial host strain.
  BCCM/GeneCorner also accepts natural and genetically modified animal or human cell
  lines, including hybridomas, as well as other genetic material, in the safe deposit
  and patent deposit collections.
