description: The European Ocean Biodiversity Information System – EurOBIS – is an
  online marine biogeographic database compiling data on all living marine creatures.
  The principle aims are to centralize the largely scattered biogeographic data on
  marine species collected by European institutions and to make these data freely
  available and easily accessible. The data are either collected within European marine
  waters or by European researchers and institutes outside Europe. The database focuses
  on taxonomy and occurrence records in space and time; all data can be searched and
  visualised through a set of online mapping tools.
