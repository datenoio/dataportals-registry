description: RETOPEA investigates the different ways in which religious coexistence is thought
  of in different environments and how religious peace treaties have been established in the
  past. The idea is to use the insights gained to inform thinking about present-day peaceful
  religious co-existence The dataset contains the contents and the metadata of the resources
  (i.e., clippings) published on the RETOPEA website (retopea.eu).
