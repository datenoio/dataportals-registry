description: The Radiocarbon Palaeolithic Europe Database stores available radiometric
  data taken from literature and from other more restricted databases. Data is collected
  by continuous checking of newly published articles in hundreds of international
  and regional scientific journals and in collections or books dealing with a particular
  period or a specific Paleolithic site. User submissions are also accepted. Please
  note that this database is only available for download and local use via Microsoft
  Access or, in a more limited way, via Excel. As such, its accessibility is limited.
