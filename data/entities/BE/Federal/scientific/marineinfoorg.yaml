description: MarineInfo - formerly IMIS -  is a catalogue that offers a comprehensive
  range of interlinked data covering various topics relevant to the marine research
  domain. It is accessible for everyone, from researchers and policymakers to educators
  and students. Data, publications, information about people, projects, institutes,
  and events can be found here. In addition, anyone can submit their own marine-related
  dataset, publication, etc to be added as a record in MarineInfo, and datasets can
  be published and given a DOI. Our goal is to be a FAIR data system that is integrated
  into the European marine community.
