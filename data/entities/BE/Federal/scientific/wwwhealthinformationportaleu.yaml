description: 'The Health Information Portal (HIP) is a web-based platform (https://www.healthinformationportal.eu/)
  hosting information about National Nodes, Research Networks, health information
  sources, i.e. data sources, health information studies and projects, health information
  publications and capacity building activities. For each of the modules, a standardized
  information structure has been developed. Different modules are interlinked with
  each other through specific elements such as country or institution.

  HIP aims to serve as a one-stop-shop for health information in Europe. It will support
  researchers and decision-makers to find and access available information, relevant
  actors, and networks.'
