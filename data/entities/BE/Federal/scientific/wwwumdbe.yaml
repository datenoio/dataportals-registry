description: BRCA Share is a novel gene datashare initiative that provides scientists
  and commercial laboratory organizations around the world with open access to BRCA
  Share (formerly UMD-BRCA1) contains BRCA1 and BRCA2 genetic data. The program’s
  goal is to accelerate research on BRCA gene mutations, particularly variants of
  uncertain significance, to improve the ability of clinical laboratory diagnostics
  to predict which individuals are at risk of developing these cancers.
