description: 'The "Autidact" website is dedicated to monitoring and disseminating
  information about autism. It aims to make a multitude of resources—articles, testimonies,
  books, podcasts, and more—more visible, whether published by people on the autism
  spectrum or by non-autistic individuals in response to the needs expressed by autistic
  people. Idealistic yet determined, we are convinced that autistic people can help
  non-autistic people better understand autism, thereby promoting the inclusion...
  of non-autistic people into their worlds, fostering greater mutual acceptance.


  In line with the recent neurodiversity paradigm, we believe that to better understand
  autistic individuals, it is crucial to listen to and value the voices of those with
  direct experience. Our site aims to be an inclusive and respectful platform, where
  the diversity of perspectives on the autism spectrum is highlighted.


  Making more visible those voices that have been overlooked in the flood of external
  productions (disconnected from autistic individuals) might lead some to think they
  are more valuable than the voices of non-autistic people. Of course, this is not
  the case. To counter this, it is essential to incorporate a diversity of opinions
  within the site''s operations and to foster debates. Therefore, this is not a "promotional"
  site (in the sense that people on the spectrum would be put on a pedestal solely
  because of their autism, without the need to debate the relevance of their viewpoints
  and cultural/scientific/ethical contributions/testimonies).


  The more autistic individuals participate, the richer this project will be, making
  visible the complexity of perspectives on autism from the inside, in order to create
  echoes at the political, cultural, and scientific levels within the frenchspeaking
  landscape.'
