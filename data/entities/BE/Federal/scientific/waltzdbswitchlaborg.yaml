description: WALTZ-DB 2.0 is a database for characterizing short peptides for their
  amyloid fiber-forming capacities. The majority of the data comes from electron microscopy,
  FTIR and Thioflavin-T experiments done by the Switch lab. Apart from that class
  of data we also provide the amyloid annotation for several other short peptides
  found in current scientific research papers. Structural models of the potential
  amyloid cores are provided for every peptide entry.
