description: LNCipedia is a database for human long non-coding RNA (lncRNA) transcripts
  and genes. In addition to basic transcript information and gene structure, several
  statistics are determined for each entry in the database, such as secondary structure
  information, protein coding potential and microRNA binding sites. Available literature
  on specific lncRNAs is linked, and users or authors can submit articles through
  a web interface. LNCipedia is publicly available and allows users to query and download
  lncRNA sequences and structures based on different search criteria. Please note
  that, while searching and download of this repository is available, the last release
  was in 2018.
