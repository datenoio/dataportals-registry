description: MariClus is a website that helps scientists discover and study natural
  products from marine microbes. It allows users to search and visualize gene clusters
  that are responsible for producing these molecules in over 500 marine-related prokaryotes.
  It also provides information on the predicted molecules and their sources. MariClus
  combines data from different databases and tools, such as GenBank, MIBiG, PubChem,
  and antiSMASH, to offer a comprehensive and user-friendly platform for marine natural
  product research.
