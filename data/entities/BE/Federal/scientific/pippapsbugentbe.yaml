description: The public PIPPA interface provides access to the raw phenotypic data
  and linked metadata, making the data FAIR based on the MIAPPE standard. API calls
  are available for expert users to perform customized data requests. Through implementation
  of the Breeding API (BrAPI), PIPPA serves as a data provider for FAIDARE, an international
  portal to facilitate the discoverability of public data on plant biology. Bioschemas
  markup has been added to PIPPA to improve the findability of the data via public
  search engines.
