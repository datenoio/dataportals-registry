description: EV-TRACK centralizes extracellular vesicle (EV) biology and methodology
  to encourage authors, reviewers, editors and funders to put experimental guidelines
  into practice. It implements a bottom-up community consensus approach and encourages
  researchers to upload published and unpublished experiments and provide feedback.
  It is a unique resource that was developed to (i) create an informed dialogue among
  researchers about relevant experimental parameters, (ii) improve the rigour and
  interpretation of experiments studying EVs, and (iii) record the evolution of EV
  research.
