description: National environment data portal for the Federated States of Micronesia
  in the SPREP Inform network. Publishes public environmental datasets for download,
  monitoring, and decision-making, including biodiversity, coastal and marine, climate,
  land, inland waters, disaster risk, and GIS files. Not a cross-government open data
  portal. Automated HTTP clients currently receive a Cloudflare challenge (HTTP 403)
  as of August 2026; the DKAN catalog remains published for browsers.
