description: Drupal-based climate change data portal of the FSM Department of Environment,
  Climate Change and Emergency Management (DECEM). Built with the Griffith University
  iCLIM platform to catalog climate resources and projects. The public JSON export
  is reachable, but as of August 2026 it contains only test records and the visible
  news dates from 2019. Not a cross-government open data portal.
