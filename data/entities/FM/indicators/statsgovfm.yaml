description: Official statistics website of the FSM Statistics Division. Publishes
  statistical releases and a searchable document library covering CPI, national accounts,
  merchandise trade, census and population, HIES, labour, poverty, education, health,
  climate, energy, and related topics, including downloadable tables and GeoJSON.
  Not a PxWeb or SDMX dissemination database. Microdata is documented separately in
  the Pacific Data Hub Microdata Library.
