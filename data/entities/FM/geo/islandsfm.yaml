description: Digital Atlas of Micronesia, a public geospatial data repository and
  interactive map atlas for the Federated States of Micronesia. Publishes themed map
  layers and related datasets for Yap, Chuuk, Pohnpei, and Kosrae, covering land,
  reefs, water, vegetation, population, infrastructure, conservation, and culture.
  Created and maintained by Island Research and Education Initiative (iREi) with support
  from DECEM. The former islandatlas.org hostname no longer serves this atlas.
