description: The ALADDIN database (A Labelled Atomic Data INterface) is a numerical
  scientific database maintained by the International Atomic Energy Agency that provides
  evaluated atomic, molecular, and plasma–material interaction data of interest to
  nuclear fusion and plasma research. It includes recommended cross sections, rate
  coefficients, and surface interaction data compiled from IAEA publications and coordinated
  research projects, supporting modelling and diagnostics of fusion plasmas and related
  physical processes.
