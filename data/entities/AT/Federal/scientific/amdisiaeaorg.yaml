description: The Atomic and Molecular Data Unit operates within the Nuclear Data Section of
  the International Atomic Energy Agency, Vienna, Austria.The primary objective of the Atomic
  and Molecular Data Unit is to establish and maintain internationally recommended numerical
  databases on atomic and molecular collision and radiative processes, atomic and molecular
  structure characteristics, particle-solid surface interaction processes and physico-chemical
  and thermo-mechanical material properties for use in fusion energy research and other plasma
  science and technology applications.
