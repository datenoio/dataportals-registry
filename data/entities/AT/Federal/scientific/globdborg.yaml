description: GlobDB is an online database of species-dereplicated microbial genomes,
  integrating 14 independent genomic catalogues into a single comprehensive resource.
  It standardizes and organizes hundreds of thousands of microbial genome sequences
  with consistent taxonomy and annotations for research use. The database supports
  comparative genomic analyses and taxonomic profiling of metagenomes with downloadable
  genome files and metadata.
