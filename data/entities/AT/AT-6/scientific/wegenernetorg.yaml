description: The WegenerNet Data Portal provides a multi-decadal data source for Austrian
  and international weather, climate, and ecosystems research. The WegenerNet Open-Air Laboratory
  Feldbach Region comprises over 150 meteorological stations. These stations measure weather
  and climate in a tightly spaced grid with an unprecedented level of accuracy and detail.
  The measurements of several parameters are taken in 5-min intervals within the entire grid
  since Jan 1, 2007.
