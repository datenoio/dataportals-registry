description: The Calabi-Yau database is a large curated collection of numerical and
  combinatorial data on Calabi-Yau manifolds, especially those arising from reflexive
  polytopes in various dimensions. It organizes results from the classification of
  these polytopes along with associated topological information like Hodge numbers.
  The database was assembled to support research in algebraic geometry and string
  theory by providing easy access to detailed properties of Calabi-Yau spaces.
