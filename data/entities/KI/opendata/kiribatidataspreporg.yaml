description: National environment data portal for Kiribati in the SPREP Inform network.
  Publishes public environmental datasets for download, monitoring, and decision-making,
  including biodiversity, coastal and marine, climate, land, inland waters, and GIS
  files. Not a cross-government open data portal. HTTPS currently presents a Wodby
  hostname-mismatched certificate and returns HTTP 503; the DKAN catalog, DCAT-US
  data.json, Drupal JSON:API, and sitemap are served over HTTP.
