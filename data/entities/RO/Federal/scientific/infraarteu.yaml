description: The INFRA-ART Spectral Library is a FAIR data service designed as a digital support tool
  for heritage research specialists working with spectroscopic techniques. With over 2,000 curated spectra,
  the database allows users to analyze and compare the spectral signatures of a wide range of reference
  materials, facilitating the identification of 'unknown' samples. The INFRA-ART Spectral Library has
  been designed, implemented, and optimized over several years, and it currently integrates ATR-FTIR,
  XRF, Raman, and SWIR reflectance spectra on over 1000 different materials typically found in works of
  art.
