name: Tests

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - 'devdocs/**'
      - 'website/**'
      - 'openspec/**'
      - '**/*.md'
      - 'llms.txt'
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - 'devdocs/**'
      - 'website/**'
      - 'openspec/**'
      - '**/*.md'
      - 'llms.txt'

# A new push to a pull request cancels its older runs. Pushes to branches run to the end.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint needs only ruff, at the version pinned in requirements.lock.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install "$(grep -E '^ruff==' requirements.lock)"

    - name: Lint (rules in pyproject.toml)
      run: ruff check --output-format=github scripts tests

  # Data checks do not depend on the Python version, so they run once.
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # A pull_request checkout is a merge commit; HEAD^1 is the base branch tip.
        fetch-depth: 2

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Validate YAML (schema)
      run: |
        # Pull requests validate only the YAML they touch, unless they change
        # the schema, the validation code or the dependencies: then every file
        # is checked.
        if [ "${{ github.event_name }}" = "pull_request" ] \
          && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(data/schemes/|scripts/(builder|constants|dpr/yaml_io)\.py$|requirements(-dev)?\.(txt|lock)$)'; then
          python scripts/builder.py validate-yaml --since HEAD^1
        else
          python scripts/builder.py validate-yaml
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      # One failing Python version does not cancel the others.
      fail-fast: false
      matrix:
        # 3.11 is the floor: duckdb 2.x does not install on 3.10.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Run tests
      run: |
        python -m pytest tests -v --cov=scripts --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  quality-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Analyze data quality
      run: python scripts/builder.py analyze-quality

    - name: Quality regression guard
      run: python -m pytest tests/test_quality_regression.py -v
