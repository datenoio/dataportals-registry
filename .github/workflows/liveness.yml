name: Catalog Liveness

on:
  schedule:
    # Weekly Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      sample:
        description: "Optional sample size (empty = full catalog)"
        required: false
        type: string
      country:
        description: "Optional ISO country filter (e.g. US)"
        required: false
        type: string

concurrency:
  group: catalog-liveness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run liveness probes
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
          COUNTRY: ${{ github.event.inputs.country }}
        run: |
          # 64 parallel probes, one request at a time per host. A full run takes
          # about 1-1.5 h: hosts that time out cost up to ~60 s each.
          CMD=(python scripts/check_liveness.py --workers 64 --delay 0.25)
          if [ -n "$SAMPLE" ]; then
            CMD+=(--sample "$SAMPLE")
          fi
          if [ -n "$COUNTRY" ]; then
            CMD+=(--country "$COUNTRY")
          fi
          "${CMD[@]}"

      # The report is written row by row, so a timed-out run still uploads
      # the rows it probed.
      - name: Upload liveness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveness-report
          path: dataquality/liveness_report.jsonl
          if-no-files-found: error
